name: Security — Zamani Compiler

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"   # Every Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ── 1. Dependency vulnerability audit ─────────────────────────────────────────
  cargo-audit:
    name: "🔒 Cargo Audit (CVE scan)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --quiet
      - name: Run audit
        run: cargo audit --json > audit-report.json 2>&1 || true
      - name: Display audit summary
        run: cargo audit || true
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cargo-audit-report
          path: audit-report.json
          retention-days: 30

  # ── 2. cargo-deny policy enforcement ──────────────────────────────────────────
  cargo-deny:
    name: "📋 License & Ban Policy (cargo-deny)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
        continue-on-error: true

  # ── 3. CodeQL static analysis ─────────────────────────────────────────────────
  codeql:
    name: "🧠 CodeQL SAST"
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: rust
          queries: security-and-quality
      - uses: dtolnay/rust-toolchain@stable
      - name: Build for CodeQL
        run: cargo build --release
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:rust"

  # ── 4. Supply chain integrity (SBOM) ──────────────────────────────────────────
  sbom:
    name: "📦 Generate SBOM (CycloneDX)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --quiet
      - name: Generate SBOM
        run: cargo cyclonedx --format json --output-file sbom.json
        continue-on-error: true
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom-cyclonedx
          path: sbom.json
          retention-days: 90

  # ── 5. Unsafe code audit ──────────────────────────────────────────────────────
  unsafe-check:
    name: "⚠️ Unsafe Code Audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Count unsafe blocks
        run: |
          UNSAFE_COUNT=$(grep -rn "unsafe" src/ --include="*.rs" | grep -v "// SAFETY:" | wc -l)
          echo "Unsafe blocks (without SAFETY comments): $UNSAFE_COUNT"
          if [ "$UNSAFE_COUNT" -gt 20 ]; then
            echo "::warning::High unsafe block count ($UNSAFE_COUNT). Review required."
          fi
      - name: Check for missing SAFETY comments
        run: |
          grep -rn "unsafe {" src/ --include="*.rs" | while read line; do
            file=$(echo "$line" | cut -d: -f1)
            lineno=$(echo "$line" | cut -d: -f2)
            prev_lineno=$((lineno - 1))
            prev=$(sed -n "${prev_lineno}p" "$file")
            if ! echo "$prev" | grep -q "SAFETY:"; then
              echo "::warning file=$file,line=$lineno::unsafe block missing SAFETY comment"
            fi
          done || true

  # ── 6. Secrets / credential scan ──────────────────────────────────────────────
  secret-scan:
    name: "🔐 Secret Scan (gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ── 7. Fuzzing (cargo-fuzz stub) ───────────────────────────────────────────────
  fuzz-check:
    name: "🎯 Fuzz Target Validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Check fuzz targets exist
        run: |
          if [ -d "fuzz" ]; then
            echo "✅ Fuzz targets found"
            ls fuzz/fuzz_targets/ 2>/dev/null || echo "No fuzz_targets directory yet"
          else
            echo "::notice::No fuzz/ directory. Consider adding cargo-fuzz targets for the lexer and parser."
          fi

  # ── 8. Security summary ───────────────────────────────────────────────────────
  security-gate:
    name: "🛡️ Security Gate"
    if: always()
    needs: [cargo-audit, codeql, unsafe-check, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Security gate summary
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Cargo Audit | ${{ needs.cargo-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL SAST | ${{ needs.codeql.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unsafe Audit | ${{ needs.unsafe-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scan | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
