canonical_ir:
path: "src/quantum/ir/"
public_concept: "quantum::ir"

quantum_ir_rule:
rule: >
quantum::ir is the canonical hardware-independent semantic boundary for
quantum computation. No second quantum IR may be introduced by grammar,
frontend, routing, scheduling, hardware, simulator, or backend layers.

grammar_must_not_depend_on:
- "src/quantum/ir/ concrete implementation details"
- "physical qubit allocation"
- "vendor gate catalog"
- "QPU inventory"
- "calibration data"
- "routing algorithm"
- "scheduling algorithm"
- "decoder implementation"

operation_extensibility:
rule: >
Quantum operations MUST be represented through an open operation
abstraction rather than a permanently closed grammar enumeration.

conceptual_shape:
  - "operationSpecifier"
