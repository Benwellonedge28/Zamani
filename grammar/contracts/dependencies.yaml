35. CYCLE DETECTION CONTRACT

=============================================================================

cycle_detection:

production_graph:
includes:
- "grammar imports"
- "contract dependencies"
- "semantic dependencies required for language meaning"
- "ownership dependencies"

excludes:
  - "test-only edges"
  - "documentation links"
  - "historical references"
  - "optional external examples"

algorithm:
required:
- "normalize paths"
- "resolve aliases"
- "construct directed graph"
- "detect strongly connected components"
- "reject production SCCs containing more than one semantic node unless
explicitly classified as a non-semantic composition cycle"

failure:
severity: "error"

diagnostic:
must_include:
- "cycle members"
- "dependency edge causing cycle"
- "owner of each symbol"
- "suggested dependency inversion boundary"

=============================================================================

