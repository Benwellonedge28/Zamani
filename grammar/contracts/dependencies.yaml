7. FORBIDDEN DEPENDENCY DIRECTIONS

=============================================================================

forbidden_edges:

- from: "grammar/"
  to: "physical hardware inventory"
  reason: "hardware discovery belongs to realization"

- from: "grammar/"
  to: "runtime live state"
  reason: "source language must remain deterministic and portable"

- from: "grammar/"
  to: "vendor SDK"
  reason: "vendor implementation is downstream"

- from: "grammar/"
  to: "scheduler implementation"
  reason: "scheduling is realization"

- from: "grammar/"
  to: "routing implementation"
  reason: "routing is realization"

- from: "grammar/"
  to: "calibration database"
  reason: "calibration is target-specific"

- from: "grammar/"
  to: "credentials"
  reason: "credentials are runtime/security data"

- from: "grammar/"
  to: "network endpoint"
  reason: "live network state is not grammar authority"

- from: "production grammar"
  to: "grammar/tests/"
  reason: "tests are downstream verification"

- from: "production grammar"
  to: "grammar/golden/"
  reason: "goldens are verification artifacts"

- from: "production grammar"
  to: "grammar/examples/"
  reason: "examples are consumers/conformance fixtures"

- from: "production source"
  to: "target-native IR"
  reason: "source semantics must pass through canonical semantic representation"

- from: "quantum::ir"
  to: "quantum::frontend"
  reason: "semantic IR must not depend on frontend"

- from: "quantum::ir"
  to: "quantum::hardware"
  reason: "hardware is downstream realization"

- from: "quantum::ir"
  to: "quantum::routing"
  reason: "routing is downstream realization"

- from: "quantum::ir"
  to: "quantum::scheduling"
  reason: "scheduling is downstream realization"

- from: "quantum::ir"
  to: "quantum::simulator"
  reason: "simulation is downstream realization"

- from: "quantum::ir"
  to: "vendor SDK"
  reason: "vendor implementation is downstream"

