- "live runtime state"
- "scheduler state"
- "calibration state"
- "credentials"
- "network connections"
- "execution results"

integration:
parser:
direction: "parser -> AST"

semantic:
  direction: "AST -> semantic analysis"

IR:
  direction: "AST/semantic -> canonical IR"

freeze_rule:
AST_mapping_required: true
semantic_mapping_required: true
IR_mapping_required_when_applicable: true

