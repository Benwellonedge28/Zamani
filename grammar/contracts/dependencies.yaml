  - "controls"
  - "parameters"
  - "results"
  - "attributes"
  - "modifiers"

operation_kinds:
  - "builtin"
  - "custom"
  - "vendor"
  - "parameterized"
  - "dialect"

qubit_scalability:
rule: >
Logical and physical qubit quantities are resource facts, not universal
grammar ceilings.

qec_dependency:
source_intent_owner: "grammar/quantum/"
semantic_owner: "quantum semantic analysis"
realization_owner:
- "src/quantum/qec/"
- "quantum backend"
dependency_direction:
allowed: "source intent -> semantic QEC requirement -> realization"

