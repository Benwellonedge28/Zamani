=============================================================================

37. FILE COMPLETION CONTRACT

=============================================================================

completion:

production_file_done_when:

- "single canonical owner exists"
- "layer is declared"
- "all imports are explicit"
- "all dependencies resolve"
- "all exports are declared"
- "no dependency cycle exists"
- "AST mapping is defined where applicable"
- "semantic mapping is defined where applicable"
- "IR mapping is defined where applicable"
- "compiler integration is defined where applicable"
- "runtime integration is defined where applicable"
- "diagnostics integration is defined"
- "compatibility status is defined"
- "tests are registered"
- "negative tests exist where applicable"
- "hard-coding audit passes"
- "target-independence audit passes"
- "scalability audit passes"
- "safe-Rust integration passes where Rust implementation exists"
- "freeze status is recorded"

no_reopen_rule:
rule: >
Once a file satisfies all completion criteria and is frozen, adding a
downstream target, device, backend, dialect, algorithm, or larger
resource realization MUST NOT require semantic modification to that
frozen file unless the language contract itself intentionally changes.

=============================================================================

38. PRODUCTION VALIDATION GATES

=============================================================================

validation_gates:

G01_manifest:
requirement: "Every production path is inventoried."

G02_ownership:
requirement: "Every exported concept has exactly one owner."

G03_dependency_resolution:
requirement: "Every mandatory dependency resolves."

G04_acyclic:
requirement: "Production dependency graph is acyclic."

G05_lexical:
requirement: "Exactly one public lexical vocabulary exists."

G06_parser:
requirement: "Exactly one public parser composition boundary exists."

G07_root:
requirement: "Zamani.g4 remains composition-only."

G08_ast:
requirement: "Every stable source construct has AST mapping."

G09_semantic:
requirement: "Every stable source construct has semantic mapping."

G10_ir:
requirement: "Every applicable construct has canonical IR mapping."

G11_effects:
requirement: "Effects use the common effect model."

G12_resources:
requirement: "Resources remain symbolic and target-independent."

G13_capabilities:
requirement: "Capabilities are distinct from physical inventory."

G14_policies:
requirement: "Policy constraints remain explicit."

G15_provenance:
requirement: "Relevant decisions remain traceable."

G16_quantum:
requirement: "Quantum semantics terminate at quantum::ir before realization."

G17_hdl:
requirement: "HDL semantics remain distinct from synthesis realization."

G18_interoperability:
requirement: "Foreign technologies remain boundary integrations."

G19_compatibility:
requirement: "Version and migration contracts exist."

G20_hard_coding:
requirement: "No universal finite capacity is hard-coded."

G21_path_hygiene:
requirement: "No malformed or ambiguous production paths remain."

G22_diagnostics:
requirement: "Failure paths have deterministic diagnostics."

G23_tests:
requirement: "Required conformance tests exist and pass."

G24_rust:
requirement: "Rust integration passes on Rust 1.97+."

G25_safe_rust:
requirement: "Production Rust contains no unsafe code."

G26_portability:
requirement: "Portable source semantics survive target changes."

G27_scalability:
requirement: "No artificial resource ceiling is encoded."

G28_freeze:
requirement: "All dependency-closed freeze stages pass."

=============================================================================

39. CI ENFORCEMENT CONTRACT

=============================================================================

ci:

required_checks:

dependency_graph:
  - "load YAML"
  - "normalize paths"
  - "resolve aliases"
  - "validate owners"
  - "validate exports"
  - "validate imports"
  - "detect cycles"

grammar:
  - "generate lexer"
  - "generate parser"
  - "validate imports"
  - "validate unreachable productions"
  - "validate ambiguity where tooling supports it"

repository:
  - "manifest consistency"
  - "ownership consistency"
  - "status consistency"
  - "path hygiene"

scalability:
  - "hard-coded capacity scan"
  - "target-specific dependency scan"
  - "symbolic resource validation"

Rust:
  - "cargo check"
  - "cargo test"
  - "safe-Rust audit"
  - "Rust 1.97+ compatibility"

failure_policy:
any_error: "freeze_blocked"

warnings:
rule: >
Warnings MAY be permitted during development but MUST NOT conceal
unresolved production dependency errors.

=============================================================================

40. CHANGE MANAGEMENT CONTRACT

=============================================================================

changes:

adding_new_grammar_file:

required:
  - "MANIFEST entry"
  - "ownership entry"
  - "dependency entry"
  - "status entry"
  - "AST mapping"
  - "semantic mapping"
  - "IR mapping where applicable"
  - "tests"
  - "hard-coding audit"
  - "compatibility classification"

rule: >
  A new grammar file MUST NOT be considered production-ready merely because
  ANTLR can parse it.

adding_new_domain:

required:
  - "common type integration"
  - "common expression integration"
  - "effect integration"
  - "resource integration"
  - "capability integration"
  - "policy integration"
  - "provenance integration"
  - "AST integration"
  - "semantic integration"
  - "canonical IR integration"
  - "compiler integration"
  - "tests"

rule: >
  A new domain MUST be added downstream of common semantics rather than
  creating a parallel language foundation.

adding_new_target:

required:
  - "capability description"
  - "resource description"
  - "target realization adapter"
  - "lowering"
  - "routing if applicable"
  - "scheduling if applicable"
  - "runtime integration"

forbidden:
  - "new universal keyword solely for target"
  - "new universal hardware capacity constant"
  - "modification of frozen portable semantics solely for target support"

=============================================================================

41. REPOSITORY-WIDE INTEGRATION MAP

=============================================================================

integration_map:

grammar:
consumes:
- "normative specification"
- "ownership contract"
- "lexical contract"
produces:
- "parseable Zamani source structure"

lexer:
path: "src/lexer.rs"
consumes:
- "grammar/lexer/"
produces:
- "tokens"

parser:
path: "src/parser.rs"
consumes:
- "grammar/antlr/ZamaniParser.g4"
produces:
- "parse structure"

ast:
path: "src/ast/"
consumes:
- "parse structure"
produces:
- "domain-neutral AST"

semantic:
path: "src/semantic.rs"
consumes:
- "AST"
- "type contracts"
- "effect contracts"
- "resource contracts"
- "policy contracts"
- "domain semantics"
produces:
- "validated semantic representation"

classical_ir:
path: "src/ir_gen.rs"
consumes:
- "validated classical/general semantic representation"
produces:
- "Classical IR"

quantum_ir:
path: "src/quantum/ir/"
consumes:
- "validated quantum semantic representation"
produces:
- "quantum::ir"

compiler:
consumes:
- "canonical IR"
- "target descriptions"
- "capability descriptions"
- "resource availability"
produces:
- "target realization"

runtime:
consumes:
- "compiled realization"
- "runtime capabilities"
- "runtime resources"
- "policies"
produces:
- "execution"

tests:
consumes:
- "all applicable production layers"
produces:
- "conformance evidence"

=============================================================================

42. FREEZE ELIGIBILITY

=============================================================================

freeze:

this_file:

status: "FREEZE_ELIGIBLE_WHEN_VALIDATED"

required:
  - "YAML parser accepts file"
  - "all referenced authoritative paths exist"
  - "dependency layers contain no forbidden cycles"
  - "ownership contract agrees"
  - "manifest references this file"
  - "status references this file"
  - "root compatibility file does not contradict it"

directory:

status: "NOT_FROZEN"

reason: >
  This contract defines the dependency architecture but does not itself
  prove that every existing grammar file satisfies the declared contract.

grammar_directory_frozen_only_when:
- "F00 through F19 pass"
- "all production files are inventoried"
- "all production files have owners"
- "all production dependencies resolve"
- "all dependency cycles are removed"
- "all mappings exist"
- "all validation gates pass"
- "all required tests pass"
- "root dependency compatibility surface is normalized"
- "safe-Rust integration passes"
- "POCO-REAF portability tests pass"

=============================================================================

43. CANONICAL MACHINE SUMMARY

=============================================================================

summary:

canonical_direction:

- "specification"
- "ownership"
- "lexical contracts"
- "core syntax"
- "types"
- "memory"
- "expressions"
- "functions"
- "statements"
- "effects/resources/policies/security"
- "domains"
- "execution"
- "compilation"
- "interoperability/dialects"
- "compatibility"
- "parser composition"
- "AST"
- "semantic analysis"
- "canonical IR"
- "target negotiation"
- "lowering"
- "routing"
- "scheduling"
- "ZQN"
- "HAL"
- "runtime"

canonical_ir_boundaries:
classical: "Classical IR"
quantum: "quantum::ir"

universal_rules:
one_language: true
one_owner_per_symbol: true
one_public_lexer: true
one_public_parser_boundary: true
one_root_composition: true
target_independent_source_semantics: true
symbolic_resource_model: true
open_world_scalability: true
explicit_capability_model: true
explicit_policy_model: true
explicit_effect_model: true
explicit_provenance_model: true
no_universal_hardware_ceiling: true
no_unsafe_rust: true

production_statement:
rule: >
The dependency contract is production-ready as an architectural
contract when validated against the repository. Production readiness of
grammar/ itself remains blocked until every declared dependency,
ownership, implementation, compatibility, conformance, scalability,
and freeze gate passes.

