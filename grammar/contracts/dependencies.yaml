=============================================================================

hard_coding:

owner:
path: "grammar/validation/"

dependency_rule:
grammar_validation:
must_run_before: "FREEZE"

forbidden_patterns:
- "universal maximum resource constants"
- "fixed device counts"
- "fixed hardware inventories"
- "vendor-specific universal tokens"
- "fixed target assumptions"
- "hidden implementation ceilings"

allowed_patterns:
