=============================================================================

2. FUNDAMENTAL DEPENDENCY LAWS

=============================================================================

invariants:

single_language:
severity: "error"
rule: >
All computational domains represented by Zamani are domains of one
language. Classical, quantum, HDL, AI, data, distributed, networking,
accelerator, embedded, and future computational constructs MUST NOT
establish incompatible independent languages.

one_canonical_owner:
severity: "error"
rule: >
Every exported language concept MUST have exactly one canonical owner
declared by grammar/contracts/ownership.yaml and grammar/OWNERSHIP.yaml.

dependency_is_not_ownership:
severity: "error"
rule: >
A dependency grants consumption rights only. It MUST NOT transfer
ownership of the consumed concept.

composition_is_not_ownership:
severity: "error"
rule: >
A dispatcher, imported grammar, facade, compatibility layer, or root
grammar MUST NOT redefine concepts owned by another grammar.

normative_before_implementation:
severity: "error"
rule: >
Production grammar MUST conform to the normative specification.
Implementation convenience MUST NOT redefine language meaning.

implementation_after_contract:
severity: "error"
rule: >
Rust implementation MUST consume stable language contracts and MUST NOT
silently introduce competing source-language semantics.

backend_not_upstream:
severity: "error"
rule: >
Grammar, specification, AST, and canonical semantic layers MUST NOT
depend on backend-specific implementation details.

target_not_upstream:
severity: "error"
rule: >
Universal source syntax MUST NOT depend on a particular CPU, GPU, FPGA,
ASIC, accelerator, QPU, simulator, cluster, cloud provider, operating
system, vendor, or physical device.

runtime_not_upstream:
severity: "error"
rule: >
Parsing and grammar validation MUST NOT depend on live runtime state.

tests_not_upstream:
severity: "error"
rule: >
Production grammar MUST NOT depend on tests, examples, golden files,
generated artifacts, benchmarks, or fixtures.

generated_not_upstream:
severity: "error"
rule: >
Generated files MUST NOT become authorities or required semantic inputs
for their own generators.

acyclic:
severity: "error"
rule: >
The production dependency graph MUST be acyclic after compatibility
aliases and explicitly test-only edges are excluded.

deterministic:
severity: "error"
rule: >
Dependency resolution and grammar composition MUST be deterministic.
Import order MUST NOT change language meaning.

explicit_dependencies:
severity: "error"
rule: >
Every production dependency MUST be explicitly declared. Hidden imports,
implicit ownership, filesystem-order dependence, and convention-only
dependencies are prohibited.

frozen_interface:
severity: "error"
rule: >
A frozen file MUST expose a stable interface that permits downstream
extension without modifying the frozen file merely to support a new
backend, target, device, operation, dialect, algorithm, or resource
scale.

dependency_closed_freeze:
severity: "error"
rule: >
A file or directory MUST NOT be marked STABLE unless every mandatory
production dependency is itself resolved and freeze-eligible.

=============================================================================

3. POCO-REAF DEPENDENCY CONTRACT

=============================================================================

poco_reaf:

name: "Program_Once_Compile_Once_Run_Everywhere_Anywhere_Forever"

semantic_principle:
rule: >
Source semantics MUST be expressed independently of the finite
characteristics of any particular execution target.

source_to_realization:

source:
  owns:
    - "program meaning"
    - "types"
    - "effects"
    - "contracts"
    - "policies"
    - "resource requirements"
    - "capability requirements"
    - "preferences"
    - "portable constraints"
    - "provenance intent"

realization:
  owns:
    - "target discovery"
    - "capability matching"
    - "resource availability"
    - "target selection"
    - "lowering"
    - "routing"
    - "scheduling"
    - "placement"
    - "calibration"
    - "execution"
    - "runtime recovery"

compile_once:
dependency_boundary:
source: "grammar/"
semantic_artifact: "src/ast/ + semantic implementation + src/ir/"
target_artifact: "compiler/backend"
invariant: >
Compile-once MUST refer to preservation of portable program meaning and
canonical compilation artifacts. It MUST NOT claim that one
target-native machine artifact is executable unchanged on physically
incompatible targets.

run_everywhere:
required_mechanisms:
- "capability discovery"
- "resource matching"
- "target-independent semantic representation"
- "target-aware lowering"
- "compatibility validation"

run_anywhere:
invariant: >
A realization is valid only when requirements, constraints, effects,
capabilities, resources, contracts, and policies permit that realization.

run_forever:
required_mechanisms:
- "language versioning"
- "AST compatibility"
- "semantic compatibility"
- "IR compatibility"
- "dialect versioning"
- "migration rules"
- "portable artifact metadata"
- "reproducibility metadata"

=============================================================================

4. SCALABILITY CONTRACT

=============================================================================

scalability:

model: "open_world"

architectural_meaning:
rule: >
Zamani grammar MUST NOT encode an artificial universal maximum for the
number, size, width, rank, depth, count, or capacity of computational
resources.

permitted:
- "symbolic dimensions"
- "runtime dimensions"
- "generic parameters"
- "dependent or constrained dimensions"
- "resource expressions"
- "capability expressions"
- "abstract topology"
- "resource negotiation"
- "target discovery"
- "dynamic allocation"
- "parallel decomposition"
- "distributed decomposition"
- "specialization"
- "placement"
- "routing"
- "scheduling"
- "adaptive realization"

forbidden_universal_capacity_constants:
- "MAX_QUBITS"
- "MAX_CPUS"
- "MAX_CORES"
- "MAX_THREADS"
- "MAX_GPUS"
- "MAX_FPGAS"
- "MAX_ASICS"
- "MAX_QPUS"
- "MAX_NODES"
- "MAX_MEMORY"
- "MAX_STORAGE"
- "MAX_REGISTER_WIDTH"
- "MAX_VECTOR_WIDTH"
- "MAX_TENSOR_RANK"
- "MAX_TENSOR_DIMENSION"
- "MAX_NETWORK_SIZE"
- "MAX_DEVICE_COUNT"
- "MAX_ACCELERATOR_COUNT"
- "MAX_AGENT_COUNT"
- "MAX_CIRCUIT_DEPTH"

equivalent_limits:
rule: >
Renaming, encoding, hiding, or moving a forbidden finite capacity into
another production does not make it legal.

resource_expression_examples:
- "requires qubits >= required_qubits"
- "requires memory >= required_memory"
- "requires capability("quantum.measurement")"
- "requires capability("gpu.compute")"
- "requires capability("tensor.compute")"
- "requires topology(required_topology)"

important_distinction:
language_capacity: "what Zamani can express"
program_constraint: "what the program explicitly requires or forbids"
implementation_capacity: "what a compiler/runtime can represent"
target_capacity: "what a realization environment currently provides"

dependency_rule:
language_to_target:
allowed: false
reason: >
Universal grammar cannot depend on target capacity.

target_to_language:
  allowed: false
  reason: >
    Target facts may constrain realization but MUST NOT redefine source
    semantics.

target_to_realization:
  allowed: true
  reason: >
    Target capability and resource data are consumed during compilation,
    lowering, scheduling, and execution.

