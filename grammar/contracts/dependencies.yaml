=============================================================================

Zamani Programming Language

=============================================================================

File:

grammar/contracts/dependencies.yaml

Purpose:

Canonical machine-checkable dependency contract for the Zamani grammar

subsystem.

This contract defines:

- dependency direction;

- dependency layers;

- grammar composition boundaries;

- lexical/parser boundaries;

- AST integration;

- semantic integration;

- canonical IR integration;

- resource/capability integration;

- effects/contracts/policies/provenance integration;

- domain integration;

- compiler/runtime boundaries;

- test and conformance dependency direction;

- compatibility dependencies;

- freeze ordering;

- cycle detection;

- hard-coding/scalability restrictions;

- safe-Rust implementation constraints;

- repository integration requirements.

This file DOES NOT define:

- token spellings;

- complete grammar productions;

- semantic definitions;

- AST data structures;

- IR data structures;

- backend algorithms;

- hardware inventory;

- runtime implementation details.

Those responsibilities remain with their declared authorities.

Repository:

Benwellonedge28/Zamani

Language:

Zamani

Rust:

Edition: 2021

Minimum supported version: 1.97

Safe Rust only.

Scalability:

Open-world and resource-bounded.

Architectural objective:

Program_Once_Compile_Once_Run_Everywhere_Anywhere_Forever (POCO-REAF)

IMPORTANT:

"Infinity" means that the language architecture imposes no artificial

finite machine-size ceiling. Every concrete compilation and execution is

necessarily finite and is constrained by actual resources, target

capabilities, implementation limits, physical reality, and explicit

program constraints.

=============================================================================

