=============================================================================

root_grammar:

path: "grammar/Zamani.g4"

role: "final composition root"

owns:
- "program-level composition"
- "source-unit dispatch"
- "universal item dispatch"
- "EOF"

may_compose:
- "canonical parser boundary"
- "approved domain dispatchers"

must_not_own:
- "individual token definitions"
- "domain-specific semantic implementations"
- "resource capacities"
- "physical hardware"
- "compiler algorithms"
- "runtime state"
- "canonical IR structures"

dependency_policy:
direct_domain_implementation_imports:
allowed: false
reason: >
Domain composition must occur through the public parser composition
contract rather than making the root a second monolithic grammar.

freeze_rule:
required_before_freeze:
- "all parser delegates frozen"
- "all exported rules uniquely owned"
- "all imports resolve"
- "no cycles"
- "no root-level domain implementation"
- "parser generation succeeds"
- "reference frontend integration succeeds"

