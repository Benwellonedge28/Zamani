parser:

public_boundary:
path: "grammar/antlr/ZamaniParser.g4"

responsibility:
- "compose parser productions"
- "provide stable public parser boundary"
- "define universal dispatch"
- "preserve source structure"

must_not:
- "perform type checking"
- "perform resource negotiation"
- "select hardware"
- "schedule execution"
- "route quantum operations"
- "perform calibration"
- "execute code"
- "define backend IR"

downstream:
ast:
owner: "src/ast/"
dependency_kind: "ast_contract"

semantic:
  owner: "semantic implementation"
  dependency_kind: "semantic_contract"

diagnostics:
  owner: "validation + frontend implementation"
  dependency_kind: "semantic_contract"

