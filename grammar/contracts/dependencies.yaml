8. LEXER DEPENDENCY CONTRACT

=============================================================================

lexer:

canonical_vocabulary_owner:
path: "grammar/lexer/"

public_boundary:
path: "grammar/antlr/ZamaniLexer.g4"

composition_rule:
rule: >
Only the canonical lexer boundary may expose the production lexer to
ANTLR parser composition.

parser_dependency:
allowed: true

parser_token_definition:
allowed: false

domain_token_definition:
allowed: false

duplicate_token_definition:
allowed: false

token_registry:
expected_path: "grammar/lexer/tokens.g4"

token_registry_requirements:
every_token:
- "canonical name"
- "spelling or lexical rule"
- "category"
- "owner"
- "reserved/contextual status"
- "compatibility status"
- "tests"

integration:
consumed_by:
- "grammar/antlr/ZamaniLexer.g4"
- "grammar/antlr/ZamaniParser.g4"
- "src/lexer.rs"

invariant: >
No parser, domain grammar, or backend may create a competing lexical
vocabulary.

