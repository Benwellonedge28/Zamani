kind: "zamani-grammar-ownership-contract"
format: "yaml"
repository: "Benwellonedge28/Zamani"
language: "Zamani"
root: "grammar/"
rust_edition: "2021"
minimum_rust: "1.97"
safety_model: "safe-rust-only"
source_of_truth: "grammar/specification/"
architectural_authority: "grammar/DESIGN.md"
repository_registry: "grammar/OWNERSHIP.yaml"
manifest: "grammar/MANIFEST.yaml"
dependency_contract: "grammar/DEPENDENCIES.yaml"
status_registry: "grammar/STATUS.yaml"

=============================================================================

1. AUTHORITY MODEL

=============================================================================

authority:

hierarchy:
- rank: 1
path: "grammar/DESIGN.md"
role: "architectural_authority"

- rank: 2
  path: "grammar/specification/"
  role: "normative_language_authority"

- rank: 3
  path: "grammar/spec/"
  role: "machine_contract_authority"

- rank: 4
  path: "grammar/OWNERSHIP.yaml"
  role: "repository_ownership_registry"

- rank: 5
  path: "grammar/contracts/ownership.yaml"
  role: "machine_checkable_ownership_contract"

- rank: 6
  path: "grammar/DEPENDENCIES.yaml"
  role: "dependency_graph"

- rank: 7
  path: "grammar/STATUS.yaml"
  role: "implementation_status"

- rank: 8
  path: "grammar/antlr/"
  role: "ANTLR_composition_boundary"

- rank: 9
  path: "grammar/*.g4"
  role: "grammar_implementation"

- rank: 10
  path: "src/"
  role: "executable_frontend_and_compiler_implementation"

historical_reference:
path: "grammar/Zamani-Grammar.md"
authority: "non_normative"
ownership_effect: "none"
rule: >
Mentioning a concept in the historical/reference document MUST NOT
establish grammar ownership.

navigation_only:
path: "grammar/README.md"
authority: "navigation"
ownership_effect: "none"

=============================================================================

2. FUNDAMENTAL OWNERSHIP LAWS

=============================================================================

rules:

one_owner_per_symbol:
severity: "error"
rule: >
Every canonical grammar symbol MUST have exactly one canonical owner.

one_owner_per_concept:
severity: "error"
rule: >
Every semantically distinct source-language concept MUST have exactly
one canonical owner.

no_duplicate_semantics:
severity: "error"
rule: >
Two files MUST NOT independently define semantically equivalent
constructs merely because their filenames differ.

composition_is_not_ownership:
severity: "error"
rule: >
A dispatcher, composition grammar, import, include, or root grammar
MAY consume another grammar but MUST NOT become the owner of its
canonical symbols.

consumption_is_not_ownership:
severity: "error"
rule: >
A consumer MAY depend on an exported concept without owning it.

implementation_is_not_ownership:
severity: "error"
rule: >
Rust implementation files MAY implement a language contract but MUST
NOT silently introduce source-language concepts absent from the
normative ownership model.

backend_is_not_ownership:
severity: "error"
rule: >
CPU, GPU, FPGA, ASIC, accelerator, QPU, simulator, cluster, cloud,
operating-system, vendor, or runtime implementations MUST NOT become
owners of universal source syntax.

specification_is_not_grammar_ownership:
severity: "error"
rule: >
Documentation defines meaning but does not create an ANTLR symbol
owner.

generated_is_not_authoritative:
severity: "error"
rule: >
Generated files MUST NOT become independent language authorities.

no_hidden_exports:
severity: "error"
rule: >
A grammar MUST NOT export a canonical symbol that is absent from its
ownership contract.

no_implicit_owner:
severity: "error"
rule: >
Any canonical symbol lacking an explicit owner is an audit failure.

dependency_closed_freeze:
severity: "error"
rule: >
A file MUST NOT be marked STABLE unless all contracts required by its
exported concepts are dependency-closed.

frozen_interface:
severity: "error"
rule: >
A frozen owner MUST be extensible through its declared interface and
MUST NOT require semantic modification merely because a new backend,
device, dialect, algorithm, or target is introduced.

ownership_is_semantic:
severity: "error"
rule: >
Ownership is determined by semantic authority, not by filename,
directory position, implementation convenience, or historical origin.

=============================================================================

3. POCO-REAF OWNERSHIP LAWS

=============================================================================

poco_reaf:

name: "Program_Once_Compile_Once_Run_Everywhere_Anywhere_Forever"

source_semantics_owner:
path: "grammar/specification/"
responsibility:
- "stable source meaning"
- "portable computation intent"
- "requirements"
- "constraints"
- "preferences"
- "capabilities"
- "effects"
- "contracts"
- "policies"
- "provenance"

compile_once_boundary:
owner:
- "grammar/compile/"
- "src/"
invariant: >
Compile-once MUST mean preservation of portable semantic intent and
target-independent compilation artifacts. It MUST NOT promise that one
target-native binary can execute unchanged on every architecture.

run_everywhere:
owner:
- "grammar/resources/"
- "grammar/hardware/"
- "grammar/compile/"
- "grammar/execution/"
- "src/"
invariant: >
Target realization MUST be capability- and resource-driven.

run_anywhere:
invariant: >
A target MAY realize a program only when its requirements, constraints,
policies, effects, and capabilities permit the realization.

run_forever:
owner:
- "grammar/compatibility/"
- "grammar/specification/compatibility.md"
invariant: >
Long-term compatibility MUST be based on versioned semantics,
canonical representations, compatibility contracts, and migrations.

forbidden:
- "source syntax owned by a physical device"
- "universal hardware ceilings"
- "vendor-specific universal keywords"
- "finite device catalogs as language law"
- "target selection embedded into universal syntax"
- "backend-specific semantics in core grammar"

=============================================================================

4. SCALABILITY CONTRACT

=============================================================================

scalability:

model: "open_world"

principle: >
Zamani source semantics MUST remain independent of the finite resources
of any current implementation. Computation MAY scale from the smallest
feasible realization to the largest feasible realization permitted by
available resources.

allowed:
- "symbolic dimensions"
- "runtime dimensions"
- "generic parameters"
- "resource requirements"
- "capability requirements"
- "abstract topology"
- "resource negotiation"
- "target discovery"
- "parallelization"
- "distribution"
- "specialization"
- "routing"
- "scheduling"
- "dynamic allocation"

forbidden_universal_capacity_names:
- "MAX_QUBITS"
- "MAX_CPUS"
- "MAX_CORES"
- "MAX_THREADS"
- "MAX_GPUS"
- "MAX_FPGAS"
- "MAX_ASICS"
- "MAX_QPUS"
- "MAX_NODES"
- "MAX_MEMORY"
- "MAX_STORAGE"
- "MAX_REGISTER_WIDTH"
- "MAX_VECTOR_WIDTH"
- "MAX_TENSOR_RANK"
- "MAX_TENSOR_DIMENSION"
- "MAX_NETWORK_SIZE"
- "MAX_DEVICE_COUNT"
- "MAX_ACCELERATOR_COUNT"
- "MAX_AGENT_COUNT"

forbidden_equivalents:
rule: >
Renaming a forbidden capacity constant does not make it legal.

distinction:
language_capacity: "expressiveness of Zamani"
implementation_capacity: "representation limits of a compiler/runtime"
target_capacity: "resources available on a realization target"
program_constraint: "explicit limit requested by a program"
deployment_constraint: "limit imposed by deployment"

invariant: >
Implementation and target capacity MUST NOT be promoted into universal
language ownership.

=============================================================================

5. RESOURCE AND CAPABILITY OWNERSHIP

=============================================================================

resource_model:

requirements:
owner: "grammar/resources/"
examples:
- "requires qubits >= required_qubits"
- "requires memory >= required_memory"
- "requires capability("quantum.measurement")"
- "requires capability("gpu.compute")"
- "requires capability("tensor.compute")"
- "requires topology(required_topology)"

constraints:
owner: "grammar/resources/"
role: "restrict_acceptable_realizations"

preferences:
owner: "grammar/resources/"
role: "rank_acceptable_realizations_without_changing_meaning"

hints:
owner: "grammar/core/hints.g4"
invariant: >
Optimization hints MUST NOT alter program semantics.

capabilities:
universal_owner: "grammar/core/capabilities.g4"
resource_semantic_owner: "grammar/resources/"
realization_owner: "grammar/hardware/"
runtime_discovery_owner: "grammar/execution/"

negotiation:
source_owner: "grammar/resources/"
realization_owner: "grammar/compile/"
runtime_owner: "grammar/execution/"

topology:
source_owner: "grammar/resources/"
realization_owner: "grammar/hardware/"
routing_owner: "grammar/compile/"

