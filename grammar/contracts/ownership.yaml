- "lexical_component"
- "normative_specification"
- "machine_specification"
- "documentation"
- "validation_contract"
- "test"
- "example"
- "generated"
- "historical"
- "repository_artifact"
- "quarantined_artifact"

=============================================================================

47. FILE FREEZE CONTRACT

=============================================================================

freeze:

a_file_is_not_stable_until:

ownership:
  - "exactly one canonical owner"
  - "no unresolved semantic duplicate"
  - "no hidden exported symbol"

dependencies:
  - "all declared imports exist"
  - "dependency direction is valid"
  - "no dependency cycle"
  - "dependency contract is frozen or explicitly versioned"

integration:
  - "AST mapping exists or is explicitly not applicable"
  - "semantic mapping exists or is explicitly not applicable"
  - "IR mapping exists or is explicitly not applicable"
  - "diagnostic ownership exists"
  - "test ownership exists"
  - "compatibility ownership exists"

scalability:
  - "no universal finite machine capacity"
  - "symbolic resource model preserved"
  - "open-world extension preserved"

portability:
  - "no accidental target coupling"
  - "no vendor-specific universal syntax"
  - "hardware realization remains downstream"

safety:
  - "Rust implementation remains safe"
  - "no unsafe requirement introduced"

validation:
  - "positive tests pass"
  - "negative tests pass"
  - "ambiguity audit passes"
  - "hard-coding audit passes"
  - "ownership audit passes"
  - "dependency audit passes"

documentation:
  - "normative specification reference exists"
  - "status is declared"
  - "compatibility impact is declared"

frozen_interface_rule:
rule: >
After a file is frozen, a new target, device, backend, operation,
dialect, algorithm, or implementation MUST integrate through existing
declared interfaces whenever its semantics fit those interfaces.

=============================================================================

48. DUPLICATE-CONCEPT RESOLUTION

=============================================================================

duplicate_resolution:

principle: >
Similar filenames are not automatically duplicates. Similar semantics
ARE duplicates unless the distinction is explicit, stable, documented,
and machine-verifiable.

known_conflicts:

- canonical: "grammar/types/array.g4"
  competing:
    - "grammar/types/array-types.g4"
  decision: "single canonical array owner"
  freeze_blocker: true

- canonical: "grammar/types/map.g4"
  competing:
    - "grammar/types/map-types.g4"
  decision: "single canonical map owner"
  freeze_blocker: true

- canonical: "grammar/types/option.g4"
  competing:
    - "grammar/types/option-types.g4"
    - "grammar/types/optional.g4"
  decision: "single canonical option/optional owner"
  freeze_blocker: true

- canonical: "grammar/expressions/lambda.g4"
  competing:
    - "grammar/expressions/lambdas.g4"
  decision: "single canonical lambda owner"
  freeze_blocker: true

- canonical: "grammar/expressions/closure.g4"
  competing:
    - "grammar/expressions/closures.g4"
  decision: "single canonical closure owner"
  freeze_blocker: true

required_ci_behavior:
- "fail if both canonical and competing files export the same symbol"
- "fail if competing files contain semantically equivalent unregistered exports"
- "fail if a quarantine file is imported by a stable grammar"
- "fail if quarantine status is absent from STATUS.yaml"

=============================================================================

49. OPEN-WORLD EXTENSION CONTRACT

=============================================================================

open_world:

rule: >
Concepts whose universe is expected to grow MUST be represented through
identifiers, registries, metadata, dialects, capabilities, parameters,
or semantic extension points rather than closed grammar enumerations.

applies_to:
- "quantum operations"
- "hardware capabilities"
- "accelerators"
- "AI models"
- "data formats"
- "network protocols"
- "device classes"
- "execution strategies"
- "resource kinds"
- "future computational domains"

forbidden_pattern:
description: >
A grammar rule MUST NOT require editing a universal enumeration merely
to introduce an otherwise valid future member of an open-ended domain.

=============================================================================

50. APPLICATION-SPECIFIC EXTENSION CONTRACT

=============================================================================

application_extensions:

universal_core_rule: >
Application concepts MUST NOT become permanent core-language keywords
solely because an application exists.

allowed_extension_mechanisms:
- "library"
- "module"
- "dialect"
- "capability"
- "policy"
- "schema"
- "application package"

rationale: >
This preserves language stability and prevents application growth from
turning the core grammar into a finite catalog.

=============================================================================

51. TARGET REALIZATION BOUNDARY

=============================================================================

target_realization:

source_owner:
- "grammar/resources/"
- "grammar/hardware/"
- "grammar/compile/"
- "grammar/execution/"

downstream_owner:
- "compiler"
- "backend"
- "runtime"
- "HAL"

forbidden_source_ownership:
- "physical CPU identity"
- "physical GPU identity"
- "physical FPGA identity"
- "physical ASIC identity"
- "physical QPU identity"
- "physical qubit allocation"
- "vendor calibration"
- "machine instruction encoding"

invariant: >
Source semantics MUST describe what must be achieved, not hard-code how
a particular machine achieves it.

=============================================================================

52. FALLBACK OWNERSHIP

=============================================================================

fallback:

source_owner:
- "grammar/policies/"
- "grammar/execution/"

semantic_rule: >
Fallback MUST be explicitly permitted and MUST preserve the required
semantic contract.

examples:
allowed:
- "quantum realization -> approved simulator"
- "accelerator realization -> approved classical realization"
- "parallel realization -> serial realization where semantics permit"

forbidden:
- "silent semantic approximation"
- "silent loss of required capability"
- "silent violation of a contract"
- "silent violation of a policy"

=============================================================================

53. SOURCE SPAN / DIAGNOSTIC OWNERSHIP

=============================================================================

source_spans:

parser_owner: "ANTLR/parser implementation"
AST_owner: "src/ast/"
semantic_owner: "semantic analysis"

invariant: >
Every stable source construct MUST preserve sufficient source-location
information for deterministic diagnostics and provenance where required.

=============================================================================

54. SAFE RUST CONTRACT

=============================================================================

rust:

edition: "2021"
minimum: "1.97"
recommended: "1.97.1_or_later"

forbidden:
- "unsafe"
- "unsafe blocks"
- "unsafe traits"
- "unsafe implementations"

grammar_contract:
rule: >
Grammar ownership MUST NOT require an unsafe Rust implementation.

frontend:
lexer: "src/lexer.rs"
parser: "src/parser.rs"
ast: "src/ast/"

integration_rule: >
ANTLR grammar contracts and the Rust frontend MUST converge on the same
accepted-language and semantic conformance contracts.

=============================================================================

55. REPOSITORY-WIDE INTEGRATION

=============================================================================

repository_integration:

required_chain:
- "grammar/DESIGN.md"
- "grammar/specification/"
- "grammar/spec/"
- "grammar/OWNERSHIP.yaml"
- "grammar/contracts/ownership.yaml"
- "grammar/DEPENDENCIES.yaml"
- "grammar/STATUS.yaml"
- "grammar/antlr/"
- "grammar modular grammars"
- "src/lexer.rs"
- "src/parser.rs"
- "src/ast/"
- "semantic analysis"
- "canonical IR"
- "compiler"
- "runtime"
- "HAL"

root_rule: >
No lower layer may become an alternate authority for source-language
ownership.

reverse_dependency_rule: >
Backend or runtime changes MUST NOT require rewriting stable source
ownership merely to support a new physical target.

=============================================================================

56. REQUIRED CROSS-CONTRACT REFERENCES

=============================================================================

cross_contracts:

ownership:
canonical: "grammar/contracts/ownership.yaml"

dependencies:
required: "grammar/contracts/dependencies.yaml"

exports:
required: "grammar/contracts/exports.yaml"

ast:
required: "grammar/contracts/ast-mappings.yaml"

semantic:
required: "grammar/contracts/semantic-mappings.yaml"

ir:
required: "grammar/contracts/ir-mappings.yaml"

diagnostics:
required: "grammar/contracts/diagnostics.yaml"

compatibility:
required: "grammar/contracts/compatibility.yaml"

status:
required: "grammar/contracts/feature-status.yaml"

synchronization_rule: >
A symbol MUST NOT be considered STABLE if these contracts disagree.

=============================================================================

