=============================================================================

Zamani Programming Language

grammar/contracts/ownership.yaml

=============================================================================

PURPOSE

-------

Machine-checkable ownership contract for the Zamani grammar subsystem.

This file defines:

1. canonical ownership of language concepts;

2. ownership of grammar symbols;

3. ownership of lexical concepts;

4. composition versus ownership;

5. AST/semantic/IR ownership boundaries;

6. downstream integration contracts;

7. duplicate/conflicting concept resolution;

8. target-independence and scalability rules;

9. POCO-REAF invariants;

10. safe-Rust implementation constraints;

11. freeze requirements;

12. validation rules that CI MUST enforce.

This file does NOT replace:

grammar/DESIGN.md

Architectural authority.

grammar/specification/

Human-readable normative language specification.

grammar/spec/

Machine-oriented semantic/specification contracts.

grammar/OWNERSHIP.yaml

Repository-wide ownership registry/inventory.

grammar/MANIFEST.yaml

Complete repository inventory and production metadata.

grammar/DEPENDENCIES.yaml

Canonical dependency DAG.

grammar/STATUS.yaml

Implementation/conformance status.

Ownership is about authority over a concept.

Composition is not ownership.

Consumption is not ownership.

AST representation is not grammar ownership.

Semantic implementation is not grammar ownership.

IR implementation is not grammar ownership.

Backend implementation is not grammar ownership.

=============================================================================

schema:
