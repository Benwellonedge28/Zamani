=============================================================================

provenance:

canonical_owner: "grammar/ai/"

cross_domain_semantic_role: true

may_attach_to:
- "source declarations"
- "inferred facts"
- "reasoning"
- "learning"
- "compiler transformations"
- "resource decisions"
- "target selection"
- "quantum routing"
- "hardware placement"
- "security decisions"
- "simulation results"

storage_rule: >
Unlimited provenance retention MUST NOT be imposed by grammar ownership.
Retention and storage are implementation concerns.

evidence:

canonical_owner: "grammar/ai/"

rule: >
Evidence syntax MUST remain generic and MUST NOT become an application-
specific vocabulary.

