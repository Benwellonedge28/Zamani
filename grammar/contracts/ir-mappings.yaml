    provenance: "required"

    preservation:
      - "semantic identity"
      - "version identity"
      - "reproducibility requirements"
      - "optimization constraints"
      - "target compatibility policy"

    diagnostics:
      contract: "grammar/contracts/diagnostics.yaml"

    compatibility:
      identity: "semantic.compilation"

    tests:
      required:
        - "grammar/conformance/ir/compile/"
        - "grammar/conformance/compatibility/"

    scalability:
      artifact_size_symbolic: true
      target_set_open_world: true

    target_independence: true
    status: "specified"
    freeze:
      required: true

  # ---------------------------------------------------------------------------
  # SECURITY
  # ---------------------------------------------------------------------------

  - id: "IR-SECURITY-001"
    semantic_identity: "semantic.security"
    semantic_owner: "semantic/security"
    source_mapping:
      grammar_owner: "grammar/security/"
      grammar_symbols:
        - "identity"
        - "authorization"
        - "permission"
        - "sandbox"
        - "trust"
      ast_mapping:
        contract: "grammar/contracts/ast-mappings.yaml"

    canonical_ir:
      boundary: "ir.program"
      operation_or_model: "security_policy"
      version: "contract-defined"

    lowering_kind: "metadata_only"

    operands:
      - "identity"
      - "permissions"
      - "trust requirements"
      - "security policy"

    results:
      - "security obligations"

    attributes:
      required:
        - "security_identity"
        - "policy"
        - "source_span"

    effects:
      - "security"

    capabilities: "security_capabilities"
    resources: "security_resources"
    contracts: "security_contracts"
    policies: "security_policies"
    provenance: "required"

    preservation:
      - "authorization requirements"
      - "permission semantics"
      - "sandbox requirements"
      - "trust requirements"
      - "audit requirements"

    diagnostics:
      contract: "grammar/contracts/diagnostics.yaml"

    compatibility:
      identity: "semantic.security"

    tests:
      required:
        - "grammar/conformance/ir/security/"

    scalability:
      identity_count_symbolic: true
      policy_count_open_world: true

    target_independence: true
    status: "specified"
    freeze:
      required: true

  # ---------------------------------------------------------------------------
  # DIALECTS / INTEROPERABILITY
  # ---------------------------------------------------------------------------

  - id: "IR-DIALECT-001"
    semantic_identity: "semantic.dialect"
    semantic_owner: "semantic/dialects"
    source_mapping:
      grammar_owner: "grammar/dialects/"
      grammar_symbols:
        - "dialect"
        - "dialectDeclaration"
        - "dialectImport"
      ast_mapping:
        contract: "grammar/contracts/ast-mappings.yaml"

    canonical_ir:
      boundary: "ir.dialect"
      operation_or_model: "dialect_descriptor"
      version: "contract-defined"

    lowering_kind: "metadata_only"

    operands:
      - "dialect identity"
      - "version"
      - "dependencies"
      - "semantic registrations"

    results:
      - "dialect descriptor"

    attributes:
      required:
        - "dialect_identity"
        - "dialect_version"
        - "source_span"

    effects: []
    capabilities: "dialect_capabilities"
    resources: []
    contracts: []
    policies: "dialect_policies"
    provenance: "required"

    preservation:
      - "dialect identity"
      - "version"
      - "dependency constraints"
      - "semantic registration identity"

    diagnostics:
      contract: "grammar/contracts/diagnostics.yaml"

    compatibility:
      identity: "semantic.dialect"

    tests:
      required:
        - "grammar/conformance/ir/dialects/"

    scalability:
      dialect_count_open_world: true

    target_independence: true
    status: "specified"
    freeze:
      required: true

  - id: "IR-INTEROP-001"
    semantic_identity: "semantic.interoperability"
    semantic_owner: "semantic/interoperability"
    source_mapping:
      grammar_owner: "grammar/interoperability/"
      grammar_symbols:
        - "ffi"
        - "abi"
        - "foreignFunction"
        - "linkage"
        - "serialization"
      ast_mapping:
        contract: "grammar/contracts/ast-mappings.yaml"

    canonical_ir:
      boundary: "ir.program"
      operation_or_model: "foreign_interoperability"
      version: "contract-defined"

    lowering_kind: "structured"

    operands:
      - "foreign symbol"
      - "ABI contract"
      - "calling convention"
      - "serialization contract"

    results:
      - "foreign call/result"

    attributes:
      required:
        - "foreign_identity"
        - "ABI_identity"
        - "source_span"

    effects:
      - "foreign"

    capabilities:
      - "foreign.interoperability"

    resources: "foreign_resources"
    contracts: "ABI_contracts"
    policies: "foreign_policies"
    provenance: "required"

    preservation:
      - "calling convention"
      - "type conversion"
      - "ownership"
      - "error semantics"
      - "serialization semantics"

    diagnostics:
      contract: "grammar/contracts/diagnostics.yaml"

    compatibility:
      identity: "semantic.interoperability"

    tests:
      required:
        - "grammar/conformance/ir/interoperability/"

    scalability:
      external_symbol_count_open_world: true

    target_independence: true
    status: "specified"
    freeze:
      required: true

  # ---------------------------------------------------------------------------
  # MACROS / METAPROGRAMMING
  # ---------------------------------------------------------------------------

  - id: "IR-METAPROGRAMMING-001"
    semantic_identity: "semantic.metaprogramming"
    semantic_owner: "semantic/metaprogramming"
    source_mapping:
      grammar_owner: "grammar/metaprogramming/"
      grammar_symbols:
        - "quote"
        - "unquote"
        - "reflection"
        - "generation"
        - "introspection"
      ast_mapping:
        contract: "grammar/contracts/ast-mappings.yaml"

    canonical_ir:
      boundary: "ir.program"
      operation_or_model: "metaprogramming_operation"
      version: "contract-defined"

    lowering_kind: "structured"

    operands:
      - "syntax representation"
      - "semantic context"
      - "generation inputs"

    results:
      - "generated semantic representation"

    attributes:
      required:
        - "generation_identity"
        - "stage"
        - "source_span"

    effects:
      - "reflection"
      - "code_generation"

    capabilities:
      - "reflection"
      - "code_generation"

    resources: "generation_resources"
    contracts: "generation_contracts"
    policies: "generation_policies"
    provenance: "required"

    preservation:
      - "hygiene"
      - "scope"
      - "generated provenance"
      - "semantic validation"

    rule: >
      Generated constructs MUST pass through the same semantic validation and
      canonical IR mapping rules as ordinary source constructs.

    diagnostics:
      contract: "grammar/contracts/diagnostics.yaml"

    compatibility:
      identity: "semantic.metaprogramming"

    tests:
      required:
        - "grammar/conformance/ir/metaprogramming/"

    scalability:
      generated_size_symbolic: true
      recursive_generation: "policy-controlled"

    target_independence: true
    status: "specified"
    freeze:
      required: true

# =============================================================================
# 14. DOMAIN COVERAGE REQUIREMENT
# =============================================================================

domain_coverage:

  required_domains:

    classical:
      semantic_prefix: "semantic.classical"
      canonical_ir: "ir.classical"
      required: true

    quantum:
      semantic_prefix: "semantic.quantum"
      canonical_ir: "ir.quantum"
      required: true

    hdl:
      semantic_prefix: "semantic.hdl"
      canonical_ir: "ir.hdl-hardware"
      required: true

    hardware:
      semantic_prefix: "semantic.hardware"
      canonical_ir: "ir.hdl-hardware"
      required: true

    hybrid:
      semantic_prefix: "semantic.hybrid"
      canonical_ir: "ir.hybrid-composition"
      required: true

    ai:
      semantic_prefix: "semantic.ai"
      canonical_ir: "domain-selected"
      required: true

    data:
      semantic_prefix: "semantic.data"
      canonical_ir: "domain-selected"
      required: true

    concurrency:
      semantic_prefix: "semantic.concurrency"
      canonical_ir: "ir.program"
      required: true

    distributed:
      semantic_prefix: "semantic.distributed"
      canonical_ir: "ir.program"
      required: true

    networking:
      semantic_prefix: "semantic.networking"
      canonical_ir: "ir.program"
      required: true

    execution:
      semantic_prefix: "semantic.execution"
      canonical_ir: "ir.program"
      required: true

    security:
      semantic_prefix: "semantic.security"
      canonical_ir: "ir.program"
      required: true

    interoperability:
      semantic_prefix: "semantic.interoperability"
      canonical_ir: "ir.program"
      required: true

    dialects:
      semantic_prefix: "semantic.dialect"
      canonical_ir: "ir.dialect"
      required: true

# =============================================================================
# 15. EXHAUSTIVE REGISTRY CLOSURE
# =============================================================================

coverage:

  mode: "exhaustive_by_registry"

  purpose: >
    This contract intentionally does not manually enumerate every grammar
    leaf rule. Repository-wide completeness is obtained by requiring every
    registered semantic identity and every lowering-relevant grammar export to
    resolve through the companion ownership, semantic, AST, export, and
    manifest contracts.

  required_sources:
    - "grammar/MANIFEST.yaml"
    - "grammar/OWNERSHIP.yaml"
    - "grammar/contracts/ownership.yaml"
    - "grammar/contracts/exports.yaml"
    - "grammar/contracts/ast-mappings.yaml"
    - "grammar/contracts/semantic-mappings.yaml"
    - "grammar/contracts/ir-mappings.yaml"
    - "grammar/STATUS.yaml"
    - "grammar/contracts/feature-status.yaml"

  closure_rules:

    every_semantic_identity:
      severity: "error"
      rule: >
        Every stable or implemented semantic identity MUST have exactly one
        IR mapping unless explicitly classified as syntax-only or
        analysis-only.

    every_lowering_relevant_export:
      severity: "error"
      rule: >
        Every grammar export that contributes executable or semantically
        observable meaning MUST resolve to a semantic identity and applicable
        canonical IR mapping.

    syntax_only:
      allowed: true
      requirement: >
        A syntax-only export MUST explicitly state that no semantic or IR
        mapping is required.

    analysis_only:
      allowed: true
      requirement: >
        An analysis-only construct MUST identify its analysis owner and MUST NOT
        be falsely represented as executable IR.

    no_orphans:
      severity: "error"
      rule: >
        No implemented semantic identity may exist without a declared canonical
        IR disposition.

    no_duplicates:
      severity: "error"
      rule: >
        One semantic identity MUST map to exactly one canonical IR ownership
        record.

# =============================================================================
# 16. LOWERING RULES
# =============================================================================

lowering:

  general:

    semantic_to_ir:
      rule: >
        Lowering converts validated semantic meaning into a canonical IR
        representation without changing semantic identity.

    normalization:
      rule: >
        Canonical normalization MUST be deterministic and target-independent.

    desugaring:
      rule: >
        Syntactic sugar MAY be removed before canonical IR construction when
        the semantic result is equivalent.

    optimization:
      rule: >
        Optimization MUST occur only after semantic validity is established or
        within a formally validated semantic-preserving transformation.

    specialization:
      rule: >
        Specialization MAY depend on symbolic values, requirements, policies,
        or later target information, but the canonical semantic identity MUST
        remain stable.

  ordering:

    required_pipeline:
      - "AST"
      - "structural validation"
      - "semantic analysis"
      - "canonical IR construction"
      - "IR validation"
      - "verified optimization"
      - "target-independent lowering"
      - "target negotiation"
      - "target-specific realization"

    prohibited_pipeline:
      - "AST -> vendor IR"
      - "AST -> physical device"
      - "grammar -> physical device"
      - "semantic model -> physical device without canonical IR"

# =============================================================================
# 17. SEMANTIC PRESERVATION
# =============================================================================

semantic_preservation:

  required: true

  equivalence:
    rule: >
      A lowering transformation is valid only when the transformed IR preserves
      every observable behavior required by the source semantic contract.

  must_preserve:
    - "values"
    - "types"
    - "effects"
    - "resource requirements"
    - "capability requirements"
    - "contracts"
    - "policies"
    - "provenance"
    - "control dependencies"
    - "ownership"
    - "error semantics"
    - "declared nondeterminism"
    - "quantum measurement semantics"
    - "HDL timing semantics where declared"
    - "distributed consistency semantics where declared"

  may_change:
    - "representation"
    - "instruction grouping"
    - "data layout when semantically invisible"
    - "parallelization"
    - "vectorization"
    - "operation decomposition"
    - "memory placement"
    - "execution schedule where timing is not semantic"
    - "target-specific implementation"

  forbidden_silent_changes:
    - "precision reduction violating contract"
    - "qubit reduction"
    - "dimension reduction"
    - "operation deletion"
    - "effect deletion"
    - "contract weakening"
    - "policy bypass"
    - "security weakening"
    - "implicit approximation"
    - "implicit fallback to different semantics"

# =============================================================================
# 18. QUANTUM-SPECIFIC PRESERVATION
# =============================================================================

quantum:

  canonical_ir:
    boundary: "src/quantum/ir/"
    identity: "quantum::ir"

  required_semantics:
    - "logical qubit identity"
    - "operation identity"
    - "parameters"
    - "controls"
    - "targets"
    - "results"
    - "measurement"
    - "dynamic control"
    - "classical feedback"
    - "channels"
    - "observables"
    - "models"
    - "pulse semantics where applicable"
    - "resource requirements"
    - "provenance"

  physical_separation:

    logical_qubit:
      belongs_to: "canonical semantic IR"

    physical_qubit:
      belongs_to: "realization"

    routing:
      belongs_to: "downstream realization"

    scheduling:
      belongs_to: "downstream realization"

    calibration:
      belongs_to: "downstream realization"

    vendor_instruction:
      belongs_to: "downstream realization"

  operation_registry:
    model: "open-world"

    allowed:
      - "builtin"
      - "custom"
      - "vendor"
      - "parameterized"
      - "dialect"

    rule: >
      The universal semantic operation model MUST remain generic enough to
      represent future operations without grammar redesign.

  qec:
    source_intent:
      may_require:
        - "fault tolerance"
        - "logical protection"
        - "code properties"
        - "resilience"
        - "syndrome semantics"

    canonical_ir:
      rule: >
        QEC intent may be represented in canonical quantum semantics, while
        decoder choice, physical code layout, syndrome routing, and device
        implementation remain downstream.

  zqn:
    rule: >
      Quantum noise and fault representation remains owned by the ZQN boundary.
      This contract MUST NOT create a competing noise ontology.

# =============================================================================
# 19. HDL / HARDWARE-SPECIFIC PRESERVATION
# =============================================================================

hdl_hardware:

  required_semantics:
    - "module"
    - "port"
    - "signal"
    - "net"
    - "register"
    - "memory"
    - "combinational behavior"
    - "sequential behavior"
    - "clock"
    - "reset"
    - "timing"
    - "pipeline"
    - "generate"
    - "interface"
    - "protocol"
    - "state machine"
    - "verification intent"
    - "synthesis intent"

  symbolic_dimensions:
    required:
      - "signal width"
      - "array dimensions"
      - "memory dimensions"
      - "pipeline dimensions"
      - "parallelism"

  forbidden:
    - "universal fixed bus maximum"
    - "universal fixed register maximum"
    - "universal fixed memory maximum"
    - "universal fixed clock count"
    - "universal fixed device count"

  realization:
    downstream:
      - "logic synthesis"
      - "technology mapping"
      - "placement"
      - "routing"
      - "timing closure"
      - "physical design"

# =============================================================================
# 20. CLASSICAL-SPECIFIC PRESERVATION
# =============================================================================

classical:

  canonical_ir:
    boundary: "Classical IR"

  required:
    - "numeric semantics"
    - "memory semantics"
    - "control flow"
    - "function semantics"
    - "type semantics"
    - "effects"
    - "resource requirements"

  numerical_portability:
    rule: >
      Numerical representation MAY vary across targets only when the declared
      semantic numerical contract remains satisfied.

  precision:
    rule: >
      Precision requirements MUST be represented semantically when they are
      correctness-relevant.

  vectorization:
    rule: >
      Vectorization is an implementation strategy and MUST NOT change the
      semantic dimensionality of the source computation.

# =============================================================================
# 21. HYBRID PRESERVATION
# =============================================================================

hybrid:

  composition:
    allowed_boundaries:
      - "classical <-> quantum"
      - "classical <-> HDL"
      - "quantum <-> HDL"
      - "classical <-> accelerator"
      - "quantum <-> accelerator"
      - "distributed <-> quantum"
      - "distributed <-> classical"

  rule: >
    Each side of a hybrid boundary MUST retain ownership of its own canonical
    semantic IR.

  conversion:
    required:
      - "explicit type semantics"
      - "ownership semantics"
      - "effect semantics"
      - "resource semantics"
      - "precision semantics where applicable"
      - "provenance"

  forbidden:
    - "implicit lossy conversion"
    - "implicit physical target selection"
    - "duplicate hybrid IR"

# =============================================================================
# 22. DISTRIBUTED AND NETWORK IR
# =============================================================================

distributed:

  topology:
    representation: "abstract"
    physical_realization: "downstream"

  node_identity:
    semantic:
      rule: >
        Logical node identities MAY exist in the semantic model when required
        by program meaning.

    physical:
      rule: >
        Physical host identity belongs to realization.

  scaling:
    node_count: "symbolic_or_dynamic"
    message_count: "symbolic_or_dynamic"
    channel_count: "symbolic_or_dynamic"
    topology_size: "open-world"

  preservation:
    - "message semantics"
    - "ordering"
    - "consistency"
    - "failure semantics"
    - "replication semantics"

# =============================================================================
# 23. TARGET INDEPENDENCE
# =============================================================================

target_independence:

  canonical_ir_must_not_contain:

    physical:
      - "device identifiers"
      - "physical addresses"
      - "physical core assignments"
      - "physical GPU assignments"
      - "physical FPGA placement"
      - "physical ASIC cells"
      - "physical qubit assignments"

    finite_capacity_constants:
      - "universal CPU count"
      - "universal GPU count"
      - "universal FPGA count"
      - "universal ASIC count"
      - "universal QPU count"
      - "universal node count"
      - "universal memory capacity"
      - "universal thread count"
      - "universal register width"
      - "universal tensor rank"
      - "universal network size"
      - "universal device count"

  allowed_downstream_information:
    - "target capabilities"
    - "available resources"
    - "target topology"
    - "target constraints"
    - "target performance characteristics"
    - "calibration"
    - "device state"
    - "runtime availability"

  rule: >
    Downstream target information may influence realization but MUST NOT
    retroactively redefine canonical semantic identity.

# =============================================================================
# 24. SCALABILITY
# =============================================================================

scalability:

  model: "open-world"

  principle: >
    Canonical IR must scale from the smallest supported computational instance
    to arbitrarily large feasible computations without imposing artificial
    language-level finite ceilings.

  dimensions:

    program_size:
      symbolic: true
      fixed_maximum: false

    operation_count:
      symbolic: true
      fixed_maximum: false

    value_count:
      symbolic: true
      fixed_maximum: false

    memory:
      symbolic: true
      fixed_maximum: false

    qubits:
      symbolic: true
      fixed_maximum: false

    classical_bits:
      symbolic: true
      fixed_maximum: false

    tensor_dimensions:
      symbolic: true
      fixed_maximum: false

    tensor_rank:
      symbolic: true
      fixed_maximum: false

    nodes:
      symbolic: true
      fixed_maximum: false

    devices:
      symbolic: true
      fixed_maximum: false

    concurrency:
      symbolic: true
      fixed_maximum: false

    signal_widths:
      symbolic: true
      fixed_maximum: false

  infinity_definition:
    rule: >
      Architectural infinity means absence of an artificial finite ceiling in
      the language or canonical IR. Every concrete artifact remains finite and
      subject to actual implementation, storage, computation, and physical
      resource availability.

  failure:
    rule: >
      When a concrete implementation cannot realize a semantically valid IR
      because of finite resources, the failure MUST be explicit and
      diagnosable.

# =============================================================================
# 25. DETERMINISM
# =============================================================================

determinism:

  canonicalization:
    required: true

  ordering:
    required: true

  hashing:
    rule: >
      Where canonical IR hashing is supported, semantically equivalent
      canonical artifacts MUST use the repository-defined canonicalization
      procedure before hashing.

  serialization:
    rule: >
      Canonical serialization MUST NOT depend on map iteration order,
      allocation order, process identifiers, physical addresses, or target
      discovery order.

  transformation_identity:
    required: true

# =============================================================================
# 26. VERSIONING
# =============================================================================

versioning:

  required_identities:
    - "language_version"
    - "grammar_version"
    - "ast_version"
    - "semantic_version"
    - "ir_version"
    - "dialect_versions"

  IR_version:
    rule: >
      Every canonical IR artifact MUST carry or be associated with an explicit
      IR compatibility identity.

  compatibility:
    authority: "grammar/contracts/compatibility.yaml"

  migration:
    rule: >
      Breaking IR changes MUST have explicit migration semantics or be rejected
      according to the compatibility contract.

  semantic_identity:
    rule: >
      A compatible IR version change MUST NOT silently change the meaning of a
      stable semantic identity.

# =============================================================================
# 27. DIAGNOSTIC CONTRACT
# =============================================================================

diagnostics:

  authority:
    path: "grammar/contracts/diagnostics.yaml"

  every_mapping:
    required:
      - "diagnostic identity"
      - "failure stage"
      - "source span"
      - "semantic identity"

  failure_stages:
    - "AST-to-IR mapping"
    - "semantic validation"
    - "IR construction"
    - "IR validation"
    - "compatibility"
    - "resource feasibility"
    - "capability feasibility"
    - "target realization"

  distinction:
    semantic_error:
      rule: >
        Invalid program meaning MUST be distinguished from target inability to
        realize a valid meaning.

    resource_error:
      rule: >
        Resource infeasibility MUST NOT be reported as a grammar error.

    capability_error:
      rule: >
        Missing capability MUST NOT be reported as malformed source syntax.

    target_error:
      rule: >
        Target realization failure MUST NOT redefine semantic validity.

# =============================================================================
# 28. AST / SEMANTIC / IR CONSISTENCY
# =============================================================================

cross_contract_consistency:

  ast:
    source: "grammar/contracts/ast-mappings.yaml"
    requirement: >
      Every IR mapping MUST reference an AST mapping for the corresponding
      meaning-bearing source construct unless explicitly marked metadata-only
      or analysis-only.

  semantic:
    source: "grammar/contracts/semantic-mappings.yaml"
    requirement: >
      Every IR mapping MUST reference exactly one canonical semantic identity.

  ownership:
    source: "grammar/contracts/ownership.yaml"
    requirement: >
      The semantic owner MUST agree with the ownership contract.

  exports:
    source: "grammar/contracts/exports.yaml"
    requirement: >
      Every grammar export participating in executable semantics MUST resolve
      to an applicable IR mapping.

  dependencies:
    source: "grammar/contracts/dependencies.yaml"
    requirement: >
      IR ownership MUST NOT introduce an upstream dependency from grammar or
      AST into target realization.

  diagnostics:
    source: "grammar/contracts/diagnostics.yaml"
    requirement: >
      Every stable IR mapping MUST have deterministic diagnostic coverage.

  compatibility:
    source: "grammar/contracts/compatibility.yaml"
    requirement: >
      Every stable canonical IR identity MUST have a compatibility identity.

  status:
    source: "grammar/contracts/feature-status.yaml"
    requirement: >
      IR status MUST agree with the feature lifecycle status.

# =============================================================================
# 29. DEPENDENCY DIRECTION
# =============================================================================

dependency_direction:

  allowed:

    source_to_ast:
      - "grammar -> AST"

    ast_to_semantic:
      - "AST -> semantic model"

    semantic_to_ir:
      - "semantic model -> canonical IR"

    ir_to_realization:
      - "canonical IR -> realization"

  forbidden:

    grammar_to_backend: true
    grammar_to_runtime: true
    ast_to_vendor_backend: true
    semantic_to_physical_device: true
    canonical_ir_to_source_grammar: true

  rule: >
    Downstream implementation details MUST NOT become upstream semantic
    dependencies.

# =============================================================================
# 30. TARGET REALIZATION BOUNDARY
# =============================================================================

realization_boundary:

  starts_after:
    - "semantic validation"
    - "canonical IR validation"
    - "required optimization validation"

  may_perform:
    - "target discovery"
    - "capability matching"
    - "resource negotiation"
    - "specialization"
    - "lowering"
    - "routing"
    - "scheduling"
    - "placement"
    - "instruction selection"
    - "calibration"
    - "device selection"
    - "runtime dispatch"

  must_not:
    - "change source semantics silently"
    - "weaken mandatory contracts"
    - "ignore mandatory policies"
    - "ignore mandatory capabilities"
    - "ignore mandatory resources"
    - "silently change declared effects"

# =============================================================================
# 31. POCO-REAF CONTRACT
# =============================================================================

poco_reaf:

  enabled: true

  identity:
    name: "Program_Once_Compile_Once_Run_Everywhere_Anywhere_Forever"

  semantic_definition:
    rule: >
      One source program MUST correspond to one stable semantic identity.
      Canonical IR preserves that semantic identity independently of a specific
      target realization.

  compile_once:
    meaning: >
      A canonical semantic IR artifact MAY be reused for multiple compatible
      target realizations without reparsing or redefining the source semantics.

  run_everywhere:
    condition: >
      A target may execute the program when its capabilities, resources,
      policies, compatibility constraints, and realization mechanisms satisfy
      the semantic artifact.

  anywhere:
    condition: >
      Different compatible execution environments MAY realize the same
      canonical semantic artifact through different lowering strategies.

  forever:
    condition: >
      Long-term reuse is governed by explicit language, semantic, IR, dialect,
      compatibility, migration, and provenance contracts.

  incompatible_target:
    rule: >
      A target that cannot satisfy mandatory semantic requirements MUST reject
      the realization or select an explicitly authorized semantically valid
      fallback.

  forbidden:
    - "silent semantic substitution"
    - "silent precision reduction"
    - "silent qubit reduction"
    - "silent data truncation"
    - "silent policy bypass"
    - "silent effect removal"
    - "silent contract weakening"

# =============================================================================
# 32. FALLBACK CONTRACT
# =============================================================================

fallback:

  allowed: true

  requirements:
    - "explicitly authorized"
    - "policy-valid"
    - "capability-valid"
    - "resource-valid"
    - "contract-valid"
    - "semantically equivalent or explicitly permitted approximation"
    - "provenance recorded"

  examples:

    quantum_to_simulation:
      allowed_only_if:
        - "simulation capability exists"
        - "program permits simulation fallback"
        - "simulation semantics satisfy requested contract"

    accelerator_to_classical:
      allowed_only_if:
        - "classical fallback is explicitly permitted"
        - "semantic equivalence is established"

  forbidden:
    implicit_fallback: true

# =============================================================================
# 33. RESOURCE NEGOTIATION
# =============================================================================

resource_negotiation:

  location: "downstream of canonical IR validation"

  input:
    - "canonical IR"
    - "resource requirements"
    - "capability requirements"
    - "constraints"
    - "preferences"
    - "policies"

  output:
    - "feasible realization"
    - "infeasible realization"
    - "authorized fallback"

  canonical_ir_rule:
    rule: >
      Negotiation MUST NOT mutate semantic identities merely because target
      resources differ.

  priority:
    - "correctness"
    - "mandatory requirements"
    - "mandatory constraints"
    - "mandatory policies"
    - "capabilities"
    - "resources"
    - "preferences"
    - "optimization hints"

# =============================================================================
# 34. IR TRANSFORMATION CONTRACT
# =============================================================================

transformations:

  every_transformation:
    required:
      - "transformation_id"
      - "input_ir_version"
      - "output_ir_version"
      - "semantic_preconditions"
      - "semantic_postconditions"
      - "preservation_claim"
      - "provenance"
      - "diagnostics"

  deterministic:
    required: true

  semantic_proof:
    required_for:
      - "meaning-changing-looking normalization"
      - "operation elimination"
      - "reordering"
      - "fusion"
      - "decomposition"
      - "specialization"
      - "precision transformation"

  target_specific:
    rule: >
      Target-specific transformations MUST occur after the canonical semantic
      IR boundary unless explicitly defined as target-independent and proven
      semantics-preserving.

# =============================================================================
# 35. QUANTUM TRANSFORMATION CONTRACT
# =============================================================================

quantum_transformations:

  allowed:
    - "operation fusion"
    - "operation decomposition"
    - "adjoint transformation"
    - "controlled transformation"
    - "measurement-preserving optimization"
    - "logical optimization"
    - "model normalization"

  downstream_only:
    - "physical qubit routing"
    - "physical qubit assignment"
    - "device calibration"
    - "pulse calibration"
    - "hardware gate decomposition"
    - "physical scheduling"

  rule: >
    A quantum optimization MUST preserve the semantics represented by
    quantum::ir.

# =============================================================================
# 36. HDL TRANSFORMATION CONTRACT
# =============================================================================

hdl_transformations:

  allowed:
    - "Boolean simplification"
    - "logic normalization"
    - "pipeline transformation"
    - "combinational optimization"
    - "sequential optimization"
    - "state machine normalization"

  downstream:
    - "technology mapping"
    - "cell selection"
    - "placement"
    - "routing"
    - "physical timing closure"

  rule: >
    Physical technology decisions MUST NOT become canonical HDL semantic
    identities.

# =============================================================================
# 37. RESOURCE AND CAPACITY AUDIT
# =============================================================================

capacity_audit:

  forbidden_patterns:

    symbolic_identifiers:
      - "MAX_*"
      - "MIN_*_CAPACITY"
      - "DEFAULT_*_COUNT"
      - "FIXED_*_COUNT"
      - "UNIVERSAL_*_LIMIT"

    physical_dimensions:
      - "fixed universal CPU count"
      - "fixed universal GPU count"
      - "fixed universal FPGA count"
      - "fixed universal QPU count"
      - "fixed universal qubit count"
      - "fixed universal memory size"
      - "fixed universal register width"
      - "fixed universal tensor rank"
      - "fixed universal network size"
      - "fixed universal device count"

  required:
    - "symbolic resource expressions"
    - "parameterized resource expressions"
    - "capability predicates"
    - "abstract topology"
    - "resource negotiation"

  severity: "error"

# =============================================================================
# 38. SOURCE SPAN CONTRACT
# =============================================================================

source_spans:

  authority: "grammar/spec/source-spans.md"

  every_mapping:
    required: true

  every_ir_entity:
    required_when:
      - "diagnostics may reference source"
      - "semantic provenance is required"
      - "transformation tracing is required"

  origin_kinds:
    - "source"
    - "generated"
    - "synthetic"
    - "desugared"

  rule: >
    Generated and transformed IR MUST retain enough provenance to identify its
    source semantic origin.

# =============================================================================
# 39. SERIALIZATION CONTRACT
# =============================================================================

serialization:

  canonical:
    required_for:
      - "portable semantic artifacts"
      - "persistent IR artifacts"
      - "reproducibility workflows"

  deterministic:
    required: true

  must_include:
    - "IR version"
    - "semantic version"
    - "language version"
    - "dialect versions where applicable"
    - "semantic identity"
    - "provenance"
    - "required capabilities"
    - "required resources"
    - "contracts where persistence is required"
    - "policies where persistence is required"

  must_not_include_as_semantic_identity:
    - "memory addresses"
    - "process identifiers"
    - "physical device identifiers"
    - "scheduler slots"
    - "runtime object addresses"

# =============================================================================
# 40. HASHING CONTRACT
# =============================================================================

hashing:

  canonicalization:
    required: true

  inputs:
    - "canonical IR"
    - "semantic version"
    - "IR version"
    - "dialect versions"
    - "semantic configuration where applicable"

  forbidden_inputs:
    - "memory addresses"
    - "allocation order"
    - "physical target identity unless explicitly part of a target artifact"
    - "runtime timestamps"

  rule: >
    Canonical semantic artifact identity MUST be stable across compatible
    target realizations.

# =============================================================================
# 41. TEST CONTRACT
# =============================================================================

tests:

  mandatory_levels:

    mapping:
      - "semantic identity exists"
      - "canonical IR identity exists"

    structural:
      - "operands validated"
      - "results validated"
      - "attributes validated"

    semantic:
      - "semantic preservation"

    effects:
      - "effect preservation"

    resources:
      - "resource preservation"

    capabilities:
      - "capability preservation"

    contracts:
      - "contract preservation"

    policies:
      - "policy preservation"

    provenance:
      - "source-to-IR provenance"

    compatibility:
      - "IR version compatibility"

    scalability:
      - "small instance"
      - "parameterized instance"
      - "large feasible instance"
      - "resource exhaustion behavior"

    portability:
      - "target variation"
      - "different execution strategies"

    negative:
      - "invalid semantic mapping"
      - "missing capability"
      - "insufficient resources"
      - "incompatible IR version"
      - "policy violation"
      - "contract violation"

  stable_mapping:
    minimum:
      - "positive test"
      - "negative test"
      - "boundary test"
      - "integration test"
      - "determinism test"
      - "scalability test"
      - "portability test"

# =============================================================================
# 42. CONFORMANCE EXAMPLES
# =============================================================================

conformance_examples:

  symbolic_quantum:
    semantic:
      requires:
        - "qubits >= n"
        - "capability(\"quantum.measurement\")"

    IR:
      preserves:
        - "symbolic qubit requirement"
        - "measurement capability"
        - "quantum semantics"

    realization:
      deferred:
        - "physical qubit count"
        - "physical qubit assignment"
        - "routing"
        - "scheduling"

  symbolic_memory:
    semantic:
      requires:
        - "memory >= required_memory"

    IR:
      preserves:
        - "required_memory expression"

    realization:
      deferred:
        - "physical memory device"
        - "address assignment"
        - "allocation strategy"

  accelerator:
    semantic:
      requires:
        - "capability(\"tensor.compute\")"

    IR:
      preserves:
        - "tensor semantics"
        - "capability requirement"

    realization:
      may_select:
        - "CPU"
        - "GPU"
        - "FPGA"
        - "ASIC"
        - "accelerator"
        - "other compatible target"

  hybrid:
    semantic:
      contains:
        - "classical computation"
        - "quantum computation"

    IR:
      uses:
        - "Classical IR"
        - "quantum::ir"

    forbidden:
      - "new competing hybrid IR"

# =============================================================================
# 43. NO-DOWNSTREAM-REEDIT CONTRACT
# =============================================================================

downstream_reedit:

  principle: >
    Once a semantic-to-IR mapping is frozen, adding a compatible backend,
    target, accelerator, simulator, QPU, FPGA, ASIC, scheduler, router, or
    runtime MUST NOT require changing the mapping's semantic identity.

  allowed_changes:
    - "new target adapter"
    - "new lowering pass"
    - "new optimization"
    - "new routing strategy"
    - "new scheduling strategy"
    - "new resource negotiation strategy"
    - "new runtime"
    - "new simulator"
    - "new hardware backend"

  prohibited_reason_for_mapping_change:
    - "new physical device"
    - "new vendor"
    - "new CPU"
    - "new GPU"
    - "new FPGA"
    - "new ASIC"
    - "new QPU"
    - "new cluster"
    - "new operating system"

  exception:
    rule: >
      A mapping may change only when the language semantic contract itself
      changes, in which case the change MUST be versioned and processed through
      the compatibility contract.

# =============================================================================
# 44. IMPLEMENTATION INTEGRATION
# =============================================================================

implementation:

  frontend:

    parser:
      source: "src/parser.rs"
      role: "legacy executable parser boundary"

    canonical_ast:
      source: "src/frontend/ast/"
      role: "canonical frontend AST"

    legacy_ast:
      source: "src/ast/mod.rs"
      role: "migration/compatibility boundary"

    rule: >
      Existing legacy AST structures MUST NOT become a second IR. They must
      migrate or adapt into the canonical semantic pipeline.

  quantum_ir:
    root: "src/quantum/ir/mod.rs"
    role: "canonical quantum IR boundary"

    canonical_modules:
      - "src/quantum/ir/core/"
      - "src/quantum/ir/quantum/"
      - "src/quantum/ir/classical/"
      - "src/quantum/ir/control/"
      - "src/quantum/ir/model/"
      - "src/quantum/ir/program/"
      - "src/quantum/ir/pulse/"
      - "src/quantum/ir/resources/"
      - "src/quantum/ir/scheduling/"
      - "src/quantum/ir/metadata/"
      - "src/quantum/ir/analysis/"
      - "src/quantum/ir/dialect/"
      - "src/quantum/ir/hashing/"
      - "src/quantum/ir/compatibility/"

    rule: >
      These modules remain the canonical implementation owners for their
      respective quantum IR concepts. This contract must not recreate them.

  classical_ir:
    source: "repository-defined canonical Classical IR"
    rule: >
      The classical semantic mapping must resolve to one canonical Classical IR
      implementation before the grammar directory is declared frozen.

  hdl_hardware_ir:
    source: "repository-defined canonical HDL/Hardware IR"
    rule: >
      HDL/hardware mappings must resolve to one canonical implementation before
      stable status is granted.

# =============================================================================
# 45. CURRENT IMPLEMENTATION RECONCILIATION
# =============================================================================

implementation_reconciliation:

  current_quantum_boundary:
    status: "confirmed"
    source: "src/quantum/ir/mod.rs"
    finding: >
      The repository already establishes quantum::ir as a canonical,
      hardware-independent quantum semantic boundary.

  quantum_identity:
    canonical:
      - "quantum::ir::qubit::QubitId"
      - "quantum::ir::qubit::PhysicalQubitId"

    rule: >
      No additional competing QubitId implementation may be introduced by the
      grammar IR contract.

  quantum_program:
    canonical:
      - "quantum::ir::program::QuantumProgram"

  quantum_models:
    canonical:
      - "quantum::ir::model"

  quantum_pulse:
    canonical:
      - "quantum::ir::pulse"

  quantum_resources:
    canonical:
      - "quantum::ir::resources"

  quantum_analysis:
    canonical:
      - "quantum::ir::analysis"

  current_ast:
    status: "migration_sensitive"
    rule: >
      Existing AST structures must be reconciled with the canonical AST and
      semantic contracts before their corresponding IR mappings receive STABLE
      status.

  current_implementation_limits:
    rule: >
      Existing implementation-level limits or representation choices MUST NOT
      be interpreted as universal language or canonical IR limits.

# =============================================================================
# 46. IR VALIDATION
# =============================================================================

validation:

  ownership:
    checks:
      - "one semantic identity -> one IR mapping"
      - "one IR concept -> one canonical owner"
      - "owner agrees with ownership contract"

  mapping:
    checks:
      - "semantic mapping exists"
      - "AST mapping exists where required"
      - "canonical IR boundary exists"
      - "IR operation/model exists or is explicitly pending"

  semantics:
    checks:
      - "types preserved"
      - "effects preserved"
      - "capabilities preserved"
      - "resources preserved"
      - "contracts preserved"
      - "policies preserved"
      - "provenance preserved"

  target_independence:
    checks:
      - "no physical device identity"
      - "no backend instruction"
      - "no target capacity constant"
      - "no vendor lock-in"
      - "no runtime handle"

  scalability:
    checks:
      - "symbolic dimensions allowed"
      - "no fixed machine-size ceiling"
      - "resource quantities remain parameterized"
      - "implementation limits are diagnosable"

  determinism:
    checks:
      - "canonical ordering"
      - "canonical attributes"
      - "canonical serialization"
      - "stable transformation identity"

  compatibility:
    checks:
      - "IR version declared"
      - "semantic version declared"
      - "migration policy available"
      - "stable identities remain compatible"

  diagnostics:
    checks:
      - "every failure is classified"
      - "source span available"
      - "semantic identity available"

# =============================================================================
# 47. FREEZE CONTRACT
# =============================================================================

freeze:

  mapping_may_be_stable_only_when:

    ownership:
      - "exactly one semantic owner"
      - "exactly one IR owner"

    source:
      - "grammar mapping resolved"
      - "AST mapping resolved"

    semantic:
      - "semantic identity resolved"
      - "semantic invariants resolved"

    IR:
      - "canonical IR boundary resolved"
      - "IR operation/model resolved"
      - "IR version resolved"

    preservation:
      - "type preservation validated"
      - "effect preservation validated"
      - "resource preservation validated"
      - "capability preservation validated"
      - "contract preservation validated"
      - "policy preservation validated"
      - "provenance preservation validated"

    portability:
      - "target independence validated"
      - "no physical target leakage"

    scalability:
      - "no artificial finite capacity"
      - "symbolic scaling supported where applicable"
      - "resource exhaustion behavior defined"

    diagnostics:
      - "diagnostic contract resolved"

    compatibility:
      - "compatibility identity resolved"

    testing:
      - "positive tests"
      - "negative tests"
      - "boundary tests"
      - "integration tests"
      - "determinism tests"
      - "scalability tests"
      - "portability tests"

    implementation:
      - "Rust 1.97+"
      - "Rust 2021"
      - "memory-safe Rust"
      - "stable toolchain"

  blocking_conditions:

    - "duplicate semantic identity"
    - "duplicate IR owner"
    - "missing semantic mapping"
    - "missing AST mapping"
    - "missing canonical IR"
    - "direct vendor IR dependency"
    - "physical target leakage"
    - "fixed universal capacity"
    - "missing source provenance"
    - "missing diagnostics"
    - "missing compatibility identity"
    - "missing conformance tests"
    - "nondeterministic canonicalization"
    - "unresolved semantic ambiguity"
    - "unresolved transformation preservation"

# =============================================================================
# 48. REPOSITORY-WIDE FREEZE GATE
# =============================================================================

repository_freeze:

  prerequisite_contracts:

    - "grammar/DESIGN.md"
    - "grammar/MANIFEST.yaml"
    - "grammar/OWNERSHIP.yaml"
    - "grammar/DEPENDENCIES.yaml"
    - "grammar/STATUS.yaml"
    - "grammar/contracts/ownership.yaml"
    - "grammar/contracts/dependencies.yaml"
    - "grammar/contracts/exports.yaml"
    - "grammar/contracts/ast-mappings.yaml"
    - "grammar/contracts/semantic-mappings.yaml"
    - "grammar/contracts/ir-mappings.yaml"
    - "grammar/contracts/diagnostics.yaml"
    - "grammar/contracts/compatibility.yaml"
    - "grammar/contracts/feature-status.yaml"

  required_closure:
    - "every grammar export has an owner"
    - "every meaning-bearing export has AST mapping"
    - "every meaning-bearing export has semantic mapping"
    - "every lowering-relevant semantic identity has IR mapping"
    - "every stable IR identity has diagnostics"
    - "every stable IR identity has compatibility identity"
    - "every stable IR identity has tests"

  root_freeze_rule:
    rule: >
      grammar/Zamani.g4 and grammar/antlr/ZamaniParser.g4 MUST NOT be declared
      permanently frozen until this semantic-to-IR closure has passed.

# =============================================================================
# 49. CI CONTRACT
# =============================================================================

ci:

  mandatory:

    contract_validation:
      - "YAML syntax validation"
      - "schema validation"
      - "ownership validation"
      - "dependency validation"
      - "semantic identity uniqueness"
      - "IR identity uniqueness"
      - "mapping closure validation"

    semantic_validation:
      - "AST coverage"
      - "semantic coverage"
      - "IR coverage"
      - "effect coverage"
      - "resource coverage"
      - "capability coverage"
      - "contract coverage"
      - "policy coverage"
      - "provenance coverage"

    IR_validation:
      - "canonical IR owner validation"
      - "quantum::ir validation"
      - "Classical IR validation"
      - "HDL/Hardware IR validation"
      - "hybrid composition validation"

    portability:
      - "target-independence audit"
      - "capacity audit"
      - "vendor leakage audit"
      - "symbolic scalability audit"

    determinism:
      - "canonicalization tests"
      - "serialization tests"
      - "hash stability tests"
      - "transformation identity tests"

    rust:
      - "cargo check"
      - "cargo test"
      - "cargo clippy"
      - "minimum Rust version validation"
      - "memory-safety policy validation"

  release_rule:
    rule: >
      No mapping may be promoted to STABLE when a mandatory validation gate is
      failed or unverified.

# =============================================================================
# 50. STATUS RULES
# =============================================================================

status_rules:

  specified:
    meaning: >
      The semantic-to-IR contract has been formally defined but implementation
      conformance is not yet fully established.

  implemented:
    meaning: >
      A corresponding implementation exists and is known to represent the
      declared mapping, but repository-wide freeze evidence may still be
      incomplete.

  partial:
    meaning: >
      Some implementation exists but the contract is not completely satisfied.

  migration_required:
    meaning: >
      Existing implementation must be reconciled with the canonical mapping.

  stable:
    meaning: >
      All freeze gates in this file and all companion contracts have passed.

  experimental:
    meaning: >
      The mapping may change without stable compatibility guarantees.

  planned:
    meaning: >
      The contract is defined for future implementation.

  deprecated:
    meaning: >
      The mapping remains for compatibility but must not be used for new
      semantic construction.

  rejected:
    meaning: >
      The mapping is explicitly prohibited.

# =============================================================================
# 51. REQUIRED IR FAMILIES
# =============================================================================

required_ir_families:

  universal:
    - "program"
    - "module"
    - "symbol"
    - "type"
    - "value"
    - "operation"
    - "control_flow"
    - "region"
    - "block"
    - "effect"
    - "resource"
    - "capability"
    - "contract"
    - "policy"
    - "provenance"

  classical:
    - "numeric"
    - "memory"
    - "function"
    - "control"
    - "collection"
    - "tensor"
    - "data"

  quantum:
    - "qubit"
    - "operation"
    - "measurement"
    - "control"
    - "channel"
    - "model"
    - "pulse"
    - "resource"
    - "program"
    - "metadata"
    - "dialect"

  hardware:
    - "module"
    - "port"
    - "signal"
    - "net"
    - "register"
    - "memory"
    - "clock"
    - "reset"
    - "timing"
    - "state_machine"
    - "interface"

  distributed:
    - "node"
    - "task"
    - "message"
    - "channel"
    - "topology"
    - "placement"
    - "replication"
    - "consistency"

  execution:
    - "execution_context"
    - "dispatch"
    - "simulation"
    - "adaptation"
    - "recovery"
    - "resilience"

# =============================================================================
# 52. IR OWNERSHIP RULE
# =============================================================================

ownership:

  one_concept_one_owner:
    severity: "error"
    rule: >
      Every canonical IR semantic concept MUST have exactly one implementation
      owner.

  aliases:
    allowed: true
    rule: >
      Compatibility aliases MAY exist, but they MUST resolve to the canonical
      implementation and MUST NOT define duplicate semantics.

  glob_exports:
    discouraged: true
    rule: >
      Broad wildcard exports MUST NOT be used to create ambiguous IR ownership.

  compatibility_modules:
    rule: >
      Compatibility paths may preserve historical APIs while forwarding to
      canonical implementations.

# =============================================================================
# 53. FORWARD COMPATIBILITY
# =============================================================================

forward_compatibility:

  new_target:
    requirement: >
      Adding a new target MUST require only downstream realization integration
      when the target can implement an existing semantic IR contract.

  new_quantum_operation:
    requirement: >
      A new quantum operation SHOULD be registered through the extensible
      quantum operation/dialect system without changing this IR contract's
      universal operation identity.

  new_resource:
    requirement: >
      A new resource kind SHOULD be added through the resource registry without
      changing existing IR identities.

  new_capability:
    requirement: >
      A new capability SHOULD be added through the capability registry without
      changing existing operation semantics.

  new_domain:
    requirement: >
      A new computational domain MUST identify its canonical semantic and IR
      boundary without redefining existing domain semantics.

# =============================================================================
# 54. BACKWARD COMPATIBILITY
# =============================================================================

backward_compatibility:

  stable_mapping:
    rule: >
      Existing stable semantic identities MUST remain recognizable by future
      compatible compilers.

  removed_mapping:
    rule: >
      Removing a stable mapping requires compatibility handling and migration
      according to the repository compatibility contract.

  renamed_mapping:
    rule: >
      A renamed semantic or IR identity MUST retain an explicit compatibility
      alias or migration record.

  semantic_change:
    rule: >
      A semantic change MUST NOT be disguised as an implementation refactor.

# =============================================================================
# 55. SECURITY BOUNDARY
# =============================================================================

security:

  canonical_ir:
    must_preserve:
      - "authorization"
      - "permissions"
      - "trust requirements"
      - "sandbox requirements"
      - "security policies"
      - "audit requirements"

  rule: >
    IR transformations MUST NOT bypass security obligations merely because the
    transformed representation no longer resembles the original syntax.

  generated_code:
    rule: >
      Generated or reflected code MUST enter the same semantic and IR validation
      pipeline as ordinary code.

# =============================================================================
# 56. SAFE RUST IMPLEMENTATION CONTRACT
# =============================================================================

rust:

  minimum_version: "1.97"
  edition: "2021"
  toolchain: "stable"

  required:
    - "memory-safe implementation"
    - "deterministic data structures where semantic ordering matters"
    - "explicit error handling"
    - "typed IR identities"
    - "versioned public interfaces"

  prohibited:
    - "memory-unsafe implementation techniques"
    - "hidden machine-capacity assumptions"
    - "target-dependent semantic identity"
    - "implicit backend dependencies"

  enforcement:
    compiler:
      - "repository-wide memory-safety lint/policy"
    ci:
      - "cargo check"
      - "cargo test"
      - "cargo clippy"

# =============================================================================
# 57. COMPLETION CRITERIA
# =============================================================================

completion:

  file_is_complete_when:

    authority:
      - "canonical authority is declared"
      - "no competing IR mapping authority exists"

    ownership:
      - "every mapping has one semantic owner"
      - "every canonical IR family has one owner"

    coverage:
      - "registry closure passes"
      - "no orphan semantic identity"
      - "no orphan lowering-relevant export"

    semantics:
      - "semantic identity is stable"
      - "type semantics are preserved"
      - "effect semantics are preserved"
      - "resource semantics are preserved"
      - "capability semantics are preserved"
      - "contract semantics are preserved"
      - "policy semantics are preserved"
      - "provenance semantics are preserved"

    domains:
      - "Classical IR covered"
      - "quantum::ir covered"
      - "HDL/Hardware IR covered"
      - "hybrid composition covered"
      - "AI/data covered"
      - "distributed/networking covered"
      - "execution covered"
      - "interoperability covered"

    quantum:
      - "quantum::ir is the sole canonical quantum boundary"
      - "logical/physical identity is separated"
      - "operations are open-world"
      - "no fixed gate enumeration is required"
      - "routing is downstream"
      - "scheduling is downstream"
      - "calibration is downstream"

    scalability:
      - "symbolic resources supported"
      - "symbolic dimensions supported where applicable"
      - "no artificial finite machine-size ceiling"
      - "resource exhaustion is explicit"

    portability:
      - "target-independent canonical IR"
      - "capability negotiation supported downstream"
      - "resource negotiation supported downstream"
      - "explicit fallback semantics"
      - "semantic preservation validated"

    compatibility:
      - "language version"
      - "semantic version"
      - "IR version"
      - "dialect version"
      - "migration policy"

    diagnostics:
      - "source spans"
      - "stable diagnostic identities"
      - "semantic vs target failures distinguished"

    testing:
      - "positive tests"
      - "negative tests"
      - "determinism tests"
      - "scalability tests"
      - "portability tests"
      - "cross-domain tests"
      - "integration tests"

    implementation:
      - "Rust 1.97+"
      - "Rust 2021"
      - "stable Rust"
      - "memory-safe implementation"

# =============================================================================
# 58. FINAL ARCHITECTURAL INVARIANTS
# =============================================================================

invariants:

  one_source_meaning:
    rule: >
      One Zamani source program has one canonical semantic meaning.

  one_semantic_identity:
    rule: >
      Every meaning-bearing construct has one stable semantic identity.

  one_canonical_ir:
    rule: >
      Every semantic domain has one canonical IR boundary or an explicitly
      defined canonical composition.

  classical:
    rule: >
      Classical computation uses Classical IR.

  quantum:
    rule: >
      Quantum computation uses quantum::ir.

  hdl:
    rule: >
      HDL and hardware intent use the canonical HDL/Hardware IR.

  hybrid:
    rule: >
      Hybrid computation composes canonical domain IRs.

  no_vendor_frontend:
    rule: >
      Vendor representations are downstream realization artifacts.

  no_physical_frontend:
    rule: >
      Physical resources and target assignments are downstream realization
      information.

  no_artificial_capacity:
    rule: >
      Neither the semantic model nor canonical IR imposes artificial finite
      machine-size limits.

  symbolic_scalability:
    rule: >
      Resource quantities, dimensions, counts, widths, ranks, topology sizes,
      and similar scalable properties remain symbolic or parameterized whenever
      their semantics require scalability.

  semantic_preservation:
    rule: >
      Every valid lowering preserves the declared program semantics.

  explicit_failure:
    rule: >
      Inability to realize a valid semantic artifact is reported explicitly
      rather than silently changing the program.

  explicit_fallback:
    rule: >
      Alternative realization is permitted only when explicitly authorized and
      semantically valid.

  deterministic:
    rule: >
      Canonical IR construction and serialization are deterministic.

  provenance:
    rule: >
      Meaning-bearing transformations remain traceable to their source semantic
      identity.

  compatibility:
    rule: >
      Stable IR identities are versioned and migratable.

  memory_safe:
    rule: >
      The reference implementation remains memory-safe Rust on Rust 1.97 or
      later.

  future_targets:
    rule: >
      Future targets can be integrated through realization layers without
      redefining stable semantic-to-IR contracts.

