# =============================================================================
#
# Zamani Programming Language
#
# grammar/contracts/ir-mappings.yaml
#
# =============================================================================
#
# PURPOSE
#
# Canonical machine-checkable contract connecting the validated Zamani
# semantic model to canonical intermediate-representation boundaries.
#
# This file owns:
#
#   - semantic -> IR ownership;
#   - canonical IR boundary selection;
#   - semantic-to-IR mapping identities;
#   - IR applicability;
#   - lowering prerequisites;
#   - preservation invariants;
#   - target independence;
#   - scalability requirements;
#   - resource/capability/effect/contract/policy/provenance preservation;
#   - quantum -> quantum::ir integration;
#   - classical -> Classical IR integration;
#   - HDL/hardware -> HDL/Hardware IR integration;
#   - hybrid multi-domain IR composition;
#   - IR compatibility;
#   - IR diagnostics;
#   - IR conformance and freeze gates.
#
# This file DOES NOT own:
#
#   - source grammar;
#   - lexer tokens;
#   - parser rules;
#   - AST structure;
#   - semantic definitions;
#   - target discovery;
#   - physical device selection;
#   - physical placement;
#   - routing algorithms;
#   - scheduling algorithms;
#   - calibration;
#   - backend instruction selection;
#   - runtime resource availability;
#   - vendor SDK semantics;
#   - target-specific machine limits.
#
# Those responsibilities belong to downstream contracts.
#
# Canonical pipeline:
#
#   Zamani source
#       |
#       v
#   Lexer
#       |
#       v
#   Parser
#       |
#       v
#   Domain-neutral AST
#       |
#       v
#   Structural validation
#       |
#       v
#   Semantic model
#       |
#       +----------------------+-----------------------+
#       |                      |                       |
#       v                      v                       v
#   Classical semantics   Quantum semantics    HDL/Hardware semantics
#       |                      |                       |
#       v                      v                       v
#   Classical IR         quantum::ir          HDL/Hardware IR
#       |                      |                       |
#       +----------------------+-----------------------+
#                              |
#                              v
#                       verified transformations
#                              |
#                              v
#                 optimization / lowering / routing /
#                 scheduling / resilience / QEC / ZQN
#                              |
#                              v
#                         target realization
#
# =============================================================================

schema:
  version: "2.0"
  kind: "zamani-grammar-ir-mapping-contract"
  format: "YAML"
  status: "NORMATIVE"
  repository: "Benwellonedge28/Zamani"
  language: "Zamani"
  root: "grammar/"
  canonical_file: "grammar/contracts/ir-mappings.yaml"

  implementation:
    rust:
      edition: "2021"
      minimum_version: "1.97"
      supported: "1.97-or-later"
      memory_safety: "required"
      implementation_policy: "memory-safe Rust only"
      compiler_features: "stable-only"

  authority:
    architecture:
      path: "grammar/DESIGN.md"
      role: "architectural_authority"

    semantic_specification:
      path: "grammar/spec/semantics.md"
      role: "semantic_authority"

    ast_mapping:
      path: "grammar/contracts/ast-mappings.yaml"
      role: "AST_mapping_authority"

    semantic_mapping:
      path: "grammar/contracts/semantic-mappings.yaml"
      role: "semantic_mapping_authority"

    ownership:
      path: "grammar/contracts/ownership.yaml"
      role: "concept_ownership_authority"

    dependencies:
      path: "grammar/contracts/dependencies.yaml"
      role: "dependency_graph_authority"

    exports:
      path: "grammar/contracts/exports.yaml"
      role: "export_registry_authority"

    diagnostics:
      path: "grammar/contracts/diagnostics.yaml"
      role: "diagnostic_authority"

    compatibility:
      path: "grammar/contracts/compatibility.yaml"
      role: "compatibility_authority"

    status:
      path: "grammar/contracts/feature-status.yaml"
      role: "feature_lifecycle_authority"

    manifest:
      path: "grammar/MANIFEST.yaml"
      role: "repository_inventory_authority"

    repository_status:
      path: "grammar/STATUS.yaml"
      role: "repository_status_authority"

    historical_reference:
      path: "grammar/Zamani-Grammar.md"
      normative: false

    implementation_reference:
      path: "grammar/grammar.md"
      normative: false
      role: "implementation_conformance_reference"

# =============================================================================
# 1. FUNDAMENTAL IR PRINCIPLES
# =============================================================================

principles:

  one_canonical_semantic_boundary:
    rule: >
      All meaning-bearing source constructs MUST pass through the canonical
      semantic model before canonical IR lowering.

  no_ast_to_vendor_ir:
    severity: "error"
    rule: >
      AST nodes MUST NOT lower directly to vendor-specific machine or device
      representations.

  no_semantic_to_vendor_ir:
    severity: "error"
    rule: >
      The canonical semantic model MUST NOT lower directly to a vendor-specific
      representation when a canonical domain IR exists.

  canonical_domain_ir:
    severity: "error"
    rule: >
      Each supported computational domain MUST identify one canonical IR
      boundary or an explicitly declared target-independent IR composition.

  quantum_canonical_boundary:
    severity: "error"
    rule: >
      Quantum semantics MUST converge through quantum::ir.

  classical_canonical_boundary:
    severity: "error"
    rule: >
      Classical computation MUST converge through the canonical Classical IR.

  hardware_canonical_boundary:
    severity: "error"
    rule: >
      HDL and hardware semantics MUST converge through the repository's
      canonical HDL/Hardware IR boundary.

  no_competing_frontend_ir:
    severity: "error"
    rule: >
      A grammar or semantic subsystem MUST NOT create a competing frontend IR
      merely to support a new feature.

  target_independent:
    severity: "error"
    rule: >
      Canonical IR semantics MUST remain independent of a particular physical
      CPU, GPU, FPGA, ASIC, accelerator, QPU, simulator, operating system,
      vendor, cluster, or deployment environment.

  open_world:
    severity: "error"
    rule: >
      New target families, devices, operations, resource kinds, capabilities,
      execution strategies, and realization technologies MUST be addable
      downstream without changing an established semantic-to-IR identity merely
      because the new realization did not previously exist.

# =============================================================================
# 2. IR LAYERS
# =============================================================================

layers:

  semantic_model:
    role: "validated portable meaning"

    owns:
      - "names"
      - "types"
      - "values"
      - "operations"
      - "control flow"
      - "effects"
      - "capabilities"
      - "resources"
      - "requirements"
      - "constraints"
      - "preferences"
      - "contracts"
      - "policies"
      - "provenance"
      - "uncertainty"
      - "domain semantics"

    does_not_own:
      - "physical device placement"
      - "backend instruction selection"
      - "target scheduling"
      - "calibration"
      - "physical routing"

  canonical_ir:
    role: "stable compiler representation"

    properties:
      - "target-independent"
      - "semantically typed"
      - "deterministic"
      - "versioned"
      - "serializable where required"
      - "source-provenance-aware"
      - "resource-aware"
      - "effect-aware"
      - "capability-aware"
      - "contract-aware"
      - "policy-aware"

  realization_ir:
    role: "downstream target-specific representation"

    owns:
      - "target lowering"
      - "instruction selection"
      - "physical placement"
      - "device mapping"
      - "routing"
      - "scheduling"
      - "calibration"
      - "target-specific optimization"

    rule: >
      Realization representations MUST NOT be treated as the canonical source
      semantic representation.

# =============================================================================
# 3. CANONICAL IR BOUNDARIES
# =============================================================================

canonical_boundaries:

  classical:
    id: "ir.classical"
    name: "Classical IR"
    semantic_owner: "semantic/classical"
    implementation_reference:
      preferred: "src/ir/"
      fallback: "repository-defined canonical classical IR boundary"
    status: "required"

    rule: >
      Classical semantic operations MUST converge through the canonical
      Classical IR before target-specific lowering.

  quantum:
    id: "ir.quantum"
    name: "quantum::ir"
    semantic_owner: "semantic/quantum"
    implementation_reference: "src/quantum/ir/"
    root_module: "src/quantum/ir/mod.rs"
    status: "implemented"

    rule: >
      Quantum semantic constructs MUST converge through src/quantum/ir/.
      No second quantum frontend IR is permitted.

    current_module_families:
      - "analysis"
      - "classical"
      - "compatibility"
      - "control"
      - "core"
      - "dialect"
      - "hashing"
      - "metadata"
      - "model"
      - "program"
      - "pulse"
      - "quantum"
      - "resources"
      - "scheduling"

  hdl_hardware:
    id: "ir.hdl-hardware"
    name: "HDL/Hardware IR"
    semantic_owner: "semantic/hdl-hardware"
    implementation_reference:
      - "src/"
      - "repository-defined hardware/HDL IR implementation"
    status: "required"

    rule: >
      HDL and hardware semantic intent MUST converge through one canonical
      HDL/Hardware IR boundary before synthesis or physical realization.

  hybrid:
    id: "ir.hybrid-composition"
    name: "canonical domain IR composition"
    semantic_owner: "semantic/hybrid"
    status: "required"

    rule: >
      Hybrid programs MUST compose canonical domain IRs rather than creating a
      competing universal hybrid IR.

# =============================================================================
# 4. IR MAPPING RECORD SCHEMA
# =============================================================================

mapping_schema:

  required_fields:
    - "id"
    - "semantic_identity"
    - "semantic_owner"
    - "source_mapping"
    - "canonical_ir"
    - "lowering_kind"
    - "operands"
    - "results"
    - "attributes"
    - "effects"
    - "capabilities"
    - "resources"
    - "contracts"
    - "policies"
    - "provenance"
    - "preservation"
    - "diagnostics"
    - "compatibility"
    - "tests"
    - "scalability"
    - "target_independence"
    - "status"
    - "freeze"

  identity:
    id:
      type: "stable_string"
      globally_unique: true
      immutable_after_stability: true

    semantic_identity:
      type: "stable_semantic_id"
      rule: >
        Semantic identity MUST NOT be derived solely from a Rust type name,
        source filename, memory address, generated symbol, or backend symbol.

  source_mapping:
    required:
      - "grammar_owner"
      - "grammar_symbols"
      - "ast_mapping"

  canonical_ir:
    required:
      - "boundary"
      - "operation_or_model"
      - "version"

  lowering_kind:
    allowed:
      - "direct"
      - "structured"
      - "desugared"
      - "composition"
      - "metadata_only"
      - "analysis_only"
      - "deferred"

  source_span:
    required: true

  status:
    allowed:
      - "specified"
      - "implemented"
      - "partial"
      - "migration_required"
      - "planned"
      - "experimental"
      - "deprecated"
      - "rejected"
      - "stable"

# =============================================================================
# 5. OPERAND AND RESULT CONTRACT
# =============================================================================

value_contract:

  operand_identity:
    rule: >
      Every IR operand MUST refer to a canonical semantic value, resource,
      block, region, symbol, or domain-defined entity.

  result_identity:
    rule: >
      Every IR result MUST have a stable semantic identity and declared type
      where applicable.

  ordering:
    rule: >
      Operand and result ordering MUST be deterministic and semantically
      significant where the operation defines positional semantics.

  ownership:
    rule: >
      IR values MUST have exactly one canonical identity owner.

  no_physical_identity:
    rule: >
      Canonical semantic IR values MUST NOT acquire physical target identity
      merely because lowering is possible.

  source_spans:
    rule: >
      Meaning-bearing IR entities MUST retain source provenance sufficient for
      diagnostics and required source-to-IR tracing.

# =============================================================================
# 6. ATTRIBUTE CONTRACT
# =============================================================================

attributes:

  categories:

    semantic:
      rule: >
        Semantic attributes affect program meaning and MUST participate in
        validation and preservation.

    optimization:
      rule: >
        Optimization attributes MAY affect implementation strategy but MUST NOT
        alter semantics.

    provenance:
      rule: >
        Provenance attributes describe origin and transformation history.

    target_independent:
      rule: >
        Canonical IR attributes MUST be target-independent unless explicitly
        marked as deferred realization metadata.

    realization:
      rule: >
        Physical realization attributes belong only to downstream realization
        layers.

  forbidden_canonical_attributes:
    - "physical_device_id"
    - "physical_cpu_id"
    - "physical_gpu_id"
    - "physical_fpga_id"
    - "physical_asic_id"
    - "physical_qpu_id"
    - "physical_qubit_assignment"
    - "runtime_handle"
    - "live_resource_count"
    - "scheduler_slot"
    - "backend_instruction"
    - "vendor_register"
    - "device_calibration_handle"

  hint_rule:
    rule: >
      Optimization hints MUST be semantically ignorable. Removing a hint MUST
      not invalidate or change the program's semantic result.

# =============================================================================
# 7. EFFECT PRESERVATION
# =============================================================================

effect_contract:

  required: true

  rule: >
    Every IR lowering MUST preserve the semantic effect set required by the
    source construct.

  effect_identity:
    stable: true

  effect_transformations:

    pure_to_pure:
      allowed: true

    pure_to_effectful:
      allowed: false
      exception:
        - "explicitly declared implementation effect that is observationally
           invisible under the language contract"

    effect_removal:
      allowed_only_if:
        - "effect is proven unobservable"
        - "semantic contract permits removal"

    effect_reordering:
      allowed_only_if:
        - "dependency analysis proves equivalence"
        - "observable ordering is preserved"

  required_cross_domain_effects:
    - "io"
    - "network"
    - "mutation"
    - "randomness"
    - "native"
    - "foreign"
    - "distributed"
    - "measurement"
    - "quantum"
    - "learning"
    - "adaptation"
    - "reflection"
    - "code_generation"
    - "simulation"

  rule_for_new_effects: >
    New effect identities MUST be registered through the effect contract and
    MUST NOT be encoded as anonymous IR flags.

# =============================================================================
# 8. CAPABILITY PRESERVATION
# =============================================================================

capability_contract:

  required: true

  rule: >
    Capability requirements expressed by semantic analysis MUST remain
    available to downstream compilation and realization.

  representation:
    identity: "extensible capability identifier"
    parameters: "typed semantic values"
    target_specificity: "forbidden in canonical IR"

  examples:
    - "quantum.measurement"
    - "gpu.compute"
    - "tensor.compute"
    - "distributed.execution"
    - "persistent.storage"

  rules:

    no_closed_world_enum:
      severity: "error"
      rule: >
        The canonical IR MUST NOT require a permanently exhaustive list of all
        future capabilities.

    no_vendor_lock:
      severity: "error"
      rule: >
        A vendor-specific capability MUST remain explicitly namespaced and
        MUST NOT redefine the universal semantic meaning of the operation.

    preservation:
      rule: >
        A lowering pass MUST preserve capability requirements unless it proves
        that the transformation eliminates the requirement.

# =============================================================================
# 9. RESOURCE PRESERVATION
# =============================================================================

resource_contract:

  required: true

  model: "symbolic-resource-semantics"

  allowed:
    - "symbolic quantities"
    - "parameterized quantities"
    - "runtime quantities"
    - "derived quantities"
    - "resource predicates"
    - "resource budgets"
    - "resource preferences"
    - "resource constraints"

  examples:
    - expression: "qubits >= required_qubits"
      meaning: "minimum logical quantum resource requirement"

    - expression: "memory >= required_memory"
      meaning: "minimum memory requirement"

    - expression: "capability(\"quantum.measurement\")"
      meaning: "measurement capability requirement"

    - expression: "capability(\"gpu.compute\")"
      meaning: "accelerated compute capability requirement"

    - expression: "capability(\"tensor.compute\")"
      meaning: "tensor compute capability requirement"

    - expression: "topology(required_topology)"
      meaning: "abstract topology requirement"

  forbidden:
    - "universal finite capacity constants"
    - "physical device counts"
    - "machine-specific maximums"
    - "vendor-specific architectural limits"
    - "hidden target capacities"

  scaling:
    rule: >
      Resource expressions MUST remain representable for every supported
      semantic scale without imposing an artificial language-level maximum.

  implementation_limit:
    rule: >
      If an implementation cannot represent a resource expression because of
      its own finite implementation capacity, it MUST report an explicit
      diagnostic. The implementation limit MUST NOT become a language semantic
      limit.

  preservation:
    rule: >
      Lowering MUST preserve mandatory resource requirements unless it proves
      that the transformed representation requires no such resource.

# =============================================================================
# 10. CONTRACT PRESERVATION
# =============================================================================

contract_contract:

  required: true

  kinds:
    - "requires"
    - "ensures"
    - "invariant"
    - "assume"
    - "guarantee"
    - "property"
    - "assertion"

  rule: >
    Canonical IR lowering MUST preserve every contract obligation whose
    validity or observability extends beyond source analysis.

  compile_time_contracts:
    may_be_discharged: true
    requirement:
      - "proof or validation evidence recorded where required"
      - "failure remains diagnosable"

  runtime_contracts:
    may_be_lowered: true
    requirement:
      - "runtime enforcement remains semantically equivalent"

  erased_contracts:
    allowed_only_if:
      - "statically proven"
      - "proof evidence retained where required by policy"

  failed_contract:
    rule: >
      A failed mandatory contract MUST NOT be converted into successful IR.

# =============================================================================
# 11. POLICY PRESERVATION
# =============================================================================

policy_contract:

  required: true

  rule: >
    Policies governing allowed, required, prohibited, preferred, fallback, or
    adaptive behavior MUST remain available to the compilation and execution
    layers that depend on them.

  policy_kinds:
    - "authorization"
    - "security"
    - "resource"
    - "execution"
    - "adaptation"
    - "simulation"
    - "deployment"
    - "fallback"
    - "target-selection"

  priority:
    semantic_correctness: 1
    mandatory_requirements: 2
    mandatory_constraints: 3
    mandatory_policies: 4
    capabilities: 5
    resources: 6
    preferences: 7
    optimization_hints: 8

  rule: >
    Preferences and optimization hints MUST NOT override semantic correctness,
    mandatory requirements, constraints, or prohibitions.

# =============================================================================
# 12. PROVENANCE PRESERVATION
# =============================================================================

provenance_contract:

  required: true

  source:
    required: true

  supported_relations:
    - "derived_from"
    - "generated_by"
    - "transformed_by"
    - "verified_by"
    - "supported_by"
    - "decided_by"
    - "specialized_from"
    - "lowered_from"

  deterministic:
    required: true

  source_span:
    required: true

  transformation_identity:
    required: true

  rule: >
    Every semantics-changing IR transformation MUST be attributable to a
    deterministic transformation identity.

  storage:
    rule: >
      The semantic requirement for provenance does not require unlimited
      in-memory history. Implementations MAY compact or externalize provenance
      according to the provenance contract.

# =============================================================================
# 13. CORE SEMANTIC MAPPINGS
# =============================================================================

mappings:

  # ---------------------------------------------------------------------------
  # CORE
  # ---------------------------------------------------------------------------

  - id: "IR-CORE-PROGRAM-001"
    semantic_identity: "semantic.program"
    semantic_owner: "semantic/program"
    source_mapping:
      grammar_owner: "grammar/core/program.g4"
      grammar_symbols:
        - "program"
        - "sourceUnit"
      ast_mapping:
        contract: "grammar/contracts/ast-mappings.yaml"

    canonical_ir:
      boundary: "ir.program"
      operation_or_model: "program"
      version: "contract-defined"

    lowering_kind: "structured"

    operands:
      - "program inputs"
      - "environmental semantic context"

    results:
      - "program result"
      - "program effects"

    attributes:
      required:
        - "language_version"
        - "semantic_version"
        - "provenance"

    effects: "inherited_from_semantic_model"
    capabilities: "inherited_from_semantic_model"
    resources: "inherited_from_semantic_model"
    contracts: "inherited_from_semantic_model"
    policies: "inherited_from_semantic_model"
    provenance: "required"

    preservation:
      - "program meaning"
      - "evaluation semantics"
      - "effects"
      - "requirements"
      - "contracts"
      - "policies"
      - "provenance"

    diagnostics:
      contract: "grammar/contracts/diagnostics.yaml"

    compatibility:
      contract: "grammar/contracts/compatibility.yaml"
      identity: "semantic.program"

    tests:
      required:
        - "grammar/conformance/semantic/program/"
        - "grammar/conformance/ast/program/"
        - "grammar/conformance/ir/program/"

    scalability:
      open_world: true
      symbolic_scale: true
      finite_capacity_in_grammar: false

    target_independence: true
    status: "specified"

    freeze:
      required: true
      gates:
        - "AST mapping stable"
        - "semantic mapping stable"
        - "canonical IR owner resolved"
        - "diagnostics resolved"
        - "compatibility resolved"
        - "determinism validated"
        - "scalability audit passed"

  - id: "IR-CORE-DECLARATION-001"
    semantic_identity: "semantic.declaration"
    semantic_owner: "semantic/declarations"
    source_mapping:
      grammar_owner: "grammar/declarations/"
      grammar_symbols:
        - "declaration"
        - "item"
      ast_mapping:
        contract: "grammar/contracts/ast-mappings.yaml"

    canonical_ir:
      boundary: "ir.program"
      operation_or_model: "declaration"
      version: "contract-defined"

    lowering_kind: "structured"

    operands:
      - "declared symbols"
      - "types"
      - "initializers"
      - "constraints"

    results:
      - "symbol definitions"
      - "semantic bindings"

    attributes:
      required:
        - "name"
        - "visibility"
        - "declaration_kind"
        - "source_span"

    effects: []
    capabilities: []
    resources: []
    contracts: []
    policies: []
    provenance: "required"

    preservation:
      - "name identity"
      - "scope"
      - "visibility"
      - "type information"
      - "generic constraints"
      - "source provenance"

    diagnostics:
      contract: "grammar/contracts/diagnostics.yaml"

    compatibility:
      identity: "semantic.declaration"

    tests:
      required:
        - "grammar/conformance/ir/declarations/"

    scalability:
      open_world: true
      no_fixed_declaration_count: true

    target_independence: true
    status: "specified"
    freeze:
      required: true

  # ---------------------------------------------------------------------------
  # TYPES
  # ---------------------------------------------------------------------------

  - id: "IR-TYPE-001"
    semantic_identity: "semantic.type"
    semantic_owner: "semantic/types"
    source_mapping:
      grammar_owner: "grammar/types/"
      grammar_symbols:
        - "type"
        - "typeExpression"
      ast_mapping:
        contract: "grammar/contracts/ast-mappings.yaml"

    canonical_ir:
      boundary: "ir.type"
      operation_or_model: "type"
      version: "contract-defined"

    lowering_kind: "structured"

    operands:
      - "type parameters"
      - "bounds"
      - "constraints"

    results:
      - "canonical type identity"

    attributes:
      required:
        - "type_identity"
        - "source_span"

    effects: []
    capabilities: []
    resources: "type-dependent"
    contracts: "type-dependent"
    policies: []
    provenance: "required"

    preservation:
      - "type identity"
      - "generic parameters"
      - "bounds"
      - "constraints"
      - "ownership properties"
      - "resource properties"

    diagnostics:
      contract: "grammar/contracts/diagnostics.yaml"

    compatibility:
      identity: "semantic.type"

    tests:
      required:
        - "grammar/conformance/ir/types/"
        - "grammar/conformance/types/"

    scalability:
      symbolic_dimensions: true
      symbolic_widths: true
      symbolic_ranks: true
      finite_machine_limits: false

    target_independence: true
    status: "specified"
    freeze:
      required: true

  - id: "IR-TYPE-LINEAR-001"
    semantic_identity: "semantic.type.linear"
    semantic_owner: "semantic/types/linear"
    source_mapping:
      grammar_owner: "grammar/types/linear.g4"
      grammar_symbols:
        - "linearType"
      ast_mapping:
        contract: "grammar/contracts/ast-mappings.yaml"

    canonical_ir:
      boundary: "ir.type"
      operation_or_model: "linear_resource_type"
      version: "contract-defined"

    lowering_kind: "structured"

    operands:
      - "resource value"

    results:
      - "linear value"

    attributes:
      required:
        - "linearity"

    effects:
      - "resource"

    capabilities: []
    resources:
      - "resource ownership"

    contracts:
      - "single-consumption"

    policies: []
    provenance: "required"

    preservation:
      - "linearity"
      - "ownership"
      - "consumption rules"

