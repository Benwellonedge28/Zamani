# =============================================================================
# Zamani Programming Language
# =============================================================================
#
# FILE
#   grammar/contracts/exports.yaml
#
# PURPOSE
#   Canonical machine-checkable export contract for grammar/.
#
# ROLE
#   This file defines:
#
#     1. what a grammar unit is allowed to export;
#     2. which symbols are public;
#     3. which grammar unit owns each public export;
#     4. who may consume each export;
#     5. the AST integration boundary;
#     6. the semantic integration boundary;
#     7. the canonical IR integration boundary;
#     8. diagnostic ownership;
#     9. compatibility requirements;
#    10. portability and POCO-REAF requirements;
#    11. scalability requirements;
#    12. hard-coding prohibitions;
#    13. freeze requirements.
#
# AUTHORITY
#   grammar/specification/
#   grammar/spec/
#   grammar/contracts/ownership.yaml
#   grammar/contracts/dependencies.yaml
#
# RELATIONSHIP TO OTHER MACHINE CONTRACTS
#
#   ownership.yaml
#       |
#       +---- establishes canonical symbol ownership
#       |
#       v
#   dependencies.yaml
#       |
#       +---- establishes legal dependency direction
#       |
#       v
#   exports.yaml
#       |
#       +---- establishes exported interfaces and consumers
#       |
#       +---- establishes AST/semantic/IR integration requirements
#       |
#       v
#   ast-mappings.yaml
#   semantic-mappings.yaml
#   ir-mappings.yaml
#
# IMPORTANT
#
#   This file does not define grammar productions.
#
#   This file does not define:
#
#     - token spellings;
#     - AST Rust structures;
#     - semantic algorithms;
#     - compiler algorithms;
#     - optimizer algorithms;
#     - routing algorithms;
#     - scheduler algorithms;
#     - hardware discovery;
#     - target selection;
#     - runtime implementation;
#     - vendor-specific machine instructions.
#
#   It defines the interfaces between those independently owned layers.
#
# LANGUAGE
#   Zamani
#
# RUST
#   edition: 2021
#   minimum: 1.97
#   unsafe: forbidden
#
# SCALABILITY
#   Open-world and resource-bounded.
#
# POCO-REAF
#   Program_Once_Compile_Once_Run_Everywhere_Anywhere_Forever
#
# INTERPRETATION OF "INFINITY"
#
#   "Infinity" means that the language architecture introduces no artificial
#   finite universal ceiling on machine scale, resource count, resource size,
#   topology size, tensor dimensions, qubit count, device count, or similar
#   physical capacity.
#
#   Every actual compilation and execution remains finite and is constrained
#   by available resources, target capabilities, implementation limits,
#   physical reality, explicit program constraints, and declared policies.
#
# =============================================================================

schema:
  version: "1.0"
  kind: "zamani-grammar-export-contract"
  format: "YAML"
  status: "NORMATIVE"
  canonical_file: "grammar/contracts/exports.yaml"

repository:
  name: "Benwellonedge28/Zamani"
  root: "grammar/"
  language: "Zamani"

language_runtime_contract:
  rust:
    edition: "2021"
    minimum_version: "1.97"
    safe_only: true
    unsafe_allowed: false

  implementation_rule: >
    Grammar exports MUST NOT require unsafe Rust. Generated or handwritten
    Rust consuming these contracts MUST remain implementable using safe Rust.

# =============================================================================
# 1. CONTRACT AUTHORITY
# =============================================================================

authority:

  architecture:
    path: "grammar/DESIGN.md"
    role: "normative grammar architecture"

  language_specification:
    path: "grammar/specification/"
    role: "normative language meaning"

  machine_specification:
    path: "grammar/spec/"
    role: "machine-oriented language contracts"

  ownership:
    path: "grammar/contracts/ownership.yaml"
    role: "canonical ownership authority"

  dependencies:
    path: "grammar/contracts/dependencies.yaml"
    role: "canonical dependency authority"

  exports:
    path: "grammar/contracts/exports.yaml"
    role: "canonical export/interface authority"

  ast_mappings:
    path: "grammar/contracts/ast-mappings.yaml"
    role: "AST integration authority"

  semantic_mappings:
    path: "grammar/contracts/semantic-mappings.yaml"
    role: "semantic integration authority"

  ir_mappings:
    path: "grammar/contracts/ir-mappings.yaml"
    role: "canonical IR integration authority"

  diagnostics:
    path: "grammar/contracts/diagnostics.yaml"
    role: "diagnostic integration authority"

  compatibility:
    path: "grammar/contracts/compatibility.yaml"
    role: "compatibility integration authority"

  feature_status:
    path: "grammar/contracts/feature-status.yaml"
    role: "feature lifecycle authority"

  inventory:
    path: "grammar/MANIFEST.yaml"
    role: "repository inventory"

  ownership_index:
    path: "grammar/OWNERSHIP.yaml"
    role: "repository ownership index"

  dependency_index:
    path: "grammar/DEPENDENCIES.yaml"
    role: "compatibility/dependency index"

  status:
    path: "grammar/STATUS.yaml"
    role: "repository lifecycle status"

  freeze:
    path: "grammar/FREEZE.md"
    role: "freeze procedure"

  conformance:
    path: "grammar/CONFORMANCE.md"
    role: "production conformance contract"

  historical_reference:
    path: "grammar/Zamani-Grammar.md"
    normative: false
    role: "historical and extended reference only"

  implementation_reference:
    path: "grammar/grammar.md"
    normative: false
    role: "derived implementation/conformance reference"

# =============================================================================
# 2. EXPORT PRINCIPLES
# =============================================================================

principles:

  one_owner:
    severity: "error"
    rule: >
      Every public export MUST have exactly one canonical owner.

  one_identity:
    severity: "error"
    rule: >
      One semantic concept MUST NOT be exported under multiple competing
      canonical identities unless an explicit compatibility alias is declared.

  explicit_export:
    severity: "error"
    rule: >
      A grammar rule is not public merely because another grammar happens to
      import it. Public status MUST be explicitly declared.

  explicit_consumer:
    severity: "error"
    rule: >
      Every public export MUST declare its legal consumers.

  no_hidden_exports:
    severity: "error"
    rule: >
      A grammar file MUST NOT expose undocumented public rules through import
      side effects or parser reachability alone.

  composition_is_not_ownership:
    severity: "error"
    rule: >
      Composition roots and dispatchers consume exports but MUST NOT acquire
      ownership of the concepts they dispatch.

  facade_is_not_duplication:
    severity: "error"
    rule: >
      A facade may re-export an existing canonical symbol but MUST NOT create
      a competing definition.

  stable_boundary:
    severity: "error"
    rule: >
      A frozen export MUST expose a stable contract that allows downstream
      implementations to evolve without requiring upstream semantic changes.

  no_backend_export:
    severity: "error"
    rule: >
      Grammar exports MUST describe source-language meaning or source-language
      interfaces. Vendor machine instructions and backend implementation
      objects MUST NOT become grammar exports.

  no_runtime_export:
    severity: "error"
    rule: >
      Grammar MUST NOT export live runtime state, physical device instances,
      mutable hardware inventory, calibration state, or runtime telemetry.

  deterministic:
    severity: "error"
    rule: >
      Export resolution MUST be deterministic and independent of filesystem
      ordering, target availability, wall-clock time, randomness, or runtime
      state.

# =============================================================================
# 3. EXPORT KINDS
# =============================================================================

export_kinds:

  grammar_rule:
    description: "Public parser or lexer rule."

  parser_entry:
    description: "Stable parser entry point."

  lexer_token:
    description: "Canonical lexical token exported through the lexer boundary."

  grammar_fragment:
    description: "Internal lexical/parser fragment explicitly reusable by consumers."

  type_constructor:
    description: "Source-level type constructor."

  expression_constructor:
    description: "Source-level expression form."

  statement_constructor:
    description: "Source-level statement form."

  declaration_constructor:
    description: "Source-level declaration form."

  effect_constructor:
    description: "Source-level effect declaration/reference."

  resource_constructor:
    description: "Source-level resource requirement or resource expression."

  capability_constructor:
    description: "Source-level capability declaration/reference."

  policy_constructor:
    description: "Source-level policy expression."

  contract_constructor:
    description: "Source-level contract expression."

  provenance_constructor:
    description: "Source-level provenance/evidence construct."

  domain_constructor:
    description: "Domain-specific source construct integrated into common semantics."

  dialect_boundary:
    description: "Explicit extension/interoperability boundary."

  compatibility_alias:
    description: "Versioned compatibility alias for an existing canonical export."

  composition_root:
    description: "Grammar composition boundary."

# =============================================================================
# 4. VISIBILITY LEVELS
# =============================================================================

visibility:

  public:
    meaning: >
      May be consumed by any legal grammar layer or parser composition
      boundary specified by this contract.

  domain_public:
    meaning: >
      May be consumed by the owning domain and explicitly declared
      cross-domain consumers.

  internal:
    meaning: >
      May only be consumed within the owning grammar subsystem.

  compatibility_only:
    meaning: >
      Exists only to preserve a declared compatibility surface.

  generated:
    meaning: >
      Generated from authoritative source data and MUST NOT become an
      independent authority.

# =============================================================================
# 5. REQUIRED EXPORT RECORD
# =============================================================================

export_record_schema:

  required:
    - "id"
    - "symbol"
    - "kind"
    - "owner"
    - "visibility"
    - "status"
    - "purpose"
    - "consumers"
    - "dependencies"
    - "ast"
    - "semantic"
    - "ir"
    - "diagnostics"
    - "compatibility"
    - "scalability"
    - "poco_reaf"
    - "hard_coding"
    - "freeze"

  fields:

    id:
      type: "string"
      rule: "Globally unique within grammar/."

    symbol:
      type: "string"
      rule: "Canonical source/grammar symbol."

    kind:
      type: "enum"
      values:
        - "grammar_rule"
        - "parser_entry"
        - "lexer_token"
        - "grammar_fragment"
        - "type_constructor"
        - "expression_constructor"
        - "statement_constructor"
        - "declaration_constructor"
        - "effect_constructor"
        - "resource_constructor"
        - "capability_constructor"
        - "policy_constructor"
        - "contract_constructor"
        - "provenance_constructor"
        - "domain_constructor"
        - "dialect_boundary"
        - "compatibility_alias"
        - "composition_root"

    owner:
      type: "repository_path"
      rule: >
        MUST identify exactly one canonical owning grammar file or explicitly
        authorized specification registry.

    visibility:
      type: "enum"
      values:
        - "public"
        - "domain_public"
        - "internal"
        - "compatibility_only"
        - "generated"

    status:
      type: "lifecycle"

    purpose:
      type: "string"

    consumers:
      type: "list[path_or_symbol]"

    dependencies:
      type: "list[path_or_symbol]"

    ast:
      required_fields:
        - "required"
        - "owner"
        - "mapping"
        - "source_span"

    semantic:
      required_fields:
        - "required"
        - "owner"
        - "mapping"

    ir:
      required_fields:
        - "required"
        - "mapping"
        - "canonical_boundary"

    diagnostics:
      required_fields:
        - "required"
        - "owner"
        - "identity"

    compatibility:
      required_fields:
        - "versioned"
        - "stability"
        - "migration"

    scalability:
      required_fields:
        - "symbolic_scale"
        - "finite_capacity_free"
        - "resource_behavior"

    poco_reaf:
      required_fields:
        - "portable_meaning"
        - "target_independence"
        - "realization_behavior"

    hard_coding:
      required_fields:
        - "forbidden_capacity_constants"
        - "target_specific_values"
        - "audit"

    freeze:
      required_fields:
        - "required_checks"
        - "blocking_conditions"

# =============================================================================
# 6. CANONICAL PUBLIC COMPOSITION EXPORTS
# =============================================================================

canonical_composition_exports:

  - id: "root.program"
    symbol: "program"
    kind: "parser_entry"
    owner: "grammar/Zamani.g4"
    visibility: "public"
    status: "SPECIFIED"
    purpose: >
      Parse one complete Zamani source unit and require complete input
      consumption.
    consumers:
      - "src/parser.rs"
      - "grammar/conformance/syntax/"
      - "grammar/golden/parser/"
    dependencies:
      - "grammar/antlr/ZamaniParser.g4::sourceUnit"
      - "grammar/antlr/ZamaniLexer.g4"
    ast:
      required: true
      owner: "src/ast/mod.rs"
      mapping: "Program"
      source_span: true
    semantic:
      required: true
      owner: "semantic implementation"
      mapping: "program semantic model"
    ir:
      required: false
      mapping: "delegates to contained semantic constructs"
      canonical_boundary: "domain semantic models"
    diagnostics:
      required: true
      owner: "src/parser.rs / diagnostic implementation"
      identity: "program-parse"
    compatibility:
      versioned: true
      stability: "language-versioned"
      migration: "grammar/compatibility/"
    scalability:
      symbolic_scale: true
      finite_capacity_free: true
      resource_behavior: "source size constrained only by implementation resources"
    poco_reaf:
      portable_meaning: true
      target_independence: true
      realization_behavior: "downstream target realization"
    hard_coding:
      forbidden_capacity_constants: true
      target_specific_values: true
      audit: "grammar/validation/hard-coding.md"
    freeze:
      required_checks:
        - "parser generation"
        - "complete-input enforcement"
        - "AST mapping"
        - "diagnostic mapping"
        - "compatibility validation"
      blocking_conditions:
        - "domain-specific implementation in root"
        - "hardware dependency"
        - "duplicate program root"

  - id: "parser.sourceUnit"
    symbol: "sourceUnit"
    kind: "parser_entry"
    owner: "grammar/antlr/ZamaniParser.g4"
    visibility: "public"
    status: "SPECIFIED"
    purpose: "Canonical parser composition unit."
    consumers:
      - "grammar/Zamani.g4::program"
      - "src/parser.rs"
    dependencies:
      - "core"
      - "declarations"
      - "statements"
      - "modules"
      - "functions"
      - "domain dispatchers"
    ast:
      required: true
      owner: "src/ast/mod.rs"
      mapping: "Program / Statement collection"
      source_span: true
    semantic:
      required: true
      owner: "semantic implementation"
      mapping: "source-unit semantic model"
    ir:
      required: false
      mapping: "contained constructs"
      canonical_boundary: "domain canonical IR"
    diagnostics:
      required: true
      owner: "parser diagnostics"
      identity: "source-unit-parse"
    compatibility:
      versioned: true
      stability: "language-versioned"
      migration: "grammar/compatibility/"
    scalability:
      symbolic_scale: true
      finite_capacity_free: true
      resource_behavior: "implementation-resource bounded"
    poco_reaf:
      portable_meaning: true
      target_independence: true
      realization_behavior: "downstream"
    hard_coding:
      forbidden_capacity_constants: true
      target_specific_values: true
      audit: "grammar/validation/hard-coding.md"
    freeze:
      required_checks:
        - "dispatch completeness"
        - "no duplicate item ownership"
        - "AST coverage"
        - "parser diagnostics"
      blocking_conditions:
        - "missing domain dispatcher"
        - "duplicate source-unit root"

# =============================================================================
# 7. LEXICAL EXPORT BOUNDARY
# =============================================================================

lexical_exports:

  public_boundary:
    symbol: "ZamaniLexer"
    owner: "grammar/antlr/ZamaniLexer.g4"
    consumers:
      - "grammar/antlr/ZamaniParser.g4"
      - "grammar/Zamani.g4"
      - "src/lexer.rs"
    rule: >
      ZamaniLexer.g4 is the single public lexer boundary. It MUST NOT redefine
      individual tokens owned by grammar/lexer/.

  canonical_lexical_composition:
    owner: "grammar/lexer/lexer.g4"
    consumers:
      - "grammar/antlr/ZamaniLexer.g4"

  token_authority:
    owner: "grammar/lexer/tokens.g4"
    rule: >
      Individual token identities MUST be owned by the canonical token
      registry and lexical component hierarchy.

  token_export_requirements:
    every_token:
      requires:
        - "unique token identity"
        - "canonical spelling or lexical definition"
        - "category"
        - "owner"
        - "compatibility identity"
        - "test coverage"
      forbids:
        - "duplicate canonical token"
        - "hardware-specific token"
        - "vendor-device token"
        - "finite-capacity token"

  lexical_ast_boundary:
    required: false
    rule: >
      Lexical exports do not directly construct AST nodes. They contribute
      token information consumed by the parser.

  lexical_semantic_boundary:
    required: false
    rule: >
      Tokens do not encode domain semantic decisions.

  lexical_ir_boundary:
    required: false
    rule: >
      Tokens never directly construct or select an IR.

# =============================================================================
# 8. CORE EXPORTS
# =============================================================================

core_exports:

  namespace:
    owner: "grammar/core/"
    public_concepts:
      - "program"
      - "sourceUnit"
      - "item"
      - "identifier"
      - "qualifiedName"
      - "path"
      - "visibility"
      - "attribute"
      - "modifier"
      - "capabilityReference"
      - "requirement"
      - "constraint"
      - "preference"
      - "hint"

  ownership_rule: >
    Core exports provide domain-neutral language foundations. They MUST NOT
    encode domain-specific hardware realization.

  required_integration:
    ast_owner: "src/ast/mod.rs"
    semantic_owner: "semantic implementation"
    ir_owner: "canonical domain IR implementations"

  target_independence: true

# =============================================================================
# 9. MODULE EXPORTS
# =============================================================================

module_exports:

  owner: "grammar/modules/"

  canonical_exports:
    - "module"
    - "modulePath"
    - "import"
    - "use"
    - "export"
    - "reexport"
    - "namespace"
    - "moduleAlias"

  rules:
    - >
      Modules MUST expose stable names and dependency boundaries without
      depending on physical deployment topology.
    - >
      A module path MUST NOT imply a physical machine, node, device, or
      vendor.

  ast:
    owner: "src/ast/mod.rs"
    required: true

  semantic:
    owner: "semantic module system"
    required: true

  ir:
    required: true
    mapping: "module identity and resolved symbol references"
    canonical_boundary: "canonical domain IR"

# =============================================================================
# 10. DECLARATION EXPORTS
# =============================================================================

declaration_exports:

  owner: "grammar/declarations/"

  canonical_families:
    - "variableDeclaration"
    - "constantDeclaration"
    - "functionDeclaration"
    - "typeDeclaration"
    - "structDeclaration"
    - "enumDeclaration"
    - "traitDeclaration"
    - "interfaceDeclaration"
    - "implementationDeclaration"
    - "typeAliasDeclaration"
    - "classDeclaration"
    - "effectDeclaration"
    - "moduleDeclaration"
    - "attributeDeclaration"

  rule:
    one_symbol_one_owner: true
    semantic_meaning: "domain-neutral"

  ast:
    owner: "src/ast/mod.rs"
    required: true
    current_mapping_policy: >
      Existing AST variants may be consumed where semantically equivalent.
      Missing production representations MUST be added through the AST
      contract before the corresponding grammar export is marked STABLE.

  semantic:
    required: true
    owner: "semantic declaration/type/function implementation"

  ir:
    required: true
    mapping: "resolved declarations and definitions"
    canonical_boundary: "domain-specific canonical IR"

# =============================================================================
# 11. TYPE EXPORTS
# =============================================================================

type_exports:

  owner: "grammar/types/"

  canonical_families:

    primitive:
      exports:
        - "primitiveType"
        - "booleanType"
        - "characterType"
        - "integerType"
        - "unsignedIntegerType"
        - "floatingType"
        - "stringType"
        - "unitType"
        - "neverType"

    structural:
      exports:
        - "tupleType"
        - "arrayType"
        - "sliceType"
        - "mapType"
        - "recordType"
        - "unionType"
        - "sumType"

    callable:
      exports:
        - "functionType"
        - "closureType"
        - "lambdaType"

    generic:
      exports:
        - "genericType"
        - "typeParameter"
        - "typeBound"
        - "typeConstraint"
        - "associatedType"
        - "higherKindedType"

    ownership:
      exports:
        - "referenceType"
        - "pointerType"
        - "linearType"
        - "affineType"
        - "lifetime"

    advanced:
      exports:
        - "optionalType"
        - "resultType"
        - "dependentType"
        - "refinementType"
        - "temporalType"
        - "identityType"

    domain:
      exports:
        - "quantumType"
        - "resourceType"
        - "hardwareCapabilityType"

  integration:

    ast:
      owner: "src/ast/mod.rs"
      canonical_boundary: "TypeExpr"
      required: true

    semantic:
      owner: "semantic type system"
      required: true

    ir:
      required: true
      mapping: "resolved canonical type representation"
      canonical_boundary: "domain canonical IR"

  scalability:
    rule: >
      Type constructors MUST support symbolic, generic, runtime, or otherwise
      semantically constrained dimensions where applicable.

    forbidden:
      - "universal maximum array length"
      - "universal maximum tensor rank"
      - "universal maximum type nesting depth"
      - "target register width as type-system limit"

  implementation_constraint:
    rule: >
      Rust implementation details such as i8, i16, i32, i64, i128, f32, and
      f64 MUST NOT be interpreted as universal limits of the Zamani language.
      They are implementation representations unless the source language
      explicitly defines them as source-level types.

# =============================================================================
# 12. MEMORY EXPORTS
# =============================================================================

memory_exports:

  owner: "grammar/memory/"

  canonical_families:
    - "ownership"
    - "borrow"
    - "reference"
    - "lifetime"
    - "allocation"
    - "deallocation"
    - "region"
    - "addressSpace"
    - "sharedMemory"
    - "distributedMemory"
    - "acceleratorMemory"
    - "persistentMemory"
    - "temporalMemory"

  integration:
    ast:
      owner: "src/ast/mod.rs"
      required: true

    semantic:
      owner: "memory/ownership semantic implementation"
      required: true

    ir:
      required: true
      mapping: "memory intent and ownership constraints"
      canonical_boundary: "canonical domain IR"

  forbidden:
    - "physical RAM size as language constant"
    - "physical VRAM size as language constant"
    - "fixed address-space capacity"
    - "fixed number of memory regions"

# =============================================================================
# 13. EXPRESSION EXPORTS
# =============================================================================

expression_exports:

  owner: "grammar/expressions/"

  canonical_expression_algebra:

    atomic:
      - "identifierExpression"
      - "literalExpression"
      - "pathExpression"

    operators:
      - "prefixExpression"
      - "infixExpression"
      - "assignmentExpression"
      - "compoundAssignmentExpression"

    control:
      - "ifExpression"
      - "matchExpression"
      - "blockExpression"
      - "loopExpression"

    callable:
      - "callExpression"
      - "lambdaExpression"
      - "closureExpression"
      - "methodCallExpression"

    data:
      - "arrayExpression"
      - "tupleExpression"
      - "recordExpression"
      - "indexExpression"
      - "rangeExpression"

    access:
      - "memberAccessExpression"

    type:
      - "castExpression"
      - "typeAscriptionExpression"

    asynchronous:
      - "awaitExpression"
      - "asyncExpression"
      - "spawnExpression"

    error:
      - "tryExpression"
      - "tryCatchExpression"

    extension:
      - "macroExpression"
      - "queryExpression"
      - "reasoningExpression"
      - "uncertaintyExpression"
      - "evidenceExpression"
      - "policyExpression"

    domain:
      - "quantumExpression"
      - "simulationExpression"

  duplicate_concept_policy:
    rule: >
      Concepts with competing filenames or rule identities MUST resolve to one
      canonical export. Examples include singular/plural duplicate naming such
      as closure/closures and lambda/lambdas. A compatibility alias may exist,
      but two canonical owners are forbidden.

  ast:
    owner: "src/ast/mod.rs"
    required: true
    canonical_boundary: "Expression"

  semantic:
    required: true
    owner: "semantic expression implementation"

  ir:
    required: true
    mapping: "resolved expression semantics"
    canonical_boundary: "domain canonical IR"

# =============================================================================
# 14. FUNCTION EXPORTS
# =============================================================================

function_exports:

  owner: "grammar/functions/"

  canonical_families:
    - "function"
    - "parameter"
    - "returnType"
    - "genericFunction"
    - "functionConstraint"
    - "closure"
    - "lambda"
    - "asyncFunction"
    - "foreignFunction"
    - "compileTimeFunction"
    - "generator"
    - "callingConvention"
    - "functionContract"

  semantic_requirements:
    - "type checking"
    - "effect checking"
    - "capability checking"
    - "resource checking"
    - "contract checking"
    - "policy checking"

  ast:
    owner: "src/ast/mod.rs"
    required: true

  semantic:
    owner: "semantic function/type implementation"
    required: true

  ir:
    required: true
    mapping: "callable semantic representation"
    canonical_boundary: "canonical domain IR"

# =============================================================================
# 15. STATEMENT EXPORTS
# =============================================================================

statement_exports:

  owner: "grammar/statements/"

  canonical_families:

    binding:
      - "letStatement"
      - "constStatement"

    control:
      - "returnStatement"
      - "breakStatement"
      - "continueStatement"
      - "whileStatement"
      - "forStatement"
      - "matchStatement"

    contracts:
      - "assertStatement"
      - "retractStatement"
      - "requiresStatement"
      - "ensuresStatement"
      - "invariantStatement"
      - "assumeStatement"
      - "guaranteeStatement"
      - "propertyStatement"

    reasoning:
      - "inferStatement"
      - "deduceStatement"
      - "reasonStatement"

    learning:
      - "learnStatement"

    adaptation:
      - "adaptStatement"

    query:
      - "queryStatement"

    explanation:
      - "explainStatement"

    simulation:
      - "simulateStatement"

    policy:
      - "policyStatement"

    sandbox:
      - "sandboxStatement"

    domain:
      - "quantumStatement"
      - "hdlStatement"
      - "distributedStatement"
      - "networkStatement"

  adaptation_rule:
    export: "adaptStatement"
    requires:
      - "policy"
      - "capability"
      - "effect"
      - "resource"
      - "authorization"
      - "provenance"
    forbids:
      - "unrestricted self-modifying code"
      - "silent semantic mutation"
      - "unauthorized code generation"

  ast:
    owner: "src/ast/mod.rs"
    required: true
    rule: >
      Existing Statement variants may be used only when their semantics match
      the canonical source construct. A grammar export MUST NOT be marked
      STABLE merely because parsing succeeds.

  semantic:
    required: true
    owner: "semantic statement implementation"

  ir:
    required: true
    mapping: "validated statement semantics"
    canonical_boundary: "canonical domain IR"

# =============================================================================
# 16. EFFECT EXPORTS
# =============================================================================

effect_exports:

  owner: "grammar/effects/"

  canonical_families:
    - "effect"
    - "effectSet"
    - "effectParameter"
    - "effectComposition"
    - "effectRequirement"
    - "effectCapabilityRelation"

  effect_categories:
    - "io"
    - "network"
    - "mutation"
    - "randomness"
    - "native"
    - "foreign"
    - "distributed"
    - "measurement"
    - "quantum"
    - "learning"
    - "adaptation"
    - "reflection"
    - "codeGeneration"
    - "simulation"
    - "security"
    - "hardware"

  rule: >
    Effect categories describe semantic behavior. They do not select a
    particular hardware implementation.

  ast:
    required: true
    owner: "src/ast/mod.rs or canonical owned AST modules"
    mapping: "effect annotations/declarations"

  semantic:
    required: true
    owner: "effect semantic implementation"

  ir:
    required: true
    mapping: "effect metadata attached to canonical semantic operations"
    canonical_boundary: "canonical domain IR"

# =============================================================================
# 17. RESOURCE EXPORTS
# =============================================================================

resource_exports:

  owner: "grammar/resources/"

  canonical_families:
    - "resource"
    - "resourceExpression"
    - "resourceRequirement"
    - "resourceConstraint"
    - "resourcePreference"
    - "resourceBudget"
    - "resourceNegotiation"
    - "placementRequirement"
    - "topologyRequirement"
    - "reliabilityRequirement"
    - "latencyRequirement"
    - "energyRequirement"

  capability_relationship:
    owner: "grammar/core/capabilities.g4"
    semantic_owner: "grammar/resources/"

  permitted_forms:
    - "requires qubits >= required_qubits"
    - "requires memory >= required_memory"
    - "requires capability(\"quantum.measurement\")"
    - "requires capability(\"gpu.compute\")"
    - "requires capability(\"tensor.compute\")"
    - "requires topology(required_topology)"
    - "prefer ..."
    - "constrain ..."
    - "allow ..."
    - "forbid ..."

  hard_coding:
    forbidden:
      - "MAX_QUBITS"
      - "MAX_CPUS"
      - "MAX_CORES"
      - "MAX_THREADS"
      - "MAX_GPUS"
      - "MAX_FPGAS"
      - "MAX_ASICS"
      - "MAX_QPUS"
      - "MAX_NODES"
      - "MAX_MEMORY"
      - "MAX_STORAGE"
      - "MAX_REGISTER_WIDTH"
      - "MAX_VECTOR_WIDTH"
      - "MAX_TENSOR_RANK"
      - "MAX_TENSOR_DIMENSION"
      - "MAX_NETWORK_SIZE"
      - "MAX_DEVICE_COUNT"
      - "MAX_ACCELERATOR_COUNT"
      - "MAX_AGENT_COUNT"
      - "MAX_CIRCUIT_DEPTH"

    equivalent_limits_forbidden: true

  ast:
    required: true
    owner: "domain-neutral AST implementation"
    mapping: "resource requirement/constraint nodes"

  semantic:
    required: true
    owner: "resource and capability semantic implementation"

  ir:
    required: true
    mapping: "resource/capability metadata"
    canonical_boundary: "canonical semantic IR"

  runtime:
    allowed_to_consume: true
    rule: >
      Runtime may evaluate resource availability but MUST NOT redefine source
      resource semantics.

# =============================================================================
# 18. CAPABILITY EXPORTS
# =============================================================================

capability_exports:

  owner: "grammar/core/capabilities.g4"

  canonical_families:
    - "capabilityReference"
    - "capabilityRequirement"
    - "capabilityProvision"
    - "capabilityConstraint"

  examples:
    - "quantum.measurement"
    - "gpu.compute"
    - "tensor.compute"

  rule: >
    Capability identifiers are open-world symbolic identifiers. The grammar
    MUST NOT contain a finite universal catalogue of physical devices.

  ownership_split:
    syntax: "grammar/core/capabilities.g4"
    resource_semantics: "grammar/resources/"
    target_capability_discovery: "hardware/compiler/runtime"
    capability_execution: "runtime/HAL"

  ast:
    required: true

  semantic:
    required: true

  ir:
    required: true
    mapping: "capability requirements attached to semantic operations"
    canonical_boundary: "canonical domain IR"

# =============================================================================
# 19. CONTRACT EXPORTS
# =============================================================================

contract_exports:

  owners:
    generic: "grammar/core/"
    statement_contracts: "grammar/statements/"
    function_contracts: "grammar/functions/"

  canonical:
    - "requires"
    - "ensures"
    - "invariant"
    - "assume"
    - "guarantee"
    - "property"

  semantics:
    rule: >
      Contracts constrain program meaning and correctness. They MUST NOT be
      converted into hidden hardware assumptions.

  ast:
    required: true
    owner: "domain-neutral AST"

  semantic:
    required: true
    owner: "contract validation"

  ir:
    required: true
    mapping: "verified contract metadata"
    canonical_boundary: "semantic IR"

# =============================================================================
# 20. POLICY EXPORTS
# =============================================================================

policy_exports:

  owner: "grammar/policies/"

  canonical:
    - "policy"
    - "policyScope"
    - "policyRule"
    - "policyRequirement"
    - "policyConstraint"
    - "policyPreference"
    - "policyFallback"
    - "policyAuthorization"

  integration:
    effects: "grammar/effects/"
    resources: "grammar/resources/"
    security: "grammar/security/"
    execution: "grammar/execution/"
    adaptation: "grammar/statements/"

  rule: >
    Policies govern permitted realization and behavior. They do not become
    hidden parser-time execution.

  ast:
    required: true

  semantic:
    required: true

  ir:
    required: true
    mapping: "policy metadata and validated constraints"
    canonical_boundary: "semantic IR"

# =============================================================================
# 21. PROVENANCE AND EVIDENCE EXPORTS
# =============================================================================

provenance_exports:

  owner:
    syntax: "grammar/ai/"
    cross_domain_contract: "grammar/core/"
    semantic: "semantic provenance implementation"

  canonical:
    - "evidence"
    - "provenance"
    - "explanation"
    - "decisionRecord"
    - "confidence"
    - "uncertainty"
    - "sourceReference"

  rule: >
    Provenance constructs are language-level semantic metadata. They MUST NOT
    force a particular storage system or backend.

  ast:
    required: true

  semantic:
    required: true

  ir:
    required: true
    mapping: "provenance metadata"
    canonical_boundary: "canonical semantic IR"

# =============================================================================
# 22. CLASSICAL COMPUTING EXPORTS
# =============================================================================

classical_exports:

  owner: "grammar/classical/"

  canonical_families:
    - "scalar"
    - "numeric"
    - "vector"
    - "matrix"
    - "tensor"
    - "linearAlgebra"
    - "statistics"
    - "signalProcessing"
    - "symbolicComputation"
    - "optimization"
    - "acceleratorIntent"

  integration:
    depends_on:
      - "grammar/types/"
      - "grammar/expressions/"
      - "grammar/functions/"
      - "grammar/effects/"
      - "grammar/resources/"
      - "grammar/memory/"

  ast:
    required: true
    owner: "src/ast/mod.rs or owned AST extension modules"

  semantic:
    required: true
    owner: "classical semantic implementation"

  ir:
    required: true
    canonical_boundary: "Classical IR"

  portability:
    rule: >
      Classical exports describe computation, not CPU instruction sets or
      fixed machine widths unless explicitly part of source semantics.

# =============================================================================
# 23. DATA EXPORTS
# =============================================================================

data_exports:

  owner: "grammar/data/"

  canonical_families:
    - "collection"
    - "record"
    - "schema"
    - "table"
    - "graph"
    - "dataset"
    - "stream"
    - "pipeline"
    - "query"
    - "serialization"
    - "deserialization"
    - "transformation"
    - "dataProvenance"

  external_formats:
    rule: >
      SQL, JSON, XML and other external data formats are dialect/interoperability
      boundaries and MUST NOT silently become universal core syntax.

  ast:
    required: true

  semantic:
    required: true

  ir:
    required: true
    canonical_boundary: "canonical data/domain IR"

# =============================================================================
# 24. CONCURRENCY EXPORTS
# =============================================================================

concurrency_exports:

  owner: "grammar/concurrency/"

  canonical:
