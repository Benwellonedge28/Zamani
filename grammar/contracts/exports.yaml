    - "quantumClassicalBoundary"
    - "hostDeviceBoundary"
    - "sharedDataBoundary"
    - "feedForwardBoundary"
    - "hybridSynchronization"
    - "hybridResourceRequirement"
    - "acceleratorInteroperability"

  rule: >
    Hybrid exports compose already-defined domain semantics. They MUST NOT
    redefine classical, quantum, HDL, or hardware semantics.

  dependencies:
    - "grammar/classical/"
    - "grammar/quantum/"
    - "grammar/hdl/"
    - "grammar/hardware/"
    - "grammar/effects/"
    - "grammar/resources/"
    - "grammar/execution/"

  ast:
    required: true

  semantic:
    required: true

  ir:
    required: true
    canonical_boundary: "canonical domain IR composition"

# =============================================================================
# 31. AI / REASONING EXPORTS
# =============================================================================

ai_exports:

  owner: "grammar/ai/"

  canonical_families:
    reasoning:
      - "infer"
      - "deduce"
      - "reason"

    learning:
      - "learn"
      - "training"
      - "adaptation"

    uncertainty:
      - "probability"
      - "confidence"
      - "uncertainty"

    evidence:
      - "evidence"
      - "provenance"
      - "explanation"
      - "decisionRecord"

    models:
      - "model"
      - "dataset"
      - "inference"
      - "optimization"

    symbolic:
      - "knowledge"
      - "rule"
      - "constraint"
      - "neuralSymbolic"

    agents:
      - "agent"
      - "planning"
      - "decision"

  application_specificity:
    rule: >
      Application-specific concepts MUST NOT become universal language
      keywords merely because an AI or application subsystem can consume them.

    extension_mechanisms:
      - "libraries"
      - "dialects"
      - "capabilities"
      - "policies"
      - "application modules"

  ast:
    required: true

  semantic:
    required: true

  ir:
    required: true
    canonical_boundary: "AI/domain semantic IR"

# =============================================================================
# 32. EXECUTION EXPORTS
# =============================================================================

execution_exports:

