# =============================================================================
# 33. COMPILATION EXPORTS
# =============================================================================

compile_exports:

  owner: "grammar/compile/"

  canonical:
    - "compilationUnit"
    - "compilationTarget"
    - "targetSelectionIntent"
    - "crossCompilation"
    - "loweringIntent"
    - "optimizationIntent"
    - "specialization"
    - "conditionalCompilation"
    - "featureSelection"
    - "reproducibleBuild"
    - "artifact"
    - "deploymentIntent"

  compile_once_rule:
    rule: >
      Compile-once refers to preserving portable program meaning and stable
      semantic artifacts. It MUST NOT imply that one target-native machine-code
      artifact can execute unchanged on physically incompatible targets.

  artifact_requirements:
    - "language version"
    - "grammar version"
    - "AST/semantic version"
    - "IR version"
    - "dialect versions"
    - "resource requirements"
    - "capability requirements"
    - "constraints"
    - "preferences"
    - "policies"
    - "effects"
    - "provenance"
    - "reproducibility metadata"

  ast:
    required: true

  semantic:
    required: true

  ir:
    required: true
    canonical_boundary: "canonical semantic IR"

# =============================================================================
# 34. INTEROPERABILITY EXPORTS
# =============================================================================

interoperability_exports:

  owner: "grammar/interoperability/"

  canonical:
    - "foreignFunction"
    - "foreignType"
    - "ffiBoundary"
    - "abiBoundary"
    - "callingConvention"
    - "linkage"
    - "serialization"
    - "externalFormat"
    - "foreignModule"

  external_formats:
    rule: >
      External language and data formats are integration boundaries. Their
      presence does not make the external language part of the Zamani core
      grammar.

  safety:
    rule: >
      Foreign execution must be represented through explicit effects,
      capabilities, policies, contracts, and provenance where applicable.

  ast:
    required: true

  semantic:
    required: true

  ir:
    required: true
    canonical_boundary: "interoperability semantic representation"

# =============================================================================
# 35. DIALECT EXPORTS
# =============================================================================

dialect_exports:

  owner: "grammar/dialects/"

  canonical:
    - "dialect"
    - "dialectIdentity"
    - "dialectNamespace"
    - "dialectVersion"
    - "dialectDependency"
    - "dialectCapability"
    - "dialectSyntax"
    - "dialectSemanticMapping"
    - "dialectRegistration"
    - "dialectCompatibility"

  requirements:
    identity: true
    namespace: true
    version: true
    dependencies: true
    compatibility: true
    semantic_mapping: true

  rule: >
    A dialect MUST NOT silently redefine a stable core export.

  future_extension:
    rule: >
      New computational domains, hardware families, operation sets, data
      formats, and application capabilities should preferentially extend the
      language through dialects rather than modifying the universal core.

  ast:
    required: true

  semantic:
    required: true

  ir:
    required: true
    canonical_boundary: "dialect semantic adapter"

# =============================================================================
# 36. SECURITY EXPORTS
# =============================================================================

security_exports:

  owner: "grammar/security/"

  canonical:
    - "identity"
    - "authorization"
    - "permission"
    - "capability"
    - "sandbox"
    - "trust"
    - "audit"
    - "privacy"
    - "secretReference"
    - "cryptographicIntent"
    - "secureComputation"
    - "securityConstraint"

  rule: >
    Grammar describes security intent and constraints. It MUST NOT directly
    execute authorization or security operations during parsing.

  integration:
    effects: "grammar/effects/"
    policies: "grammar/policies/"
    resources: "grammar/resources/"
    execution: "grammar/execution/"

  ast:
    required: true

  semantic:
    required: true

  ir:
    required: true
    canonical_boundary: "security semantic IR"

# =============================================================================
# 37. MACRO EXPORTS
# =============================================================================

macro_exports:

  owner: "grammar/macros/"

  canonical:
    - "macroDeclaration"
    - "macroParameter"
    - "macroInvocation"
    - "macroExpansion"
    - "macroHygiene"
    - "macroDiagnostic"

  rule: >
    Macro expansion MUST NOT bypass lexical, syntactic, type, effect,
    capability, resource, policy, contract, or security validation.

  ast:
    required: true

  semantic:
    required: true

  ir:
    required: true
    mapping: "expanded semantic program"
    canonical_boundary: "same canonical semantic pipeline as ordinary source"

# =============================================================================
# 38. METAPROGRAMMING EXPORTS
# =============================================================================

metaprogramming_exports:

  owner: "grammar/metaprogramming/"

  canonical:
    - "quotation"
    - "unquotation"
    - "syntaxTree"
    - "reflection"
    - "introspection"
    - "compileTimeExecution"
    - "codeGeneration"
    - "specialization"
    - "schemaGeneration"

  required_controls:
    - "effect"
    - "capability"
    - "policy"
    - "sandbox"
    - "provenance"

  rule: >
    Reflection and code generation MUST be controlled semantic operations and
    MUST NOT create an unrestricted path around the language safety model.

  ast:
    required: true

  semantic:
    required: true

  ir:
    required: true
    canonical_boundary: "semantic IR"

# =============================================================================
# 39. VALIDATION EXPORTS
# =============================================================================

validation_exports:

  owner: "grammar/validation/"

  canonical_validation_contracts:

    inventory:
      - "inventoryValidation"

    ownership:
      - "ownershipValidation"

    dependencies:
      - "dependencyValidation"

    lexer:
      - "tokenUniquenessValidation"
      - "lexerBoundaryValidation"

    parser:
      - "parserBoundaryValidation"
      - "reachabilityValidation"
      - "ambiguityValidation"
      - "precedenceValidation"

    semantics:
      - "astCoverageValidation"
      - "semanticCoverageValidation"
      - "irCoverageValidation"

    portability:
      - "targetIndependenceValidation"
      - "hardCodingValidation"
      - "scalabilityValidation"

    quality:
      - "duplicateConceptValidation"
      - "pathHygieneValidation"
      - "sourceSpanValidation"

  rule: >
    Validation grammars and documents may validate production grammar but MUST
    NOT become upstream semantic dependencies of the language itself.

# =============================================================================
# 40. COMPATIBILITY EXPORTS
# =============================================================================

compatibility_exports:

  owner: "grammar/compatibility/"

  canonical:
    - "languageVersion"
    - "grammarVersion"
    - "lexerVersion"
    - "parserVersion"
    - "astVersion"
    - "semanticVersion"
    - "irVersion"
    - "dialectVersion"
    - "featureGate"
    - "deprecatedFeature"
    - "compatibilityAlias"
    - "migrationRule"

  stable_export_requirements:
    - "compatibility identifier"
    - "version classification"
    - "migration behavior"
    - "deprecation behavior where applicable"

  rule: >
    Compatibility aliases MUST point to an existing canonical export and MUST
    NOT create a second semantic owner.

# =============================================================================
# 41. AST INTEGRATION CONTRACT
# =============================================================================

ast_integration:

  canonical_owner:
    primary: "src/ast/mod.rs"

  source_span:
    required: true
    rule: >
      Every semantic source construct MUST preserve source location information
      sufficiently for deterministic diagnostics, tooling, provenance and
      conformance.

  domain_neutrality:
    required: true
    rule: >
      Parser exports MUST first map into the canonical frontend AST or an
      explicitly authorized AST extension that participates in the same
      domain-neutral architecture.

  required_metadata:
    where_applicable:
      - "attributes"
      - "modifiers"
      - "effects"
      - "capabilities"
      - "resources"
      - "contracts"
      - "policies"
      - "provenance"

  forbidden:
    - "vendor instruction objects in frontend AST"
    - "physical device identity in universal AST"
    - "runtime telemetry in frontend AST"
    - "hidden parser-only semantics"
    - "backend-specific scheduling decisions"

  implementation_gap_rule:
    rule: >
      Existing AST variants that do not faithfully represent a canonical
      grammar export MUST NOT be treated as proof of production completeness.
      The export remains below STABLE until its AST contract is complete.

# =============================================================================
# 42. SEMANTIC INTEGRATION CONTRACT
# =============================================================================

semantic_integration:

  pipeline:

    - "lexical classification"
    - "parsing"
    - "domain-neutral AST"
    - "structural validation"
    - "type validation"
    - "effect validation"
    - "capability validation"
    - "resource validation"
    - "contract validation"
    - "policy validation"
    - "provenance validation"
    - "domain semantic validation"
    - "canonical domain IR"

  rule: >
    A grammar export cannot be considered semantically complete solely because
    it has an ANTLR production.

  required_semantic_contract:
    - "meaning"
    - "well-formedness"
    - "type behavior"
    - "effect behavior where applicable"
    - "resource behavior where applicable"
    - "capability behavior where applicable"
    - "policy behavior where applicable"
    - "diagnostics"
    - "compatibility"

# =============================================================================
# 43. IR INTEGRATION CONTRACT
# =============================================================================

ir_integration:

  source_path:

    - "Zamani source"
    - "domain-neutral AST"
    - "semantic model"
    - "canonical domain IR"
    - "optimization"
    - "lowering"
    - "target realization"

  canonical_ir:

    classical:
      name: "Classical IR"
      owner: "compiler/IR implementation"

    quantum:
      name: "quantum::ir"
      owner: "src/quantum/ir/ and associated compiler implementation"

    hdl:
      name: "HDL/Hardware IR"
      owner: "hardware/HDL compiler implementation"

  rule: >
    Grammar exports MUST NOT lower directly to vendor-specific machine
    representations.

  competing_frontend_ir:
    forbidden: true

  target_specific_ir:
    allowed_only_after:
      - "semantic validation"
      - "canonical IR"
      - "explicit lowering boundary"

# =============================================================================
# 44. DIAGNOSTIC INTEGRATION
# =============================================================================

diagnostic_integration:

  required:
    - "stable diagnostic identity"
    - "source span"
    - "category"
    - "severity"
    - "deterministic message contract"
    - "machine-readable representation where applicable"
    - "compatibility behavior"

  ownership:

    lexical:
      owner: "lexer/parser diagnostic implementation"

    syntax:
      owner: "parser diagnostic implementation"

    type:
      owner: "semantic type implementation"

    effect:
      owner: "effect validation"

    resource:
      owner: "resource validation"

    capability:
      owner: "capability validation"

    contract:
      owner: "contract validation"

    policy:
      owner: "policy/security validation"

    provenance:
      owner: "provenance validation"

    target:
      owner: "compiler/runtime realization boundary"

  critical_rule: >
    Target infeasibility is not a syntax error. A valid source program that
    cannot be realized on a selected target must receive a semantic,
    compilation, or runtime realization diagnostic according to the failure
    stage.

# =============================================================================
# 45. POCO-REAF EXPORT CONTRACT
# =============================================================================

poco_reaf:

  program_once:
    required: true
    rule: >
      Source semantics MUST NOT require separate source programs solely because
      target scale changes.

  compile_once:
    required: true
    rule: >
      Portable semantic artifacts MUST preserve source meaning independently
      from one particular target realization.

  run_everywhere:
    required: true
    requires:
      - "capability discovery"
      - "resource matching"
      - "target-independent semantics"
      - "target-aware lowering"
      - "compatibility validation"

  run_anywhere:
    required: true
    rule: >
      A target is valid only when all required semantic conditions,
      capabilities, resources, policies, effects and constraints permit it.

  run_forever:
    required: true
    requires:
      - "language versioning"
      - "AST compatibility"
      - "semantic compatibility"
      - "IR compatibility"
      - "dialect versioning"
      - "migration rules"
      - "reproducibility metadata"

  fallback:
    explicit: true
    rule: >
      Fallback MUST be explicitly authorized. The implementation MUST NOT
      silently replace an unavailable realization with an approximation that
      changes declared semantics.

# =============================================================================
# 46. SCALABILITY CONTRACT
# =============================================================================

scalability:

  model: "open_world"

  source_language:
    artificial_universal_limits: false

  resource_model:
    symbolic: true
    dynamic: true
    negotiated: true
    target_discovered: true

  allowed:
    - "symbolic dimensions"
    - "generic dimensions"
    - "dependent dimensions"
    - "runtime dimensions"
    - "resource expressions"
    - "capability expressions"
    - "abstract topology"
    - "placement requirements"
    - "resource budgets"
    - "constraints"
    - "preferences"

  forbidden:
    - "universal maximum machine size"
    - "universal maximum qubit count"
    - "universal maximum memory"
    - "universal maximum thread count"
    - "universal maximum tensor rank"
    - "universal maximum device count"
    - "universal maximum network size"

  scaling_invariant:
    rule: >
      Changing available target resources MUST NOT require changing source
      syntax solely to represent a larger realization.

# =============================================================================
# 47. HARD-CODING CONTRACT
# =============================================================================

hard_coding:

  forbidden_categories:

    machine:
      - "MAX_CPUS"
      - "MAX_CORES"
      - "MAX_THREADS"
      - "MAX_GPUS"
      - "MAX_FPGAS"
      - "MAX_ASICS"
      - "MAX_QPUS"
      - "MAX_ACCELERATORS"
      - "MAX_DEVICES"

    quantum:
      - "MAX_QUBITS"
      - "MAX_LOGICAL_QUBITS"
      - "MAX_PHYSICAL_QUBITS"
      - "MAX_CIRCUIT_DEPTH"

    memory:
      - "MAX_MEMORY"
      - "MAX_STORAGE"
      - "MAX_REGISTER_WIDTH"
      - "MAX_VECTOR_WIDTH"

    data:
      - "MAX_TENSOR_RANK"
      - "MAX_TENSOR_DIMENSION"
      - "MAX_NETWORK_SIZE"
      - "MAX_DATASET_SIZE"

    distributed:
      - "MAX_NODES"
      - "MAX_PROCESSES"
      - "MAX_AGENTS"
      - "MAX_CHANNELS"

  equivalent_detection:
    required: true
    rule: >
      Renaming, encoding, hiding, moving or deriving a prohibited universal
      capacity does not make it valid.

  allowed:
    - "program-specific constants"
    - "symbolic requirements"
    - "resource constraints explicitly written by the programmer"
    - "target-reported capacities during realization"

# =============================================================================
# 48. TARGET INDEPENDENCE
# =============================================================================

target_independence:

  grammar_may_export:
    - "requirements"
    - "capabilities"
    - "constraints"
    - "preferences"
    - "abstract topology"
    - "placement intent"
    - "execution intent"
    - "fallback policy"
    - "resource budget"
    - "reliability requirement"
    - "latency requirement"
    - "energy requirement"

  grammar_must_not_export:
    - "physical device inventory"
    - "vendor instruction set"
    - "physical routing result"
    - "physical placement result"
    - "runtime scheduling result"
    - "calibration data"
    - "live telemetry"
    - "device discovery result"

  rule: >
    A target can constrain realization but cannot redefine source semantics.

# =============================================================================
# 49. EXPORT CONSUMER RULES
# =============================================================================

consumer_rules:

  grammar_to_grammar:
    allowed: true
    requirements:
      - "dependency declared"
      - "owner exists"
      - "export is public or explicitly permitted"
      - "no cycle"

  grammar_to_ast:
    allowed: "indirect"
    rule: >
      Grammar exports map through the parser into AST structures. Grammar
      source files MUST NOT contain Rust AST implementation code.

  grammar_to_semantic:
    allowed: "contractual"
    rule: >
      Grammar specifies source constructs; semantic implementation interprets
      them.

  grammar_to_ir:
    allowed: "mapping only"
    rule: >
      Grammar may identify the canonical IR mapping but MUST NOT implement the
      IR.

  grammar_to_runtime:
    allowed: false
    rule: >
      Grammar does not consume live runtime state.

  grammar_to_backend:
    allowed: false
    rule: >
      Backend implementation is downstream from canonical semantic IR.

  grammar_to_tests:
    allowed: false
    rule: >
      Tests consume grammar exports; grammar does not depend on tests.

# =============================================================================
# 50. ROOT EXPORT MATRIX
# =============================================================================

root_export_matrix:

  "grammar/Zamani.g4":
    exports:
      - "program"
    consumes:
      - "grammar/antlr/ZamaniParser.g4"
      - "grammar/antlr/ZamaniLexer.g4"

  "grammar/antlr/ZamaniParser.g4":
    exports:
      - "sourceUnit"
      - "item"
      - "declaration"
      - "statement"
      - "expression"
      - "type"
    consumes:
      - "grammar/core/"
      - "grammar/modules/"
      - "grammar/declarations/"
      - "grammar/types/"
      - "grammar/memory/"
      - "grammar/expressions/"
      - "grammar/functions/"
      - "grammar/statements/"
      - "grammar/effects/"
      - "grammar/resources/"
      - "grammar/policies/"
      - "grammar/security/"
      - "grammar/classical/"
      - "grammar/data/"
      - "grammar/concurrency/"
      - "grammar/distributed/"
      - "grammar/networking/"
      - "grammar/hardware/"
      - "grammar/quantum/"
      - "grammar/hdl/"
      - "grammar/hybrid/"
      - "grammar/ai/"
      - "grammar/execution/"
      - "grammar/compile/"
      - "grammar/interoperability/"
      - "grammar/dialects/"
      - "grammar/macros/"
      - "grammar/metaprogramming/"

  "grammar/antlr/ZamaniLexer.g4":
    exports:
      - "canonical Zamani token vocabulary"
    consumes:
      - "grammar/lexer/lexer.g4"

# =============================================================================
# 51. DOMAIN EXPORT MATRIX
# =============================================================================

domain_export_matrix:

  classical:
    owner: "grammar/classical/"
    foundations:
      - "types"
      - "expressions"
      - "functions"
      - "memory"
      - "effects"
      - "resources"
    canonical_ir: "Classical IR"

  quantum:
    owner: "grammar/quantum/"
    foundations:
      - "types"
      - "expressions"
      - "effects"
      - "resources"
      - "capabilities"
      - "hardware"
      - "execution"
    canonical_ir: "quantum::ir"

  hdl:
    owner: "grammar/hdl/"
    foundations:
      - "types"
      - "memory"
      - "hardware"
      - "resources"
      - "execution"
    canonical_ir: "HDL/Hardware IR"

  hybrid:
    owner: "grammar/hybrid/"
    foundations:
      - "classical"
      - "quantum"
      - "hdl"
      - "hardware"
      - "effects"
      - "resources"
    canonical_ir: "canonical domain IR composition"

  ai:
    owner: "grammar/ai/"
    foundations:
      - "types"
      - "data"
      - "expressions"
      - "functions"
      - "effects"
      - "resources"
      - "concurrency"
      - "distributed"
      - "provenance"
    canonical_ir: "AI/domain semantic IR"

# =============================================================================
# 52. EXPORT STATUS MODEL
# =============================================================================

status_model:

  allowed:
    - "HISTORICAL"
    - "PROPOSED"
    - "PLANNED"
    - "EXPERIMENTAL"
    - "SPECIFIED"
    - "IMPLEMENTED"
    - "PARTIALLY_IMPLEMENTED"
    - "TESTED"
    - "STABLE"
    - "DEPRECATED"
    - "REJECTED"

  stable_requirements:
    - "single owner"
    - "resolved dependencies"
    - "documented consumers"
    - "AST mapping"
    - "semantic mapping"
    - "IR mapping where applicable"
    - "diagnostics"
    - "compatibility"
    - "source spans"
    - "hard-coding audit"
    - "target-independence audit"
    - "scalability audit"
    - "conformance tests"
    - "negative tests"
    - "ambiguity validation"
    - "reachability validation"
    - "safe Rust integration"

  rule: >
    A grammar export MUST NOT be marked STABLE merely because its grammar rule
    parses successfully.

# =============================================================================
# 53. FREEZE CONTRACT
# =============================================================================

freeze:

  export_is_freezable_only_when:

    ownership:
      - "exactly one owner"
      - "ownership agrees with ownership.yaml"
      - "ownership agrees with OWNERSHIP.yaml"

    dependencies:
      - "all mandatory dependencies resolve"
      - "dependency graph remains acyclic"
      - "dependency status is sufficient"

    grammar:
      - "rule reachable"
      - "rule unambiguous"
      - "precedence defined"
      - "no accidental duplicate concept"
      - "no hidden export"

    AST:
      - "AST mapping exists"
      - "source span behavior exists"
      - "stable node identity exists"

    semantics:
      - "semantic meaning defined"
      - "type behavior defined where applicable"
      - "effects defined where applicable"
      - "capabilities defined where applicable"
      - "resources defined where applicable"
      - "contracts defined where applicable"
      - "policies defined where applicable"
      - "provenance defined where applicable"

    IR:
      - "canonical IR mapping exists where applicable"
      - "no competing frontend IR"
      - "no vendor-specific direct lowering"

    diagnostics:
      - "diagnostic identity exists"
      - "failure stage is defined"
      - "diagnostic is deterministic"

    compatibility:
      - "version identity exists"
      - "migration behavior exists where required"
      - "deprecation behavior exists where required"

    scalability:
      - "no universal finite capacity"
      - "symbolic scale supported where applicable"
      - "resource negotiation defined where applicable"

    safety:
      - "safe Rust implementation"
      - "no unsafe requirement"

    tests:
      - "positive test"
      - "negative test"
      - "boundary test"
      - "integration test"
      - "conformance test"

  downstream_reedit_rule:
    rule: >
      A frozen export MUST NOT require semantic re-edit solely because a
      downstream compiler, backend, runtime, target, accelerator, device,
      dialect, or future realization is added.

# =============================================================================
# 54. AUTOMATED VALIDATION CONTRACT
# =============================================================================

validation:

  ownership:
    checks:
      - "every public export has one owner"
      - "owner path exists"
      - "owner agrees with ownership.yaml"
      - "no duplicate canonical owner"

  dependencies:
    checks:
      - "every consumer is legal"
      - "every dependency is declared"
      - "no cycle"
      - "no hidden import"

  grammar:
    checks:
      - "all exported rules resolve"
      - "all public entries are reachable"
      - "no unreachable public export"
      - "no ambiguous public export"
      - "no duplicate public export"

  AST:
    checks:
      - "every semantic export has AST mapping"
      - "source span is preserved"
      - "mapping is stable"

  semantics:
    checks:
      - "every semantic export has semantic owner"
      - "semantic status is tracked"

  IR:
    checks:
      - "every lowering-relevant export has canonical IR mapping"
      - "no direct vendor IR mapping"
      - "quantum maps through quantum::ir"

  portability:
    checks:
      - "no physical capacity constants"
      - "no target-specific universal syntax"
      - "no vendor lock-in in core exports"

  safety:
    checks:
      - "Rust version >= 1.97"
      - "Rust 2021"
      - "unsafe forbidden"

# =============================================================================
# 55. CI INTEGRATION
# =============================================================================

ci:

  mandatory:

    contract_validation:
      - "validate YAML"
      - "validate schema"
      - "validate ownership"
      - "validate dependencies"
      - "validate exports"
      - "validate consumers"
      - "validate AST mappings"
      - "validate semantic mappings"
      - "validate IR mappings"

    grammar_validation:
      - "ANTLR generation"
      - "lexer validation"
      - "parser validation"
      - "reachability"
      - "ambiguity"
      - "precedence"
      - "duplicate token detection"
      - "hard-coding audit"

    rust_validation:
      - "cargo check"
      - "cargo test"
      - "cargo clippy"
      - "unsafe-policy validation"

    conformance:
      - "lexical"
      - "parser"
      - "AST"
      - "semantic"
      - "IR"
      - "compatibility"
      - "portability"
      - "scalability"

  release_rule:
    rule: >
      A production release MUST NOT mark an export STABLE while any mandatory
      validation gate is failed or unverified.

# =============================================================================
# 56. REQUIRED CROSS-CONTRACT CONSISTENCY
# =============================================================================

cross_contract_consistency:

  ownership:
    source: "grammar/contracts/ownership.yaml"
    requirement: >
      Every export owner in this file MUST exist in the ownership contract.

  dependencies:
    source: "grammar/contracts/dependencies.yaml"
    requirement: >
      Every declared consumer/dependency MUST be legal under the dependency
      DAG.

  manifest:
    source: "grammar/MANIFEST.yaml"
    requirement: >
      Every exported grammar file MUST be represented in the repository
      inventory.

  status:
    source: "grammar/STATUS.yaml"
    requirement: >
      Export lifecycle status MUST agree with repository status.

  ast:
    source: "grammar/contracts/ast-mappings.yaml"
    requirement: >
      Every export with ast.required=true MUST have a matching AST mapping.

  semantic:
    source: "grammar/contracts/semantic-mappings.yaml"
    requirement: >
      Every export with semantic.required=true MUST have a matching semantic
      mapping.

  ir:
    source: "grammar/contracts/ir-mappings.yaml"
    requirement: >
      Every export with ir.required=true MUST have a matching IR mapping.

  diagnostics:
    source: "grammar/contracts/diagnostics.yaml"
    requirement: >
      Every export with diagnostics.required=true MUST have a matching
      diagnostic identity.

  compatibility:
    source: "grammar/contracts/compatibility.yaml"
    requirement: >
      Every stable export MUST have a compatibility identity.

# =============================================================================
# 57. GENERATED INDEX RULE
# =============================================================================

generated_index:

  purpose: >
    Provide a complete machine-generated list of all leaf exports without
    requiring this contract to become a second grammar-definition authority.

  source_of_truth:
    - "individual grammar file export declarations"
    - "grammar/contracts/exports.yaml"
    - "grammar/contracts/ownership.yaml"
    - "grammar/MANIFEST.yaml"

  generated_outputs:
    - "grammar/generated/exports-index.yaml"

  rule: >
    generated/exports-index.yaml is derived output and MUST NOT be edited as
    an independent authority.

  synchronization:
    required: true

  stale_generated_index:
    severity: "error"

# =============================================================================
# 58. LEAF FILE REQUIREMENT
# =============================================================================

leaf_file_export_requirement:

  every_grammar_file:
    required_metadata:
      - "purpose"
      - "status"
      - "authority"
      - "owns"
      - "does_not_own"
      - "imports"
      - "exports"
      - "consumers"
      - "ast_owner"
      - "semantic_owner"
      - "ir_owner"
      - "diagnostic_owner"
      - "test_owner"
      - "compatibility_contract"
      - "scalability_contract"
      - "poco_reaf_contract"
      - "hard_coding_audit"
      - "freeze_criteria"

  rule: >
    A grammar file cannot be frozen while its export metadata is absent or
    inconsistent with this contract.

# =============================================================================
# 59. NO-DOWNSTREAM-REEDIT GUARANTEE
# =============================================================================

downstream_reedit_guarantee:

  principle: >
    A correctly frozen export is an interface, not a provisional implementation
    detail.

  allowed_downstream_changes:
    - "new compiler backend"
    - "new target"
    - "new device"
    - "new accelerator"
    - "new QPU"
    - "new FPGA"
    - "new ASIC"
    - "new simulator"
    - "new runtime"
    - "new scheduler"
    - "new router"
    - "new optimization"
    - "new deployment environment"
    - "new dialect that does not redefine stable core semantics"

  prohibited_effect:
    rule: >
      None of the above may require modifying a correctly frozen source grammar
      export merely to make the new realization possible.

# =============================================================================
# 60. RESOURCE AVAILABILITY MODEL
# =============================================================================

resource_availability:

  source:
    expresses:
      - "minimum requirements"
      - "maximum permitted usage when explicitly requested"
      - "preferences"
      - "constraints"
      - "capability requirements"
      - "topology requirements"
      - "fallback policies"

  compiler:
    determines:
      - "candidate targets"
      - "capability matching"
      - "resource matching"
      - "specialization"
      - "lowering"
      - "routing"
      - "scheduling"

  runtime:
    determines:
      - "actual availability"
      - "dynamic state"
      - "recovery"
      - "execution"

  rule: >
    Resource availability MUST remain outside the universal grammar's physical
    capacity model.

# =============================================================================
# 61. PORTABILITY GUARANTEE
# =============================================================================

portability:

  source_program:
    invariant: >
      A valid program describes semantic computation and portable realization
      requirements rather than one mandatory physical implementation.

  target_variation:
    allowed:
      - "machine size"
      - "CPU architecture"
      - "GPU architecture"
      - "FPGA architecture"
      - "ASIC architecture"
      - "accelerator architecture"
      - "QPU architecture"
      - "simulator"
      - "HPC system"
      - "cluster"
      - "future realization"

  semantic_preservation:
    required: true
    rule: >
      Where the program declares semantic equivalence requirements, target
      realization MUST preserve them or explicitly reject the realization.

# =============================================================================
# 62. FINAL ACCEPTANCE CRITERIA
# =============================================================================

acceptance:

  exports_yaml_complete_when:

    authority:
      - "authority chain is explicit"
      - "no competing export authority exists"

    ownership:
      - "every public export has one owner"

    composition:
      - "root exports are explicit"
      - "domain exports are explicit"
      - "leaf export metadata is machine-checkable"

    consumers:
      - "all public consumers are declared"

    AST:
      - "all applicable exports have AST mappings"

    semantic:
      - "all semantic exports have semantic mappings"

    IR:
      - "all lowering-relevant exports have canonical IR mappings"

    diagnostics:
      - "all applicable exports have diagnostic contracts"

    compatibility:
      - "all stable exports are versioned"

    scalability:
      - "no universal finite capacity is exported"

    portability:
      - "no physical target is required by universal syntax"

    POCO_REAF:
      - "portable meaning is separated from realization"

    safety:
      - "Rust 1.97+"
      - "Rust 2021"
      - "unsafe forbidden"

    tests:
      - "positive coverage"
      - "negative coverage"
      - "integration coverage"
      - "scalability coverage"
      - "portability coverage"

  repository_freeze_dependency:
    rule: >
      exports.yaml itself may be frozen before the entire grammar tree, but
      the complete grammar directory MUST NOT be declared FROZEN until every
      exported production has satisfied its applicable downstream contracts.

# =============================================================================
# 63. CURRENT REPOSITORY INTEGRATION STATE
# =============================================================================

current_state:

  contract_status: "SPECIFIED"

  repository_status: "AUDIT_REQUIRED"

  production_ready: false

  reason: >
    This export contract defines the production boundary, but production
    readiness requires repository-wide validation of every concrete grammar
    export against ownership, dependency, AST, semantic, IR, diagnostic,
    compatibility, path, ambiguity, hard-coding, safety and conformance
    contracts.

  important_existing_implementation_observation:
    ast:
      owner: "src/ast/mod.rs"
      rule: >
        The current AST contains many established variants and also contains
        domain-specific and historical implementation constructs. These MUST
        be reconciled against the canonical domain-neutral AST contract before
        corresponding grammar exports can be marked STABLE.

    unsafe:
      rule: >
        The current AST includes an Unsafe statement variant. This export
        contract does not authorize unsafe Rust implementation. Source-language
        safety semantics and Rust implementation safety are separate concerns;
        the repository's production policy requires safe Rust implementation.

    fixed_widths:
      rule: >
        Existing implementation-level integer and floating-point widths MUST
        NOT be interpreted as universal Zamani machine limits. Source-level
        fixed-width numeric types, where intentionally specified, are semantic
        types; implementation representation remains downstream.

  next_validation_stage:
    name: "EXPORT_CLOSURE_AUDIT"
    required_inputs:
      - "grammar/MANIFEST.yaml"
      - "grammar/OWNERSHIP.yaml"
      - "grammar/contracts/ownership.yaml"
      - "grammar/contracts/dependencies.yaml"
      - "grammar/contracts/exports.yaml"
      - "grammar/contracts/ast-mappings.yaml"
      - "grammar/contracts/semantic-mappings.yaml"
      - "grammar/contracts/ir-mappings.yaml"
      - "grammar/contracts/diagnostics.yaml"
      - "grammar/contracts/compatibility.yaml"
      - "grammar/STATUS.yaml"

# =============================================================================
# 64. NON-NEGOTIABLE INVARIANTS
# =============================================================================

invariants:

  one_language:
    rule: >
      Classical, quantum, HDL, AI, data, distributed, networking, hardware,
      accelerator and future computational domains remain domains of one
      language.

  one_lexer:
    rule: >
      One public lexer boundary exists.

  one_parser:
    rule: >
      One public parser boundary and one complete-program root exist.

  one_ast:
    rule: >
      Source constructs pass through the canonical frontend AST architecture.

  one_semantic_model:
    rule: >
      Domain semantics integrate through the common semantic validation model.

  canonical_ir:
    rule: >
      Canonical domain IRs are downstream of semantic meaning.

  one_owner:
    rule: >
      Every public export has exactly one canonical owner.

  no_hidden_capacity:
    rule: >
      No universal source-language export may hide a finite physical capacity.

  no_target_leakage:
    rule: >
      Universal exports cannot depend on a particular physical target.

  no_backend_upstream:
    rule: >
      Backend implementation details cannot become grammar dependencies.

  no_runtime_upstream:
    rule: >
      Runtime state cannot become grammar dependencies.

  no_test_upstream:
    rule: >
      Tests cannot become grammar dependencies.

  no_unsafe:
    rule: >
      Rust implementation remains safe-only.

  explicit_fallback:
    rule: >
      Fallback behavior must be explicitly authorized and semantically
      validated.

  stable_interfaces:
    rule: >
      Frozen exports remain valid interfaces when downstream targets and
      implementations evolve.

  open_world:
    rule: >
      New resources, capabilities, devices, operations and target types can be
      introduced without changing the fundamental universal grammar merely to
      encode their finite physical properties.

