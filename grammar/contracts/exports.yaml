    - "generate"
    - "interface"
    - "protocol"
    - "stateMachine"
    - "assertion"
    - "verification"
    - "synthesisIntent"
    - "physicalIntent"

  scalability:
    rule: >
      Widths, depths, lane counts, register counts, memory capacities,
      pipeline depths, clock counts and device counts are source parameters or
      target properties, never universal grammar ceilings.

  ast:
    required: true

  semantic:
    required: true
    owner: "HDL/hardware semantic implementation"

  ir:
    required: true
    canonical_boundary: "HDL/Hardware IR"

# =============================================================================
# 30. HYBRID EXPORTS
# =============================================================================

hybrid_exports:

  owner: "grammar/hybrid/"

  canonical:
