    - "actor"
    - "channel"
    - "parallelRegion"
    - "pipeline"
    - "synchronization"
    - "collective"
    - "workDistribution"

  realization_rule: >
    Source-level concurrency expresses computation semantics. It MUST NOT
    require the programmer to select a physical thread, core, GPU lane, or
    cluster node unless explicitly requested as a semantic constraint.

  ast:
    required: true

  semantic:
    required: true

  ir:
    required: true
    canonical_boundary: "Classical IR / distributed semantic IR / domain IR"

# =============================================================================
# 25. DISTRIBUTED EXPORTS
# =============================================================================

distributed_exports:

  owner: "grammar/distributed/"

  canonical:
    - "node"
