    - "service"
    - "topology"
    - "placement"
    - "partition"
    - "replication"
    - "consistency"
    - "faultTolerance"
    - "remoteExecution"

  scalability:
    rule: >
      Node count, process count, message count, channel count and topology
      size are open-world resource properties and MUST NOT be universal
      grammar limits.

  ast:
    required: true

  semantic:
    required: true

  ir:
    required: true
    canonical_boundary: "distributed semantic IR / canonical domain IR"

# =============================================================================
# 26. NETWORKING EXPORTS
# =============================================================================

networking_exports:

  owner: "grammar/networking/"

  canonical:
    - "address"
    - "endpoint"
    - "channel"
    - "message"
    - "request"
    - "response"
    - "service"
    - "route"
    - "protocol"
    - "stream"
    - "socket"
    - "discovery"
    - "networkCapability"

  rule: >
    Networking exports describe network semantics and intent. They MUST NOT
    define a finite universal network topology.

  ast:
    required: true

  semantic:
    required: true

  ir:
    required: true
    canonical_boundary: "network/domain semantic IR"

# =============================================================================
# 27. HARDWARE EXPORTS
# =============================================================================

hardware_exports:

  owner: "grammar/hardware/"

  canonical_families:
    - "hardwareCapability"
    - "hardwareResource"
    - "hardwareTopology"
    - "hardwareMemory"
    - "hardwareTiming"
    - "hardwarePower"
    - "hardwareThermal"
    - "hardwareReliability"
    - "hardwarePlacement"
    - "hardwareNegotiation"

  ownership_boundary:
    grammar:
      owns:
        - "hardware intent"
        - "capability references"
        - "abstract resources"
        - "abstract topology"
        - "placement intent"
        - "timing intent"
        - "reliability requirements"

    compiler:
      owns:
        - "target discovery"
        - "target matching"
        - "lowering"
        - "specialization"

    runtime:
      owns:
        - "live device state"
        - "telemetry"
        - "calibration"
        - "execution state"

  forbidden:
    - "physical device inventory in universal grammar"
    - "vendor-specific hardware as universal grammar requirement"
    - "fixed device counts"
    - "fixed memory capacities"
    - "fixed bus widths"
    - "fixed topology sizes"

  ast:
    required: true

  semantic:
    required: true

  ir:
    required: true
    canonical_boundary: "HDL/Hardware IR or domain canonical IR"

# =============================================================================
# 28. QUANTUM EXPORTS
# =============================================================================

quantum_exports:

  owner: "grammar/quantum/"

  canonical_families:

    operation:
      exports:
        - "quantumOperation"
        - "operationSpecifier"
        - "operationTargetList"
        - "operationParameterList"
        - "operationAttributeList"
        - "operationModifierList"

    operation_specifier:
      allowed:
        - "builtin"
        - "custom"
        - "vendor"
        - "parameterized"
        - "dialect"
        - "future"

    state:
      exports:
        - "quantumState"
        - "logicalQubit"
        - "quantumRegister"

    control:
      exports:
        - "quantumControl"
        - "controlledOperation"
        - "adjointOperation"
        - "inverseOperation"

    measurement:
      exports:
        - "quantumMeasurement"
        - "measurementResult"
        - "midCircuitMeasurement"
        - "feedForward"

    channels:
      exports:
        - "quantumChannel"
        - "noiseModel"
        - "noiseParameter"

    observable:
      exports:
        - "observable"
        - "expectation"

    dynamic:
      exports:
        - "dynamicCircuit"
        - "conditionalQuantumOperation"
        - "classicalFeedForward"

    error_correction:
      exports:
        - "errorCorrectionRequirement"
        - "logicalCode"
        - "codeDistance"
        - "syndrome"
        - "decoderRequirement"
        - "faultToleranceRequirement"

    pulse:
      exports:
        - "pulse"
        - "pulseParameter"
        - "timingRequirement"

  critical_rule:
    finite_operation_catalogue_forbidden: true
    rule: >
      Quantum grammar MUST NOT require a permanently enumerated universal
      catalogue of gate names. New operations MUST be representable through
      the generic operationSpecifier contract and registered through
      appropriate metadata or dialect mechanisms.

  physical_separation:
    logical_semantics:
      owner: "grammar/quantum/"
    physical_mapping:
      owner: "compiler/lowering/routing"
    calibration:
      owner: "runtime/HAL"
    physical_qubits:
      owner: "target realization"

  ast:
    required: true
    owner: "domain-neutral AST plus quantum semantic extensions where required"

  semantic:
    required: true
    owner: "quantum semantic implementation"

  ir:
    required: true
    canonical_boundary: "quantum::ir"

  resilience:
    required: true
    rule: >
      Quantum source semantics may express resilience requirements but MUST
      not encode physical QPU limits.

# =============================================================================
# 29. HDL EXPORTS
# =============================================================================

hdl_exports:

  owner: "grammar/hdl/"

  canonical_families:
    - "hdlModule"
    - "port"
