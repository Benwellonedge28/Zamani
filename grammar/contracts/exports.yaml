    - "executionIntent"
    - "dispatch"
    - "placement"
    - "scheduleIntent"
    - "adaptiveExecution"
    - "simulation"
    - "parallelExecution"
    - "distributedExecution"
    - "checkpoint"
    - "recovery"
    - "resilience"
    - "timeline"
    - "observation"
    - "profiling"
    - "tracing"
    - "lifecycle"
    - "fallback"

  boundary:
    grammar_owns:
      - "execution intent"
      - "portable execution constraints"
      - "fallback declarations"
      - "adaptation intent"

    compiler_owns:
      - "scheduling"
      - "lowering"
      - "placement realization"
      - "target specialization"

    runtime_owns:
      - "live execution state"
      - "recovery execution"
      - "telemetry"
      - "device interaction"

  ast:
    required: true

  semantic:
    required: true

  ir:
    required: true
