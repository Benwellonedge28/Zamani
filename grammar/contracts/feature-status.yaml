    name: "Learning"
    category: "ai"
    owner: "grammar/ai/"
    lifecycle: "SPECIFIED"
    syntax: "SPECIFIED"
    lexer: "SPECIFIED"
    ast: "SPECIFIED"
    semantic: "SPECIFIED"
    ir: "SPECIFIED"
    diagnostics: "SPECIFIED"
    compatibility: "SPECIFIED"
    conformance: "NOT_TESTED"
    freeze: "NOT_ELIGIBLE"
    dependencies:
      - "domain.ai"
      - "domain.data"
      - "semantic.effects"
      - "semantic.resources"
      - "semantic.policies"
    consumers:
      - "learning semantic subsystem"
      - "compiler"
      - "runtime"
    scalability:
      mode: "OPEN_ENDED"
    poco_reaf:
      participates: true
    hard_coding_audit:
      status: "REQUIRED"
      finite_capacity_allowed: false
    status_reason: "Learning algorithms must remain extensible rather than grammar-enumerated."

  - id: "ai.adaptation"
    name: "Controlled adaptive computation"
    category: "ai"
    owner: "grammar/execution/"
    lifecycle: "SPECIFIED"
    syntax: "SPECIFIED"
    lexer: "SPECIFIED"
    ast: "SPECIFIED"
    semantic: "SPECIFIED"
    ir: "SPECIFIED"
    diagnostics: "SPECIFIED"
    compatibility: "SPECIFIED"
    conformance: "NOT_TESTED"
    freeze: "NOT_ELIGIBLE"
    dependencies:
      - "semantic.effects"
      - "semantic.resources"
      - "semantic.capabilities"
      - "semantic.policies"
      - "semantic.security"
      - "semantic.provenance"
    consumers:
      - "execution"
      - "compiler"
      - "runtime"
    scalability:
      mode: "OPEN_ENDED"
    poco_reaf:
      participates: true
    hard_coding_audit:
      status: "REQUIRED"
      finite_capacity_allowed: false
    safety:
      unrestricted_self_modification: false
      authorization_required: true
      policy_required: true
      provenance_required: true
    status_reason: >
      Adaptation must be controlled semantic adaptation, never an unrestricted
      self-modification escape from validation.

  # ---------------------------------------------------------------------------
  # INTEROPERABILITY / DIALECTS / METAPROGRAMMING
  # ---------------------------------------------------------------------------

  - id: "domain.interoperability"
    name: "FFI, ABI and external representations"
    category: "interoperability"
    owner: "grammar/interoperability/"
    lifecycle: "SPECIFIED"
    syntax: "SPECIFIED"
    lexer: "SPECIFIED"
    ast: "SPECIFIED"
    semantic: "SPECIFIED"
    ir: "SPECIFIED"
    diagnostics: "SPECIFIED"
    compatibility: "SPECIFIED"
    conformance: "NOT_TESTED"
    freeze: "NOT_ELIGIBLE"
    dependencies:
      - "language.types"
      - "language.functions"
      - "semantic.effects"
      - "semantic.security"
    consumers:
      - "compiler"
      - "linker"
      - "runtime"
    scalability:
      mode: "OPEN_ENDED"
    poco_reaf:
      participates: true
    hard_coding_audit:
      status: "REQUIRED"
      finite_capacity_allowed: false
    status_reason: >
      Foreign interfaces must remain explicit boundaries and must not become
      competing semantic authorities.

  - id: "domain.dialects"
    name: "Controlled language dialects"
    category: "dialects"
    owner: "grammar/dialects/"
    lifecycle: "SPECIFIED"
    syntax: "SPECIFIED"
    lexer: "SPECIFIED"
    ast: "SPECIFIED"
    semantic: "SPECIFIED"
    ir: "SPECIFIED"
    diagnostics: "SPECIFIED"
    compatibility: "SPECIFIED"
    conformance: "NOT_TESTED"
    freeze: "NOT_ELIGIBLE"
    dependencies:
      - "language.modules"
      - "semantic.capabilities"
      - "semantic.resources"
      - "compatibility"
    consumers:
      - "interoperability"
      - "compiler"
    scalability:
      mode: "OPEN_ENDED"
    poco_reaf:
      participates: true
    hard_coding_audit:
      status: "REQUIRED"
      finite_capacity_allowed: false
    rules:
      - "dialect identity is versioned"
      - "dialect ownership is explicit"
      - "dialect dependencies are explicit"
      - "dialect cannot silently redefine stable core semantics"
      - "dialect cannot create a competing parser root"
    status_reason: "Dialect architecture must remain controlled extensibility, not language fragmentation."

  - id: "domain.metaprogramming"
    name: "Macros and metaprogramming"
    category: "metaprogramming"
    owner: "grammar/metaprogramming/"
    lifecycle: "SPECIFIED"
    syntax: "SPECIFIED"
    lexer: "SPECIFIED"
    ast: "SPECIFIED"
    semantic: "SPECIFIED"
    ir: "SPECIFIED"
    diagnostics: "SPECIFIED"
    compatibility: "SPECIFIED"
    conformance: "NOT_TESTED"
    freeze: "NOT_ELIGIBLE"
    dependencies:
      - "language.expressions"
      - "language.types"
      - "semantic.effects"
      - "semantic.capabilities"
      - "semantic.policies"
      - "semantic.security"
    consumers:
      - "compile"
      - "compiler"
    scalability:
      mode: "OPEN_ENDED"
    poco_reaf:
      participates: true
    hard_coding_audit:
      status: "REQUIRED"
      finite_capacity_allowed: false
    safety:
      semantic_validation_bypass: false
      unrestricted_reflection: false
    status_reason: "Metaprogramming must remain subject to semantic validation and policy."

  # ---------------------------------------------------------------------------
  # COMPATIBILITY
  # ---------------------------------------------------------------------------

  - id: "language.compatibility"
    name: "Language and grammar compatibility"
    category: "compatibility"
    owner: "grammar/compatibility/"
    lifecycle: "SPECIFIED"
    syntax: "NOT_APPLICABLE"
    lexer: "NOT_APPLICABLE"
    ast: "NOT_APPLICABLE"
    semantic: "SPECIFIED"
    ir: "SPECIFIED"
    diagnostics: "SPECIFIED"
    compatibility: "SPECIFIED"
    conformance: "NOT_TESTED"
    freeze: "NOT_ELIGIBLE"
    dependencies:
      - "all production feature contracts"
    consumers:
      - "compiler"
      - "artifact reader"
      - "migration tooling"
      - "runtime"
    scalability:
      mode: "OPEN_ENDED"
    poco_reaf:
      participates: true
      critical: true
    hard_coding_audit:
      status: "REQUIRED"
      finite_capacity_allowed: false
    status_reason: >
      Compatibility must be finalized only after language features and their
      cross-layer mappings have been audited.

# =============================================================================
# 11. RESOURCE/CAPACITY SAFETY CONTRACT
# =============================================================================

scalability:

  model: "OPEN_ENDED_RESOURCE_BOUNDED"

  principle: >
    Zamani expresses computations and requirements without imposing artificial
    universal finite capacity ceilings.

  valid_constraints:
    - "program-defined constants"
    - "symbolic resource requirements"
    - "target-provided capabilities"
    - "runtime availability"
    - "explicit resource budgets"
    - "explicit deployment policies"
    - "physical feasibility constraints"

  invalid_constraints:
    - "universal maximum qubits"
    - "universal maximum CPUs"
    - "universal maximum GPUs"
    - "universal maximum FPGAs"
    - "universal maximum nodes"
    - "universal maximum memory"
    - "universal maximum threads"
    - "universal maximum register width"
    - "universal maximum tensor rank"
    - "universal maximum network size"
    - "universal maximum device count"

  forbidden_identifiers:
    - "MAX_QUBITS"
    - "MAX_CPUS"
    - "MAX_CORES"
    - "MAX_THREADS"
    - "MAX_GPUS"
    - "MAX_FPGAS"
    - "MAX_ASICS"
    - "MAX_QPUS"
    - "MAX_NODES"
    - "MAX_MEMORY"
    - "MAX_STORAGE"
    - "MAX_REGISTER_WIDTH"
    - "MAX_VECTOR_WIDTH"
    - "MAX_TENSOR_RANK"
    - "MAX_TENSOR_DIMENSION"
    - "MAX_NETWORK_SIZE"
    - "MAX_DEVICE_COUNT"
    - "MAX_ACCELERATOR_COUNT"
    - "MAX_AGENT_COUNT"
    - "MAX_GATE_COUNT"
    - "MAX_CIRCUIT_DEPTH"

  disguised_limits:
    forbidden: true
    rule: >
      A finite universal capacity remains forbidden when encoded through aliases,
      enums, array bounds, token enumerations, grammar repetition bounds,
      hidden constants, vendor assumptions, or equivalent mechanisms.

  canonical_examples:
    - "requires qubits >= required_qubits"
    - "requires memory >= required_memory"
    - 'requires capability("quantum.measurement")'
    - 'requires capability("gpu.compute")'
    - 'requires capability("tensor.compute")'
    - "requires topology(required_topology)"

  rule: >
    Actual physical availability is determined outside the universal grammar by
    capability discovery, resource negotiation, lowering, scheduling, deployment,
    and runtime realization.

# =============================================================================
# 12. POCO-REAF FEATURE STATUS CONTRACT
# =============================================================================

poco_reaf:

  architectural_status: "REQUIRED"

  dimensions:

    program_once:
      required: true
      rule: >
        Changing machine scale or hardware class must not require rewriting
        portable program semantics merely to accommodate the target.

    compile_once:
      required: true
      rule: >
        The portable artifact must preserve semantic identity, language version,
        feature set, resource requirements, capabilities, constraints,
        preferences, policies, effects, provenance, and target-independent
        representation.

    run_everywhere:
      required: true
      rule: >
        Realization must be selected from available capabilities and resources.

    anywhere:
      required: true
      rule: >
        Unsupported targets must produce explicit incompatibility diagnostics or
        use explicitly authorized semantic fallbacks.

    forever:
      required: true
      rule: >
        Long-term preservation requires stable language, AST, semantic, IR,
        dialect, artifact, compatibility, and migration contracts.

  forbidden:
    - "silent semantic substitution"
    - "silent approximation"
    - "hardware-specific universal syntax"
    - "vendor-specific mandatory source semantics"
    - "target-specific AST meaning"
    - "target-specific universal type meaning"

# =============================================================================
# 13. DOMAIN INTEGRATION RULES
# =============================================================================

domain_integration:

  classical:
    semantic_boundary: "canonical classical semantic model"
    canonical_ir: "Classical IR"
    hardware_realization_downstream: true

  quantum:
    semantic_boundary: "semantic quantum operation model"
    canonical_ir: "quantum::ir"
    hardware_realization_downstream: true
    routing_downstream: true
    scheduling_downstream: true
    QEC_downstream: true

  hdl:
    semantic_boundary: "hardware semantic model"
    canonical_ir: "HDL/Hardware IR"
    synthesis_downstream: true

  hybrid:
    semantic_boundary: "common semantic model plus domain composition"
    canonical_ir:
      - "Classical IR"
      - "quantum::ir"
      - "HDL/Hardware IR"

  ai:
    semantic_boundary: "common semantic model plus AI domain semantics"
    vendor_frameworks_downstream: true

  distributed:
    semantic_boundary: "common distributed semantic model"
    physical_node_assignment_downstream: true

  hardware:
    semantic_boundary: "hardware intent and capability requirements"
    physical_inventory_downstream: true

# =============================================================================
# 14. ROOT COMPOSITION STATUS
# =============================================================================

root_composition:

  parser_root:
    path: "grammar/antlr/ZamaniParser.g4"
    lifecycle: "SPECIFIED"
    rule: >
      Root parser composition MUST remain thin and MUST NOT become an
      independent owner of domain syntax.

  grammar_root:
    path: "grammar/Zamani.g4"
    lifecycle: "SPECIFIED"
    owns:
      - "program"
      - "source-unit composition"
      - "universal item dispatch"
      - "EOF"

    must_not_own:
      - "individual quantum operations"
      - "HDL semantics"
      - "AI semantics"
      - "hardware capacity"
      - "resource negotiation"
      - "backend implementation"
      - "runtime state"
      - "IR structures"

  freeze_rule: >
    Root composition cannot be FROZEN until all subordinate feature exports and
    their dependencies are frozen or explicitly exempted by the composition
    contract.

# =============================================================================
# 15. LEXICAL STATUS
# =============================================================================

lexical:

  authority:
    registry: "grammar/lexer/tokens.g4"
    public_boundary: "grammar/antlr/ZamaniLexer.g4"

  requirements:
    - "one token vocabulary"
    - "one owner per token"
    - "documented spelling"
    - "documented contextual behavior"
    - "documented compatibility behavior"
    - "documented tests"
    - "no domain-created competing token vocabulary"

  status_gate:
    duplicate_token: "BLOCK"
    undocumented_token: "BLOCK"
    conflicting_token_owner: "BLOCK"
    untested_stable_token: "BLOCK"

# =============================================================================
# 16. DUPLICATE-CONCEPT AUDIT
# =============================================================================

duplicate_concept_audit:

  purpose: >
    Prevent multiple files from accidentally defining the same semantic concept.

  known_candidates:
    -:
        - "grammar/expressions/closure.g4"
        - "grammar/expressions/closures.g4"
      action: "REQUIRE_EXPLICIT_DISTINCTION_OR_CANONICALIZE"

    -:
        - "grammar/expressions/lambda.g4"
        - "grammar/expressions/lambdas.g4"
      action: "REQUIRE_EXPLICIT_DISTINCTION_OR_CANONICALIZE"

    -:
        - "grammar/types/map.g4"
        - "grammar/types/map-types.g4"
      action: "REQUIRE_EXPLICIT_DISTINCTION_OR_CANONICALIZE"

    -:
        - "grammar/types/option.g4"
        - "grammar/types/option-types.g4"
      action: "REQUIRE_EXPLICIT_DISTINCTION_OR_CANONICALIZE"

    -:
        - "grammar/types/array.g4"
        - "grammar/types/array-types.g4"
      action: "REQUIRE_EXPLICIT_DISTINCTION_OR_CANONICALIZE"

    -:
        - "grammar/types/associated types.g4"
        - "grammar/types/functional dependencies.g4"
      action: "PATH_HYGIENE_AND_OWNERSHIP_AUDIT"

  rule: >
    Similar filenames are not automatically errors, but unexplained competing
    ownership is a production blocker.

# =============================================================================
# 17. PATH HYGIENE
# =============================================================================

path_hygiene:

  production_paths:
    require:
      - "stable path"
      - "portable filename"
      - "no accidental whitespace"
      - "no duplicate canonical path"
      - "case-consistent naming"
      - "manifest registration"

  suspicious_path_policy:
    whitespace_paths:
      status: "BLOCKED_UNTIL_EXPLICITLY_JUSTIFIED"

  rule: >
    A feature cannot become STABLE when its canonical source path is ambiguous,
    duplicated, malformed, or dependent on filesystem-specific behavior.

# =============================================================================
# 18. SOURCE-SPAN REQUIREMENT
# =============================================================================

source_spans:

  required_for:
    - "syntax errors"
    - "semantic diagnostics"
    - "type diagnostics"
    - "effect diagnostics"
    - "resource diagnostics"
    - "policy diagnostics"
    - "compatibility diagnostics"
    - "migration diagnostics"

  rule: >
    A production feature must preserve enough source-location information for
    deterministic diagnostics.

# =============================================================================
# 19. DIAGNOSTIC REQUIREMENT
# =============================================================================

diagnostics:

  every_feature:
    required:
      - "diagnostic ownership"
      - "failure stage"
      - "stable diagnostic identity where compatibility requires it"
      - "source location"
      - "deterministic behavior"

  invalid_feature_status:
    if_missing_diagnostics: "STABLE_FORBIDDEN"

# =============================================================================
# 20. COMPATIBILITY REQUIREMENT
# =============================================================================

compatibility:

  every_stable_feature:
    required:
      - "feature compatibility identity"
      - "language-version relationship"
      - "grammar-version relationship where applicable"
      - "AST-version relationship where applicable"
      - "semantic-version relationship where applicable"
      - "IR-version relationship where applicable"
      - "dialect-version relationship where applicable"
      - "deprecation behavior where applicable"
      - "migration behavior where applicable"

  breaking_change:
    requires:
      - "explicit classification"
      - "version change"
      - "diagnostics"
      - "migration guidance"
      - "conformance tests"

  target_change:
    language_version_change: false
    rule: >
      Adding a target, device, backend, accelerator, QPU, FPGA, ASIC, simulator,
      scheduler or runtime must not automatically change the language feature
      lifecycle.

# =============================================================================
# 21. FREEZE CONTRACT
# =============================================================================

freeze:

  not_eligible_if:
    - "owner unresolved"
    - "dependency unresolved"
    - "AST mapping missing"
    - "semantic mapping missing"
    - "IR mapping missing where required"
    - "diagnostics missing"
    - "compatibility missing"
    - "conformance failing"
    - "hard-coding audit failing"
    - "ambiguity unresolved"
    - "reachability unresolved"
    - "path ambiguity unresolved"
    - "unsafe Rust dependency"
    - "target leakage unresolved"

  ready:
    requires:
      - "all applicable production gates pass"
      - "lifecycle status is IMPLEMENTED or higher"
      - "compatibility is TESTED or STABLE"
      - "conformance is PASS"
      - "scalability verified"
      - "hard-coding verified"
      - "ownership verified"
      - "dependencies verified"

  frozen:
    requires:
      - "lifecycle == STABLE"
      - "freeze == FROZEN"
      - "all cross-contract references resolve"
      - "no known production blocker"

  downstream_reedit_rule:
    rule: >
      A frozen feature MUST NOT require semantic re-edit merely because a new
      backend, device, accelerator, QPU, FPGA, ASIC, simulator, scheduler,
      runtime, target, topology, or deployment environment is introduced.

# =============================================================================
# 22. VALIDATION AUTOMATION
# =============================================================================

validation:

  feature_identity:
    checks:
      - "unique feature ID"
      - "stable identifier"
      - "owner exists"
      - "owner is canonical"

  lifecycle:
    checks:
      - "allowed lifecycle value"
      - "lifecycle consistent with implementation dimensions"
      - "STABLE has all required gates"

  ownership:
    checks:
      - "exactly one owner"
      - "owner agrees with ownership contract"
      - "no duplicate owner"

  dependencies:
    checks:
      - "all dependencies declared"
      - "all dependencies resolve"
      - "no forbidden edge"
      - "no cycle"

  syntax:
    checks:
      - "grammar path exists"
      - "public export exists when required"
      - "ANTLR generation succeeds"
      - "no unresolved ambiguity"
      - "no unreachable production"

  ast:
    checks:
      - "mapping exists when required"
      - "mapping points to canonical AST"
      - "source spans preserved"

  semantic:
    checks:
      - "semantic mapping exists"
      - "semantic owner exists"
      - "domain does not create incompatible semantic universe"

  ir:
    checks:
      - "canonical IR mapping exists where applicable"
      - "no hidden frontend IR"
      - "no direct vendor IR"

  diagnostics:
    checks:
      - "diagnostic contract exists"
      - "diagnostic owner exists"
      - "failure stage exists"

  compatibility:
    checks:
      - "stable feature has compatibility identity"
      - "breaking changes are versioned"
      - "migration requirements are satisfied"

  scalability:
    checks:
      - "no forbidden capacity constant"
      - "no disguised capacity limit"
      - "resource requirements remain symbolic"
      - "target capacity remains downstream"

  safety:
    checks:
      - "Rust edition == 2021"
      - "Rust minimum >= 1.97"
      - "unsafe forbidden"
      - "unsafe implementation dependency rejected"

# =============================================================================
# 23. TEST REQUIREMENTS
# =============================================================================

tests:

  every_production_feature:
    required:
      - "positive"
      - "negative"
      - "boundary"
      - "diagnostic"
      - "integration"
      - "compatibility"
      - "scalability"
      - "determinism"

  applicable_features:
    ast:
      required: true

    semantic:
      required: true

    ir:
      required: true

    target_portability:
      required: true

  domain_tests:

    classical:
      required:
        - "scalar"
        - "collection"
        - "numeric"
        - "large symbolic problem"

    quantum:
      required:
        - "single logical qubit"
        - "multiple logical qubits"
        - "parameterized qubit count"
        - "generic operation"
        - "custom operation"
        - "parameterized operation"
        - "measurement"
        - "dynamic control"
        - "resource requirement"
        - "QEC intent"
      forbidden:
        - "universal maximum qubit test"

    hdl:
      required:
        - "module"
        - "ports"
        - "signals"
        - "registers"
        - "clock"
        - "reset"
        - "timing"
        - "parameterized width"
        - "synthesis intent"
      forbidden:
        - "universal fixed width"

    distributed:
      required:
        - "small topology"
        - "larger topology"
        - "abstract topology"
        - "resource negotiation"

    ai:
      required:
        - "inference"
        - "learning"
        - "reasoning"
        - "uncertainty"
        - "provenance"
        - "resource requirement"

# =============================================================================
# 24. SCALABILITY TEST MODEL
# =============================================================================

scalability_tests:

  principle: >
    The same source semantics should be testable across different realization
    scales without source rewriting merely to encode target size.

  dimensions:

    computation_size:
      values:
        - "symbolic"
        - "small"
        - "larger"
        - "resource-selected"

    machine_class:
      values:
        - "minimal"
        - "CPU"
        - "GPU"
        - "FPGA"
        - "ASIC"
        - "accelerator"
        - "QPU"
        - "simulator"
        - "HPC"
        - "cluster"
        - "distributed"
        - "future"

  rule: >
    These are test dimensions, not language-level capacity limits.

# =============================================================================
# 25. FEATURE PROMOTION RULES
# =============================================================================

promotion:

  proposed_to_planned:
    requires:
      - "design accepted"
      - "owner assigned"

  planned_to_specified:
    requires:
      - "normative specification"
      - "ownership"
      - "dependencies"
      - "AST/semantic design"

  specified_to_experimental:
    requires:
      - "implementation path"
      - "feature gate"
      - "diagnostics"
      - "tests"

  experimental_to_implemented:
    requires:
      - "implementation complete"
      - "AST complete"
      - "semantic complete"
      - "applicable IR complete"

  implemented_to_stable:
    requires:
      - "all production gates"
      - "compatibility"
      - "conformance"
      - "scalability"
      - "hard-coding audit"
      - "freeze readiness"

  deprecated:
    requires:
      - "replacement or removal strategy"
      - "compatibility behavior"
      - "migration guidance"
      - "diagnostics"

# =============================================================================
# 26. FEATURE DEMOTION RULES
# =============================================================================

demotion:

  stable_to_deprecated:
    allowed: true
    requires:
      - "compatibility policy"
      - "migration policy"
      - "deprecation diagnostics"

  stable_to_experimental:
    allowed: false
    rule: >
      A stable feature cannot be silently downgraded. Such a change requires
      explicit language-version governance.

  implemented_to_partial:
    allowed: true
    requires:
      - "documented regression"
      - "status update"
      - "conformance failure"

  any_to_rejected:
    allowed: true
    requires:
      - "explicit architectural rejection"
      - "compatibility analysis"

# =============================================================================
# 27. NO SILENT PROMOTION
# =============================================================================

promotion_safety:

  parser_presence:
    insufficient: true

  Rust_presence:
    insufficient: true

  tests_only:
    insufficient: true

  specification_only:
    insufficient: true

  implementation_only:
    insufficient: true

  rule: >
    No single layer can promote a feature to STABLE.

# =============================================================================
# 28. DOMAIN-SPECIFIC EXTENSIBILITY
# =============================================================================

extensibility:

  operations:
    rule: >
      New operations should be registered through data-driven specifications,
      dialects, metadata, semantic registries, or other explicit extension
      mechanisms instead of requiring universal grammar redesign.

  resources:
    rule: >
      New resource kinds must be expressible without changing universal grammar
      solely to encode finite target inventory.

  capabilities:
    rule: >
      New capabilities must be discoverable and negotiable downstream.

  targets:
    rule: >
      New targets must integrate through lowering, realization, HAL, runtime,
      and capability/resource negotiation.

  applications:
    rule: >
      Application-specific functionality belongs in libraries, dialects,
      capabilities, policies, services, or applications rather than universal
      grammar keywords.

# =============================================================================
# 29. APPLICATION-NEUTRALITY
# =============================================================================

application_neutrality:

  universal_grammar:
    must_not_require:
      - "specific business domain"
      - "specific application workflow"
      - "specific service provider"
      - "specific device vendor"
      - "specific operating system"
      - "specific hardware inventory"

  allowed_extension_mechanisms:
    - "library"
    - "dialect"
    - "capability"
    - "policy"
    - "service"
    - "application module"

# =============================================================================
# 30. ADAPTATION SAFETY
# =============================================================================

adaptation:

  semantic_definition:
    allowed:
      - "controlled adaptation"
      - "policy-directed adaptation"
      - "capability-directed adaptation"
      - "resource-directed adaptation"
      - "authorized optimization"

  required:
    - "authorization"
    - "policy"
    - "effect analysis"
    - "resource analysis"
    - "provenance"
    - "validation"

  forbidden:
    - "unrestricted self-modification"
    - "silent semantic mutation"
    - "validation bypass"
    - "policy bypass"
    - "provenance bypass"

# =============================================================================
# 31. DOMAIN-NEUTRAL AST RULE
# =============================================================================

ast_contract:

  principle: >
    Source syntax from every domain must pass through the canonical frontend
    AST architecture before domain-specific semantic realization.

  allowed_domain_extensions:
    - "explicit domain node"
    - "typed semantic metadata"
    - "domain-neutral operation representation"

  forbidden:
    - "backend object in source AST"
    - "physical device handle"
    - "live runtime state"
    - "scheduler state"
    - "calibration state"
    - "vendor SDK object"

# =============================================================================
# 32. CANONICAL IR RULE
# =============================================================================

ir_contract:

  principle: >
    Domain semantics may lower to canonical domain IRs only after common
    semantic validation.

  required_paths:

    classical:
      source: "Zamani syntax"
      ast: "domain-neutral AST"
      semantic: "classical semantic model"
      ir: "Classical IR"

    quantum:
      source: "Zamani syntax"
      ast: "domain-neutral AST"
      semantic: "semantic quantum model"
      ir: "quantum::ir"

    hdl:
      source: "Zamani syntax"
      ast: "domain-neutral AST"
      semantic: "HDL/hardware semantic model"
      ir: "HDL/Hardware IR"

  forbidden:
    - "source grammar -> vendor IR"
    - "source grammar -> device-specific IR"
    - "domain grammar -> hidden competing IR"

# =============================================================================
# 33. ROOT-TO-BACKEND TRACEABILITY
# =============================================================================

traceability:

  required_chain:
    - "source syntax"
    - "token"
    - "grammar rule"
    - "AST node"
    - "semantic construct"
    - "canonical IR"
    - "compiler consumer"
    - "runtime/backend consumer"
    - "tests"

  reverse_traceability:
    required_chain:
      - "backend requirement"
      - "canonical IR capability"
      - "semantic contract"
      - "AST representation"
      - "grammar representation"
      - "source syntax"

  rule: >
    A feature is not production-ready if either forward or reverse traceability
    is broken.

# =============================================================================
# 34. FREEZE ORDER
# =============================================================================

freeze_order:

  - stage: 0
    name: "Inventory and contract bootstrap"
    paths:
      - "grammar/MANIFEST.yaml"
      - "grammar/OWNERSHIP.yaml"
      - "grammar/DEPENDENCIES.yaml"
      - "grammar/STATUS.yaml"
      - "grammar/contracts/"
    status: "FIRST"

  - stage: 1
    name: "Authority and specification"
    paths:
      - "grammar/DESIGN.md"
      - "grammar/specification/"
      - "grammar/spec/"

  - stage: 2
    name: "Lexical foundation"
    paths:
      - "grammar/lexer/"
      - "grammar/antlr/ZamaniLexer.g4"

  - stage: 3
    name: "Core language"
    paths:
      - "grammar/core/"
      - "grammar/modules/"
      - "grammar/declarations/"

  - stage: 4
    name: "Types and memory"
    paths:
      - "grammar/types/"
      - "grammar/memory/"

  - stage: 5
    name: "Expressions, functions and statements"
    paths:
      - "grammar/expressions/"
      - "grammar/functions/"
      - "grammar/statements/"

  - stage: 6
    name: "Effects, resources, capabilities, contracts and policies"
    paths:
      - "grammar/effects/"
      - "grammar/resources/"
      - "grammar/policies/"
      - "grammar/security/"
      - "grammar/validation/"

  - stage: 7
    name: "Classical and data"
    paths:
      - "grammar/classical/"
      - "grammar/data/"

  - stage: 8
    name: "Concurrency, distributed and networking"
    paths:
      - "grammar/concurrency/"
      - "grammar/distributed/"
      - "grammar/networking/"

  - stage: 9
    name: "Hardware, execution and compilation"
    paths:
      - "grammar/hardware/"
      - "grammar/execution/"
      - "grammar/compile/"

  - stage: 10
    name: "Quantum"
    paths:
      - "grammar/quantum/"

  - stage: 11
    name: "HDL"
    paths:
      - "grammar/hdl/"

  - stage: 12
    name: "Hybrid"
    paths:
      - "grammar/hybrid/"

  - stage: 13
    name: "AI"
    paths:
      - "grammar/ai/"

  - stage: 14
    name: "Interoperability and dialects"
    paths:
      - "grammar/interoperability/"
      - "grammar/dialects/"

  - stage: 15
    name: "Macros and metaprogramming"
    paths:
      - "grammar/macros/"
      - "grammar/metaprogramming/"

  - stage: 16
    name: "Compatibility"
    paths:
      - "grammar/compatibility/"

  - stage: 17
    name: "Root parser composition"
    paths:
      - "grammar/antlr/ZamaniParser.g4"
      - "grammar/Zamani.g4"
    status: "LAST"

# =============================================================================
# 35. DIRECTORY FREEZE RULE
# =============================================================================

directory_freeze:

  feature_level:
    rule: >
      A directory may be frozen only when every public feature in that directory
      has a lifecycle record and every STABLE feature satisfies its production
      gates.

  grammar_level:
    rule: >
      grammar/ cannot be declared fully FROZEN while any required feature is
      missing ownership, dependency closure, AST mapping, semantic mapping,
      canonical IR mapping, diagnostics, compatibility, conformance,
      scalability validation, or hard-coding validation.

  root_last:
    rule: >
      Root grammar composition is frozen after subordinate contracts are closed.

# =============================================================================
# 36. CI REQUIREMENTS
# =============================================================================

ci:

  mandatory_checks:

    schema:
      - "YAML parse"
      - "schema validation"

    repository:
      - "manifest synchronization"
      - "ownership synchronization"
      - "dependency synchronization"
      - "status synchronization"

    grammar:
      - "ANTLR generation"
      - "lexer generation"
      - "parser generation"
      - "reachability"
      - "ambiguity"
      - "precedence"
      - "duplicate rule detection"
      - "duplicate token detection"

    frontend:
      - "lexer conformance"
      - "parser conformance"
      - "AST conformance"
      - "source-span conformance"

    semantic:
      - "type validation"
      - "effect validation"
      - "capability validation"
      - "resource validation"
      - "contract validation"
      - "policy validation"
      - "provenance validation"

    ir:
      - "canonical IR mapping validation"
      - "quantum::ir mapping validation"
      - "Classical IR mapping validation"
      - "HDL/Hardware IR mapping validation"

    portability:
      - "hard-coding audit"
      - "target-leakage audit"
      - "resource-model audit"
      - "fallback audit"

    compatibility:
      - "version validation"
      - "migration validation"
      - "deprecation validation"

    rust:
      - "Rust 2021 validation"
      - "minimum Rust >= 1.97"
      - "unsafe policy validation"
      - "cargo check"
      - "cargo test"
      - "cargo clippy"

# =============================================================================
# 37. SAFE RUST REQUIREMENT
# =============================================================================

rust_safety:

  minimum_version: "1.97"

  edition: "2021"

  unsafe_allowed: false

  prohibited:
    - "unsafe blocks"
    - "unsafe functions"
    - "unsafe traits"
    - "unsafe implementations"
    - "unsafe pointer operations"
    - "unsafe transmutation"
    - "unsafe generated grammar integration"

  rule: >
    A feature cannot be marked production-ready if its required Zamani frontend,
    parser integration, semantic implementation, or grammar-support tooling
    requires unsafe Rust.

# =============================================================================
# 38. DETERMINISM
# =============================================================================

determinism:

  required_for:
    - "lexer"
    - "parser"
    - "AST construction"
    - "semantic validation"
    - "feature status evaluation"
    - "compatibility resolution"
    - "diagnostic classification"

  forbidden_dependencies:
    - "filesystem ordering"
    - "wall-clock time"
    - "random state"
    - "live hardware state"
    - "mutable runtime state"
    - "network response ordering"

  rule: >
    Environmental information may influence realization downstream but must not
    silently alter the normative meaning or lifecycle status of a language
    feature.

# =============================================================================
# 39. STATUS SYNCHRONIZATION WITH grammar/STATUS.yaml
# =============================================================================

status_synchronization:

  source_of_feature_lifecycle:
    path: "grammar/contracts/feature-status.yaml"

  source_of_repository_lifecycle:
    path: "grammar/STATUS.yaml"

  rules:

    feature_to_repository:
      rule: >
        A repository cannot be STABLE while any mandatory feature required by
        the production language remains below STABLE or has a failed mandatory
        gate.

    repository_to_feature:
      rule: >
        Repository STABLE status does not automatically imply every feature is
        STABLE; each feature must retain its own lifecycle evidence.

    conflict:
      action: "BLOCK_RELEASE"

# =============================================================================
# 40. CURRENT REPOSITORY STATE
# =============================================================================

current_state:

  lifecycle: "SPECIFIED"

  production_ready: false

  freeze_allowed: false

  reason: >
    This file establishes the feature lifecycle contract, but the repository
    must still close concrete ownership, dependency, AST, semantic, IR,
    diagnostic, compatibility, path, ambiguity, hard-coding, Rust-safety and
    conformance audits before features can be promoted to STABLE.

  important_distinction: >
    This conservative state is intentional. Declaring the registry itself
    production-ready must not falsely declare the underlying grammar features
    production-ready.

# =============================================================================
# 41. REQUIRED NEXT AUDIT
# =============================================================================

next_audit:

  name: "FEATURE_CLOSURE_AUDIT"

  purpose: >
    Convert the repository's concrete grammar inventory into individual feature
    records without guessing implementation maturity.

  inputs:
    - "grammar/MANIFEST.yaml"
    - "grammar/OWNERSHIP.yaml"
    - "grammar/DEPENDENCIES.yaml"
    - "grammar/STATUS.yaml"
    - "grammar/contracts/ownership.yaml"
    - "grammar/contracts/dependencies.yaml"
    - "grammar/contracts/exports.yaml"
    - "grammar/contracts/ast-mappings.yaml"
    - "grammar/contracts/semantic-mappings.yaml"
    - "grammar/contracts/ir-mappings.yaml"
    - "grammar/contracts/diagnostics.yaml"
    - "grammar/contracts/compatibility.yaml"

  required_outputs:
    - "feature-to-file mapping"
    - "feature-to-owner mapping"
    - "feature dependency closure"
    - "feature AST closure"
    - "feature semantic closure"
    - "feature IR closure"
    - "feature diagnostic closure"
    - "feature compatibility closure"
    - "feature test closure"
    - "hard-coding violations"
    - "duplicate concepts"
    - "orphan features"
    - "unmapped exports"
    - "unreachable features"
    - "ambiguous features"
    - "path hygiene violations"

  prohibition: >
    The audit MUST NOT promote features merely because corresponding files exist
    or because the parser currently accepts their syntax.

# =============================================================================
# 42. FINAL PRODUCTION INVARIANTS
# =============================================================================

invariants:

  one_language:
    rule: >
      Classical, quantum, HDL, AI, data, distributed, networking, hardware,
      accelerator and future computational domains remain domains of one
      coherent language.

  one_feature_authority:
    rule: >
      Every feature has exactly one lifecycle record.

  one_owner:
    rule: >
      Every feature has exactly one canonical owner.

  one_lexer:
    rule: >
      One canonical public lexer boundary exists.

  one_parser:
    rule: >
      One canonical public parser boundary exists.

  one_ast_architecture:
    rule: >
      Source features use the canonical frontend AST architecture.

  common_semantics:
    rule: >
      Domains reuse common types, effects, resources, capabilities, contracts,
      policies, diagnostics and provenance.

  canonical_ir:
    rule: >
      Domain IRs are downstream of semantic validation.

  quantum_ir:
    rule: >
      quantum::ir remains the canonical quantum IR boundary.

  no_backend_upstream:
    rule: >
      Backend implementation details cannot become universal grammar semantics.

  no_runtime_upstream:
    rule: >
      Runtime state cannot become universal grammar semantics.

  no_target_leakage:
    rule: >
      Universal language features cannot require a particular physical target.

  no_capacity_ceiling:
    rule: >
      No artificial finite universal hardware or computational capacity may be
      encoded into the language architecture.

  symbolic_resources:
    rule: >
      Resource requirements remain expressible symbolically and are evaluated
      against actual available resources downstream.

  explicit_fallback:
    rule: >
      Fallback must be explicitly authorized and semantically validated.

  no_silent_approximation:
    rule: >
      A target cannot silently replace required semantics with an approximation
      unless the language contract explicitly permits that behavior.

  controlled_adaptation:
    rule: >
      Adaptive behavior remains subject to policy, capability, effects,
      resources, authorization, validation and provenance.

  safe_rust:
    rule: >
      Rust implementation uses Rust 2021 and Rust 1.97 or later without unsafe
      Rust.

  compatibility:
    rule: >
      Stable features have explicit version and migration behavior.

  freeze_integrity:
    rule: >
      A frozen feature remains semantically valid when downstream implementations
      evolve.

  future_extensibility:
    rule: >
      New devices, resources, capabilities, operations, dialects and computational
      domains can be added without encoding their finite physical properties
      into universal grammar.

# =============================================================================
# 43. FINAL ACCEPTANCE CRITERIA
# =============================================================================

acceptance:

  this_file:
    must:
      - "parse as YAML 1.2"
      - "have unique feature IDs"
      - "have deterministic lifecycle semantics"
      - "reference canonical repository contracts"
      - "not duplicate ownership authority"
      - "not duplicate dependency authority"
      - "not duplicate inventory authority"
      - "not claim unverified feature stability"

  feature:
    may_be_STABLE_only_when:
      - "owner verified"
      - "dependencies verified"
      - "syntax verified"
      - "AST verified where applicable"
      - "semantic verified where applicable"
      - "IR verified where applicable"
      - "diagnostics verified"
      - "compatibility verified"
      - "conformance passed"
      - "scalability verified"
      - "hard-coding audit passed"
      - "ambiguity audit passed"
      - "reachability audit passed"
      - "safe Rust integration passed where applicable"
      - "freeze criteria passed"

  grammar_directory:
    may_be_FROZEN_only_when:
      - "all mandatory features are accounted for"
      - "all stable features satisfy their contracts"
      - "all dependencies are closed"
      - "all mappings are closed"
      - "all mandatory tests pass"
      - "root composition is frozen last"
      - "repository-wide production gates pass"

# =============================================================================
# END OF grammar/contracts/feature-status.yaml
# =============================================================================