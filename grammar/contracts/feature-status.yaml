# =============================================================================
# Zamani Programming Language
# =============================================================================
#
# FILE
#   grammar/contracts/feature-status.yaml
#
# PURPOSE
#   Canonical machine-readable feature lifecycle and production-readiness
#   contract for grammar/.
#
# ROLE
#   This file owns FEATURE LIFECYCLE STATUS.
#
#   It does NOT own:
#     - repository inventory
#     - symbol ownership
#     - dependency graph
#     - public exports
#     - AST implementation
#     - semantic implementation
#     - IR implementation
#     - language meaning
#
#   Those responsibilities remain owned by their respective contracts.
#
# AUTHORITY CHAIN
#
#   grammar/DESIGN.md
#          |
#          +--> grammar/specification/
#          |
#          +--> grammar/spec/
#          |
#          +--> grammar/contracts/
#          |
#          +--> grammar/STATUS.yaml
#          |
#          +--> grammar/MANIFEST.yaml
#          |
#          +--> grammar/*
#
# MACHINE AUTHORITY
#   Feature lifecycle:
#     grammar/contracts/feature-status.yaml
#
# RELATED AUTHORITIES
#   Inventory:
#     grammar/MANIFEST.yaml
#
#   Repository lifecycle:
#     grammar/STATUS.yaml
#
#   Ownership:
#     grammar/OWNERSHIP.yaml
#     grammar/contracts/ownership.yaml
#
#   Dependencies:
#     grammar/DEPENDENCIES.yaml
#     grammar/contracts/dependencies.yaml
#
#   Exports:
#     grammar/contracts/exports.yaml
#
#   AST:
#     grammar/contracts/ast-mappings.yaml
#
#   Semantics:
#     grammar/contracts/semantic-mappings.yaml
#
#   IR:
#     grammar/contracts/ir-mappings.yaml
#
#   Diagnostics:
#     grammar/contracts/diagnostics.yaml
#
#   Compatibility:
#     grammar/contracts/compatibility.yaml
#
#   Human normative specification:
#     grammar/specification/
#
#   Machine normative specification:
#     grammar/spec/
#
# IMPLEMENTATION BASELINE
#   Rust edition: 2021
#   Minimum Rust: 1.97
#   Newer compatible stable Rust versions: permitted
#   unsafe Rust: forbidden
#
# SCALABILITY
#   Open-ended.
#   Programs scale according to available resources and explicitly declared
#   semantic requirements.
#
# POCO-REAF
#   Program Once
#   Compile Once
#   Run Everywhere
#   Anywhere
#   Forever
#
# =============================================================================

schema:
  id: "zamani-grammar-feature-status"
  version: "1.0.0"
  format: "YAML"
  yaml_compatibility: "YAML 1.2"
  authority: "grammar/contracts/feature-status.yaml"
  machine_readable: true

  purpose: >
    Provide a deterministic lifecycle registry for language features and
    production grammar capabilities without becoming a second grammar,
    semantic, AST, IR, ownership, dependency, or inventory authority.

repository:
  name: "Benwellonedge28/Zamani"
  root: "grammar/"

implementation:
  language: "Zamani"
  rust:
    edition: "2021"
    minimum_version: "1.97"
    newer_compatible_stable_versions_allowed: true
    unsafe_allowed: false

  parser:
    technology: "ANTLR4"
    public_boundary: "grammar/antlr/ZamaniParser.g4"

  lexer:
    technology: "ANTLR4"
    public_boundary: "grammar/antlr/ZamaniLexer.g4"

  ast:
    source_owner: "src/ast/"
    frontend_owner: "src/frontend/ast/"

  quantum_ir:
    canonical_name: "quantum::ir"

# =============================================================================
# 1. AUTHORITY AND OWNERSHIP
# =============================================================================

authority:

  feature_status:
    path: "grammar/contracts/feature-status.yaml"
    owns:
      - "feature lifecycle"
      - "feature maturity"
      - "feature gate state"
      - "feature production-readiness state"
      - "feature freeze eligibility"
      - "feature conformance gate state"

  repository_status:
    path: "grammar/STATUS.yaml"
    owns:
      - "repository lifecycle"
      - "repository-wide production readiness"
      - "repository-wide freeze state"

  manifest:
    path: "grammar/MANIFEST.yaml"
    owns:
      - "repository inventory"
      - "file existence"
      - "file classification"

  ownership:
    paths:
      - "grammar/OWNERSHIP.yaml"
      - "grammar/contracts/ownership.yaml"
    owns:
      - "canonical feature/file/symbol ownership"

  dependencies:
    paths:
      - "grammar/DEPENDENCIES.yaml"
      - "grammar/contracts/dependencies.yaml"
    owns:
      - "dependency graph"
      - "legal dependency direction"

  exports:
    path: "grammar/contracts/exports.yaml"
    owns:
      - "public grammar exports"
      - "export consumers"

  ast:
    path: "grammar/contracts/ast-mappings.yaml"
    owns:
      - "syntax to AST mapping"

  semantic:
    path: "grammar/contracts/semantic-mappings.yaml"
    owns:
      - "AST to semantic mapping"

  ir:
    path: "grammar/contracts/ir-mappings.yaml"
    owns:
      - "semantic to canonical IR mapping"

  diagnostics:
    path: "grammar/contracts/diagnostics.yaml"
    owns:
      - "diagnostic identity and ownership"

  compatibility:
    path: "grammar/contracts/compatibility.yaml"
    owns:
      - "cross-version compatibility"

  specification:
    path: "grammar/specification/"
    owns:
      - "normative human-readable language meaning"

  machine_specification:
    path: "grammar/spec/"
    owns:
      - "machine-oriented normative language contracts"

  historical_reference:
    path: "grammar/Zamani-Grammar.md"
    authority: "non_normative"
    rule: >
      Historical or exploratory material MUST NOT promote a feature to STABLE.
      Promotion requires the normative specification and all applicable
      production gates.

# =============================================================================
# 2. STATUS MODEL
# =============================================================================

lifecycle:

  allowed:
    - "HISTORICAL"
    - "REJECTED"
    - "PROPOSED"
    - "PLANNED"
    - "SPECIFIED"
    - "EXPERIMENTAL"
    - "PARTIALLY_IMPLEMENTED"
    - "IMPLEMENTED"
    - "STABLE"
    - "DEPRECATED"

  meanings:

    HISTORICAL:
      meaning: >
        Retained for historical reference only. It is not part of the current
        language contract.
      usable_by_new_source: false

    REJECTED:
      meaning: >
        Explicitly rejected from the language architecture.
      usable_by_new_source: false
      implementation_must_not_promote: true

    PROPOSED:
      meaning: >
        A design proposal without a complete normative specification.
      usable_by_new_source: false

    PLANNED:
      meaning: >
        Intended future functionality whose production contract is incomplete.
      usable_by_new_source: false

    SPECIFIED:
      meaning: >
        Normative syntax or semantics have been defined, but complete
        implementation or production conformance is not demonstrated.
      usable_by_new_source: "only_if_feature_gate_allows"

    EXPERIMENTAL:
      meaning: >
        Implemented or testable provisional functionality whose stable contract
        is not yet frozen.
      usable_by_new_source: "feature_gate_required"

    PARTIALLY_IMPLEMENTED:
      meaning: >
        Some implementation layers exist but one or more required layers remain
        incomplete.
      usable_by_new_source: "feature_gate_required"

    IMPLEMENTED:
      meaning: >
        Required implementation layers exist, but complete production
        conformance and compatibility evidence is not yet sufficient for STABLE.
      usable_by_new_source: "conditional"

    STABLE:
      meaning: >
        The complete production contract is frozen and all applicable gates have
        passed.
      usable_by_new_source: true

    DEPRECATED:
      meaning: >
        Previously stable or implemented functionality retained only for
        compatibility and scheduled for removal or replacement.
      usable_by_new_source: false

# =============================================================================
# 3. INDEPENDENT IMPLEMENTATION DIMENSIONS
# =============================================================================

implementation_dimensions:

  syntax:
    allowed:
      - "NOT_APPLICABLE"
      - "PLANNED"
      - "SPECIFIED"
      - "PARTIALLY_IMPLEMENTED"
      - "IMPLEMENTED"
      - "TESTED"
      - "STABLE"

  lexer:
    allowed:
      - "NOT_APPLICABLE"
      - "PLANNED"
      - "SPECIFIED"
      - "PARTIALLY_IMPLEMENTED"
      - "IMPLEMENTED"
      - "TESTED"
      - "STABLE"

  ast:
    allowed:
      - "NOT_APPLICABLE"
      - "PLANNED"
      - "SPECIFIED"
      - "PARTIALLY_IMPLEMENTED"
      - "IMPLEMENTED"
      - "TESTED"
      - "STABLE"

  semantic:
    allowed:
      - "NOT_APPLICABLE"
      - "PLANNED"
      - "SPECIFIED"
      - "PARTIALLY_IMPLEMENTED"
      - "IMPLEMENTED"
      - "TESTED"
      - "STABLE"

  ir:
    allowed:
      - "NOT_APPLICABLE"
      - "PLANNED"
      - "SPECIFIED"
      - "PARTIALLY_IMPLEMENTED"
      - "IMPLEMENTED"
      - "TESTED"
      - "STABLE"

  diagnostics:
    allowed:
      - "NOT_APPLICABLE"
      - "PLANNED"
      - "SPECIFIED"
      - "PARTIALLY_IMPLEMENTED"
      - "IMPLEMENTED"
      - "TESTED"
      - "STABLE"

  compatibility:
    allowed:
      - "NOT_APPLICABLE"
      - "PLANNED"
      - "SPECIFIED"
      - "PARTIALLY_IMPLEMENTED"
      - "IMPLEMENTED"
      - "TESTED"
      - "STABLE"
      - "DEPRECATED"

  conformance:
    allowed:
      - "NOT_TESTED"
      - "PARTIAL"
      - "PASS"
      - "FAIL"
      - "BLOCKED"

  freeze:
    allowed:
      - "NOT_ELIGIBLE"
      - "BLOCKED"
      - "READY"
      - "FROZEN"
      - "FROZEN_MECHANICAL_ONLY"

# =============================================================================
# 4. REQUIRED FEATURE RECORD
# =============================================================================

feature_record_schema:

  required:
    - "id"
    - "name"
    - "category"
    - "owner"
    - "lifecycle"
    - "authority"
    - "syntax"
    - "lexer"
    - "ast"
    - "semantic"
    - "ir"
    - "diagnostics"
    - "compatibility"
    - "conformance"
    - "freeze"
    - "dependencies"
    - "consumers"
    - "scalability"
    - "poco_reaf"
    - "hard_coding_audit"
    - "status_reason"

  optional:
    - "grammar_paths"
    - "specification"
    - "machine_specification"
    - "ast_mapping"
    - "semantic_mapping"
    - "ir_mapping"
    - "tests"
    - "feature_gate"
    - "migration"
    - "deprecation"
    - "notes"

  identity_rule: >
    Every feature MUST have a stable machine-readable identifier that does not
    depend on filename spelling, implementation language, or backend identity.

  ownership_rule: >
    Every feature MUST resolve to exactly one canonical owner.

  status_rule: >
    Lifecycle status MUST NOT be inferred from file existence, parser acceptance,
    comments, directory names, or implementation presence alone.

# =============================================================================
# 5. PRODUCTION STATUS DERIVATION
# =============================================================================

production_status:

  stable_requires_all:
    - "lifecycle == STABLE"
    - "canonical owner verified"
    - "dependencies verified"
    - "syntax gate passed when applicable"
    - "lexer gate passed when applicable"
    - "AST mapping passed when applicable"
    - "semantic mapping passed when applicable"
    - "IR mapping passed when applicable"
    - "diagnostic contract passed"
    - "compatibility contract passed"
    - "conformance tests passed"
    - "scalability audit passed"
    - "hard-coding audit passed"
    - "ambiguity audit passed"
    - "reachability audit passed"
    - "source-span behavior passed"
    - "safe Rust integration passed when implementation exists"
    - "POCO-REAF audit passed when feature participates in portability"

  stable_forbidden_if:
    - "duplicate owner"
    - "unresolved dependency"
    - "circular dependency"
    - "hidden parser root"
    - "hidden lexer authority"
    - "missing AST mapping"
    - "missing semantic mapping"
    - "missing IR mapping where required"
    - "missing diagnostics"
    - "missing compatibility contract"
    - "unresolved grammar ambiguity"
    - "unreachable production"
    - "hard-coded universal capacity"
    - "target-specific semantics in universal grammar"
    - "unsafe Rust requirement"
    - "unverified migration"
    - "unverified conformance"

  important_rule: >
    STABLE is a whole-contract state, not a syntax-only state.

# =============================================================================
# 6. FEATURE GATE MODEL
# =============================================================================

feature_gates:

  core:
    required_for_stable: true
    default: "enabled"

  experimental:
    required_for_use: true
    default: "disabled"

  deprecated:
    required_for_new_source: false
    default: "disabled"

  dialect:
    required_for_use: true
    default: "disabled"

  target:
    required_for_use: true
    default: "environment_selected"

  vendor:
    required_for_use: true
    default: "disabled"

  future:
    required_for_use: true
    default: "disabled"

  rule: >
    A feature gate controls availability; it MUST NOT silently change the
    semantic meaning of a stable program.

# =============================================================================
# 7. COMMON STATUS RULES
# =============================================================================

common_rules:

  syntax_without_semantics:
    status_ceiling: "IMPLEMENTED"
    rule: >
      A parsed construct cannot be STABLE when its required semantics are
      unspecified or unimplemented.

  syntax_without_ast:
    status_ceiling: "IMPLEMENTED"
    rule: >
      A frontend construct cannot be STABLE without a defined AST mapping unless
      it is explicitly classified as syntax-only metadata.

  semantic_without_diagnostics:
    status_ceiling: "IMPLEMENTED"
    rule: >
      A semantic feature cannot be STABLE without deterministic diagnostics for
      invalid forms.

  ir_without_canonical_boundary:
    status_ceiling: "IMPLEMENTED"
    rule: >
      A lowering-relevant feature cannot be STABLE if it lacks a canonical IR
      mapping.

  parser_acceptance:
    does_not_imply:
      - "semantic validity"
      - "type correctness"
      - "resource feasibility"
      - "target compatibility"
      - "IR support"
      - "runtime support"
      - "production stability"

  implementation_presence:
    does_not_imply:
      - "normative status"
      - "compatibility"
      - "production readiness"

# =============================================================================
# 8. CROSS-CONTRACT INTEGRATION
# =============================================================================

integration:

  manifest:
    source: "grammar/MANIFEST.yaml"
    requirement: >
      Every feature owner and grammar path MUST resolve against the repository
      inventory.

  status:
    source: "grammar/STATUS.yaml"
    requirement: >
      Feature lifecycle MUST agree with the repository-wide status policy.

  ownership:
    source:
      - "grammar/OWNERSHIP.yaml"
      - "grammar/contracts/ownership.yaml"
    requirement: >
      Every feature MUST have exactly one canonical owner.

  dependencies:
    source:
      - "grammar/DEPENDENCIES.yaml"
      - "grammar/contracts/dependencies.yaml"
    requirement: >
      Every dependency MUST be declared and legal.

  exports:
    source: "grammar/contracts/exports.yaml"
    requirement: >
      Every public syntax feature MUST map to an export where applicable.

  ast:
    source: "grammar/contracts/ast-mappings.yaml"
    requirement: >
      Every syntax feature entering the frontend MUST have an AST mapping.

  semantic:
    source: "grammar/contracts/semantic-mappings.yaml"
    requirement: >
      Every semantic feature MUST have a semantic mapping.

  ir:
    source: "grammar/contracts/ir-mappings.yaml"
    requirement: >
      Every lowering-relevant feature MUST have a canonical IR mapping.

  diagnostics:
    source: "grammar/contracts/diagnostics.yaml"
    requirement: >
      Every feature capable of producing semantic or syntax errors MUST have a
      diagnostic contract.

  compatibility:
    source: "grammar/contracts/compatibility.yaml"
    requirement: >
      Every STABLE feature MUST have a compatibility identity and migration
      behavior where required.

# =============================================================================
# 9. FEATURE CATEGORIES
# =============================================================================

categories:

  language_foundation:
    paths:
      - "grammar/core/"
      - "grammar/modules/"
      - "grammar/declarations/"
      - "grammar/functions/"
      - "grammar/types/"
      - "grammar/memory/"

  lexical:
    paths:
      - "grammar/lexer/"
      - "grammar/antlr/ZamaniLexer.g4"

  expressions:
    paths:
      - "grammar/expressions/"

  statements:
    paths:
      - "grammar/statements/"

  semantic_control_plane:
    paths:
      - "grammar/effects/"
      - "grammar/resources/"
      - "grammar/policies/"
      - "grammar/security/"
      - "grammar/validation/"

  classical:
    paths:
      - "grammar/classical/"

  data:
    paths:
      - "grammar/data/"

  concurrency:
    paths:
      - "grammar/concurrency/"

  distributed:
    paths:
      - "grammar/distributed/"

  networking:
    paths:
      - "grammar/networking/"

  hardware:
    paths:
      - "grammar/hardware/"

  execution:
    paths:
      - "grammar/execution/"

  compilation:
    paths:
      - "grammar/compile/"

  quantum:
    paths:
      - "grammar/quantum/"

  hdl:
    paths:
      - "grammar/hdl/"

  hybrid:
    paths:
      - "grammar/hybrid/"

  ai:
    paths:
      - "grammar/ai/"

  interoperability:
    paths:
      - "grammar/interoperability/"

  dialects:
    paths:
      - "grammar/dialects/"

  metaprogramming:
    paths:
      - "grammar/macros/"
      - "grammar/metaprogramming/"

  compatibility:
    paths:
      - "grammar/compatibility/"

# =============================================================================
# 10. UNIVERSAL LANGUAGE FOUNDATION FEATURES
# =============================================================================

features:

  # ---------------------------------------------------------------------------
  # LANGUAGE FOUNDATION
  # ---------------------------------------------------------------------------

  - id: "language.program"
    name: "Program and source-unit structure"
    category: "language_foundation"
    owner: "grammar/core/"
    grammar_paths:
      - "grammar/core/"
    lifecycle: "SPECIFIED"
    authority:
      specification: "grammar/specification/"
      machine_specification: "grammar/spec/"
    syntax: "SPECIFIED"
    lexer: "SPECIFIED"
    ast: "SPECIFIED"
    semantic: "SPECIFIED"
    ir: "NOT_APPLICABLE"
    diagnostics: "SPECIFIED"
    compatibility: "SPECIFIED"
    conformance: "NOT_TESTED"
    freeze: "NOT_ELIGIBLE"
    dependencies:
      - "lexical foundation"
    consumers:
      - "grammar/antlr/ZamaniParser.g4"
      - "grammar/Zamani.g4"
    scalability:
      mode: "OPEN_ENDED"
      universal_capacity_limit: false
    poco_reaf:
      participates: true
    hard_coding_audit:
      status: "REQUIRED"
      finite_capacity_allowed: false
    status_reason: >
      Core source structure is specified but repository-wide production
      conformance must be verified before freeze.

  - id: "language.names"
    name: "Identifiers and names"
    category: "language_foundation"
    owner: "grammar/core/"
    lifecycle: "SPECIFIED"
    syntax: "SPECIFIED"
    lexer: "SPECIFIED"
    ast: "SPECIFIED"
    semantic: "SPECIFIED"
    ir: "NOT_APPLICABLE"
    diagnostics: "SPECIFIED"
    compatibility: "SPECIFIED"
    conformance: "NOT_TESTED"
    freeze: "NOT_ELIGIBLE"
    dependencies:
      - "lexical foundation"
    consumers:
      - "modules"
      - "declarations"
      - "types"
      - "expressions"
      - "functions"
    scalability:
      mode: "OPEN_ENDED"
    poco_reaf:
      participates: true
    hard_coding_audit:
      status: "REQUIRED"
      finite_capacity_allowed: false
    status_reason: "Requires complete repository-wide ownership and conformance closure."

  - id: "language.modules"
    name: "Modules and namespaces"
    category: "language_foundation"
    owner: "grammar/modules/"
    lifecycle: "SPECIFIED"
    syntax: "SPECIFIED"
    lexer: "SPECIFIED"
    ast: "SPECIFIED"
    semantic: "SPECIFIED"
    ir: "NOT_APPLICABLE"
    diagnostics: "SPECIFIED"
    compatibility: "SPECIFIED"
    conformance: "NOT_TESTED"
    freeze: "NOT_ELIGIBLE"
    dependencies:
      - "language.names"
    consumers:
      - "declarations"
      - "functions"
      - "interoperability"
      - "dialects"
    scalability:
      mode: "OPEN_ENDED"
      module_count_limit: "NONE"
    poco_reaf:
      participates: true
    hard_coding_audit:
      status: "REQUIRED"
      finite_capacity_allowed: false
    status_reason: "Module semantics must be closed before root composition is frozen."

  - id: "language.declarations"
    name: "Declarations"
    category: "language_foundation"
    owner: "grammar/declarations/"
    lifecycle: "SPECIFIED"
    syntax: "SPECIFIED"
    lexer: "SPECIFIED"
    ast: "SPECIFIED"
    semantic: "SPECIFIED"
    ir: "NOT_APPLICABLE"
    diagnostics: "SPECIFIED"
    compatibility: "SPECIFIED"
    conformance: "NOT_TESTED"
    freeze: "NOT_ELIGIBLE"
    dependencies:
      - "language.names"
      - "language.modules"
      - "language.types"
    consumers:
      - "functions"
      - "statements"
      - "domains"
    scalability:
      mode: "OPEN_ENDED"
    poco_reaf:
      participates: true
    hard_coding_audit:
      status: "REQUIRED"
      finite_capacity_allowed: false
    status_reason: "Declaration ownership and mappings require closure."

  - id: "language.types"
    name: "Universal type system"
    category: "language_foundation"
    owner: "grammar/types/"
    lifecycle: "SPECIFIED"
    syntax: "SPECIFIED"
    lexer: "SPECIFIED"
    ast: "SPECIFIED"
    semantic: "SPECIFIED"
    ir: "SPECIFIED"
    diagnostics: "SPECIFIED"
    compatibility: "SPECIFIED"
    conformance: "NOT_TESTED"
    freeze: "NOT_ELIGIBLE"
    dependencies:
      - "language.names"
      - "language.declarations"
    consumers:
      - "expressions"
      - "functions"
      - "memory"
      - "classical"
      - "quantum"
      - "hdl"
      - "ai"
      - "data"
      - "hybrid"
    scalability:
      mode: "OPEN_ENDED"
      type_arity_limit: "NONE"
      tensor_rank_limit: "NONE"
      width_limit: "NONE"
    poco_reaf:
      participates: true
    hard_coding_audit:
      status: "REQUIRED"
      finite_capacity_allowed: false
    status_reason: >
      Type-system stability requires reconciliation of all existing type
      grammars, including duplicate-looking type files, ownership, mappings,
      and semantic implementation.

  - id: "language.memory"
    name: "Portable memory and ownership model"
    category: "language_foundation"
    owner: "grammar/memory/"
    lifecycle: "SPECIFIED"
    syntax: "SPECIFIED"
    lexer: "SPECIFIED"
    ast: "SPECIFIED"
    semantic: "SPECIFIED"
    ir: "SPECIFIED"
    diagnostics: "SPECIFIED"
    compatibility: "SPECIFIED"
    conformance: "NOT_TESTED"
    freeze: "NOT_ELIGIBLE"
    dependencies:
      - "language.types"
      - "language.names"
    consumers:
      - "expressions"
      - "functions"
      - "execution"
      - "hardware"
      - "distributed"
    scalability:
      mode: "OPEN_ENDED"
      physical_memory_limit_in_grammar: false
    poco_reaf:
      participates: true
    hard_coding_audit:
      status: "REQUIRED"
      finite_capacity_allowed: false
    status_reason: "Memory semantics must remain separate from physical capacity."

  # ---------------------------------------------------------------------------
  # EXPRESSIONS AND FUNCTIONS
  # ---------------------------------------------------------------------------

  - id: "language.expressions"
    name: "Universal expression algebra"
    category: "expressions"
    owner: "grammar/expressions/"
    lifecycle: "SPECIFIED"
    syntax: "SPECIFIED"
    lexer: "SPECIFIED"
    ast: "SPECIFIED"
    semantic: "SPECIFIED"
    ir: "SPECIFIED"
    diagnostics: "SPECIFIED"
    compatibility: "SPECIFIED"
    conformance: "NOT_TESTED"
    freeze: "NOT_ELIGIBLE"
    dependencies:
      - "language.types"
      - "language.names"
      - "language.memory"
    consumers:
      - "functions"
      - "statements"
      - "classical"
      - "quantum"
      - "hdl"
      - "ai"
      - "data"
    scalability:
      mode: "OPEN_ENDED"
    poco_reaf:
      participates: true
    hard_coding_audit:
      status: "REQUIRED"
      finite_capacity_allowed: false
