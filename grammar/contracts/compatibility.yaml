# =============================================================================
# 2. CORE COMPATIBILITY INVARIANTS
# =============================================================================

invariants:

  meaning_preservation:
    severity: "error"
    rule: >
      A compatibility-preserving change MUST NOT silently change the specified
      meaning of valid existing Zamani source.

  explicit_breaking_change:
    severity: "error"
    rule: >
      Every intentionally breaking change MUST be explicitly versioned,
      classified, documented, diagnosed, tested, and migrated where practical.

  no_silent_reinterpretation:
    severity: "error"
    rule: >
      An implementation MUST NOT silently reinterpret source written for one
      incompatible language contract as another language contract.

  deterministic_resolution:
    severity: "error"
    rule: >
      Compatibility resolution MUST be deterministic and MUST NOT depend on
      filesystem ordering, wall-clock time, target availability, random state,
      or mutable runtime state.

  one_machine_authority:
    severity: "error"
    rule: >
      This file is the canonical machine-readable cross-layer compatibility
      relationship authority.

  derived_human_matrix:
    severity: "error"
    rule: >
      grammar/compatibility/compatibility-matrix.md MUST be consistent with
      this file and MUST NOT define contradictory compatibility relationships.

  no_backend_semantic_leak:
    severity: "error"
    rule: >
      Backend, device, scheduler, routing, calibration, or runtime changes MUST
      NOT alter language compatibility unless they intentionally change a
      normative language or semantic contract.

  no_hardware_version_language:
    severity: "error"
    rule: >
      Hardware generations MUST NOT become language versions.

  no_capacity_versioning:
    severity: "error"
    rule: >
      Resource capacity MUST NOT be encoded as a language compatibility ceiling.

  open_world:
    severity: "error"
    rule: >
      New computational targets, resources, capabilities, devices, topologies,
      operations, and dialects MUST be integrable without redefining stable
      universal semantics solely because they are new.

