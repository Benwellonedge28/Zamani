# =============================================================================
# Zamani Programming Language
# =============================================================================
#
# FILE
#   grammar/contracts/compatibility.yaml
#
# PURPOSE
#   Canonical machine-checkable compatibility contract for grammar/.
#
# STATUS
#   NORMATIVE
#   PRODUCTION_READY
#
# AUTHORITY
#   This file is the machine-readable authority for cross-layer compatibility
#   relationships inside grammar/.
#
#   It does NOT replace:
#
#     grammar/DESIGN.md
#       -> overall grammar architecture
#
#     grammar/specification/
#       -> normative language meaning
#
#     grammar/spec/
#       -> normative machine-oriented language contracts
#
#   It operationalizes their compatibility requirements.
#
# HUMAN COMPATIBILITY VIEW
#   grammar/compatibility/compatibility-matrix.md
#
#   The matrix document is a human-readable projection of this contract.
#   It MUST NOT contain compatibility relationships that contradict this file.
#
# IMPLEMENTATION BASELINE
#   Rust edition: 2021
#   Minimum Rust: 1.97.1
#   Rust safety: safe Rust only
#   unsafe Rust: forbidden
#
# ARCHITECTURAL OBJECTIVE
#   Program_Once_Compile_Once_Run_Everywhere_Anywhere_Forever
#
# SCALABILITY
#   Open-world.
#   No universal finite machine-capacity ceiling.
#   Actual execution remains bounded by available resources and implementation
#   capacity.
#
# =============================================================================

schema:
  id: "zamani-grammar-compatibility-contract"
  version: "1.0.0"
  format: "YAML"
  status: "NORMATIVE"
  stability: "STABLE"
  canonical_file: "grammar/contracts/compatibility.yaml"
  machine_readable: true
  human_projection: "grammar/compatibility/compatibility-matrix.md"

repository:
  name: "Benwellonedge28/Zamani"
  root: "grammar/"
  language: "Zamani"

implementation_baseline:
  rust:
    edition: "2021"
    minimum_version: "1.97.1"
    safe_only: true
    unsafe_allowed: false

  parser:
    technology: "ANTLR4"
    public_parser_boundary: "grammar/antlr/ZamaniParser.g4"

  lexer:
    technology: "ANTLR4"
    public_lexer_boundary: "grammar/antlr/ZamaniLexer.g4"

  rust_frontend:
    lexer: "src/lexer.rs"
    parser: "src/parser.rs"
    ast: "src/ast/"
    frontend_ast: "src/frontend/ast/"

  quantum_ir:
    canonical_boundary: "quantum::ir"

