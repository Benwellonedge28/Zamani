# =============================================================================
#
# Zamani Programming Language
#
# grammar/contracts/ast-mappings.yaml
#
# =============================================================================
#
# PURPOSE
#
# Canonical machine-checkable contract connecting Zamani source grammar
# productions to the frontend AST.
#
# This contract is deliberately independent of:
#
#   - physical hardware;
#   - target devices;
#   - compiler backend selection;
#   - runtime state;
#   - resource availability;
#   - scheduling;
#   - routing;
#   - calibration;
#   - vendor instruction sets;
#   - physical qubit allocation;
#   - finite machine capacities.
#
# The AST represents source structure and portable computation intent.
#
# The AST does NOT represent target realization.
#
# Canonical pipeline:
#
#   Zamani source
#       |
#       v
#   lexer
#       |
#       v
#   parser
#       |
#       v
#   frontend AST
#       |
#       v
#   structural validation
#       |
#       +--> types
#       +--> effects
#       +--> capabilities
#       +--> resources
#       +--> contracts
#       +--> policies
#       +--> provenance
#       |
#       v
#   semantic model
#       |
#       +--> Classical IR
#       +--> quantum::ir
#       +--> HDL / Hardware IR
#       |
#       v
#   optimization / lowering / routing / scheduling / resilience
#       |
#       v
#   ZQN
#       |
#       v
#   HAL / runtime / realization
#
# =============================================================================

schema:
  version: "2.0"
  kind: "zamani-grammar-ast-mapping-contract"
  format: "YAML"
  status: "NORMATIVE"
  repository: "Benwellonedge28/Zamani"
  language: "Zamani"
  root: "grammar/"
  canonical_file: "grammar/contracts/ast-mappings.yaml"

  implementation:
    rust:
      edition: "2021"
      minimum_version: "1.97"
      recommended_version: "1.97-or-later"
      safety_policy: "safe-rust-only"
      unsafe_code: "forbidden"

  scalability:
    model: "open-world"
    principle: >
      The language and AST impose no artificial finite machine-size ceiling.
      Concrete compilation and execution remain bounded by actual resources,
      implementation representation limits, explicit program constraints,
      deployment policy, and physical reality.

  portability:
    model: "target-independent-source-semantics"

  poco_reaf:
    enabled: true
    name: "Program_Once_Compile_Once_Run_Everywhere_Anywhere_Forever"
    meaning: >
      Source meaning and its portable compilation contract remain independent
      of any particular realization target. Target-specific realization is
      performed only after capability, resource, policy, effect, and
      compatibility validation.

# =============================================================================
# 1. AUTHORITY
# =============================================================================

authority:
  architecture:
    path: "grammar/DESIGN.md"
    role: "architectural_authority"

  normative_language:
    path: "grammar/specification/"
    role: "normative_language_specification"

  machine_specification:
    path: "grammar/spec/"
    role: "machine_oriented_language_contracts"

  ownership:
    path: "grammar/contracts/ownership.yaml"
    role: "canonical_concept_ownership"

  dependencies:
    path: "grammar/contracts/dependencies.yaml"
    role: "canonical_dependency_graph"

  exports:
    path: "grammar/contracts/exports.yaml"
    role: "canonical_export_registry"

  semantic_mappings:
    path: "grammar/contracts/semantic-mappings.yaml"
    role: "AST_to_semantic_mapping"

  ir_mappings:
    path: "grammar/contracts/ir-mappings.yaml"
    role: "semantic_to_IR_mapping"

  diagnostics:
    path: "grammar/contracts/diagnostics.yaml"
    role: "diagnostic_contract"

  compatibility:
    path: "grammar/contracts/compatibility.yaml"
    role: "cross_version_compatibility"

  feature_status:
    path: "grammar/contracts/feature-status.yaml"
    role: "feature_lifecycle_status"

  ast_conformance:
    path: "grammar/compatibility/ast-conformance.md"
    role: "AST_conformance_requirements"

  syntax_specification:
    path: "grammar/spec/syntax.md"
    role: "syntax_to_AST_contract"

  source_spans:
    path: "grammar/spec/source-spans.md"
    role: "source_span_contract"

  AST_coverage:
    path: "grammar/validation/ast-coverage.md"
    role: "AST_coverage_validation"

  frontend:
    current_legacy_boundary:
      path: "src/ast/mod.rs"
      role: "legacy_AST_compatibility_boundary"

    canonical_boundary:
      path: "src/frontend/ast/node/mod.rs"
      role: "canonical_frontend_AST_node_boundary"

  parser:
    path: "src/parser.rs"
    role: "legacy_executable_parser_boundary"

  historical_reference:
    path: "grammar/Zamani-Grammar.md"
    normative: false
    ownership_effect: "none"

  derived_reference:
    path: "grammar/grammar.md"
    normative: false
    role: "implementation_conformance_reference"

# =============================================================================
# 2. AUTHORITY RULES
# =============================================================================

authority_rules:

  grammar_does_not_own_AST:
    severity: "error"
    rule: >
      Grammar files define source syntax. They do not define Rust AST
      implementation structures.

  AST_does_not_define_source_language:
    severity: "error"
    rule: >
      Existing Rust AST implementation must not silently become the source
      language authority. Normative source meaning remains owned by
      grammar/specification/.

  one_canonical_AST_boundary:
    severity: "error"
    rule: >
      The decomposed frontend AST under src/frontend/ast/node/ is the
      forward canonical AST boundary.

  legacy_AST_is_not_parallel_authority:
    severity: "error"
    rule: >
      src/ast/mod.rs is a compatibility and migration boundary while the
      frontend AST decomposition is completed. It must not become a second
      independent language model.

  parser_to_AST:
    severity: "error"
    rule: >
      Every meaning-bearing parser production must map to an AST
      representation or to an explicitly declared syntax-only construct.

  no_hidden_AST:
    severity: "error"
    rule: >
      A grammar production may not depend on an undocumented Rust structure.

  no_backend_AST:
    severity: "error"
    rule: >
      AST nodes must not contain backend-specific realization decisions.

  no_target_AST:
    severity: "error"
    rule: >
      AST nodes must not encode physical CPU, GPU, FPGA, ASIC, accelerator,
      QPU, simulator, cluster, cloud, vendor, or operating-system selection.

  no_runtime_AST:
    severity: "error"
    rule: >
      AST nodes must not contain live runtime state or mutable resource
      availability.

  no_machine_capacity_AST:
    severity: "error"
    rule: >
      AST mappings must not turn implementation or target capacity into
      language-level limits.

  source_structure_only:
    severity: "error"
    rule: >
      The AST records source structure, source intent, syntactic metadata,
      and source provenance. Semantic realization belongs downstream.

# =============================================================================
# 3. AST LAYERS
# =============================================================================

layers:

  syntax_AST:
    purpose: "faithful source structure"
    owns:
      - "source ordering"
      - "grammar structure"
      - "names"
      - "expressions"
      - "statements"
      - "declarations"
      - "patterns"
      - "type expressions"
      - "attributes"
      - "modifiers"
      - "source spans"
      - "literal source values"
      - "source-level domain constructs"
      - "source-level resource requirements"
      - "source-level capability requirements"
      - "source-level effect declarations"
      - "source-level contracts"
      - "source-level policies"
      - "source-level provenance"

  structural_validation:
    purpose: "validate AST structure before semantic interpretation"
    owns:
      - "well_formedness"
      - "duplicate declarations"
      - "structural constraints"
      - "syntax-derived invariants"

  semantic_model:
    purpose: "meaning and validity"
    owns:
      - "name resolution"
      - "type checking"
      - "effect checking"
      - "capability validation"
      - "resource validation"
      - "contract validation"
      - "policy evaluation"
      - "provenance validation"
      - "domain semantics"

  canonical_IR:
    purpose: "compiler representation after semantic validation"
    owns:
      - "Classical IR"
      - "quantum::ir"
      - "HDL/Hardware IR"

  realization:
    purpose: "target-specific realization"
    owns:
      - "target discovery"
      - "resource negotiation"
      - "placement"
      - "routing"
      - "scheduling"
      - "lowering"
      - "calibration"
      - "device selection"
      - "backend instruction selection"

# =============================================================================
# 4. NODE CONTRACT
# =============================================================================

node_contract:

  required_properties:
    - "kind"
    - "source_span"
    - "children"
    - "syntactic_attributes"
    - "provenance"

  optional_properties:
    - "stable_node_id"
    - "generated_origin"
    - "dialect"
    - "version"
    - "source_metadata"

  forbidden_properties:
    - "physical_device_id"
    - "physical_qubit_id"
    - "CPU_core_assignment"
    - "GPU_assignment"
    - "FPGA_placement"
    - "ASIC_cell_selection"
    - "QPU_calibration"
    - "runtime_handle"
    - "live_resource_count"
    - "scheduler_slot"
    - "routing_result"
    - "backend_instruction"
    - "target_native_register"

  invariants:
    source_reconstructability:
      rule: >
        The AST must retain sufficient structural information for downstream
        semantic analysis without reparsing ordinary syntax from raw source.

    deterministic_traversal:
      rule: >
        AST traversal order must be deterministic and independent of hash-map
        iteration order or machine-specific execution.

    source_order:
      rule: >
        Source ordering must be preserved wherever language semantics depend
        on declaration or evaluation order.

    no_address_identity:
      rule: >
        AST identity must never depend on memory addresses or pointer identity.

    no_target_identity:
      rule: >
        AST identity must never depend on a physical target identifier.

# =============================================================================
# 5. SOURCE SPAN CONTRACT
# =============================================================================

source_span:

  canonical_type:
    path: "src/source_map.rs"
    symbol: "Span"

  authority:
    specification: "grammar/spec/source-spans.md"

  requirements:
    every_source_node: true
    deterministic: true
    reproducible: true
    source_order_preserved: true
    diagnostic_compatible: true
    tooling_compatible: true
    target_independent: true
    runtime_independent: true

  origin_kinds:
    - "source"
    - "generated"
    - "synthetic"
    - "desugared"

  forbidden:
    - "memory_address"
    - "pointer_address"
    - "device_address"
    - "runtime_handle"
    - "physical_resource_identifier"

  mapping_rule: >
    Every AST mapping below assumes the canonical Span representation.
    Individual nodes must not introduce alternate span structures.

# =============================================================================
# 6. MAPPING SCHEMA
# =============================================================================

mapping_schema:

  required:
    - "id"
    - "grammar_owner"
    - "grammar_symbols"
    - "ast_boundary"
    - "ast_kind"
    - "representation"
    - "fields"
    - "source_span"
    - "semantic_consumer"
    - "status"
    - "tests"
    - "freeze"

  fields_schema:
    id:
      type: "string"
      uniqueness: "global"

    grammar_owner:
      type: "repository_path"
      must_match:
        - "grammar/contracts/ownership.yaml"
        - "grammar/OWNERSHIP.yaml"

    grammar_symbols:
      type: "list"

    ast_boundary:
      enum:
        - "canonical"
        - "legacy_compatibility"
        - "migration"

    ast_kind:
      type: "string"

    representation:
      type: "string"

    fields:
      type: "list"

    source_span:
      required: true

    semantic_consumer:
      type: "repository_path_or_contract"

    IR_consumer:
      optional: true

    status:
      enum:
        - "specified"
        - "implemented"
        - "partial"
        - "migration_required"
        - "planned"
        - "experimental"
        - "deprecated"
        - "rejected"

    tests:
      required: true

    freeze:
      required: true

# =============================================================================
# 7. CANONICAL ROOT MAPPINGS
# =============================================================================

mappings:

  - id: "AST-ROOT-001"
    grammar_owner: "grammar/core/program.g4"
    grammar_symbols:
      - "program"
      - "sourceUnit"

    ast_boundary: "canonical"
    ast_kind: "Program"
    representation: "src/frontend/ast/node/"

    fields:
      - name: "items"
        type: "ordered collection of top-level AST nodes"
        source: "program contents"
      - name: "span"
        type: "Span"
        source: "complete program/source unit"

    source_span:
      required: true
      representation: "Span"

    semantic_consumer: "semantic program validation"
    IR_consumer: "compiler semantic lowering"

    status: "implemented"
    tests:
      required:
        - "grammar/conformance/syntax/program"
        - "grammar/conformance/ast/program"
        - "grammar/tests/ast/program"
    freeze:
      requires:
        - "source span validation"
        - "deterministic ordering"
        - "single root ownership"

  - id: "AST-CORE-001"
    grammar_owner: "grammar/core/names.g4"
    grammar_symbols:
      - "identifier"

    ast_boundary: "canonical"
    ast_kind: "Identifier"
    representation: "src/frontend/ast/node/"

    fields:
      - name: "name"
        type: "source identifier representation"
      - name: "span"
        type: "Span"

    source_span:
      required: true

    semantic_consumer: "name resolution"

    status: "implemented"
    tests:
      required:
        - "grammar/tests/ast/identifiers"
        - "grammar/conformance/ast/identifiers"

    freeze:
      requires:
        - "Unicode policy resolved"
        - "normalization policy resolved"
        - "source spelling preservation resolved"

# =============================================================================
# 8. DECLARATION MAPPINGS
# =============================================================================

  - id: "AST-DECL-001"
    grammar_owner: "grammar/declarations/variables.g4"
    grammar_symbols:
      - "variableDeclaration"
      - "letDeclaration"
      - "constDeclaration"

    ast_boundary: "canonical"
    ast_kind: "BindingDeclaration"

    representation:
      legacy:
        "src/ast/mod.rs::Statement::Let"
        "src/ast/mod.rs::Statement::Const"
      canonical:
        "src/frontend/ast/node/statements/let_stmt.rs"
        "src/frontend/ast/node/statements/const_stmt.rs"

    fields:
      - name: "binding_name"
        type: "Identifier"
      - name: "type_annotation"
        type: "optional TypeExpr"
      - name: "initializer"
        type: "Expression"
      - name: "mutability"
        type: "source-level mutability"
      - name: "attributes"
        type: "attribute collection"
      - name: "span"
        type: "Span"

    source_span:
      required: true

    semantic_consumer:
      - "name resolution"
      - "type checking"
      - "ownership analysis"
      - "effect analysis"

    status: "migration_required"

    tests:
      required:
        - "grammar/tests/ast/declarations/variables"
        - "grammar/conformance/ast/declarations"
        - "grammar/conformance/ast/source-spans"

    freeze:
      requires:
        - "canonical BindingDeclaration representation"
        - "legacy adapter retained"
        - "mutability preserved"
        - "initializer absence/presence preserved"
        - "source span preserved"

  - id: "AST-DECL-002"
    grammar_owner: "grammar/declarations/functions.g4"
    grammar_symbols:
      - "functionDeclaration"
      - "function"
      - "parameterList"
      - "returnType"

    ast_boundary: "canonical"
    ast_kind: "FunctionDeclaration"

    representation:
      canonical:
        "src/frontend/ast/node/declarations/"
      legacy:
        "src/ast/mod.rs::Statement::Function"

    fields:
      - name: "name"
        type: "Identifier"
      - name: "generic_parameters"
        type: "ordered collection of TypeParameter"
      - name: "parameters"
        type: "ordered collection of Parameter"
      - name: "return_type"
        type: "optional TypeExpr"
      - name: "where_constraints"
        type: "constraint collection"
      - name: "body"
        type: "Expression"
      - name: "attributes"
        type: "attribute collection"
      - name: "effects"
        type: "effect syntax"
      - name: "contracts"
        type: "contract syntax"
      - name: "span"
        type: "Span"

    source_span:
      required: true

    semantic_consumer:
      - "function signature validation"
      - "generic/type checking"
      - "effect checking"
      - "contract checking"

    IR_consumer:
      - "Classical IR"
      - "quantum::ir where semantically applicable"
      - "HDL/Hardware IR where semantically applicable"

    status: "migration_required"

    tests:
      required:
        - "grammar/tests/ast/functions"
        - "grammar/conformance/ast/functions"
        - "grammar/conformance/ast/source-spans"

    freeze:
      requires:
        - "generic parameter preservation"
        - "effect preservation"
        - "contract preservation"
        - "attribute preservation"
        - "source ordering"

  - id: "AST-DECL-003"
    grammar_owner: "grammar/declarations/structs.g4"
    grammar_symbols:
      - "structDeclaration"
      - "structField"

    ast_boundary: "canonical"
    ast_kind: "StructDeclaration"

    representation:
      canonical:
        "src/frontend/ast/node/declarations/"
      legacy:
        "src/ast/mod.rs::Statement::Struct"

    fields:
      - name: "name"
        type: "Identifier"
      - name: "generic_parameters"
        type: "ordered collection of TypeParameter"
      - name: "fields"
        type: "ordered collection of StructField"
      - name: "attributes"
        type: "attribute collection"
      - name: "visibility"
        type: "Visibility"
      - name: "span"
        type: "Span"

    source_span:
      required: true

    semantic_consumer:
      - "type declaration validation"
      - "layout-independent type checking"

    status: "migration_required"

    tests:
      required:
        - "grammar/tests/ast/types/struct"
        - "grammar/conformance/ast/types"

    freeze:
      requires:
        - "field order preservation"
        - "generic preservation"
        - "visibility preservation"

  - id: "AST-DECL-004"
    grammar_owner: "grammar/declarations/enums.g4"
    grammar_symbols:
      - "enumDeclaration"
      - "enumVariant"

    ast_boundary: "canonical"
    ast_kind: "EnumDeclaration"

    representation:
      canonical:
        "src/frontend/ast/node/declarations/"
      legacy:
        "src/ast/mod.rs::Statement::Enum"

    fields:
      - name: "name"
        type: "Identifier"
      - name: "generic_parameters"
        type: "ordered collection of TypeParameter"
      - name: "variants"
        type: "ordered collection of EnumVariant"
      - name: "attributes"
        type: "attribute collection"
      - name: "span"
        type: "Span"

    source_span:
      required: true

    semantic_consumer:
      - "sum type validation"
      - "pattern checking"
      - "exhaustiveness analysis"

    status: "migration_required"

    tests:
      required:
        - "grammar/tests/ast/types/enums"
        - "grammar/conformance/ast/types"

    freeze:
      requires:
        - "variant order preservation"
        - "variant field structure preservation"
        - "pattern compatibility"

  - id: "AST-DECL-005"
    grammar_owner: "grammar/declarations/traits.g4"
    grammar_symbols:
      - "traitDeclaration"
      - "traitItem"
      - "associatedType"

    ast_boundary: "canonical"
    ast_kind: "TraitDeclaration"

    representation:
      canonical:
        "src/frontend/ast/node/declarations/"
      legacy:
        "src/ast/mod.rs::Statement::Trait"

    fields:
      - name: "name"
        type: "Identifier"
      - name: "generic_parameters"
        type: "ordered collection of TypeParameter"
      - name: "items"
        type: "ordered collection of TraitItem"
      - name: "constraints"
        type: "constraint collection"
      - name: "span"
        type: "Span"

    source_span:
      required: true

    semantic_consumer:
      - "trait/type-class validation"
      - "generic constraint resolution"

    status: "migration_required"

    tests:
      required:
        - "grammar/tests/ast/traits"
        - "grammar/conformance/ast/generics"

    freeze:
      requires:
        - "associated members preserved"
        - "generic bounds preserved"
        - "default bodies preserved"

  - id: "AST-DECL-006"
    grammar_owner: "grammar/declarations/impl.g4"
    grammar_symbols:
      - "implDeclaration"
      - "implItem"

    ast_boundary: "canonical"
    ast_kind: "ImplDeclaration"

    representation:
      canonical:
        "src/frontend/ast/node/declarations/"
      legacy:
        "src/ast/mod.rs::Statement::Impl"

    fields:
      - name: "trait_type"
        type: "optional Identifier/TypeExpr"
      - name: "target_type"
        type: "TypeExpr"
      - name: "items"
        type: "ordered collection of ImplItem"
      - name: "span"
        type: "Span"

    source_span:
      required: true

    semantic_consumer:
      - "trait implementation checking"
      - "method resolution"

    status: "migration_required"

    tests:
      required:
        - "grammar/tests/ast/impl"
        - "grammar/conformance/ast/traits"

    freeze:
      requires:
        - "trait-for-type relationship preserved"
        - "implementation item order preserved"

  - id: "AST-DECL-007"
    grammar_owner: "grammar/declarations/type-aliases.g4"
    grammar_symbols:
      - "typeAlias"
      - "typeAliasDeclaration"

    ast_boundary: "canonical"
    ast_kind: "TypeAliasDeclaration"

    representation:
      canonical:
        "src/frontend/ast/node/declarations/type_alias.rs"
      legacy:
        "src/ast/mod.rs::Statement::TypeAlias"

    fields:
      - name: "name"
        type: "Identifier"
      - name: "generic_parameters"
        type: "ordered collection of TypeParameter"
      - name: "target"
        type: "TypeExpr"
      - name: "span"
        type: "Span"

    source_span:
      required: true

    semantic_consumer:
      - "type alias resolution"

    status: "implemented"

    tests:
      required:
        - "grammar/tests/ast/types/type-alias"
        - "grammar/conformance/ast/types"

    freeze:
      requires:
        - "generic parameters preserved"
        - "target type preserved"

# =============================================================================
# 9. MODULE / IMPORT MAPPINGS
# =============================================================================

  - id: "AST-MOD-001"
    grammar_owner: "grammar/modules/modules.g4"
    grammar_symbols:
      - "moduleDeclaration"
      - "modulePath"

    ast_boundary: "canonical"
    ast_kind: "ModuleDeclaration"

    representation:
      canonical:
        "src/frontend/ast/node/modules/"
      legacy:
        "src/ast/mod.rs::Statement::Module"

    fields:
      - name: "path"
        type: "qualified source path"
      - name: "items"
        type: "ordered AST collection"
      - name: "attributes"
        type: "attribute collection"
      - name: "span"
        type: "Span"

    source_span:
      required: true

    semantic_consumer:
      - "module resolution"
      - "visibility analysis"
      - "name resolution"

    status: "migration_required"

    tests:
      required:
        - "grammar/tests/ast/modules"
        - "grammar/conformance/ast/modules"

    freeze:
      requires:
        - "qualified path preservation"
        - "nested item ordering"

  - id: "AST-MOD-002"
    grammar_owner: "grammar/modules/imports.g4"
    grammar_symbols:
      - "importDeclaration"
      - "importPath"

    ast_boundary: "canonical"
    ast_kind: "ImportDeclaration"

    representation:
      canonical:
        "src/frontend/ast/node/modules/"
      legacy:
        "src/ast/mod.rs::Statement::Import"

    fields:
      - name: "path"
        type: "qualified source path"
      - name: "selectors"
        type: "optional import selectors"
      - name: "span"
        type: "Span"

    source_span:
      required: true

    semantic_consumer:
      - "module resolution"

    status: "migration_required"

    tests:
      required:
        - "grammar/tests/ast/modules/imports"

    freeze:
      requires:
        - "import path preservation"
        - "selector preservation"

  - id: "AST-MOD-003"
    grammar_owner: "grammar/modules/use.g4"
    grammar_symbols:
      - "useDeclaration"
      - "usePath"

    ast_boundary: "canonical"
    ast_kind: "UseDeclaration"

    representation:
      canonical:
        "src/frontend/ast/node/modules/"
      legacy:
        "src/ast/mod.rs::Statement::Use"

