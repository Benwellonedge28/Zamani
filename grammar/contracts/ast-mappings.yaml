# =============================================================================
# 17. RESOLVED TYPE BOUNDARY
# =============================================================================

resolved_types:

  canonical_rule:
    source_type:
      symbol: "TypeExpr"
      meaning: "source-level type syntax"

    resolved_type:
      symbol: "Type"
      meaning: "semantic type after validation/resolution"

  implementation:
    legacy_path: "src/ast/mod.rs"
    canonical_future_owner: "semantic/type-system"

  critical_invariant:
    rule: >
      The Rust representation of a resolved type must never silently become
      a limit on source-language expressiveness.

  forbidden_examples:
    - "source integer limited to i64 because AST stores i64"
    - "source floating value limited to f64 because AST stores f64"
    - "array dimension limited by host usize"
    - "tensor rank limited by a compiler enum"
    - "qubit count limited by a Rust integer width"

  diagnostic_policy:
    rule: >
      If a concrete compiler representation cannot represent a valid source
      construct, the compiler must report a representation/resource diagnostic
      rather than redefining the source language.

# =============================================================================
# 18. QUANTUM AST MAPPINGS
# =============================================================================

  - id: "AST-Q-001"
    grammar_owner: "grammar/quantum/operations.g4"
    grammar_symbols:
      - "quantumOperation"
      - "operationSpecifier"
      - "quantumOperationAttributes"

    ast_boundary: "canonical"
    ast_kind: "QuantumOperation"

    representation:
      canonical:
        "frontend AST domain operation node"
      legacy:
        "src/ast/mod.rs::Expression::QuantumOp"

    required_fields:
      - name: "operation"
        type: "qualified operation identifier"
      - name: "namespace"
        type: "optional qualified namespace"
      - name: "operands"
        type: "ordered Expression collection"
      - name: "parameters"
        type: "ordered Expression collection"
      - name: "results"
        type: "ordered result collection"
      - name: "attributes"
        type: "attribute collection"
      - name: "modifiers"
        type: "modifier collection"
      - name: "controls"
        type: "optional operand collection"
      - name: "targets"
        type: "operand collection"
      - name: "conditions"
        type: "optional Expression collection"
      - name: "span"
        type: "Span"

    operation_kinds:
      - "builtin"
      - "custom"
      - "vendor"
      - "parameterized"
      - "dialect"
      - "future"

    extensibility:
      closed_operation_enumeration: false
      rule: >
        Adding a quantum operation must not require modifying the core AST
        schema merely because the operation name is new.

    semantic_consumer: "quantum semantic model"

    IR_consumer: "quantum::ir"

    physical_realization:
      forbidden_in_AST:
        - "physical qubit assignment"
        - "QPU selection"
        - "calibration"
        - "pulse realization"
        - "routing result"

    status: "migration_required"

    tests:
      required:
        - "grammar/tests/ast/quantum/operations"
        - "grammar/conformance/ast/quantum"
        - "grammar/conformance/ast/extensible-operations"

    freeze:
      requires:
        - "generic operation representation"
        - "operation namespace preservation"
        - "targets and controls preserved"
        - "parameters preserved"
        - "attributes preserved"
        - "modifiers preserved"
        - "no closed gate enumeration"

  - id: "AST-Q-002"
    grammar_owner: "grammar/quantum/measurement.g4"
    grammar_symbols:
      - "measurement"
      - "measureOperation"

    ast_boundary: "canonical"
    ast_kind: "QuantumMeasurement"

    representation:
      canonical:
        "frontend AST quantum operation node with measurement semantics"

    fields:
      - name: "targets"
        type: "ordered expression collection"
      - name: "results"
        type: "ordered result collection"
      - name: "basis"
        type: "optional expression/operation specification"
      - name: "attributes"
        type: "attribute collection"
      - name: "span"
        type: "Span"

    semantic_consumer:
      - "quantum measurement semantics"
      - "effect analysis"
      - "capability validation"

    status: "migration_required"

    tests:
      required:
        - "grammar/tests/ast/quantum/measurement"

    freeze:
      requires:
        - "measurement represented structurally"
        - "measurement effect preserved"
        - "measurement capability requirement preserved"

  - id: "AST-Q-003"
    grammar_owner: "grammar/quantum/controls.g4"
    grammar_symbols:
      - "quantumControl"
      - "controlledOperation"

    ast_boundary: "canonical"
    ast_kind: "QuantumOperationModifier"

    representation:
      rule: >
        Controls are represented as structured operation metadata and are not
        lowered to physical routing during AST construction.

    fields:
      - name: "controls"
        type: "ordered Expression collection"
      - name: "condition"
        type: "optional Expression"
      - name: "span"
        type: "Span"

    semantic_consumer: "quantum semantic model"

    IR_consumer: "quantum::ir"

    status: "migration_required"

    tests:
      required:
        - "grammar/tests/ast/quantum/controls"

    freeze:
      requires:
        - "control semantics preserved"
        - "no physical qubit assignment"

  - id: "AST-Q-004"
    grammar_owner: "grammar/quantum/error-correction.g4"
    grammar_symbols:
      - "errorCorrectionRequirement"
      - "logicalQubit"
      - "codeDistance"

    ast_boundary: "canonical"
    ast_kind: "QuantumResilienceIntent"

    representation:
      canonical:
        "frontend AST quantum resilience/resource intent node"

    fields:
      - name: "code"
        type: "qualified identifier or symbolic specification"
      - name: "distance"
        type: "Expression"
      - name: "logical_resources"
        type: "resource expression collection"
      - name: "capabilities"
        type: "capability reference collection"
      - name: "attributes"
        type: "attribute collection"
      - name: "span"
        type: "Span"

    semantic_consumer:
      - "quantum resilience semantics"
      - "resource analysis"

    IR_consumer: "quantum::ir"

    status: "migration_required"

    tests:
      required:
        - "grammar/tests/ast/quantum/error-correction"
        - "grammar/conformance/ast/quantum/resilience"

    freeze:
      requires:
        - "distance preserved as source expression"
        - "no physical-code selection during parsing"
        - "resource intent preserved"

