# =============================================================================
# 34. COMPILE AST
# =============================================================================

  - id: "AST-COMPILE-001"
    grammar_owner: "grammar/compile/"
    grammar_symbols:
      - "compileDirective"
      - "targetRequirement"
      - "optimizationHint"
      - "specialization"
      - "reproducibility"

    ast_boundary: "canonical"
    ast_kind: "CompilationIntent"

    fields:
      - name: "kind"
        type: "compilation intent category"
      - name: "value"
        type: "Expression or metadata"
      - name: "span"
        type: "Span"

    semantic_consumer:
      - "compilation policy"
      - "specialization analysis"

    status: "migration_required"

    tests:
      required:
        - "grammar/tests/ast/compile"

    freeze:
      requires:
        - "optimization hints cannot change semantics"
        - "target requirements remain declarative"
        - "target-specific realization remains downstream"

# =============================================================================
# 35. DIALECT AST
# =============================================================================

  - id: "AST-DIALECT-001"
    grammar_owner: "grammar/dialects/"
    grammar_symbols:
      - "dialectDeclaration"
      - "dialectReference"
      - "dialectVersion"

    ast_boundary: "canonical"
    ast_kind: "DialectReference"

    fields:
      - name: "namespace"
        type: "qualified identifier"
      - name: "version"
        type: "version expression"
      - name: "arguments"
        type: "ordered Expression collection"
      - name: "span"
        type: "Span"

    semantic_consumer:
      - "dialect resolution"
      - "compatibility validation"

    status: "migration_required"

    tests:
      required:
        - "grammar/tests/ast/dialects"

    freeze:
      requires:
        - "dialect identity preserved"
        - "dialect version preserved"
        - "dialect AST cannot bypass common semantic validation"

# =============================================================================
# 36. INTEROPERABILITY AST
# =============================================================================

  - id: "AST-INTEROP-001"
    grammar_owner: "grammar/interoperability/"
    grammar_symbols:
      - "ffiDeclaration"
      - "abi"
      - "foreignFunction"
      - "foreignType"
      - "callingConvention"

    ast_boundary: "canonical"
    ast_kind: "InteropDeclaration"

    fields:
      - name: "kind"
        type: "interop category"
      - name: "name"
        type: "Identifier"
      - name: "signature"
        type: "source-level signature"
      - name: "abi"
        type: "optional ABI identifier"
      - name: "calling_convention"
        type: "optional calling convention identifier"
      - name: "effects"
        type: "effect syntax"
      - name: "span"
        type: "Span"

    semantic_consumer:
      - "FFI validation"
      - "ABI compatibility"
      - "effect validation"

    status: "migration_required"

    tests:
      required:
        - "grammar/tests/ast/interoperability"

    freeze:
      requires:
        - "foreign operations are explicit"
        - "FFI effects are preserved"
        - "foreign implementation does not redefine core AST"

# =============================================================================
# 37. MACRO AST
# =============================================================================

  - id: "AST-MACRO-001"
    grammar_owner: "grammar/macros/"
    grammar_symbols:
      - "macroDeclaration"
      - "macroInvocation"
      - "macroExpansion"

    ast_boundary: "canonical"
    ast_kind: "MacroSyntax"

    fields:
      - name: "name"
        type: "Identifier"
      - name: "arguments"
        type: "ordered syntax/AST collection"
      - name: "body"
        type: "syntax representation"
      - name: "hygiene"
        type: "hygiene metadata"
      - name: "span"
        type: "Span"

    semantic_consumer:
      - "macro expansion"
      - "post-expansion AST validation"

    status: "migration_required"

    tests:
      required:
        - "grammar/tests/ast/macros"

    freeze:
      requires:
        - "macro expansion cannot bypass AST validation"
        - "hygiene preserved"
        - "source provenance preserved"

# =============================================================================
# 38. METAPROGRAMMING AST
# =============================================================================

  - id: "AST-META-001"
    grammar_owner: "grammar/metaprogramming/"
    grammar_symbols:
      - "quote"
      - "unquote"
      - "reflection"
      - "introspection"
      - "codeGeneration"

    ast_boundary: "canonical"
    ast_kind: "MetaOperation"

    fields:
      - name: "operation"
        type: "qualified identifier"
      - name: "payload"
        type: "syntax/Expression representation"
      - name: "effects"
        type: "effect syntax"
      - name: "capabilities"
        type: "capability references"
      - name: "policy"
        type: "optional PolicyReference"
      - name: "span"
        type: "Span"

    semantic_consumer:
      - "metaprogramming validation"
      - "effect checking"
      - "capability checking"
      - "policy checking"

    status: "migration_required"

    tests:
      required:
        - "grammar/tests/ast/metaprogramming"

    freeze:
      requires:
        - "reflection is controlled"
        - "code generation is effect/capability governed"
        - "generated source retains provenance"

# =============================================================================
# 39. SECURITY / SANDBOX AST
# =============================================================================

  - id: "AST-SECURITY-001"
    grammar_owner: "grammar/security/"
    grammar_symbols:
      - "authorization"
      - "permission"
      - "sandbox"
      - "trust"
      - "audit"
      - "securityConstraint"

    ast_boundary: "canonical"
    ast_kind: "SecurityIntent"

    fields:
      - name: "kind"
        type: "security intent category"
      - name: "expression"
        type: "Expression"
      - name: "scope"
        type: "source scope"
      - name: "span"
        type: "Span"

    semantic_consumer:
      - "security semantic validation"
      - "policy validation"

    status: "migration_required"

    tests:
      required:
        - "grammar/tests/ast/security"

    freeze:
      requires:
        - "AST represents requested security intent"
        - "actual authorization result remains downstream"
        - "no runtime secret material in AST"

# =============================================================================
# 40. DOMAIN OPERATION UNIVERSAL MODEL
# =============================================================================

domain_operation_model:

  purpose: >
    Prevent every computational domain from creating an independent AST
    hierarchy when a common structured operation is sufficient.

  canonical_shape:
    name:
      type: "qualified identifier"

    namespace:
      type: "optional qualified identifier"

    operands:
      type: "ordered Expression collection"

    parameters:
      type: "ordered Expression collection"

    results:
      type: "ordered result collection"

    attributes:
      type: "attribute collection"

    modifiers:
      type: "modifier collection"

    effects:
      type: "effect reference collection"

    capabilities:
      type: "capability reference collection"

    resources:
      type: "resource requirement collection"

    contracts:
      type: "contract collection"

    policies:
      type: "policy reference collection"

    provenance:
      type: "provenance metadata"

    span:
      type: "Span"

  applicable_domains:
    - "classical"
    - "quantum"
    - "HDL"
    - "hardware"
    - "AI"
    - "data"
    - "distributed"
    - "networking"
    - "accelerator"
    - "hybrid"
    - "future"

  invariant: >
    New operation names, vendors, algorithms, devices, accelerators, or
    future computational mechanisms must not require modification of the
    common AST structure merely because the operation is new.

# =============================================================================
# 41. SOURCE-LEVEL RESOURCE SCALABILITY
# =============================================================================

scalability_contract:

  open_world: true

  allowed:
    - "symbolic quantities"
    - "generic parameters"
    - "runtime quantities"
    - "resource expressions"
    - "capability expressions"
    - "abstract topology"
    - "dynamic dimensions"
    - "parameterized types"
    - "resource negotiation"

  prohibited_AST_limits:
    - "maximum qubit count"
    - "maximum CPU count"
    - "maximum GPU count"
    - "maximum FPGA count"
    - "maximum ASIC count"
    - "maximum node count"
    - "maximum memory"
    - "maximum thread count"
    - "maximum register width"
    - "maximum vector width"
    - "maximum tensor rank"
    - "maximum tensor dimension"
    - "maximum network size"
    - "maximum device count"
    - "maximum accelerator count"

  representation_rule: >
    A Rust integer type used internally by one compiler stage must never
    silently become a source-language capacity limit.

  failure_rule: >
    If a compiler implementation cannot represent a valid source construct,
    it must produce an explicit implementation/resource diagnostic rather
    than rejecting the construct through an undocumented AST limitation.

# =============================================================================
# 42. POCO-REAF AST CONTRACT
# =============================================================================

poco_reaf_contract:

  source_artifact:
    must_contain:
      - "source semantics"
      - "AST structure"
      - "source provenance"
      - "language version"
      - "dialect identity where applicable"
      - "resource requirements"
      - "capability requirements"
      - "effects"
      - "contracts"
      - "policies"

  must_not_contain:
    - "physical device selection"
    - "physical qubit allocation"
    - "backend instruction"
    - "scheduler decision"
    - "routing decision"
    - "calibration result"
    - "live hardware inventory"

  invariant: >
    The same AST semantics must remain valid when the realization target
    changes, provided the target satisfies the program's declared semantic
    requirements and policies.

  scaling:
    rule: >
      Program parameters may scale without changing the AST schema. The AST
      schema must not contain finite target capacities.

# =============================================================================
# 43. LEGACY AST MIGRATION
# =============================================================================

legacy_migration:

  legacy_boundary:
    path: "src/ast/mod.rs"
    role: "compatibility_boundary"

  canonical_boundary:
    path: "src/frontend/ast/node/mod.rs"
    role: "forward_AST_boundary"

  migration_rule: >
    New grammar features must map directly to the canonical frontend AST.
    They must not add new permanent semantic variants to the legacy monolithic
    AST merely for convenience.

  adapter:
    required: true
    owner: "src/frontend/ast/"
    responsibility:
      - "legacy_to_canonical conversion"
      - "canonical_to_legacy compatibility where required"
      - "source span preservation"
      - "semantic equivalence verification"

  legacy_changes:
    prohibited_without_migration_plan: true

  completion:
    condition: >
      The legacy AST can be removed only after all production grammar
      mappings, parser consumers, semantic consumers, tests, and downstream
      compiler stages consume the canonical frontend AST.

# =============================================================================
# 44. KNOWN IMPLEMENTATION GAPS
# =============================================================================

implementation_gaps:

  - id: "GAP-AST-001"
    issue: >
      The repository contains both src/ast/mod.rs and
      src/frontend/ast/node/.
    required_action: >
      Complete the canonical frontend AST migration and retain the old AST
      only as an explicit compatibility boundary.
    blocking: true

  - id: "GAP-AST-002"
    issue: >
      The legacy AST stores integer literals as i64 and floating literals
      as f64.
    required_action: >
      Introduce lossless source-level numeric literal representation before
      declaring numeric AST mappings permanently frozen.
    blocking: true

  - id: "GAP-AST-003"
    issue: >
      The legacy resolved Type representation uses fixed-width integer and
      floating variants.
    required_action: >
      Ensure resolved semantic representations do not impose source-language
      limits and distinguish implementation representation from language
      semantics.
    blocking: true

  - id: "GAP-AST-004"
    issue: >
      The legacy array type representation uses Option<usize>.
    required_action: >
      Preserve source-level array dimensions independently of host usize.
    blocking: true

  - id: "GAP-AST-005"
    issue: >
      Existing AST variants include several domain-specific constructs that
      may represent overlapping concepts.
    required_action: >
      Reconcile them through the common domain-operation model and the
      ownership registry.
    blocking: true

  - id: "GAP-AST-006"
    issue: >
      Multiple grammar filenames represent apparently overlapping concepts,
      including closure/closures, lambda/lambdas, array/array-types,
      map/map-types, and option/option-types.
    required_action: >
      Resolve ownership before AST mappings are marked stable.
    blocking: true

  - id: "GAP-AST-007"
    issue: >
      Some source constructs currently exist in parser/AST implementation
      without corresponding production-ready common semantic contracts.
    required_action: >
      Register each construct in ownership, exports, semantic mappings,
      diagnostics, compatibility, and this AST mapping contract.
    blocking: true

  - id: "GAP-AST-008"
    issue: >
      Some grammar domains require structured resource, capability, effect,
      policy, and provenance AST carriers that are not represented uniformly
      by the legacy AST.
    required_action: >
      Use canonical metadata/domain-operation nodes rather than adding
      independent AST systems.
    blocking: true

# =============================================================================
# 45. REJECTED AST DESIGN PATTERNS
# =============================================================================

rejected_patterns:

  - "one Rust enum variant for every vendor instruction"

  - "one Rust enum variant for every quantum gate"

  - "one AST node for every GPU model"

  - "one AST node for every QPU model"

  - "one AST node for every FPGA family"

  - "one AST node for every accelerator vendor"

  - "physical qubit IDs embedded in portable quantum AST"

  - "runtime resource counts embedded in AST"

  - "scheduler slots embedded in AST"

  - "routing results embedded in AST"

  - "fixed array dimension limits embedded in AST"

  - "fixed tensor rank limits embedded in AST"

  - "fixed machine width treated as language width"

  - "backend-specific IR represented as source AST"

  - "AST generated from a backend instead of source semantics"

# =============================================================================
# 46. AST -> SEMANTIC INTEGRATION
# =============================================================================

semantic_integration:

  required_sequence:
    - "parse"
    - "construct AST"
    - "validate AST structure"
    - "resolve names"
    - "resolve types"
    - "validate effects"
    - "validate capabilities"
    - "validate resources"
    - "validate contracts"
    - "validate policies"
    - "validate provenance"
    - "construct semantic model"

  AST_must_not_perform:
    - "type inference"
    - "target selection"
    - "resource negotiation"
    - "routing"
    - "scheduling"
    - "QEC realization"
    - "calibration"
    - "backend lowering"

  required_companion_contract:
    path: "grammar/contracts/semantic-mappings.yaml"

  invariant: >
    Every mapping in this file must have a corresponding semantic mapping
    before it may be marked STABLE.

# =============================================================================
# 47. AST -> IR INTEGRATION
# =============================================================================

IR_integration:

  required_sequence:
    - "AST"
    - "structural validation"
    - "semantic model"
    - "canonical IR"

  classical:
    IR: "Classical IR"
    mapping_contract: "grammar/contracts/ir-mappings.yaml"

  quantum:
    IR: "quantum::ir"
    mapping_contract: "grammar/contracts/ir-mappings.yaml"

  HDL:
    IR: "HDL/Hardware IR"
    mapping_contract: "grammar/contracts/ir-mappings.yaml"

  invariant: >
    AST nodes must never bypass semantic validation to directly become
    target-specific instructions.

  invariant_2: >
    No second canonical quantum IR may be introduced between the frontend AST
    and quantum::ir.

# =============================================================================
# 48. DIAGNOSTIC INTEGRATION
# =============================================================================

diagnostics:

  canonical_contract:
    path: "grammar/contracts/diagnostics.yaml"

  AST_diagnostics_must_identify:
    - "diagnostic code"
    - "source span"
    - "construct"
    - "expected structure"
    - "actual structure"
    - "relevant context"
    - "compatibility information where applicable"

  AST_diagnostics_must_not_depend_on:
    - "physical device IDs"
    - "runtime memory addresses"
    - "backend implementation details unless explicitly a downstream diagnostic"

  diagnostic_layers:
    syntax:
      owner: "parser/frontend"
    structural:
      owner: "AST validation"
    semantic:
      owner: "semantic analysis"
    resource:
      owner: "resource validation"
    target:
      owner: "compiler/realization"
    runtime:
      owner: "runtime"

# =============================================================================
# 49. COMPATIBILITY
# =============================================================================

compatibility:

  canonical_contract:
    path: "grammar/contracts/compatibility.yaml"

  AST_version:
    required: true

  compatibility_identity:
    every_stable_mapping:
      required_fields:
        - "mapping_id"
        - "AST_kind"
        - "field_schema"
        - "source_span_policy"
        - "version"

  breaking_changes:
    examples:
      - "remove AST field"
      - "change field meaning"
      - "change source-to-node cardinality"
      - "change source ordering semantics"
      - "change literal precision semantics"
      - "change operation representation"
      - "change node identity semantics"

    required:
      - "version increment"
      - "migration specification"
      - "golden AST updates"
      - "compatibility tests"

  non_breaking:
    examples:
      - "new domain operation represented by existing generic operation node"
      - "new capability name"
      - "new resource kind"
      - "new dialect operation"
      - "new optional attribute"

# =============================================================================
# 50. TEST CONTRACT
# =============================================================================

tests:

  required_layers:

    lexer:
      directory: "grammar/tests/lexer/"
      required: true

    parser:
      directory: "grammar/tests/parser/"
      required: true

    AST:
      directory: "grammar/tests/ast/"
      required: true

    structural:
      directory: "grammar/conformance/ast/"
      required: true

    semantic:
      directory: "grammar/tests/semantic/"
      required: true

    IR:
      directory: "grammar/tests/ir/"
      required: true

    compatibility:
      directory: "grammar/tests/compatibility/"
      required: true

  every_mapping:
    positive_test: true
    negative_test: true
    span_test: true
    deterministic_test: true

  domain_tests:
    - "classical"
    - "quantum"
    - "HDL"
    - "hybrid"
    - "AI"
    - "data"
    - "concurrency"
    - "distributed"
    - "networking"
    - "hardware"
    - "execution"
    - "interoperability"
    - "dialects"
    - "macros"
    - "metaprogramming"
    - "security"

  scalability_tests:
    required: true
    rule: >
      Tests must vary symbolic/program resource quantities without changing
      the AST schema.

  no_fixed_capacity_test:
    required: true
    rejects:
      - "MAX_QUBITS"
      - "MAX_CPUS"
      - "MAX_CORES"
      - "MAX_THREADS"
      - "MAX_GPUS"
      - "MAX_FPGAS"
      - "MAX_ASICS"
      - "MAX_QPUS"
      - "MAX_NODES"
      - "MAX_MEMORY"
      - "MAX_STORAGE"
      - "MAX_REGISTER_WIDTH"
      - "MAX_VECTOR_WIDTH"
      - "MAX_TENSOR_RANK"
      - "MAX_NETWORK_SIZE"
      - "MAX_DEVICE_COUNT"

# =============================================================================
# 51. GOLDEN AST CONTRACT
# =============================================================================

golden:

  directory: "grammar/golden/ast/"

  every_stable_mapping:
    required: true

  golden_record:
    must_contain:
      - "source"
      - "mapping_id"
      - "AST_kind"
      - "field_structure"
      - "source_span"
      - "serialization_version"

  deterministic_serialization:
    required: true

  prohibited:
    - "memory addresses"
    - "hash iteration order"
    - "backend IDs"
    - "runtime handles"
    - "physical device identifiers"

# =============================================================================
# 52. MANIFEST / OWNERSHIP / EXPORT INTEGRATION
# =============================================================================

repository_integration:

  manifest:
    path: "grammar/MANIFEST.yaml"
    requirements:
      - "every mapped grammar file listed"
      - "every AST mapping ID listed"
      - "status synchronized"
      - "test paths synchronized"

  ownership:
    path: "grammar/contracts/ownership.yaml"
    requirements:
      - "grammar owner matches mapping"
      - "one owner per grammar concept"
      - "one AST semantic representation per concept"

  repository_ownership:
    path: "grammar/OWNERSHIP.yaml"
    requirements:
      - "mapping owner must exist"
      - "canonical owner must match"

  exports:
    path: "grammar/contracts/exports.yaml"
    requirements:
      - "every public export requiring AST mapping references this file"
      - "mapping IDs are unique"

  dependencies:
    path: "grammar/contracts/dependencies.yaml"
    requirements:
      - "grammar -> AST dependency explicit"
      - "AST -> semantic dependency explicit"
      - "AST -> tests dependency remains test-only"
      - "no AST -> backend upstream edge"

  status:
    path: "grammar/STATUS.yaml"
    requirements:
      - "AST status synchronized"
      - "stable requires freeze gates"

# =============================================================================
# 53. VALIDATOR CONTRACT
# =============================================================================

validator:

  executable_requirement:
    rule: >
      CI must validate this file mechanically. Human review alone is not
      sufficient for AST conformance.

  checks:

    unique_mapping_ids:
      severity: "error"

    owner_exists:
      severity: "error"

    owner_matches_registry:
      severity: "error"

    grammar_symbol_exists:
      severity: "error"

    one_AST_owner:
      severity: "error"

    source_span_declared:
      severity: "error"

    semantic_mapping_exists:
      severity: "error"

    IR_mapping_exists_when_required:
      severity: "error"

    diagnostic_contract_exists:
      severity: "error"

    compatibility_contract_exists:
      severity: "error"

    test_contract_exists:
      severity: "error"

    no_backend_fields:
      severity: "error"

    no_target_fields:
      severity: "error"

    no_capacity_constants:
      severity: "error"

    no_duplicate_semantics:
      severity: "error"

    no_host_width_language_limit:
      severity: "error"

    deterministic_structure:
      severity: "error"

    canonical_span:
      severity: "error"

    stable_requires_dependency_closure:
      severity: "error"

    stable_requires_all_tests:
      severity: "error"

    stable_requires_no_blocking_gaps:
      severity: "error"

# =============================================================================
# 54. FREEZE RULES
# =============================================================================

freeze:

  mapping_status_STABLE_requires:

    - "grammar owner frozen"
    - "grammar export frozen"
    - "AST representation frozen"
    - "source span mapping frozen"
    - "semantic mapping frozen"
    - "IR mapping frozen where applicable"
    - "diagnostic mapping frozen"
    - "compatibility identity assigned"
    - "positive tests passing"
    - "negative tests passing"
    - "source span tests passing"
    - "determinism tests passing"
    - "scalability audit passing"
    - "hard-coding audit passing"
    - "dependency closure passing"
    - "ownership audit passing"
    - "no duplicate semantic ownership"
    - "no blocking implementation gap"

  stable_means:
    rule: >
      The mapping interface may be consumed by downstream compiler stages
      without requiring semantic changes merely because a new target,
      operation, resource scale, algorithm, dialect, or backend is introduced.

  new_backend_rule:
    required: >
      Adding a backend must not require changing a frozen AST mapping unless
      the source language meaning itself changes.

  new_device_rule:
    required: >
      Adding a device must not require changing a frozen AST mapping.

  new_quantum_operation_rule:
    required: >
      Adding a quantum operation must use the existing extensible operation
      representation whenever its semantics fit that representation.

  new_resource_scale_rule:
    required: >
      Increasing a program resource quantity must not require changing AST
      structure.

# =============================================================================
# 55. PRODUCTION COMPLETION CRITERIA
# =============================================================================

production_ready:

  required:

    architecture:
      - "single canonical frontend AST boundary"
      - "legacy AST migration boundary explicitly controlled"
      - "one source concept -> one canonical AST meaning"

    grammar:
      - "every meaning-bearing production mapped"
      - "no orphan production"
      - "no duplicate semantic mapping"
      - "no hidden AST dependency"

    source_spans:
      - "every source construct mapped to Span"
      - "generated/synthetic provenance defined"

    semantics:
      - "every stable AST mapping has semantic mapping"
      - "types separated from TypeExpr"
      - "effects separated from runtime behavior"
      - "resources represented symbolically"
      - "capabilities represented declaratively"
      - "policies represented declaratively"

    domains:
      - "classical"
      - "quantum"
      - "HDL"
      - "hybrid"
      - "AI"
      - "data"
      - "concurrency"
      - "distributed"
      - "networking"
      - "hardware"
      - "execution"
      - "interoperability"
      - "dialects"

    quantum:
      - "generic operation representation"
      - "no closed gate enum"
      - "logical/physical separation"
      - "quantum::ir remains canonical downstream boundary"

    scalability:
      - "no finite universal hardware ceiling"
      - "no host-width semantic leakage"
      - "symbolic resource expressions supported"
      - "parameterized dimensions supported"

    safety:
      - "Rust 2021"
      - "Rust 1.97 or later"
      - "safe Rust only"
      - "no unsafe implementation dependency"

    testing:
      - "AST positive tests"
      - "AST negative tests"
      - "span tests"
      - "determinism tests"
      - "compatibility tests"
      - "scalability tests"
      - "domain tests"
      - "IR integration tests"

# =============================================================================
# 56. FINAL ARCHITECTURAL INVARIANT
# =============================================================================

final_invariant:

  source:
    statement: >
      Zamani source describes computation and its constraints.

  AST:
    statement: >
      The AST preserves that source meaning structurally and independently of
      physical realization.

  semantic_model:
    statement: >
      Semantic analysis determines whether the requested computation is valid
      and what it means.

  IR:
    statement: >
      Canonical IR represents validated computation before target realization.

  realization:
    statement: >
      Compiler and runtime components negotiate actual resources and perform
      target-specific lowering, routing, scheduling, resilience, and execution.

  scalability:
    statement: >
      Increasing available resources does not require changing the grammar or
      AST schema merely to represent the larger realization.

  portability:
    statement: >
      Changing CPU, GPU, FPGA, ASIC, accelerator, QPU, simulator, HPC,
      cluster, distributed environment, or future target does not require
      changing source AST semantics merely because the target changed.

  freeze:
    statement: >
      Once every mapping satisfies this contract and all companion contracts
      pass validation, grammar/contracts/ast-mappings.yaml itself can be
      frozen. Downstream implementation evolution must occur behind the
      declared AST interface rather than by silently changing source meaning.