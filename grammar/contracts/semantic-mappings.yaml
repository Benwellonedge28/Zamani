# =============================================================================
#
# Zamani Programming Language
#
# grammar/contracts/semantic-mappings.yaml
#
# =============================================================================
#
# PURPOSE
#
# Canonical machine-checkable contract connecting the Zamani source/AST model
# to the semantic model.
#
# This file defines:
#
#   1. semantic ownership;
#   2. AST -> semantic mappings;
#   3. structural-validation boundaries;
#   4. type/effect/capability/resource/contract/policy/provenance mappings;
#   5. classical/quantum/HDL/hybrid/data/AI/distributed/networking mappings;
#   6. semantic normalization rules;
#   7. target-independence rules;
#   8. scalability rules;
#   9. POCO-REAF rules;
#  10. diagnostics and validation integration;
#  11. canonical IR hand-off;
#  12. compatibility/versioning;
#  13. implementation-status gates;
#  14. freeze requirements.
#
# This file DOES NOT own:
#
#   - source grammar productions;
#   - lexer tokens;
#   - AST implementation structures;
#   - physical hardware;
#   - target selection;
#   - routing;
#   - scheduling;
#   - calibration;
#   - backend instructions;
#   - runtime resource availability;
#   - target-specific machine limits.
#
# Those responsibilities remain in their declared layers.
#
# =============================================================================

schema:
  version: "1.0"
  kind: "zamani-grammar-semantic-mapping-contract"
  format: "YAML"
  status: "NORMATIVE"
  repository: "Benwellonedge28/Zamani"
  language: "Zamani"
  root: "grammar/"
  canonical_file: "grammar/contracts/semantic-mappings.yaml"

  implementation:
    rust:
      edition: "2021"
      minimum_version: "1.97"
      supported_versions: "1.97-or-later"
      safety_policy: "safe-rust-only"
      unsafe_code: "forbidden"

  architecture:
    semantic_model: "target-independent"
    canonical_quantum_ir: "quantum::ir"
    canonical_classical_ir: "Classical IR"
    canonical_hardware_boundary: "HDL/Hardware IR"

  scalability:
    model: "open-world"
    meaning: >
      Zamani source semantics impose no artificial finite universal ceiling
      on computational scale. Concrete compilation and execution remain
      bounded by actual resources, implementation representation, explicit
      program constraints, deployment policy, and physical feasibility.

  poco_reaf:
    enabled: true
    name: "Program_Once_Compile_Once_Run_Everywhere_Anywhere_Forever"
    semantic_meaning: >
      Source meaning remains stable and target-independent while realization
      may be specialized according to capabilities, resources, constraints,
      policies, effects, topology, and execution environment.

# =============================================================================
# 1. AUTHORITY
# =============================================================================

authority:

  architecture:
    path: "grammar/DESIGN.md"
    role: "normative_architectural_authority"

  language_specification:
    path: "grammar/specification/"
    role: "normative_language_meaning"

  machine_specification:
    path: "grammar/spec/"
    role: "machine_checkable_language_contracts"

  ownership:
    path: "grammar/contracts/ownership.yaml"
    role: "canonical_concept_ownership"

  dependencies:
    path: "grammar/contracts/dependencies.yaml"
    role: "canonical_dependency_graph"

  exports:
    path: "grammar/contracts/exports.yaml"
    role: "canonical_export_registry"

  ast_mappings:
    path: "grammar/contracts/ast-mappings.yaml"
    role: "grammar_to_ast_contract"

  semantic_mappings:
    path: "grammar/contracts/semantic-mappings.yaml"
    role: "ast_to_semantic_contract"

  ir_mappings:
    path: "grammar/contracts/ir-mappings.yaml"
    role: "semantic_to_ir_contract"

  diagnostics:
    path: "grammar/contracts/diagnostics.yaml"
    role: "diagnostic_contract"

  compatibility:
    path: "grammar/contracts/compatibility.yaml"
    role: "compatibility_contract"

  feature_status:
    path: "grammar/contracts/feature-status.yaml"
    role: "feature_lifecycle_contract"

  semantic_boundaries:
    path: "grammar/validation/semantic-boundaries.md"
    role: "semantic_boundary_validation"

  source_spans:
    path: "grammar/spec/source-spans.md"
    role: "source_provenance_contract"

  implementation_status:
    path: "grammar/grammar.md"
    role: "derived_implementation_conformance_reference"
    normative: false

  historical_reference:
    path: "grammar/Zamani-Grammar.md"
    role: "historical_extended_reference"
    normative: false
    ownership_effect: "none"

# =============================================================================
# 2. AUTHORITY LAWS
# =============================================================================

authority_rules:

  semantic_mapping_is_not_grammar_ownership:
    severity: "error"
    rule: >
      A semantic mapping consumes grammar/AST concepts. It MUST NOT redefine
      their source syntax.

  semantic_mapping_is_not_AST_ownership:
    severity: "error"
    rule: >
      This file references AST structures but does not define Rust AST
      structures.

  one_semantic_owner:
    severity: "error"
    rule: >
      Every meaning-bearing source concept MUST have exactly one canonical
      semantic owner.

  no_parallel_semantic_models:
    severity: "error"
    rule: >
      Classical, quantum, HDL, AI, data, distributed, networking, accelerator,
      embedded, and future-domain constructs MUST integrate with the common
      semantic model rather than creating incompatible semantic universes.

  domain_extension_without_core_duplication:
    severity: "error"
    rule: >
      Domain extensions MAY add domain semantics but MUST reuse common types,
      effects, capabilities, resources, contracts, policies, provenance,
      execution intent, and compatibility mechanisms where applicable.

  semantic_before_realization:
    severity: "error"
    rule: >
      Source semantics MUST be validated before target realization.

  realization_not_semantics:
    severity: "error"
    rule: >
      Target selection, placement, routing, scheduling, calibration,
      instruction selection, and physical resource allocation MUST NOT be
      represented as universal source semantics.

  implementation_not_language_law:
    severity: "error"
    rule: >
      Limitations of the current Rust implementation MUST NOT redefine the
      normative Zamani language.

# =============================================================================
# 3. SEMANTIC PIPELINE
# =============================================================================

pipeline:

  stages:

    - id: "source"
      owner: "grammar/"
      input: "Zamani source"
      output: "source syntax"

    - id: "lexical"
      owner: "grammar/lexer/"
      input: "source text"
      output: "tokens"

    - id: "parsing"
      owner: "grammar/antlr/"
      input: "tokens"
      output: "parse structure"

    - id: "ast"
      owner: "grammar/contracts/ast-mappings.yaml"
      input: "parse structure"
      output: "domain-neutral AST"

    - id: "structural_validation"
      owner: "grammar/validation/"
      input: "AST"
      output: "structurally valid AST"

    - id: "name_resolution"
      owner: "semantic/name-resolution"
      input: "valid AST"
      output: "resolved semantic references"

    - id: "type_analysis"
      owner: "semantic/type-system"
      input: "resolved AST"
      output: "typed semantic model"

    - id: "effect_analysis"
      owner: "semantic/effects"
      input: "typed semantic model"
      output: "effect-annotated semantic model"

    - id: "capability_analysis"
      owner: "semantic/capabilities"
      input: "effect-annotated semantic model"
      output: "capability requirements"

    - id: "resource_analysis"
      owner: "semantic/resources"
      input: "capability requirements"
      output: "resource requirements and constraints"

    - id: "contract_analysis"
      owner: "semantic/contracts"
      input: "resource-aware semantic model"
      output: "contract-validated semantic model"

    - id: "policy_analysis"
      owner: "semantic/policies"
      input: "contract-validated semantic model"
      output: "policy-validated semantic model"

    - id: "provenance_analysis"
      owner: "semantic/provenance"
      input: "validated semantic model"
      output: "provenance-complete semantic model"

    - id: "domain_semantics"
      owner: "semantic/domains"
      input: "validated semantic model"
      output: "domain semantic representation"

    - id: "canonical_ir"
      owner: "src/ir/"
      input: "domain semantic representation"
      output:
        - "Classical IR"
        - "quantum::ir"
        - "HDL/Hardware IR"

    - id: "realization"
      owner: "compiler/runtime"
      input: "canonical IR"
      output: "target realization"

  invariant: >
    No later stage may require semantic reinterpretation of an earlier frozen
    source construct merely because a new target, backend, accelerator,
    device, dialect, algorithm, or resource scale is introduced.

# =============================================================================
# 4. SEMANTIC LAYERS
# =============================================================================

semantic_layers:

  source_semantics:
    owns:
      - "source meaning"
      - "program structure"
      - "types"
      - "operations"
      - "control flow"
      - "effects"
      - "requirements"
      - "capabilities"
      - "resources"
      - "contracts"
      - "policies"
      - "provenance"
      - "execution intent"

  structural_semantics:
    owns:
      - "well-formedness"
      - "scope structure"
      - "declaration consistency"
      - "grammar-derived invariants"

  language_semantics:
    owns:
      - "name resolution"
      - "type semantics"
      - "evaluation semantics"
      - "effect semantics"
      - "capability semantics"
      - "resource semantics"
      - "contract semantics"
      - "policy semantics"
      - "domain semantics"

  canonical_ir_semantics:
    owns:
      - "target-independent executable meaning"
      - "canonical operation representation"
      - "semantic dependencies"
      - "semantic effects"
      - "semantic capabilities"
      - "semantic resource requirements"

  target_realization:
    owns:
      - "target discovery"
      - "capability matching"
      - "resource negotiation"
      - "placement"
      - "routing"
      - "scheduling"
      - "lowering"
      - "calibration"
      - "backend selection"
      - "device-specific execution"

# =============================================================================
# 5. UNIVERSAL SEMANTIC ENTITY
# =============================================================================

semantic_entity:

  required_identity:
    - "stable semantic identifier"
    - "source provenance"
    - "semantic kind"
    - "language version"
    - "domain"

  optional_identity:
    - "dialect"
    - "dialect version"
    - "generated origin"
    - "specialization identity"

  required_properties:
    - "source meaning"
    - "semantic dependencies"
    - "effects"
    - "capabilities"
    - "resources"
    - "contracts"
    - "policies"
    - "provenance"

  forbidden_properties:
    - "physical_device_id"
    - "physical_core_id"
    - "physical_gpu_id"
    - "physical_fpga_location"
    - "physical_asic_cell"
    - "physical_qubit_id"
    - "runtime_pointer"
    - "memory_address"
    - "scheduler_slot"
    - "routing_assignment"
    - "calibration_state"
    - "live_device_count"

  identity_invariant: >
    Semantic identity MUST NOT depend on the machine on which the semantic
    representation is compiled or executed.

# =============================================================================
# 6. SOURCE PROVENANCE
# =============================================================================

provenance:

  canonical_source:
    specification: "grammar/spec/source-spans.md"
    implementation: "src/source_map.rs"

  required:
    - "source span"
    - "origin kind"
    - "source revision when required"
    - "transformation provenance for generated/desugared nodes"

  origin_kinds:
    - "source"
    - "generated"
    - "synthetic"
    - "desugared"
    - "imported"
    - "macro_expansion"

  invariant: >
    Semantic entities MUST retain enough provenance to produce deterministic
    diagnostics and explain transformations back to source constructs.

  forbidden_provenance:
    - "memory address"
    - "device address"
    - "physical qubit identity"
    - "scheduler identity"
    - "backend-private pointer"

# =============================================================================
# 7. MAPPING SCHEMA
# =============================================================================

mapping_schema:

  required_fields:
    - "id"
    - "grammar_owner"
    - "grammar_symbols"
    - "ast_mapping"
    - "semantic_owner"
    - "semantic_kind"
    - "semantic_contract"
    - "dependencies"
    - "effects"
    - "capabilities"
    - "resources"
    - "contracts"
    - "policies"
    - "provenance"
    - "ir_boundary"
    - "status"
    - "tests"
    - "freeze"

  optional_fields:
    - "dialect"
    - "feature_gate"
    - "normalization"
    - "desugaring"
    - "diagnostics"
    - "compatibility"
    - "deprecation"

  status_values:
    - "HISTORICAL"
    - "REJECTED"
    - "PROPOSED"
    - "PLANNED"
    - "EXPERIMENTAL"
    - "PARTIALLY_IMPLEMENTED"
    - "IMPLEMENTED"
    - "CONFORMANT"
    - "STABLE"
    - "DEPRECATED"

  stable_requires:
    - "normative specification exists"
    - "unique grammar owner"
    - "unique semantic owner"
    - "AST mapping exists"
    - "dependencies are frozen"
    - "semantic invariants are defined"
    - "effects are defined"
    - "capabilities are defined where applicable"
    - "resources are defined where applicable"
    - "contracts are defined where applicable"
    - "policies are defined where applicable"
    - "provenance is defined"
    - "IR mapping exists where applicable"
    - "diagnostics exist"
    - "compatibility contract exists"
    - "positive tests exist"
    - "negative tests exist"
    - "scalability audit passes"
    - "hard-coding audit passes"
    - "target-independence audit passes"

# =============================================================================
# 8. COMMON SEMANTIC CONTRACT
# =============================================================================

common_contract:

  every_meaningful_construct:
    must_resolve_to:
      - "semantic kind"
      - "semantic identity"
      - "source provenance"

  may_reference:
    - "types"
    - "values"
    - "functions"
    - "modules"
    - "capabilities"
    - "resources"
    - "effects"
    - "contracts"
    - "policies"
    - "provenance"
    - "dialects"

  may_declare:
    - "constraints"
    - "preferences"
    - "requirements"
    - "effects"
    - "capabilities"
    - "resource requirements"
    - "contracts"
    - "policies"

  must_not_directly_select:
    - "CPU"
    - "GPU instance"
    - "FPGA device"
    - "ASIC device"
    - "QPU device"
    - "physical qubit"
    - "physical memory location"
    - "scheduler slot"
    - "routing path"
    - "backend instruction"

# =============================================================================
# 9. NAME AND PATH SEMANTICS
# =============================================================================

mappings:

  name:
    id: "semantic.name"
    grammar_owner: "grammar/core/names.g4"
    grammar_symbols:
      - "identifier"
      - "name"
    ast_mapping:
      contract: "grammar/contracts/ast-mappings.yaml"
      semantic_input: "Identifier"
    semantic_owner: "semantic/name-resolution"
    semantic_kind: "name"
    semantic_contract:
      identity: "lexical_name"
      resolution: "scope_and_namespace"
      shadowing: "language_defined"
      case_sensitivity: "language_defined"
    dependencies:
      - "core.names"
      - "core.scopes"
      - "modules.namespaces"
    effects: []
    capabilities: []
    resources: []
    contracts: []
    policies: []
    provenance: "source_span"
    ir_boundary: "metadata_only"
    status: "IMPLEMENTED"
    tests:
      positive:
        - "grammar/conformance/core/names/"
      negative:
        - "grammar/conformance/diagnostics/name-resolution/"
    freeze:
      required: true

  qualified_name:
    id: "semantic.qualified-name"
    grammar_owner: "grammar/core/qualified-names.g4"
    grammar_symbols:
      - "qualifiedName"
      - "path"
    ast_mapping:
      contract: "grammar/contracts/ast-mappings.yaml"
    semantic_owner: "semantic/name-resolution"
    semantic_kind: "qualified_name"
    semantic_contract:
      namespace_resolution: true
      deterministic: true
    dependencies:
      - "semantic.name"
      - "modules.namespaces"
    effects: []
    capabilities: []
    resources: []
    contracts: []
    policies: []
    provenance: "source_span"
    ir_boundary: "metadata_only"
    status: "IMPLEMENTED"
    tests:
      positive:
        - "grammar/conformance/core/qualified-names/"
      negative:
        - "grammar/conformance/diagnostics/name-resolution/"
    freeze:
      required: true

# =============================================================================
# 10. DECLARATION SEMANTICS
# =============================================================================

  declaration:
    id: "semantic.declaration"
    grammar_owner: "grammar/declarations/"
    grammar_symbols:
      - "declaration"
      - "item"
    ast_mapping:
      contract: "grammar/contracts/ast-mappings.yaml"
    semantic_owner: "semantic/declarations"
    semantic_kind: "declaration"
    semantic_contract:
      declares:
        - "name"
        - "kind"
        - "visibility"
        - "attributes"
        - "source_provenance"
      uniqueness: "scope-dependent"
    dependencies:
      - "semantic.name"
      - "semantic.types"
      - "semantic.visibility"
      - "semantic.attributes"
    effects: []
    capabilities: []
    resources: []
    contracts:
      - "declaration invariants"
    policies: []
    provenance: "source_span"
    ir_boundary: "semantic_declaration"
    status: "IMPLEMENTED"
    tests:
      positive:
        - "grammar/conformance/declarations/"
      negative:
        - "grammar/conformance/diagnostics/declarations/"
    freeze:
      required: true

  function:
    id: "semantic.function"
    grammar_owner: "grammar/functions/"
    grammar_symbols:
      - "function"
      - "functionDeclaration"
      - "parameters"
      - "returnType"
    ast_mapping:
      contract: "grammar/contracts/ast-mappings.yaml"
    semantic_owner: "semantic/functions"
    semantic_kind: "function"
    semantic_contract:
      includes:
        - "signature"
        - "generic_parameters"
        - "constraints"
        - "body"
        - "effects"
        - "contracts"
        - "capabilities"
        - "resource_requirements"
    dependencies:
      - "semantic.name"
      - "semantic.types"
      - "semantic.effects"
      - "semantic.resources"
      - "semantic.contracts"
    effects:
      source: "declared_or_inferred"
    capabilities:
      source: "declared_or_inferred"
    resources:
      source: "declared_or_inferred"
    contracts:
      source: "declared_and_inferred"
    policies:
      source: "inherited_and_declared"
    provenance: "source_span"
    ir_boundary: "function_semantic"
    status: "PARTIALLY_IMPLEMENTED"
    tests:
      positive:
        - "grammar/conformance/functions/"
      negative:
        - "grammar/conformance/diagnostics/functions/"
    freeze:
      required: true
      blocker_if_incomplete: true

# =============================================================================
# 11. TYPE SEMANTICS
# =============================================================================

  type:
    id: "semantic.type"
    grammar_owner: "grammar/types/"
    grammar_symbols:
      - "type"
      - "typeExpression"
    ast_mapping:
      contract: "grammar/contracts/ast-mappings.yaml"
    semantic_owner: "semantic/type-system"
    semantic_kind: "type"
    semantic_contract:
      responsibilities:
        - "type identity"
        - "type equality"
        - "type compatibility"
        - "generic substitution"
        - "bounds"
        - "constraints"
        - "variance"
        - "ownership properties"
        - "resource properties"
        - "domain properties"
    dependencies:
      - "semantic.name"
      - "semantic.declarations"
    effects: []
    capabilities: []
    resources: []
    contracts:
      - "type invariants"
    policies: []
    provenance: "source_span"
    ir_boundary: "canonical_type_representation"
    status: "PARTIALLY_IMPLEMENTED"
    tests:
      positive:
        - "grammar/conformance/types/"
      negative:
        - "grammar/conformance/diagnostics/types/"
    freeze:
      required: true
      blocker_if_incomplete: true

  generic_type:
    id: "semantic.generic-type"
    grammar_owner: "grammar/types/generic.g4"
    grammar_symbols:
      - "genericType"
      - "typeParameter"
      - "typeArguments"
      - "typeBounds"
    ast_mapping:
      contract: "grammar/contracts/ast-mappings.yaml"
    semantic_owner: "semantic/type-system/generics"
    semantic_kind: "generic_type"
    semantic_contract:
      supports:
        - "type parameters"
        - "value parameters where specified"
        - "bounds"
        - "constraints"
        - "associated semantics"
    dependencies:
      - "semantic.type"
      - "semantic.constraints"
    effects: []
    capabilities: []
    resources: []
    contracts: []
    policies: []
    provenance: "source_span"
    ir_boundary: "generic_type"
    status: "PARTIALLY_IMPLEMENTED"
    tests:
      positive:
        - "grammar/conformance/types/generics/"
      negative:
        - "grammar/conformance/diagnostics/types/generics/"
    freeze:
      required: true

  linear_type:
    id: "semantic.linear-type"
    grammar_owner: "grammar/types/linear.g4"
    grammar_symbols:
      - "linearType"
    ast_mapping:
      contract: "grammar/contracts/ast-mappings.yaml"
    semantic_owner: "semantic/type-system/linearity"
    semantic_kind: "linear_type"
    semantic_contract:
      usage: "resource-sensitive"
      consumption: "tracked_by_semantic_analysis"
      duplication: "restricted_by_type_rules"
    dependencies:
      - "semantic.type"
      - "semantic.resources"
      - "semantic.memory"
    effects: []
    capabilities: []
    resources:
      relationship: "resource_usage"
    contracts: []
    policies: []
    provenance: "source_span"
    ir_boundary: "linear_type"
    status: "PLANNED"
    tests:
      positive:
        - "grammar/conformance/types/linear/"
      negative:
        - "grammar/conformance/diagnostics/types/linear/"
    freeze:
      required: true

  affine_type:
    id: "semantic.affine-type"
    grammar_owner: "grammar/types/affine.g4"
    grammar_symbols:
      - "affineType"
    ast_mapping:
      contract: "grammar/contracts/ast-mappings.yaml"
    semantic_owner: "semantic/type-system/affinity"
    semantic_kind: "affine_type"
    semantic_contract:
      usage: "at_most_once"
    dependencies:
      - "semantic.type"
      - "semantic.memory"
    effects: []
    capabilities: []
    resources: []
    contracts: []
    policies: []
    provenance: "source_span"
    ir_boundary: "affine_type"
    status: "PLANNED"
    tests:
      positive:
        - "grammar/conformance/types/affine/"
      negative:
        - "grammar/conformance/diagnostics/types/affine/"
    freeze:
      required: true

# =============================================================================
# 12. EXPRESSION SEMANTICS
# =============================================================================

  expression:
    id: "semantic.expression"
    grammar_owner: "grammar/expressions/expressions.g4"
    grammar_symbols:
      - "expression"
      - "primaryExpression"
      - "unaryExpression"
      - "binaryExpression"
      - "callExpression"
      - "memberExpression"
      - "indexExpression"
    ast_mapping:
      contract: "grammar/contracts/ast-mappings.yaml"
    semantic_owner: "semantic/expressions"
    semantic_kind: "expression"
    semantic_contract:
      produces:
        - "value"
        - "type"
        - "effects"
        - "provenance"
      evaluation:
        order: "language-defined"
    dependencies:
      - "semantic.name"
      - "semantic.type"
      - "semantic.effects"
    effects:
      source: "operation-dependent"
    capabilities:
      source: "operation-dependent"
    resources:
      source: "operation-dependent"
    contracts: []
    policies: []
    provenance: "source_span"
    ir_boundary: "expression_semantics"
    status: "PARTIALLY_IMPLEMENTED"
    tests:
      positive:
        - "grammar/conformance/expressions/"
      negative:
        - "grammar/conformance/diagnostics/expressions/"
    freeze:
      required: true

  lambda:
    id: "semantic.lambda"
    grammar_owner: "grammar/expressions/lambda.g4"
    grammar_symbols:
      - "lambdaExpression"
    ast_mapping:
      contract: "grammar/contracts/ast-mappings.yaml"
      current_ast_symbol: "Expression::Lambda"
    semantic_owner: "semantic/functions/closures"
    semantic_kind: "lambda"
    semantic_contract:
      captures: "semantic"
