# =============================================================================
# 40. IR HAND-OFF CONTRACT
# =============================================================================

ir_handoff:

  rule: >
    A semantic mapping may hand information to canonical IR only after the
    semantic construct has been validated. IR must preserve required source
    meaning without introducing target-specific decisions prematurely.

  canonical_targets:

    classical:
      ir: "Classical IR"
      owner: "src/ir/"
      required_metadata:
        - "source"
        - "name"
        - "namespace"
        - "operands"
        - "parameters"
        - "results"
        - "attributes"
        - "modifiers"
        - "effects"
        - "capabilities"
        - "source_provenance"

    quantum:
      ir: "quantum::ir"
      owner: "src/quantum/"
      required_metadata:
        - "operation identity"
        - "operands"
        - "parameters"
        - "results"
        - "attributes"
        - "modifiers"
        - "effects"
        - "capabilities"
        - "resource requirements"
        - "source provenance"

    hdl:
      ir: "HDL/Hardware IR"
      owner: "src/hdl/ or canonical hardware IR owner"
      required_metadata:
        - "hardware intent"
        - "ports"
        - "signals"
        - "state"
        - "timing intent"
        - "constraints"
        - "source provenance"

  forbidden_ir_handoff:
    - "physical device selection"
    - "physical qubit allocation"
    - "backend instruction selection"
    - "scheduler slot"
    - "routing result"
    - "calibration data"
    - "live resource inventory"

# =============================================================================
# 41. TARGET-INDEPENDENCE CONTRACT
# =============================================================================

target_independence:

  semantic_layer_must_not_depend_on:
    - "specific CPU model"
    - "specific GPU model"
    - "specific FPGA model"
    - "specific ASIC implementation"
    - "specific QPU model"
    - "specific simulator implementation"
    - "specific cluster size"
    - "specific cloud provider"
    - "specific operating system"
    - "specific vendor device"

  allowed_as_semantic_data:
    - "abstract capability"
    - "abstract resource"
    - "abstract topology"
    - "explicit program requirement"
    - "explicit program prohibition"
    - "explicit program preference"
    - "explicit deployment policy"

  target_selection_boundary:
    semantic_layer: "requirements_and_constraints_only"
    compiler: "negotiation_and_specialization"
    runtime: "availability_and_realization"

# =============================================================================
# 42. SCALABILITY CONTRACT
# =============================================================================

scalability_contract:

  universal_rule: >
    Semantic mappings MUST remain valid when symbolic dimensions, resource
    quantities, data sizes, qubit counts, node counts, tensor dimensions,
    memory requirements, parallelism, or hardware resources grow beyond any
    value known when the grammar was written.

  allowed:
    - "symbolic dimensions"
    - "generic dimensions"
    - "runtime dimensions"
    - "resource expressions"
    - "capability expressions"
    - "abstract topology"
    - "dynamic allocation"
    - "parallel decomposition"
    - "distributed decomposition"
    - "target specialization"
    - "resource negotiation"

  prohibited:
    - "universal finite capacity constants"
    - "fixed machine inventory"
    - "vendor hardware as language law"
    - "implicit physical allocation"
    - "source-level scheduler limits"

  forbidden_universal_capacity_identifiers:
    - "MAX_QUBITS"
    - "MAX_CPUS"
    - "MAX_CORES"
    - "MAX_THREADS"
    - "MAX_GPUS"
    - "MAX_FPGAS"
    - "MAX_ASICS"
    - "MAX_QPUS"
    - "MAX_NODES"
    - "MAX_MEMORY"
    - "MAX_STORAGE"
    - "MAX_REGISTER_WIDTH"
    - "MAX_VECTOR_WIDTH"
    - "MAX_TENSOR_RANK"
    - "MAX_TENSOR_DIMENSION"
    - "MAX_NETWORK_SIZE"
    - "MAX_DEVICE_COUNT"
    - "MAX_ACCELERATOR_COUNT"
    - "MAX_AGENT_COUNT"

  equivalent_identifier_rule: >
    A differently named constant or hidden finite bound is subject to the
    same prohibition when it performs the same architectural function.

# =============================================================================
# 43. POCO-REAF CONTRACT
# =============================================================================

poco_reaf_contract:

  program_once:
    semantic_requirement: >
      A program expresses stable source meaning rather than a mandatory
      physical execution arrangement.

  compile_once:
    semantic_requirement: >
      Compilation produces or preserves a target-independent semantic artifact
      containing sufficient language, semantic, compatibility, provenance,
      capability, resource, effect, contract, and policy information.

  run_everywhere:
    semantic_requirement: >
      A realization is permitted when target capabilities and resources satisfy
      the semantic requirements and policies.

  run_anywhere:
    semantic_requirement: >
      Target discovery and realization occur outside universal source syntax.

  run_forever:
    semantic_requirement: >
      Long-term portability is maintained through versioned language semantics,
      AST contracts, semantic contracts, IR contracts, dialect contracts,
      compatibility rules, and migrations.

  semantic_preservation:
    required: true

  silent_semantic_change:
    allowed: false

  silent_approximation:
    allowed: false

  unsupported_feature_silent_fallback:
    allowed: false

# =============================================================================
# 44. ERROR AND DIAGNOSTIC INTEGRATION
# =============================================================================

diagnostics:

  canonical_contract:
    path: "grammar/contracts/diagnostics.yaml"

  every_semantic_error:
    required_fields:
      - "diagnostic_id"
      - "severity"
      - "source_span"
      - "semantic_kind"
      - "message"
      - "expected"
      - "actual"
      - "help_when_available"

  required_categories:
    - "name_resolution"
    - "type_error"
    - "effect_error"
    - "capability_error"
    - "resource_error"
    - "contract_error"
    - "policy_error"
    - "provenance_error"
    - "domain_semantic_error"
    - "compatibility_error"
    - "unsupported_realization"
    - "nonportable_construct"

  target_failure_rule: >
    A target inability to realize a valid source program MUST be diagnosed as
    a realization/compatibility/resource failure rather than by silently
    changing source semantics.

# =============================================================================
# 45. VALIDATION INTEGRATION
# =============================================================================

validation:

  pre_semantic:
    owner: "grammar/validation/"
    checks:
      - "AST structural validity"
      - "duplicate declarations"
      - "invalid references"
      - "invalid source structure"

  semantic:
    owner: "semantic/"
    checks:
      - "name resolution"
      - "type validity"
      - "effect validity"
      - "capability validity"
      - "resource validity"
      - "contract validity"
      - "policy validity"
      - "provenance validity"
      - "domain validity"

  scalability:
    required_checks:
      - "no universal finite capacity"
      - "symbolic resource acceptance"
      - "target independence"
      - "no hidden target selection"

  hardcoding:
    required_checks:
      - "forbidden capacity identifiers"
      - "equivalent finite bounds"
      - "vendor leakage"
      - "physical allocation leakage"

# =============================================================================
# 46. CROSS-CONTRACT INTEGRATION
# =============================================================================

integration:

  ownership:
    file: "grammar/contracts/ownership.yaml"
    rule: >
      Every semantic_owner referenced here MUST be represented in the
      repository ownership model.

  dependencies:
    file: "grammar/contracts/dependencies.yaml"
    rule: >
      Every dependency declared by a mapping MUST exist in the canonical
      dependency graph.

  exports:
    file: "grammar/contracts/exports.yaml"
    rule: >
      Every grammar symbol referenced here MUST be a registered export or an
      explicitly internal symbol permitted by the export contract.

  ast:
    file: "grammar/contracts/ast-mappings.yaml"
    rule: >
      Every mapping MUST resolve to an AST contract before becoming STABLE.

  ir:
    file: "grammar/contracts/ir-mappings.yaml"
    rule: >
      Every mapping marked as requiring IR MUST resolve to exactly one
      canonical IR boundary.

  diagnostics:
    file: "grammar/contracts/diagnostics.yaml"
    rule: >
      Every STABLE semantic mapping MUST have diagnostics coverage.

  compatibility:
    file: "grammar/contracts/compatibility.yaml"
    rule: >
      Every public STABLE semantic mapping MUST have a compatibility identity.

  feature_status:
    file: "grammar/contracts/feature-status.yaml"
    rule: >
      This file MUST NOT invent a lifecycle state that contradicts the central
      feature-status registry.

  specification:
    directory: "grammar/specification/"
    rule: >
      Every semantic mapping MUST be traceable to normative language meaning.

# =============================================================================
# 47. LEGACY AST INTEGRATION
# =============================================================================

legacy_ast:

  current_boundary:
    path: "src/ast/mod.rs"
    role: "compatibility_and_migration_boundary"

  rule: >
    Existing AST variants are not automatically canonical semantic contracts.

  known_current_domain_variants:
    examples:
      - "QuantumCircuit"
      - "NoiseModel"
      - "FidelityCheck"
      - "SurfaceCode"
      - "NanoAgent"
      - "EffectDeclaration"
      - "Unsafe"
      - "Wisdom"
      - "Omniversal*"
      - "AsiSystem"
      - "PaymentGateway"
      - "Graphics"
      - "Video"
      - "SelfAdjust"
      - "SelfVersioning"

  migration_rule: >
    Domain-specific or application-specific variants that are not part of the
    normative universal semantic model MUST be migrated to libraries,
    dialects, capabilities, policies, or application layers rather than being
    promoted into the permanent universal semantic core.

  safety_rule: >
    No semantic mapping may authorize source constructs that violate the
    repository-wide safe-Rust implementation contract.

  canonical_future_boundary:
    path: "src/frontend/ast/"
    status: "required_for_completion"

  freeze_requirement: >
    The legacy AST cannot be considered the final semantic authority until
    every stable grammar construct has an explicit canonical AST and semantic
    mapping.

# =============================================================================
# 48. APPLICATION-SPECIFIC CONCEPT BOUNDARY
# =============================================================================

application_boundary:

  universal_semantic_core:
    allowed:
      - "computation"
      - "data"
      - "reasoning"
      - "learning"
      - "communication"
      - "security"
      - "resources"
      - "capabilities"
      - "policies"
      - "contracts"
      - "provenance"
      - "execution intent"

  application_specific_features:
    integration:
      - "library"
      - "dialect"
      - "capability"
      - "policy"
      - "application semantic package"

  rule: >
    Application-specific functionality MUST NOT force new universal semantic
    primitives when the functionality can be expressed through the extension
    mechanisms already provided by the language.

# =============================================================================
# 49. DIALECT EXTENSIBILITY
# =============================================================================

dialect_extensibility:

  new_semantic_operation:
    must_supply:
      - "dialect identity"
      - "version"
      - "semantic kind"
      - "AST mapping"
      - "effects"
      - "capabilities"
      - "resources"
      - "contracts"
      - "policies"
      - "provenance"
      - "IR mapping"
      - "diagnostics"
      - "compatibility"
      - "tests"

  core_modification:
    required_only_when: >
      The proposed construct cannot be expressed through existing universal
      semantic abstractions and is demonstrably language-core functionality.

  vendor_extension:
    rule: >
      Vendor semantics MUST remain isolated behind dialect/capability/resource
      contracts and MUST NOT redefine universal source meaning.

# =============================================================================
# 50. DETERMINISM
# =============================================================================

determinism:

  semantic_mapping:
    required: true

  semantic_identity:
    must_not_depend_on:
      - "hash iteration order"
      - "filesystem traversal order"
      - "thread scheduling"
      - "memory addresses"
      - "target discovery order"

  resolution:
    imports: "deterministic"
    overloads: "language_defined"
    type_constraints: "deterministic"
    capability_matching: "realization_stage"

  exception:
    explicit_nondeterminism:
      allowed: true
      must_be_declared: true
      must_be_semantically_visible: true

# =============================================================================
# 51. REPRODUCIBILITY
# =============================================================================

reproducibility:

  semantic_identity:
    required_inputs:
      - "language version"
      - "dialect versions"
      - "semantic contract version"
      - "source provenance"
      - "declared policies"
      - "declared capabilities"
      - "declared resources"

  target_identity:
    not_required_for_source_semantics: true

  rule: >
    Reproducibility metadata must distinguish reproducibility of source
    semantics from reproducibility of a particular physical realization.

# =============================================================================
# 52. COMPATIBILITY
# =============================================================================

compatibility:

  semantic_versioning:
    required: true

  stable_mapping:
    requires:
      - "stable mapping ID"
      - "semantic version"
      - "compatibility policy"
      - "migration policy when applicable"

  breaking_change:
    examples:
      - "semantic meaning changes"
      - "effect meaning changes"
      - "type compatibility changes"
      - "resource requirement interpretation changes"
      - "capability meaning changes"
      - "contract meaning changes"
      - "policy meaning changes"

  nonbreaking_extension:
    examples:
      - "new dialect operation"
      - "new capability"
      - "new resource kind"
      - "new target realization"
      - "new backend"
    condition: >
      Existing semantic mappings retain their meaning.

# =============================================================================
# 53. TEST CONTRACT
# =============================================================================

tests:

  every_mapping:
    required:
      - "positive parse/semantic test"
      - "negative semantic test"
      - "source-span test"
      - "diagnostic test"

  domain_mappings:
    additionally_require:
      - "domain semantic test"
      - "IR hand-off test"
      - "target-independence test"

  scalable_mappings:
    additionally_require:
      - "symbolic-size test"
      - "resource-scaling test"
      - "absence-of-fixed-capacity test"

  quantum:
    additionally_require:
      - "operation identity test"
      - "parameter test"
      - "target abstraction test"
      - "measurement effect test"
      - "resource requirement test"

  hdl:
    additionally_require:
      - "symbolic width test"
      - "timing intent test"
      - "hardware realization separation test"

  interoperability:
    additionally_require:
      - "ABI boundary test"
      - "foreign effect test"
      - "compatibility test"

# =============================================================================
# 54. FREEZE CONTRACT
# =============================================================================

freeze:

  mapping_is_freezable_only_when:
    - "grammar owner is unique"
    - "semantic owner is unique"
    - "AST mapping is stable"
    - "dependencies are resolved"
    - "semantic contract is normative"
    - "effects are defined"
    - "capabilities are defined where applicable"
    - "resources are defined where applicable"
    - "contracts are defined where applicable"
    - "policies are defined where applicable"
    - "provenance is defined"
    - "IR boundary is defined"
    - "diagnostics are defined"
    - "compatibility is defined"
    - "tests exist"
    - "scalability audit passes"
    - "hard-coding audit passes"
    - "target-independence audit passes"
    - "safe-Rust implementation constraints pass"

  frozen_mapping_invariant: >
    Once STABLE, a semantic mapping MUST NOT require semantic redesign merely
    because a new hardware target, backend, device, dialect, algorithm,
    compiler optimization, runtime, or resource scale is added.

# =============================================================================
# 55. CI ENFORCEMENT
# =============================================================================

ci:

  required_validators:

    ownership:
      checks:
        - "semantic owner exists"
        - "semantic owner is unique"

    dependencies:
      checks:
        - "all dependencies exist"
        - "no production cycle"
        - "no backend dependency upstream"

    AST:
      checks:
        - "AST mapping exists"
        - "AST kind resolves"
        - "source span is supported"

    semantics:
      checks:
        - "semantic kind exists"
        - "semantic contract exists"
        - "semantic invariants exist"

    effects:
      checks:
        - "effect references resolve"

    capabilities:
      checks:
        - "capability references resolve"

    resources:
      checks:
        - "resource references resolve"
        - "no universal finite capacity"

    contracts:
      checks:
        - "contract references resolve"

    policies:
      checks:
        - "policy references resolve"

    provenance:
      checks:
        - "provenance is preserved"

    IR:
      checks:
        - "required IR mapping exists"
        - "IR boundary is canonical"

    diagnostics:
      checks:
        - "diagnostic coverage exists"

    compatibility:
      checks:
        - "stable identity exists"
        - "version contract exists"

    scalability:
      checks:
        - "no forbidden finite capacity"
        - "no target leakage"
        - "no physical allocation in semantic layer"

    implementation:
      checks:
        - "Rust edition is 2021"
        - "minimum Rust version is 1.97"
        - "safe-Rust policy is satisfied"

# =============================================================================
# 56. PRODUCTION READINESS GATE
# =============================================================================

production_gate:

  all_mappings:
    required:
      - "ownership"
      - "AST"
      - "semantic"
      - "dependencies"
      - "effects"
      - "capabilities"
      - "resources"
      - "contracts"
      - "policies"
      - "provenance"
      - "IR"
      - "diagnostics"
      - "compatibility"
      - "tests"

  universal_requirements:
    - "target independent"
    - "resource scalable"
    - "capability driven"
    - "policy aware"
    - "effect aware"
    - "provenance preserving"
    - "versioned"
    - "deterministic where required"
    - "safe-Rust compatible"

  failure_conditions:
    - "duplicate semantic owner"
    - "missing AST mapping"
    - "missing semantic owner"
    - "unresolved dependency"
    - "missing IR boundary"
    - "missing diagnostic contract"
    - "missing compatibility contract"
    - "hard-coded universal capacity"
    - "physical target leakage"
    - "silent semantic fallback"
    - "silent approximation"
    - "unsafe implementation requirement"

# =============================================================================
# 57. COMPLETION CRITERIA
# =============================================================================

completion:

  this_file_is_complete_when:

    authority:
      - "authority references resolve"
      - "no competing semantic-mapping authority exists"

    ownership:
      - "every mapping has exactly one semantic owner"

    grammar:
      - "every referenced grammar owner exists"
      - "every referenced grammar symbol is registered"

    AST:
      - "every stable mapping has a canonical AST mapping"

    semantics:
      - "every stable mapping has a complete semantic contract"

    integration:
      - "effects integrate"
      - "capabilities integrate"
      - "resources integrate"
      - "contracts integrate"
      - "policies integrate"
      - "provenance integrates"

    IR:
      - "every executable domain has a canonical IR boundary"

    diagnostics:
      - "every stable semantic failure has a diagnostic contract"

    compatibility:
      - "every stable semantic identity is versioned"

    scalability:
      - "no artificial universal finite capacity exists"

    portability:
      - "semantic meaning is independent of physical realization"

    safety:
      - "Rust implementation remains within the safe-Rust contract"

    tests:
      - "positive tests exist"
      - "negative tests exist"
      - "scalability tests exist"
      - "integration tests exist"

    freeze:
      - "CI validators pass"
      - "semantic mapping registry is synchronized with exports"
      - "dependency graph is synchronized"
      - "AST mappings are synchronized"
      - "IR mappings are synchronized"
      - "status registry is synchronized"

# =============================================================================
# 58. REQUIRED SYNCHRONIZATION
# =============================================================================

synchronization:

  canonical_relationship:

    grammar:
      source: "grammar/**/*.g4"

    ownership:
      source: "grammar/contracts/ownership.yaml"

    exports:
      source: "grammar/contracts/exports.yaml"

    ast:
      source: "grammar/contracts/ast-mappings.yaml"

    semantic:
      source: "grammar/contracts/semantic-mappings.yaml"

    ir:
      source: "grammar/contracts/ir-mappings.yaml"

    diagnostics:
      source: "grammar/contracts/diagnostics.yaml"

    compatibility:
      source: "grammar/contracts/compatibility.yaml"

    status:
      source: "grammar/contracts/feature-status.yaml"

  invariant: >
    No contract may silently invent a symbol, owner, semantic kind,
    dependency, AST node, IR node, diagnostic, or compatibility identity that
    is absent from the corresponding canonical registry.

# =============================================================================
# END OF CONTRACT
# =============================================================================