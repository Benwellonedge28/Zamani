=============================================================================

66. POCO-REAF CONTRACT

=============================================================================

poco_reaf:

name: "Program_Once_Compile_Once_Run_Everywhere_Anywhere_Forever"

diagnostic_guarantees:

source_portability:
  requirement: >
    Diagnostics MUST distinguish invalid source semantics from target
    realization limitations.

semantic_portability:
  requirement: >
    The same source semantic condition MUST retain the same canonical
    diagnostic identity across compatible targets.

target_portability:
  requirement: >
    Target-specific failures MUST be classified as target/resource/
    capability/realization conditions when appropriate.

scaling:
  requirement: >
    Diagnostics MUST remain valid as the program scales to different
    resource sizes without changing diagnostic semantics.

future_targets:
  requirement: >
    Adding a future target MUST NOT require changing existing universal
    diagnostic meanings merely because the target is new.

future_domains:
  requirement: >
    New domains MAY register diagnostics through the common contract
    without creating a separate diagnostic universe.

forbidden:

- "target-specific source error masquerading as universal syntax error"
- "resource shortage reported as malformed syntax"
- "capability absence reported as invalid grammar"
- "vendor error replacing canonical Zamani identity"
- "fixed machine capacity encoded into diagnostic semantics"
- "fixed diagnostic count encoded into language semantics"

