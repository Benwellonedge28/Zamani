70. FINAL ARCHITECTURAL INVARIANTS

=============================================================================

invariants:

- id: "DIAG-001"
  rule: >
  Every externally observable diagnostic has a stable canonical identity.

- id: "DIAG-002"
  rule: >
  Diagnostic meaning is independent of human-readable wording.

- id: "DIAG-003"
  rule: >
  Diagnostic phase identifies where the condition was detected.

- id: "DIAG-004"
  rule: >
  Diagnostic domain identifies which semantic subsystem owns the condition.

- id: "DIAG-005"
  rule: >
  Source locations use source identity plus canonical byte offsets.

- id: "DIAG-006"
  rule: >
  Line and column are presentation data derived from canonical source
  positions.

- id: "DIAG-007"
  rule: >
  Resource infeasibility is distinct from syntax invalidity.

- id: "DIAG-008"
  rule: >
  Capability absence is distinct from syntax invalidity.

- id: "DIAG-009"
  rule: >
  Target incompatibility is distinct from source semantic invalidity.

- id: "DIAG-010"
  rule: >
  Fallback behavior must be explicit and policy-authorized.

- id: "DIAG-011"
  rule: >
  Diagnostics are deterministic for equivalent compilation environments.

- id: "DIAG-012"
  rule: >
  Operational diagnostic budgets are not language-level capacity limits.

- id: "DIAG-013"
  rule: >
  No universal hardware capacity is encoded into diagnostic semantics.

- id: "DIAG-014"
  rule: >
  New domains and targets extend the diagnostic registry rather than
  replacing the diagnostic architecture.

- id: "DIAG-015"
  rule: >
  Quantum diagnostics converge through the canonical quantum::ir boundary.

- id: "DIAG-016"
  rule: >
  Rendering is separate from diagnostic data.

- id: "DIAG-017"
  rule: >
  LSP, CLI, compiler library and machine-readable diagnostics share
  canonical identity.

- id: "DIAG-018"
  rule: >
  Internal compiler failures are not falsely reported as user syntax
  errors.

- id: "DIAG-019"
  rule: >
  Production Rust integration uses Rust 1.97 or later and safe Rust only.

- id: "DIAG-020"
  rule: >
  A frozen diagnostic contract does not require semantic modification
  merely because a new target, backend, dialect, operation or computational
  domain is introduced.

- id: "DIAG-021"
  rule: >
  Diagnostic semantics remain valid from the smallest feasible computation
  to arbitrarily larger feasible computations as available resources grow.

- id: "DIAG-022"
  rule: >
  Long-term compatibility is based on stable codes, versioned contracts,
  structured fields and explicit migration rules.

- id: "DIAG-023"
  rule: >
  Diagnostic provenance may explain a decision without becoming a second
  diagnostic identity system.

- id: "DIAG-024"
  rule: >
  A diagnostic contract is complete only when syntax, AST, semantics, IR,
  compiler, tooling, target and runtime consumers can map to it without
  inventing competing meanings.

