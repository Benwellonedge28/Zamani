  code: "ZMN-INTERNAL-CONTRACT-MISMATCH"

ownership_mismatch:
  code: "ZMN-INTERNAL-OWNERSHIP-MISMATCH"

safety:
unsafe_rust_forbidden: true

panic_policy:
ordinary_diagnostic_handling:
panics: false

implementation_invariant:
  preferred_behavior: >
    Return a structured internal diagnostic or typed error rather than
    panicking during ordinary user-driven compilation.

invariant: >
An internal diagnostic MUST NOT be downgraded into a user-source error
merely to make the compiler appear to have accepted the failure.

