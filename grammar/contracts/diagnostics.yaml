=============================================================================

freeze:

file_status:
target: "STABLE"

prerequisites:

specification:
  - "grammar/spec/diagnostics.md is consistent"
  - "grammar/spec/source-spans.md is consistent"
  - "grammar/spec/source-map.md is consistent"

ownership:
  - "diagnostic ownership is unique"

dependencies:
  - "all dependencies resolve"

implementation:
  - "src/compiler/diagnostics.rs maps required fields"
  - "src/error_reporting.rs preserves canonical identity"
  - "LSP preserves canonical identity"
  - "quantum IR diagnostics remain source-map independent"

tests:
  - "diagnostic contract tests pass"
  - "determinism tests pass"
  - "hard-coding audit passes"
  - "compatibility tests pass"
  - "safe-Rust audit passes"

no_downstream_reedit_rule: >
Once this contract is frozen, downstream implementation files MUST adapt
through the declared diagnostic interface rather than requiring this
contract to be semantically rewritten for every new compiler pass,
hardware target, quantum operation, dialect, or backend.

freeze_definition: >
The file is frozen when its schema, ownership, domains, phases, severity
model, identity rules, location model, compatibility rules, scalability
rules and integration boundaries are stable and all implementation
mappings are dependency-closed.

