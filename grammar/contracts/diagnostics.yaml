26. INTERNAL COMPILER DIAGNOSTICS

=============================================================================

internal_diagnostics:

purpose: >
Report failures of compiler implementation invariants without falsely
attributing them to user source.

canonical_codes:

invariant:
  code: "ZMN-INTERNAL-INVARIANT"

