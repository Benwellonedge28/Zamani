=============================================================================

6. SEVERITY

=============================================================================

severity:

ERROR:
blocks_affected_success: true
meaning: >
The requested operation cannot be considered valid under the current
applicable conditions.

WARNING:
blocks_affected_success: false
meaning: >
The program remains potentially valid, but the condition may indicate
a defect, portability issue, deprecated behavior, suspicious construct,
or undesirable realization.

INFORMATION:
blocks_affected_success: false
meaning: >
Non-error information about compiler or realization behavior.

NOTE:
blocks_affected_success: false
meaning: >
Context associated with another diagnostic.

HINT:
blocks_affected_success: false
meaning: >
Optional actionable improvement or remediation information.

invariant:
- "WARNING MUST NOT silently change semantics."
- "INFORMATION MUST NOT be required for correctness."
- "NOTE SHOULD normally be attached to another diagnostic."
- "HINT MUST NOT imply invalidity by itself."

=============================================================================

7. DIAGNOSTIC IDENTITY

=============================================================================

identity:

canonical_format: "ZMN-<DOMAIN>-<CONDITION>"

domain_format:
pattern: "^[A-Z][A-Z0-9_]*$"

condition_format:
pattern: "^[A-Z][A-Z0-9_-]*$"

examples:
- "ZMN-LEX-INVALID-CHARACTER"
- "ZMN-LEX-INVALID-NUMBER"
- "ZMN-PARSE-UNEXPECTED-TOKEN"
- "ZMN-NAME-UNKNOWN-IDENTIFIER"
- "ZMN-TYPE-MISMATCH"
- "ZMN-EFFECT-UNDECLARED"
- "ZMN-RESOURCE-UNSATISFIED"
- "ZMN-CAPABILITY-MISSING"
- "ZMN-POLICY-DENIED"
- "ZMN-QUANTUM-INVALID-OPERATION"
- "ZMN-QUANTUM-RESOURCE-UNSATISFIED"
- "ZMN-HDL-INVALID-CONNECTION"
- "ZMN-IR-INVARIANT-VIOLATION"
- "ZMN-IR-LOWERING-UNSUPPORTED"
- "ZMN-TARGET-UNSUPPORTED"
- "ZMN-COMPAT-DEPRECATED"
- "ZMN-SAFETY-UNSAFE-DISALLOWED"
- "ZMN-INTERNAL-INVARIANT"

rules:

stable_code:
  requirement: >
    Every externally observable diagnostic MUST have a stable machine
    readable code.

code_not_message:
  requirement: >
    Tooling MUST identify diagnostics by code and structured fields, not
    by matching human-readable message text.

message_change:
  allowed: true
  requirement: >
    Human-readable wording MAY change while the stable diagnostic meaning
    remains represented by the same code.

semantic_identity:
  requirement: >
    Diagnostics representing the same semantic condition across CLI,
    compiler library, LSP, IDE, JSON and machine-readable output MUST
    retain the same diagnostic code.

no_backend_codes_as_language_codes:
  requirement: >
    Backend-native error identifiers MUST be retained as optional
    related machine data and MUST NOT replace the canonical Zamani
    diagnostic identity.

=============================================================================

8. CODE REGISTRY CONTRACT

=============================================================================

code_registry:

canonical_owner:
path: "grammar/contracts/diagnostics.yaml"

future_registry:
recommended_path: "grammar/contracts/diagnostic-codes.yaml"

registry_requirement:
requirement: >
A stable implementation MUST maintain one registry mapping every stable
diagnostic code to its domain, phase, default severity, meaning,
compatibility status and test coverage.

uniqueness:
rule: >
A diagnostic code MUST identify exactly one semantic condition.

reuse:
forbidden: >
A stable code MUST NOT be reused for a materially different condition.

reservation:
allowed: true
rule: >
Codes MAY be reserved before implementation, but reserved codes MUST
NOT be presented as implemented.

deprecation:
rule: >
Deprecated diagnostic codes MUST remain recognizable for the compatibility
period defined by grammar/compatibility/.

removal:
rule: >
Removing a stable code requires an explicit compatibility/migration
record.

collision_detection:
required: true

=============================================================================

9. DIAGNOSTIC STRUCTURE

=============================================================================

diagnostic:

required_fields:

code:
  type: "stable-diagnostic-code"
  required: true

severity:
  type: "severity"
  required: true

domain:
  type: "diagnostic-domain"
  required: true

phase:
  type: "diagnostic-phase"
  required: true

message:
  type: "human-readable-string"
  required: true

primary_location:
  type: "source-or-ir-location"
  required: false
  requirement: >
    A source location SHOULD be present whenever the diagnostic can be
    causally associated with source or IR location information.

origin:
  type: "diagnostic-origin"
  required: true

optional_fields:

labels:
  type: "ordered-label-list"

notes:
  type: "ordered-note-list"

help:
  type: "ordered-help-list"

related_information:
  type: "ordered-related-information-list"

suggestions:
  type: "ordered-suggestion-list"

machine_data:
  type: "structured-key-value-data"

semantic_identity:
  type: "semantic-identity"

provenance:
  type: "provenance-reference"

applicability:
  type: "applicability"

target_context:
  type: "target-context"

resource_context:
  type: "resource-context"

capability_context:
  type: "capability-context"

contract_context:
  type: "contract-context"

policy_context:
  type: "policy-context"

cause_chain:
  type: "ordered-diagnostic-reference-list"

fix:
  type: "machine-applicable-fix"

=============================================================================

10. ORIGIN

=============================================================================

origin:

allowed:

USER_SOURCE:
  meaning: "condition caused by user source"

SOURCE_ENVIRONMENT:
  meaning: "condition caused by source/environment integration"

COMPILER:
  meaning: "compiler-generated observation or validation result"

FRONTEND:
  meaning: "frontend subsystem"

SEMANTIC:
  meaning: "semantic analysis subsystem"

IR:
  meaning: "IR subsystem"

BACKEND:
  meaning: "backend subsystem"

TARGET:
  meaning: "target realization subsystem"

RUNTIME:
  meaning: "runtime subsystem"

TOOLING:
  meaning: "tooling integration"

INTERNAL:
  meaning: "implementation invariant failure"

invariant: >
An implementation invariant failure MUST NOT be reported as if the user
wrote invalid source unless the source itself is actually responsible.

=============================================================================

11. SOURCE LOCATION

=============================================================================

location:

canonical_model:

source:
  source_id:
    required: true
    meaning: "stable identity of the source unit"

  start:
    unit: "utf8-byte-offset"
    required: true

  end:
    unit: "utf8-byte-offset"
    required: true

line_column:
  role: "derived-presentation"
  canonical: false
  indexing:
    line: "1-based"
    column: "1-based"

rules:

byte_offsets_are_canonical: true

source_id_required_for_source_span: true

zero_length:
  allowed: true
  use:
    - "insertion point"
    - "missing token"
    - "missing delimiter"
    - "point diagnostic"

ordering:
  requirement: "start <= end"

same_source:
  requirement: >
    A normal contiguous source span MUST refer to one source identity.

unresolved_location:
  behavior: >
    If a source location cannot be resolved, the renderer MUST NOT invent
    line or column information.

internal_invalid_span:
  classification: "INTERNAL"
  requirement: >
    Invalid internal spans MUST be treated as compiler implementation
    failures rather than user syntax errors.

integration:

current_source_map:
  path: "src/source_map.rs"
  current_model:
    file_id: "FileId"
    start: "BytePos"
    end: "BytePos"
    line: "derived"
    column: "derived"

frontend_source_model:
  path: "src/frontend/ast/node/source/"
  requirement: >
    Frontend AST source spans MUST be convertible into the canonical
    diagnostic location model without losing source identity.

quantum_ir:
  path: "src/quantum/ir/validation/diagnostics.rs"
  requirement: >
    Quantum IR diagnostics MAY use IR-native locations. They MUST NOT
    require the frontend source-map implementation.

=============================================================================

12. SOURCE-SPAN SCALABILITY

=============================================================================

source_span_scalability:

semantic_model:
offsets: "unbounded-non-negative-integer-concept"
source_identity: "opaque-stable-identifier"

implementation_model:
rule: >
A concrete integer representation is an implementation concern and
MUST NOT define a language-level source-size ceiling.

overflow:
classification: "INTERNAL"
code: "ZMN-INTERNAL-SOURCE-OFFSET-OVERFLOW"
requirement: >
If an implementation cannot represent an otherwise valid source
location, it MUST report an implementation/resource limitation rather
than silently truncate or corrupt the location.

forbidden:
- "MAX_SOURCE_BYTES as a language rule"
- "MAX_DIAGNOSTIC_SPANS as a language rule"
- "MAX_RELATED_LOCATIONS as a language rule"
- "MAX_DIAGNOSTIC_CHILDREN as a language rule"

=============================================================================

13. RELATED LOCATIONS

=============================================================================

related_locations:

purpose: >
Explain causal relationships involving multiple source files, declarations,
definitions, imports, targets, IR nodes, resources or semantic facts.

location_roles:

PRIMARY:
  meaning: "most causally significant location"

SECONDARY:
  meaning: "supporting source location"

DEFINITION:
  meaning: "location of referenced definition"

USE:
  meaning: "location of reference"

PREVIOUS:
  meaning: "previous relevant declaration or state"

REQUIRED:
  meaning: "location identifying a required construct"

CONFLICT:
  meaning: "location participating in a conflict"

DERIVED:
  meaning: "location produced by transformation"

GENERATED:
  meaning: "generated source or artifact location"

IR:
  meaning: "IR-level location"

TARGET:
  meaning: "target-specific contextual location"

rules:
ordered: true
deterministic: true
explicit_labels_required: true

no_hidden_relationships: >
  A renderer MUST NOT require undocumented assumptions to understand why
  a secondary location is related.

=============================================================================

14. SEMANTIC IDENTITY

=============================================================================

semantic_identity:

purpose: >
Stable identity for a semantic condition independent of wording and
presentation.

components:

language:
  required: true

language_version:
  required: true

feature_or_domain:
  required: true

construct_identity:
  required: false

semantic_entity_identity:
  required: false

diagnostic_code:
  required: true

rule: >
Diagnostic identity MUST NOT depend on memory addresses, pointer values,
hash-map iteration order, process IDs, timestamps, random identifiers,
temporary filesystem paths, or target-local allocation addresses.

=============================================================================

15. RESOURCE DIAGNOSTICS

=============================================================================

resource_diagnostics:

central_rule: >
Resource infeasibility is not a syntax failure.

distinctions:

resource_requirement_invalid:
  example: >
    The source expresses a malformed or semantically invalid resource
    requirement.
  domain: "RESOURCE"
  phase: "RESOURCE"

resource_requirement_unsatisfied:
  example: >
    A required resource cannot currently be satisfied by the selected
    realization environment.
  domain: "RESOURCE"
  phase: "RESOURCE"

resource_budget_exhausted:
  example: >
    A compiler/runtime operational budget was exhausted.
  domain: "RESOURCE"
  phase: "TOOLING or RUNTIME"

target_unavailable:
  example: >
    The requested realization target cannot be reached.
  domain: "TARGET"
  phase: "TARGET"

canonical_codes:
malformed_requirement: "ZMN-RESOURCE-INVALID-REQUIREMENT"
unsatisfied_requirement: "ZMN-RESOURCE-UNSATISFIED"
constraint_conflict: "ZMN-RESOURCE-CONSTRAINT-CONFLICT"
preference_unmet: "ZMN-RESOURCE-PREFERENCE-UNMET"
budget_exhausted: "ZMN-RESOURCE-BUDGET-EXHAUSTED"

examples:
allowed:
- "requires qubits >= required_qubits"
- "requires memory >= required_memory"
- "requires capability("quantum.measurement")"
- "requires capability("gpu.compute")"
- "requires capability("tensor.compute")"
- "requires topology(required_topology)"

invariant: >
Diagnostics MUST NOT imply that a resource value is globally impossible
merely because one target or compiler configuration cannot provide it.

=============================================================================

16. CAPABILITY DIAGNOSTICS

=============================================================================

capability_diagnostics:

central_rule: >
A capability is distinct from a resource quantity and distinct from a
physical device identity.

distinctions:

unknown_capability:
  domain: "CAPABILITY"
  phase: "CAPABILITY"

unavailable_capability:
  domain: "CAPABILITY"
  phase: "CAPABILITY"

forbidden_capability:
  domain: "POLICY"
  phase: "POLICY"

capability_realization_failure:
  domain: "TARGET"
  phase: "TARGET"

canonical_codes:
malformed: "ZMN-CAPABILITY-INVALID"
missing: "ZMN-CAPABILITY-MISSING"
unavailable: "ZMN-CAPABILITY-UNAVAILABLE"
denied: "ZMN-CAPABILITY-DENIED"

invariant: >
A missing capability MUST NOT be reported as an invalid source construct
when the source requirement itself is valid.

=============================================================================

17. TARGET DIAGNOSTICS

=============================================================================

target_diagnostics:

purpose: >
Report failures or observations involving concrete target realization
without making target identity part of universal language semantics.

canonical_codes:

unsupported_target:
  code: "ZMN-TARGET-UNSUPPORTED"

incompatible_target:
  code: "ZMN-TARGET-INCOMPATIBLE"

realization_failed:
  code: "ZMN-TARGET-REALIZATION-FAILED"

target_unavailable:
  code: "ZMN-TARGET-UNAVAILABLE"

fallback_not_permitted:
  code: "ZMN-TARGET-FALLBACK-DENIED"

fallback_selected:
  code: "ZMN-TARGET-FALLBACK-SELECTED"
  severity: "INFORMATION"

invariant: >
A target diagnostic MUST distinguish inability to realize a program from
invalidity of the program's source semantics.

=============================================================================

18. FALLBACK DIAGNOSTICS

=============================================================================

fallback:

semantics:

explicit_only: true

