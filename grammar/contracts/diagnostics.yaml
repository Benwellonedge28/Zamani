path: "grammar/contracts/diagnostics.yaml"
responsibility:
- "machine-checkable diagnostic contract"
- "diagnostic schema"
- "diagnostic identity contract"
- "diagnostic domain registry"
- "diagnostic phase registry"
- "severity semantics"
- "source-location contract"
- "related-location contract"
- "diagnostic determinism"
- "diagnostic compatibility"
- "cross-stage diagnostic invariants"
- "diagnostic integration requirements"

implementation_owner:
primary:
- "src/compiler/diagnostics.rs"
- "src/error_reporting.rs"

source_mapping:
  - "src/source_map.rs"
  - "src/frontend/ast/node/source/"
  - "src/frontend/ast/node/validation/"

quantum_diagnostic_boundaries:
  - "src/quantum/frontend/core/diagnostics.rs"
  - "src/quantum/ir/validation/diagnostics.rs"

grammar_consumers:
lexical:
- "grammar/lexer/diagnostics.md"
- "grammar/lexer/lexer-errors.g4"

semantic:
  - "grammar/validation/"
  - "grammar/types/"
  - "grammar/effects/"
  - "grammar/resources/"
  - "grammar/policies/"
  - "grammar/security/"

domain:
  - "grammar/classical/"
  - "grammar/quantum/"
  - "grammar/hdl/"
  - "grammar/hybrid/"
  - "grammar/ai/"
  - "grammar/data/"
  - "grammar/concurrency/"
  - "grammar/distributed/"
  - "grammar/networking/"
  - "grammar/hardware/"

compilation:
  - "grammar/compile/"
  - "grammar/execution/"
  - "grammar/interoperability/"
  - "grammar/dialects/"

composition_is_not_ownership: true
implementation_is_not_ownership: true
backend_is_not_ownership: true
target_is_not_ownership: true

invariant: >
No grammar domain, compiler pass, backend, runtime, hardware target,
vendor implementation, or external dialect may silently create a
conflicting diagnostic architecture.

=============================================================================

2. DIAGNOSTIC PURPOSE

=============================================================================

purpose:

definition: >
A diagnostic is structured machine-readable information describing a
condition, observation, warning, failure, explanation, or actionable
remediation produced by a Zamani toolchain component.

data_first: true
rendering_is_presentation: true

diagnostic_is_not:
- "a parser-only object"
- "a Rust-only error string"
- "a terminal formatting artifact"
- "an LSP-only object"
- "a hardware error code"
- "a vendor-specific failure format"
- "an IR-specific error system"

diagnostic_must_survive:
- "CLI rendering"
- "library API"
- "LSP transport"
- "IDE integration"
- "JSON serialization"
- "machine-readable CI output"
- "compiler logs"
- "semantic analysis"
- "IR validation"
- "target realization"
- "runtime reporting"

=============================================================================

3. VALIDITY LAYERS

=============================================================================

validity:

ordered_layers:
- "SOURCE"
- "LEXICAL"
- "PARSE"
- "AST"
- "NAME"
- "MODULE"
- "TYPE"
- "OWNERSHIP"
- "MEMORY"
- "EFFECT"
- "CONTRACT"
- "POLICY"
- "RESOURCE"
- "CAPABILITY"
- "DOMAIN"
- "SEMANTIC"
- "IR_GENERATION"
- "IR_VERIFICATION"
- "OPTIMIZATION"
- "ROUTING"
- "SCHEDULING"
- "RESILIENCE"
- "QEC"
- "ZQN"
- "HAL"
- "TARGET"
- "RUNTIME"
- "TOOLING"
- "COMPATIBILITY"

distinctions:
lexical_valid:
distinct_from:
- "syntactic_valid"
- "semantic_valid"

syntactic_valid:
  distinct_from:
    - "semantic_valid"
    - "resource_feasible"
    - "target_compatible"

semantic_valid:
  distinct_from:
    - "compilable"
    - "target_compatible"
    - "resource_feasible"
    - "executable"

resource_feasible:
  distinct_from:
    - "syntactic_valid"
    - "semantic_valid"
    - "target_compatible"

target_compatible:
  distinct_from:
    - "resource_feasible"
    - "runtime_success"

runtime_success:
  distinct_from:
    - "compile_success"

invariant: >
A diagnostic MUST identify the actual failing or observational layer.
Implementations MUST NOT collapse materially different failure causes
into an undifferentiated compilation failure.

