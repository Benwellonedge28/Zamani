- "MAX_DIAGNOSTICS"
- "MAX_DIAGNOSTIC_SPANS"
- "MAX_DIAGNOSTIC_CHILDREN"

forbidden_equivalents:
rule: >
Renaming a forbidden universal capacity constant does not make the
capacity contractually valid.

allowed:
- "compiler operational budgets"
- "deployment resource budgets"
- "runtime safety budgets"
- "terminal rendering budgets"
- "LSP transport budgets"
- "user-declared program constraints"

invariant: >
Operational limits MUST remain configuration/policy data and MUST NOT be
interpreted as language semantics.

=============================================================================

49. DETERMINISM

=============================================================================

determinism:

required: true

same_inputs:
includes:
- "same source"
- "same source identities"
- "same language version"
- "same diagnostic contract version"
- "same compiler semantic environment"
- "same diagnostic policy"

expected:
- "same diagnostic codes"
- "same classifications"
- "equivalent locations"
- "same ordering"
- "same structured semantic identity"

allowed_variation:
- "human-readable wording when code/meaning remains stable"
- "presentation formatting"
- "ANSI color"
- "target-specific supplementary machine data"

forbidden_variation:
- "random diagnostic codes"
- "random ordering"
- "memory-address ordering"
- "thread-completion ordering"
- "hash-map iteration ordering"

=============================================================================

50. ERROR RECOVERY

=============================================================================

recovery:

parser:

requirement: >
  Parser recovery MAY continue after an error to discover additional
  independent diagnostics.

invariant: >
  Recovery MUST NOT manufacture semantic acceptance of malformed input.

semantic:

requirement: >
  Semantic analysis MAY continue after independent errors where safe.

invariant: >
  Error recovery MUST preserve deterministic diagnostics.

compiler:

requirement: >
  A diagnostic budget MAY terminate further analysis when configured, but
  the resulting budget condition MUST be explicit.

=============================================================================

51. DIAGNOSTIC SUPPRESSION

=============================================================================

suppression:

allowed: true

reasons:

- "duplicate"
- "user-configured"
- "diagnostic budget"
- "cascading error suppression"
- "tooling presentation policy"

rules:

semantic_identity_preserved: true

suppressed_count:
  recommended: true

hidden_errors:
  forbidden: >
    A tool MUST NOT present compilation as error-free merely because errors
    were suppressed.

canonical_budget_code:
"ZMN-TOOL-DIAGNOSTIC-BUDGET-EXHAUSTED"

=============================================================================

52. CASCADING DIAGNOSTICS

=============================================================================

cascading:

purpose: >
Prevent large numbers of secondary diagnostics caused solely by one
upstream failure.

allowed:
- "mark downstream diagnostics as dependent"
- "attach cause chain"
- "suppress known derivative diagnostics"

invariant: >
Suppression of a derivative diagnostic MUST NOT suppress an independent
semantic failure.

=============================================================================

53. DIAGNOSTIC QUALITY RULES

=============================================================================

quality:

required:

precise:
  rule: >
    Identify the most precise known failure condition.

layered:
  rule: >
    Identify the correct validation phase.

source_aware:
  rule: >
    Include source location whenever available.

machine_readable:
  rule: >
    Provide stable identity.

actionable:
  rule: >
    Provide remediation where reasonably derivable.

deterministic:
  rule: >
    Produce stable ordering and identity.

target_aware:
  rule: >
    Identify target realization failures separately from language errors.

scalable:
  rule: >
    Do not encode finite hardware or diagnostic capacities into language
    semantics.

=============================================================================

54. CROSS-DOMAIN RULE

=============================================================================

cross_domain:

requirement: >
Classical, quantum, HDL, hybrid, AI, data, distributed, networking,
accelerator and future domains MUST use the same diagnostic contract.

domain_specific_extension:
allowed: true

domain_specific_extension_rules:
- "must retain canonical diagnostic code"
- "must retain canonical severity"
- "must retain canonical phase"
- "must retain source/IR location when applicable"
- "must not create incompatible rendering semantics"
- "must not create a competing diagnostic identity system"

=============================================================================

55. DIALECT RULE

=============================================================================

dialects:

diagnostic_identity:
rule: >
A dialect MAY define additional diagnostics, but each diagnostic MUST
register with the canonical diagnostic architecture.

external_errors:
rule: >
External compiler/parser/backend errors MAY be attached as structured
machine data or related information.

canonical_translation:
required: true

opaque_external_error:
allowed: true
requirement: >
Opaque external errors MUST still receive a canonical Zamani diagnostic
code describing the integration-level condition.

=============================================================================

56. SAFETY

=============================================================================

safety:

rust:

unsafe:
  forbidden: true

unsafe_block:
  forbidden: true

unsafe_trait:
  forbidden: true

unsafe_impl:
  forbidden: true

diagnostic_handling:

ordinary_paths_must_not_panic: true

invalid_user_input_must_be_recoverable: true

malformed_machine_data_must_not_trigger_undefined_behavior: true

FFI:

rule: >
  Foreign interfaces MUST cross a validated safe abstraction boundary.
  The diagnostic contract itself MUST remain safe-Rust compatible.

=============================================================================

57. SECURITY

=============================================================================

security:

diagnostic_content:

secrets:
  must_not_leak: true

credentials:
  must_not_leak: true

private_keys:
  must_not_leak: true

tokens:
  must_not_leak: true

raw_sensitive_machine_data:
  policy_controlled: true

target_information:
requirement: >
Target information MAY be included when required to explain a failure,
subject to security policy.

provenance:
requirement: >
Provenance information MUST respect applicable security and privacy
policies.

=============================================================================

58. SOURCE REVISION AND STALE DIAGNOSTICS

=============================================================================

source_revision:

purpose: >
Prevent diagnostics or fixes generated for one source revision from being
incorrectly applied to another.

optional_fields:

source_revision:
  type: "stable-content-or-build-identity"

source_document_version:
  type: "tooling-defined"

fix_application:
stale_revision:
action: "reject"

diagnostic_display:
stale_diagnostic:
allowed: true
requirement: >
Tooling SHOULD identify when a diagnostic belongs to an older source
revision.

