=============================================================================

Zamani Programming Language

grammar/contracts/diagnostics.yaml

=============================================================================

MACHINE-CHECKABLE DIAGNOSTIC CONTRACT

Repository:

https://github.com/Benwellonedge28/Zamani

Language:

Zamani

Purpose:

Define the single machine-checkable contract for diagnostics emitted by

the Zamani language toolchain from source processing through execution.

Architectural authority:

grammar/DESIGN.md

Normative language authority:

grammar/specification/

Machine-contract authority:

grammar/spec/

Repository ownership:

grammar/OWNERSHIP.yaml

Repository manifest:

grammar/MANIFEST.yaml

Dependency graph:

grammar/DEPENDENCIES.yaml

Status:

grammar/STATUS.yaml

Rust:

edition: 2021

minimum: 1.97

safety: safe Rust only

POCO-REAF:

Program_Once_Compile_Once_Run_Everywhere_Anywhere_Forever

IMPORTANT:

This contract does not define a universal finite number of diagnostics,

source bytes, AST nodes, targets, qubits, processors, devices, resources,

messages, related locations, or semantic objects.

Implementations MAY impose operational budgets for safety, availability,

memory consumption, terminal output, IDE transport, or hostile input.

Such budgets are implementation/deployment policy and MUST NOT become

language-level semantic limits.

=============================================================================

schema:
version: "1.0"
kind: "zamani-diagnostics-contract"
format: "yaml"
status: "NORMATIVE"
stable_identity: "diagnostic-contract-v1"
repository: "Benwellonedge28/Zamani"
language: "Zamani"

authority:
architectural:
path: "grammar/DESIGN.md"
role: "architectural_authority"

normative_language:
path: "grammar/specification/"
role: "language_meaning"

machine_contract:
path: "grammar/spec/"
role: "machine_oriented_contract"

ownership:
path: "grammar/OWNERSHIP.yaml"
role: "repository_ownership_registry"

dependencies:
path: "grammar/DEPENDENCIES.yaml"
role: "dependency_graph"

manifest:
path: "grammar/MANIFEST.yaml"
role: "repository_inventory"

status:
path: "grammar/STATUS.yaml"
role: "implementation_status"

historical_reference:
path: "grammar/Zamani-Grammar.md"
role: "non_normative_reference"
ownership_effect: false

navigation:
path: "grammar/README.md"
role: "navigation_only"
ownership_effect: false

