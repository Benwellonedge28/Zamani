28. DEDUPLICATION

=============================================================================

deduplication:

enabled_by_policy: true

fingerprint:

required_components:
  - "diagnostic_code"
  - "severity"
  - "domain"
  - "phase"
  - "primary_location"
  - "semantic_identity"
  - "stable_machine_data_identity"

forbidden_components:
  - "rendered_message_only"
  - "memory_address"
  - "process_id"
  - "timestamp"
  - "random_id"
  - "hash_map_iteration_order"

rule: >
Two diagnostics MUST NOT be considered duplicates merely because their
messages happen to be identical.

current_implementation_gap:
path: "src/compiler/diagnostics.rs"
issue: >
The current fingerprint includes level, code, message and span but not
domain, phase or semantic identity.

required_resolution:
  owner: "src/compiler/diagnostics.rs"
  action:
    - "extend the implementation fingerprint"
    - "preserve stable code identity"
    - "include structured semantic identity when available"
    - "do not use rendered text as the sole identity"

freeze_condition: >
  The implementation MUST satisfy the complete fingerprint contract
  before the diagnostics subsystem is declared STABLE.

=============================================================================

29. DETERMINISTIC ORDERING

=============================================================================

ordering:

deterministic: true

canonical_sort_keys:

- "source_id"
- "primary_start_offset"
- "primary_end_offset"
- "phase_ordinal"
- "domain"
- "severity_rank"
- "diagnostic_code"
- "semantic_identity"
- "stable_secondary_sequence"

source_less_diagnostics:
placement: "after source-located diagnostics unless caller specifies policy"

tie_breaking:
requirement: >
Equal primary sort keys MUST have a deterministic secondary ordering.

forbidden:
- "hash-map iteration order"
- "thread completion order"
- "target discovery order"
- "random order"
- "memory address order"

invariant: >
Identical source, language version, diagnostic policy and semantic
environment MUST produce equivalent diagnostic ordering.

=============================================================================

30. DIAGNOSTIC BUDGETS

=============================================================================

budgets:

purpose: >
Protect compiler and tooling processes from resource exhaustion without
defining language-level diagnostic capacity.

policy:

configurable: true
deployment_defined: true
language_semantic: false

supported_budget_kinds:

max_total_diagnostics:
  semantic_limit: false

max_error_diagnostics:
  semantic_limit: false

max_warning_diagnostics:
  semantic_limit: false

max_notes:
  semantic_limit: false

max_help_items:
  semantic_limit: false

max_rendered_bytes:
  semantic_limit: false

max_related_locations:
  semantic_limit: false

max_machine_data_bytes:
  semantic_limit: false

exhaustion_behavior:
required:
- "emit a deterministic budget diagnostic if possible"
- "preserve the fact that additional diagnostics were suppressed"
- "never claim that suppressed diagnostics do not exist"
- "never convert a budget condition into a source-language semantic fact"

canonical_code:
"ZMN-TOOL-DIAGNOSTIC-BUDGET-EXHAUSTED"

important_rule: >
Operational budgets MAY be finite. They MUST NOT appear as universal
language constants or grammar semantics.

