============================================================================

SYMBOL REGISTRY REQUIREMENT

============================================================================

This file defines ownership classes and canonical owners.

The detailed symbol-by-symbol registry belongs in:

grammar/contracts/ownership.yaml

The validator MUST generate/check that registry against actual ANTLR rules.

============================================================================

symbol_registry:

detailed_authority:
path: "grammar/contracts/ownership.yaml"

required_fields:
- "symbol"
- "owner"
- "kind"
- "status"
- "exports"
- "consumers"
- "ast_mapping"
- "semantic_mapping"
- "ir_mapping"

uniqueness:
key: "symbol"

validation:
duplicate_owner: "error"
missing_owner: "error"
missing_mapping: "error"
stale_owner: "error"
missing_file: "error"

============================================================================

DIRECTORY OWNERSHIP RULE

============================================================================

Every current grammar directory MUST either:

1. have an explicit ownership section here;

2. match a declared non-grammar artifact class;

3. be explicitly marked planned/quarantined;

4. be rejected as an invalid grammar directory.

============================================================================

directory_policy:

required_top_level_domains:

- "antlr"
- "lexer"
- "core"
- "modules"
- "declarations"
- "types"
- "memory"
- "expressions"
- "functions"
- "statements"
- "effects"
- "resources"
- "policies"
- "security"
- "validation"
- "classical"
- "data"
- "concurrency"
- "distributed"
- "networking"
- "hardware"
- "execution"
- "compile"
- "quantum"
- "hdl"
- "hybrid"
- "ai"
- "interoperability"
- "dialects"
- "macros"
- "metaprogramming"
- "compatibility"
- "specification"
- "spec"
- "tests"

additional_current_directories_requiring_classification:
- "filesystem"
- "mathematics"
- "nlp"
- "reference"

rule: >
No unclassified top-level directory may participate in canonical parser
composition.

============================================================================

PRODUCTION OWNERSHIP INVARIANTS

============================================================================

production_invariants:

- «»
  
  There is exactly one canonical public lexer boundary.

- «»
  
  There is exactly one canonical parser composition root.

- «»
  
  There is exactly one canonical top-level grammar composition root.

- «»
  
  Every token has one lexical owner.

- «»
  
  Every parser symbol has one grammar owner.

- «»
  
  Every semantic concept has one semantic owner.

- «»
  
  Grammar ownership does not imply semantic ownership.

- «»
  
  Grammar ownership does not imply runtime ownership.

- «»
  
  Grammar ownership does not imply hardware ownership.

- «»
  
  No grammar file owns physical target realization.

- «»
  
  No grammar file owns a competing IR.

- «»
  
  Quantum operations remain open-ended through the generic operation model.

- «»
  
  Resource requirements remain symbolic and capability-driven.

- «»
  
  Hardware limits remain environmental rather than universal language limits.

- «»
  
  New hardware does not require rewriting stable source-language ownership.

- «»
  
  New quantum operations do not require a new universal parser alternative
  when representable through the generic operation model.

- «»
  
  New domains can be introduced through dialects and semantic extensions
  without destabilizing the core language.

- «»
  
  Adaptation, reflection, and code generation remain policy/effect/capability
  controlled.

- «»
  
  Application-specific vocabulary does not automatically become universal
  syntax.

- «»
  
  Unsafe Rust is never required.

- «»
  
  Rust 1.97 or later remains the implementation baseline.

- «»
  
  A frozen grammar file is never reopened merely because a downstream target
  was added.

============================================================================

FINAL FREEZE GATE

============================================================================

final_gate:

ownership_is_production_ready_only_when:

- "all 878 current repository grammar entries have been classified"
- "manifest inventory is synchronized with Git"
- "all malformed paths are repaired or quarantined"
- "all duplicate concepts are explicitly resolved"
- "all canonical symbols have one owner"
- "all ownership records have dependency contracts"
- "all stable exports have AST mappings"
- "all stable exports have semantic mappings"
- "all applicable exports have canonical IR mappings"
- "all diagnostics have owners"
- "all tests have owners"
- "all compatibility contracts are defined"
- "all hard-coding audits pass"
- "all scalability audits pass"
- "all POCO-REAF audits pass"
- "ANTLR composition is deterministic"
- "no competing lexer exists"
- "no competing parser root exists"
- "no competing AST exists"
- "no competing semantic model exists"
- "no competing IR is introduced"
- "Rust 1.97+ integration is safe-only"
- "no unresolved ownership cycle exists"
- "no unclassified grammar directory participates in production"
- "CI verifies this file against the repository tree"

freeze_result:
success_state: "OWNERSHIP_FROZEN"
failure_state: "OWNERSHIP_AUDIT_REQUIRED"

============================================================================

END OF OWNERSHIP CONTRACT

