============================================================================

Zamani Programming Language

============================================================================

File:

grammar/OWNERSHIP.yaml

Purpose:

Canonical machine-readable ownership registry for grammar/.

This file answers:

"Which file owns which language concept?"

It is intentionally separate from:

MANIFEST.yaml       -> inventory + production gates

DEPENDENCIES.yaml   -> dependency DAG

STATUS.yaml         -> implementation/conformance status

specification/      -> normative human language meaning

spec/               -> machine-oriented semantic contracts

Ownership is a semantic boundary, not merely a filesystem convention.

============================================================================

PRODUCTION PRINCIPLE

============================================================================

Every language concept MUST have exactly one canonical owner.

A concept MAY be:

declared by one grammar;

composed by another grammar;

consumed by many grammars;

mapped to many AST/semantic/IR components;

but it MUST NOT have two competing canonical owners.

============================================================================

POCO-REAF

============================================================================

Ownership MUST preserve:

Program Once

->

Compile Once

->

Run Everywhere

->

Run Anywhere

->

Run Forever

Grammar ownership therefore describes portable source meaning.

It MUST NOT assign ownership of:

physical CPU selection

physical GPU selection

FPGA selection

ASIC selection

QPU selection

physical qubit allocation

routing

scheduling

calibration

target discovery

hardware inventory

runtime placement

Those belong downstream.

============================================================================

SCALABILITY

============================================================================

This registry is open-ended.

It MUST NOT encode universal finite implementation capacities.

Forbidden ownership concepts include, but are not limited to:

MAX_QUBITS

MAX_CPUS

MAX_CORES

MAX_THREADS

MAX_GPUS

MAX_FPGAS

MAX_ASICS

MAX_QPUS

MAX_NODES

MAX_MEMORY

MAX_STORAGE

MAX_REGISTER_WIDTH

MAX_VECTOR_WIDTH

MAX_TENSOR_RANK

MAX_TENSOR_DIMENSION

MAX_NETWORK_SIZE

MAX_DEVICE_COUNT

MAX_ACCELERATOR_COUNT

Equivalent renamed finite limits are equally forbidden.

Resource requirements MAY instead be expressed symbolically, for example:

requires qubits >= required_qubits

requires memory >= required_memory

requires capability("quantum.measurement")

requires capability("gpu.compute")

requires capability("tensor.compute")

requires topology(required_topology)

============================================================================

RUST IMPLEMENTATION CONTRACT

============================================================================

Repository implementation baseline:

Rust edition:       2021

Minimum Rust:       1.97

Preferred baseline: Rust 1.97.1 or later compatible stable Rust

Safety:

unsafe Rust is forbidden.

This ownership registry therefore MUST NOT assign any grammar concept to an

implementation that requires unsafe Rust.

ANTLR grammar files themselves contain no Rust implementation.

============================================================================

ANTLR ARCHITECTURE

============================================================================

There is exactly one public lexer boundary:

grammar/antlr/ZamaniLexer.g4

There is exactly one public parser composition root:

grammar/antlr/ZamaniParser.g4

There is exactly one top-level grammar composition root:

grammar/Zamani.g4

Lexical vocabulary is owned below:

grammar/lexer/

Parser leaf concepts are owned by their respective domain/foundation files.

============================================================================

AUTHORITY

============================================================================

Ownership is subordinate to language authority:

grammar/DESIGN.md

|

v

grammar/specification/

|

v

grammar/spec/

|

v

grammar/OWNERSHIP.yaml

|

v

modular grammar ownership

|

v

grammar/antlr/

|

v

grammar/Zamani.g4

Historical or aspirational documentation MUST NOT create ownership merely

by mentioning a concept.

============================================================================

MACHINE RULES

============================================================================

schema:
version: "1.0"
kind: "zamani-grammar-ownership"
format: "yaml"
repository: "Benwellonedge28/Zamani"
root: "grammar/"
language: "Zamani"

ownership_rules:

one_owner_per_symbol:
severity: "error"
rule: >
Every canonical grammar symbol MUST have exactly one owner.

one_owner_per_token:
severity: "error"
rule: >
Every emitted lexical token MUST have exactly one lexical owner.

one_owner_per_concept:
severity: "error"
rule: >
Semantically equivalent concepts MUST NOT be independently owned by
multiple files unless one is explicitly classified as compatibility,
deprecated, historical, generated, or test-only.

composition_is_not_ownership:
severity: "error"
rule: >
A dispatcher/composition grammar MAY consume or import another grammar
without becoming owner of the consumed symbols.

specification_is_not_grammar_ownership:
severity: "error"
rule: >
Documentation may define meaning but does not become an ANTLR symbol
owner.

implementation_is_not_grammar_ownership:
severity: "error"
rule: >
Rust implementation files consume grammar contracts; they do not create
competing source-language ownership.

backend_is_not_grammar_ownership:
severity: "error"
rule: >
Backend-specific implementation MUST NOT become owner of universal
source syntax.

target_independence:
severity: "error"
rule: >
Universal ownership MUST NOT depend on a particular physical target.

open_world:
severity: "error"
rule: >
Extensible domains MUST use identifiers, registries, capabilities,
dialects, metadata, and semantic contracts instead of finite grammar
enumerations where the concept is inherently open-ended.

frozen_interface:
severity: "error"
rule: >
Once an owner is frozen, downstream additions MUST integrate through its
declared exports and MUST NOT require semantic modification of the
frozen owner merely to support a new target, backend, device, or dialect.

dependency_direction:
severity: "error"
rule: >
Ownership dependencies MUST follow the canonical dependency DAG declared
by DEPENDENCIES.yaml.

no_circular_ownership:
severity: "error"
rule: >
Ownership MUST NOT create circular semantic authority.

no_hidden_exports:
severity: "error"
rule: >
A grammar MUST NOT expose a canonical symbol that is absent from its
ownership contract.

no_implicit_owner:
severity: "error"
rule: >
A symbol without an explicit owner is an audit failure.

