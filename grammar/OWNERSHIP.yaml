============================================================================

APPLICATION / LIBRARY BOUNDARY

============================================================================

application_boundary:

rule: >
Application-specific vocabulary is not automatically universal language
syntax.

preferred_extension_mechanisms:
- "standard library"
- "package"
- "module"
- "dialect"
- "capability"
- "policy"
- "interoperability boundary"

examples:
rule: >
Domain/application names should remain identifiers or registered
extension vocabulary unless explicitly made normative by the language
specification.

============================================================================

FILE-NAME / PATH NORMALIZATION

============================================================================

path_normalization:

canonical_filename_rules:
- "UTF-8"
- "no trailing whitespace"
- "no embedded newline"
- "no embedded carriage return"
- "no path containing source-code payload"
- "no whitespace-only distinction between canonical concepts"
- "lowercase kebab-case preferred for multiword grammar filenames"
- "filename must describe one stable ownership concept"

current_known_violations:
- "grammar/data/tensors.g4 "
- "grammar/effects/code_generation.g4 "
- "grammar/expressions/lambda.g4 "
- "grammar/interoperability/interoperability.g4 "
- "grammar/validation/grammar-validation.md "
- "grammar/types/associated types.g4"
- "grammar/types/functional dependencies.g4"
- "malformed embedded-content paths under grammar/types/array-types.g4"

rule: >
A path-normalization violation prevents STABLE ownership for the affected
file until corrected.

============================================================================

DUPLICATE-CONCEPT POLICY

============================================================================

duplicate_concepts:

expression_candidates:
- "closure / closures"
- "lambda / lambdas"
- "range / ranges"

type_candidates:
- "array / array-types"
- "map / map-types"
- "option / option-types / optional"
- "associated / associated types"
- "functional dependencies / normalized equivalent"

quantum_candidates:
- "states / quantum-states"
- "types / quantum-specific type extensions"
- "gates / operations"

rule: >
A duplicate candidate is not automatically erroneous, but it MUST be
explicitly classified before freeze.

allowed_classifications:
- "canonical"
- "compatibility"
- "deprecated"
- "historical"
- "test-only"
- "generated"
- "removed"
- "quarantined"

forbidden:
- "two simultaneous canonical owners for the same symbol"

============================================================================

FREEZE CONTRACT

============================================================================

freeze:

file_is_freezable_only_when:

ownership:
  - "every exported symbol has exactly one owner"
  - "does_not_own boundary is explicit"
  - "no competing owner exists"

dependencies:
  - "all imports are declared"
  - "dependency DAG is acyclic"
  - "all direct dependencies have stable contracts"

parser:
  - "ANTLR grammar composes successfully"
  - "no accidental ambiguity"
  - "no unintended left recursion"
  - "no unreachable exported rule"

lexical:
  - "all tokens have unique ownership"
  - "token vocabulary is canonical"

ast:
  - "AST mapping is complete"
  - "source spans are preserved"

semantics:
  - "semantic mapping is complete"
  - "types/effects/resources/capabilities/policies/provenance mappings are
    explicit where applicable"

ir:
  - "applicable canonical IR mapping is declared"
  - "no competing IR is introduced"

diagnostics:
  - "diagnostic ownership is declared"
  - "negative cases are tested"

compatibility:
  - "compatibility owner is declared"
  - "version/deprecation/migration behavior is known"

scalability:
  - "hard-coding audit passes"
  - "no finite machine ceiling is introduced"
  - "symbolic resource model remains open-ended"

poco_reaf:
  - "source meaning is target-independent"
  - "target constraints are explicit"
  - "fallback semantics are explicit where applicable"
  - "target realization remains downstream"

safety:
  - "Rust integration requires no unsafe"
  - "Rust baseline remains 1.97 or later"

tests:
  - "positive tests"
  - "negative tests"
  - "ambiguity tests"
  - "AST tests"
  - "semantic tests"
  - "portability tests"
  - "scalability tests where applicable"

post_freeze_rule: >
Adding a new downstream backend, hardware target, compiler optimization,
QPU, GPU, FPGA, ASIC, cluster, runtime, dialect, or future execution
environment MUST NOT require changing a frozen owner merely to represent
the new target.

============================================================================

INTEGRATION WITH MANIFEST.yaml

============================================================================

manifest_integration:

inventory_source:
owner: "grammar/MANIFEST.yaml"

ownership_source:
owner: "grammar/OWNERSHIP.yaml"

dependency_source:
owner: "grammar/DEPENDENCIES.yaml"

status_source:
owner: "grammar/STATUS.yaml"

contract_source:
owner: "grammar/contracts/"

required_consistency:
- "every manifest grammar file has an ownership record or matches an
explicitly declared directory ownership rule"
- "every ownership path exists in the repository or is explicitly marked
planned/quarantined"
- "every exported symbol is represented in the ownership registry"
- "every owner has a dependency record"
- "every stable owner has status evidence"
- "every quarantined path has a remediation record"

inventory_revision:
current_repository_grammar_file_count: 878
previous_manifest_claim: 877
correction_required: true

rule: >
The manifest count MUST be generated from the repository tree and MUST NOT
be manually trusted when it disagrees with Git.

============================================================================

INTEGRATION WITH RUST FRONTEND

============================================================================

rust_integration:

lexer:
consumer: "src/lexer.rs"
contract:
- "lexer token identity must remain synchronized with canonical lexical
ownership"
- "no duplicate semantic token mapping"
- "source spans preserved"

parser:
consumer: "src/parser.rs"
contract:
- "parser consumes canonical grammar meaning"
- "parser must not create a competing grammar authority"

ast:
consumer: "src/ast/"
contract:
- "every stable grammar construct has an AST representation or explicit
syntax-only classification"
- "domain-neutral AST remains canonical"

semantic:
consumer: "src/semantic/ where present"
contract:
- "semantic interpretation remains downstream from grammar"

ir:
consumer: "src/ir/ where present"
contract:
- "grammar owns no IR"
- "canonical IR boundaries remain outside grammar/"

safety:
