============================================================================

NON-GRAMMAR ARTIFACTS

============================================================================

The current repository contains directories under grammar/ that contain files

that are not valid ANTLR grammar ownership units.

They MUST NOT silently become part of the language grammar.

============================================================================

non_grammar_artifacts:

filesystem:
directory: "grammar/filesystem/"
current_files:
- "grammar/filesystem/file.g4"
status: "QUARANTINED_PENDING_CLASSIFICATION"
rule: >
Classify this as a genuine grammar domain, move it into the appropriate
owned domain, or mark it non-production. It MUST NOT be implicitly
imported into the universal parser.

mathematics:
directory: "grammar/mathematics/"
current_files:
- "grammar/mathematics/mathematic.g4"
status: "QUARANTINED_PENDING_CLASSIFICATION"
rule: >
Mathematics grammar must either be assigned a canonical domain owner or
become a dialect/library boundary.

nlp:
directory: "grammar/nlp/"
current_files:
- "grammar/nlp/nlp.g4"
status: "QUARANTINED_PENDING_CLASSIFICATION"
rule: >
NLP-specific syntax MUST NOT become universal core syntax without a
normative specification and explicit ownership decision.

reference:
directory: "grammar/reference/"
current_files:
- "grammar/reference/mod.rs"
status: "QUARANTINED_NON_ANTLR_ARTIFACT"
rule: >
Rust source does not belong inside the ANTLR grammar ownership tree.
Move it to the Rust source tree or explicitly classify it as tooling
metadata.

tests:
directory: "grammar/tests/"
current_files:
- "grammar/tests/mod.rs"
status: "QUARANTINED_NON_ANTLR_ARTIFACT"
rule: >
Rust test modules MUST NOT be treated as grammar owners. Grammar tests
belong to the conformance/test ownership layer.

============================================================================

SOURCE-LEVEL DOMAIN OWNERSHIP

============================================================================

domain_rules:

one_language:
rule: >
Classical, quantum, HDL, hardware, AI, data, distributed, networking,
accelerator, embedded, simulation, and future computation are domains of
one Zamani language.

shared_foundation:
every_domain_must_reuse:
- "core"
- "types"
- "expressions"
- "functions"
- "effects"
- "resources"
- "capabilities"
- "policies"
- "provenance"

no_parallel_semantics:
rule: >
A domain MUST NOT define an incompatible duplicate of the universal type,
effect, resource, capability, policy, provenance, or expression model.

semantic_pipeline:
- "source syntax"
- "domain-neutral AST"
- "structural validation"
- "semantic analysis"
- "canonical domain semantic representation"
- "canonical domain IR"
- "optimization"
- "lowering"
- "target negotiation"
- "routing"
- "scheduling"
- "resilience"
- "ZQN where applicable"
- "HAL"
- "target realization"

============================================================================

AST OWNERSHIP

============================================================================

ast:

grammar_rule:
owner: "src/ast/"
grammar_role: "syntax only"

invariant: >
No grammar file may define a competing AST model.

required_mapping:
every_exported_parser_construct:
- "AST node or explicit syntax-only classification"
- "source span preservation"
- "diagnostic mapping"
- "semantic mapping"

domain_rule: >
Domain-specific AST information must remain representable inside the
canonical domain-neutral AST architecture. Domain semantics are resolved
after parsing.

============================================================================

SEMANTIC OWNERSHIP

============================================================================

semantic:

owner: "repository semantic-analysis implementation"

grammar_role:
- "declare source syntax"
- "preserve source intent"
- "provide explicit resource/effect/capability/policy information"

semantic_layer_owns:
- "type checking"
- "name resolution"
- "effect checking"
- "capability checking"
- "resource feasibility"
- "contract checking"
- "policy evaluation"
- "provenance validation"
- "domain semantics"
- "compatibility validation"

grammar_must_not_own:
- "target discovery"
- "physical allocation"
- "scheduling"
- "routing"
- "calibration"
- "device selection"

============================================================================

IR OWNERSHIP

============================================================================

ir:

grammar_ownership:
rule: >
Grammar files own no IR definitions.

canonical_boundaries:
classical:
name: "Classical IR"
owner: "repository canonical classical IR implementation"

quantum:
  name: "quantum::ir"
  owner: "repository canonical quantum IR implementation"

hdl:
  name: "canonical HDL/Hardware semantic IR"
  owner: "repository canonical hardware/HDL IR implementation"

forbidden:
- "QuantumGateIR defined inside grammar/"
- "HardwareIR defined inside grammar/"
- "AIIR defined inside grammar/"
- "ResourceIR defined inside grammar/"
- "parallel vendor-specific IR owned by grammar"

