- "quarantined_artifact"

============================================================================

ROOT OWNERSHIP

============================================================================

roots:

grammar_root:
path: "grammar/Zamani.g4"
kind: "antlr_parser_root"
authority: "composition-only"

owns:
  - "program"
  - "sourceUnit"
  - "top-level item dispatch"
  - "universal expression dispatch where required"
  - "universal type dispatch where required"
  - "EOF"

does_not_own:
  - "tokens"
  - "keywords"
  - "operators"
  - "punctuation"
  - "domain-specific syntax"
  - "types"
  - "expressions"
  - "statements"
  - "quantum operations"
  - "HDL constructs"
  - "AI constructs"
  - "resource realization"
  - "hardware selection"
  - "IR"
  - "runtime"
  - "backend"

consumes:
  - "antlr/ZamaniParser.g4"

freeze_rule: >
  This file is frozen only after every required subordinate dispatcher has
  a stable ownership contract.

parser_root:
path: "grammar/antlr/ZamaniParser.g4"
kind: "antlr_parser_root"
authority: "canonical parser composition"

owns:
  - "canonical parser entry boundary"
  - "source-unit parser composition"
  - "universal declaration dispatch"
  - "universal statement dispatch"
  - "universal expression dispatch"
  - "universal type dispatch"
  - "cross-domain parser composition"

does_not_own:
  - "leaf syntax"
  - "tokens"
  - "lexer rules"
  - "semantic meaning"
  - "AST node definitions"
  - "IR"
  - "routing"
  - "scheduling"
  - "QEC"
  - "ZQN"
  - "HAL"
  - "hardware realization"

consumes:
  - "core dispatchers"
  - "declaration dispatcher"
  - "statement dispatcher"
  - "expression dispatcher"
  - "type dispatcher"
  - "domain dispatchers"

freeze_rule: >
  This root may be frozen only after all imported parser contracts are
  dependency-complete.

lexer_root:
path: "grammar/antlr/ZamaniLexer.g4"
kind: "antlr_lexer_root"
authority: "canonical public lexer boundary"

owns:
  - "public ZamaniLexer boundary"
  - "ANTLR lexer composition boundary"

does_not_own:
  - "individual tokens"
  - "keyword vocabulary"
  - "operators"
  - "punctuation"
  - "literal implementations"
  - "identifier implementation"
  - "parser rules"
  - "semantic analysis"

consumes:
  - "lexer/lexer.g4"

freeze_rule: >
  This file MUST contain no competing lexical vocabulary.

============================================================================

LEXICAL OWNERSHIP

============================================================================

lexical:

registry:
path: "grammar/lexer/tokens.g4"
kind: "lexical_registry"

owns:
  - "canonical token identity"
  - "token names"
  - "token categories"
  - "token registration metadata"

does_not_own:
  - "semantic meaning"
  - "AST nodes"
  - "parser productions"
  - "hardware realization"

invariant: >
  Every emitted token has exactly one registry identity.

lexer_composition:
path: "grammar/lexer/lexer.g4"
kind: "lexical_component"

owns:
  - "lexical component composition"
  - "canonical lexer grammar assembly"

delegates:
  - "tokens"
  - "keywords"
  - "operators"
  - "punctuation"
  - "identifiers"
  - "literals"
  - "comments"
  - "annotations"
  - "lexer diagnostics"

keywords:
path: "grammar/lexer/keywords.g4"
owns:
- "reserved-word lexical declarations"
- "contextual-keyword lexical declarations where applicable"

does_not_own:
