# ============================================================================
# DOMAIN DEPENDENCY ORDER
# ============================================================================

dependency_layers:

  layer_0_authority:
    - "grammar/DESIGN.md"
    - "grammar/specification/"
    - "grammar/spec/"

  layer_1_lexical:
    - "grammar/lexer/"
    - "grammar/antlr/ZamaniLexer.g4"

  layer_2_core:
    - "grammar/core/"
    - "grammar/modules/"
    - "grammar/declarations/"

  layer_3_types:
    - "grammar/types/"
    - "grammar/memory/"

  layer_4_expressions:
    - "grammar/expressions/"

  layer_5_functions_and_statements:
    - "grammar/functions/"
    - "grammar/statements/"

  layer_6_control_plane:
    - "grammar/effects/"
    - "grammar/resources/"
    - "grammar/validation/"
    - "grammar/policies/"
    - "grammar/security/"

  layer_7_classical_data:
    - "grammar/classical/"
    - "grammar/mathematics/"
    - "grammar/data/"

  layer_8_parallel_distributed:
    - "grammar/concurrency/"
    - "grammar/distributed/"
    - "grammar/networking/"

  layer_9_realization_intent:
    - "grammar/hardware/"
    - "grammar/execution/"
    - "grammar/compile/"

  layer_10_quantum:
    - "grammar/quantum/"

  layer_11_hdl:
    - "grammar/hdl/"

  layer_12_hybrid:
    - "grammar/hybrid/"

  layer_13_ai:
    - "grammar/ai/"
    - "grammar/nlp/"

  layer_14_extensions:
    - "grammar/interoperability/"
    - "grammar/dialects/"
    - "grammar/macros/"
    - "grammar/metaprogramming/"

  layer_15_compatibility:
    - "grammar/compatibility/"

  layer_16_composition:
    - "grammar/antlr/ZamaniParser.g4"
    - "grammar/Zamani.g4"

  rule: >
    A file in a later layer MUST NOT become a prerequisite for a file in an
    earlier layer unless an explicit architecture exception is documented.

# ============================================================================
# LEXER CONTRACT
# ============================================================================

lexer:
  canonical_public_boundary:
    path: "grammar/antlr/ZamaniLexer.g4"

  canonical_internal_composition:
    path: "grammar/lexer/lexer.g4"

  token_registry:
    path: "grammar/lexer/tokens.g4"

  ownership_rule: >
    Every emitted token MUST have exactly one lexical owner.

  prohibited:
    - "duplicate token declarations"
    - "duplicate token spellings without documented contextual semantics"
    - "domain-specific lexer authorities"
    - "parser-level token redefinitions"
    - "hardware-specific token capacity limits"

  token_categories:
    - "keyword"
    - "identifier"
    - "operator"
    - "punctuation"
    - "literal"
    - "annotation"
    - "comment"
    - "lexical-error"

  contextual_keyword_rule: >
    A word MUST NOT become globally reserved merely because a domain happens
    to use it. Contextual reservation MUST be explicitly documented.

# ============================================================================
# QUANTUM CONTRACT
# ============================================================================

quantum:
  path: "grammar/quantum/"
  canonical_ir: "quantum::ir"

  operation_model:
    rule: "data-driven"
    required_components:
      - "operationSpecifier"
      - "targets"
      - "optional controls"
      - "parameters"
      - "results"
      - "attributes"
      - "modifiers"

  operation_kinds:
    - "builtin"
    - "custom"
    - "vendor"
    - "parameterized"
    - "dialect"
    - "future"

  prohibited_architecture: >
    The universal grammar MUST NOT require a permanently enumerated finite
    catalogue of quantum gates or physical devices.

  physical_mapping:
    grammar: "logical quantum intent"
    semantic_model: "validated quantum meaning"
    quantum_ir: "canonical quantum representation"
    backend: "physical mapping"
    runtime: "device discovery and execution"

  resource_rule: >
    Logical qubit expressions MUST NOT be interpreted as direct physical
    qubit allocation by the grammar.

# ============================================================================
# HDL CONTRACT
# ============================================================================

hdl:
  path: "grammar/hdl/"

  owns:
    - "hardware intent"
    - "modules"
    - "ports"
    - "signals"
    - "nets"
    - "registers"
    - "memories"
    - "clocking"
    - "timing"
    - "pipelines"
    - "state machines"
    - "verification intent"
    - "synthesis intent"

  does_not_own:
    - "fixed universal hardware capacity"
    - "vendor-specific device selection"
    - "physical placement"
    - "routing implementation"
    - "fabrication technology"

# ============================================================================
# AI CONTRACT
# ============================================================================

ai:
  path: "grammar/ai/"

  common_semantic_foundations:
    - "types"
    - "effects"
    - "resources"
    - "capabilities"
    - "contracts"
    - "policies"
    - "provenance"
    - "evidence"
    - "uncertainty"

  extensible_categories:
    - "inference"
    - "deduction"
    - "reasoning"
    - "learning"
    - "adaptation"
    - "probability"
    - "confidence"
    - "evidence"
    - "models"
    - "datasets"
    - "training"
    - "agents"
    - "planning"
    - "neural-symbolic"

  application_keyword_rule: >
    Application-specific concepts MUST NOT automatically become universal
    language keywords. They belong in libraries, dialects, capabilities,
    policies, or application-level packages.

# ============================================================================
# INTEROPERABILITY CONTRACT
# ============================================================================

interoperability:
  path: "grammar/interoperability/"

  categories:
    - "foreign-source-format"
    - "ABI"
    - "API"
    - "FFI"
    - "calling-convention"
    - "foreign-type"
    - "serialization"
    - "external-function"
    - "linkage"

  rule: >
    Supporting an external language or data format does not make that external
    language or format part of the Zamani core language.

# ============================================================================
# DIALECT CONTRACT
# ============================================================================

dialects:
  path: "grammar/dialects/"

  required_metadata:
    - "identity"
    - "namespace"
    - "version"
    - "dependencies"
    - "capabilities"
    - "syntax"
    - "semantic_mapping"
    - "compatibility"
    - "registration"
    - "status"

  rule: >
    A dialect MUST integrate through explicit registration and stable semantic
    interfaces. A dialect MUST NOT silently redefine core Zamani semantics.

# ============================================================================
# MACRO / METAPROGRAMMING CONTRACT
# ============================================================================

metaprogramming:
  macros:
    path: "grammar/macros/"
    requirements:
      - "hygiene"
      - "source provenance"
      - "expansion diagnostics"
      - "semantic validation after expansion"

  metaprogramming:
    path: "grammar/metaprogramming/"
    requirements:
      - "controlled reflection"
      - "controlled introspection"
      - "quotation"
      - "unquotation"
      - "code generation"
      - "compile-time evaluation"
      - "provenance"
      - "effects"
      - "capabilities"
      - "policies"
      - "sandbox"

  rule: >
    Metaprogramming MUST NOT provide an unchecked path around type checking,
    effects, capabilities, resource checks, security policy, or provenance.

# ============================================================================
# AST CONTRACT
# ============================================================================

ast:
  owner: "src/ast/"

  required_property: >
    The AST is domain-neutral at its structural boundary.

  grammar_to_ast:
    rule: >
      Every stable grammar production that carries semantic meaning MUST have
      a documented AST mapping.

  source_information:
    preserve:
      - "source span"
      - "source location"
      - "relevant lexical identity"
      - "source provenance"
      - "diagnostic context"

  prohibited:
    - "physical device allocation in syntax AST"
    - "vendor-specific instruction representation"
    - "backend scheduling state"
    - "runtime-only hardware state"

# ============================================================================
# SEMANTIC CONTRACT
# ============================================================================

semantic:
  owner: "src/semantic/"

  required_domains:
    - "names"
    - "types"
    - "values"
    - "operations"
    - "effects"
    - "capabilities"
    - "resources"
    - "requirements"
    - "constraints"
    - "contracts"
    - "policies"
    - "provenance"
    - "diagnostics"
    - "compatibility"

  rule: >
    Grammar describes syntax. Semantic analysis determines meaning and
    validity. Grammar files MUST NOT become a substitute for semantic
    analysis.

# ============================================================================
# IR CONTRACT
# ============================================================================

ir:
  owner: "src/ir/"

  canonical_boundaries:
    classical: "Classical IR"
    quantum: "quantum::ir"
    hardware: "HDL/Hardware semantic IR as defined by compiler architecture"

  rule: >
    Domain-specific lowering representations MAY exist downstream, but they
    MUST NOT replace the canonical semantic IR boundary.

  prohibited:
    - "grammar-defined vendor IR"
    - "grammar-defined physical QPU IR"
    - "grammar-defined GPU instruction IR"
    - "grammar-defined FPGA implementation IR"

# ============================================================================
# DIAGNOSTIC CONTRACT
# ============================================================================

diagnostics:
  required_layers:
    - "lexical"
    - "syntactic"
    - "structural"
    - "type"
    - "effect"
    - "contract"
    - "policy"
    - "capability"
    - "resource"
    - "semantic"
    - "compatibility"
    - "lowering"
    - "backend"

  rule: >
    Diagnostics MUST identify the earliest applicable semantic layer rather
    than collapsing every failure into a generic compilation error.

# ============================================================================
# VALIDATION CONTRACT
# ============================================================================

validation:
  path: "grammar/validation/"

  mandatory_checks:
    ownership:
      - "unique token owner"
      - "unique parser-rule owner"
      - "unique exported-symbol owner"

    dependency:
      - "all imports resolve"
      - "no forbidden dependency direction"
      - "no unresolved cycles"
      - "dependency graph is deterministic"

    grammar:
      - "no unintended left recursion"
      - "no unreachable rules"
      - "no accidental ambiguity"
      - "precedence is explicit"
      - "parser entry points are reachable"

    lexical:
      - "no duplicate token spelling"
      - "no duplicate token definition"
      - "contextual keywords are explicit"

    scalability:
      - "no universal hardware ceiling"
      - "no disguised finite capacity"
      - "symbolic dimensions remain symbolic"
      - "resource feasibility remains downstream"

    integration:
      - "AST mapping exists"
      - "semantic mapping exists"
      - "IR mapping exists where required"
      - "diagnostic mapping exists"
      - "compatibility mapping exists"

    naming:
      - "no unexplained near-duplicate filenames"
      - "no trailing whitespace in paths"
      - "no whitespace-dependent filenames"
      - "no singular/plural duplicates without documented ownership"

# ============================================================================
# CURRENT REPOSITORY PATH AUDIT
# ============================================================================

path_audit:
  policy: "FAIL_CLOSED"

  reject:
    - "trailing whitespace in filename"
    - "leading whitespace in filename"
    - "embedded newline in filename"
    - "embedded tab in filename"
    - "case-only collision"
    - "duplicate semantic owner"
    - "unexplained singular/plural duplicate"

  known_current_tree_issue:
    path_pattern:
      - "grammar/validation/grammar-validation.md "
    classification: "MALFORMED_PATH"
    required_action: >
      Rename to a canonical path without trailing whitespace before the
      containing directory can be frozen.

  known_conceptual_duplicate_classes:
    examples:
      - "closure vs closures"
      - "lambda vs lambdas"
      - "map vs map-types"
      - "option vs option-types"
      - "array vs array-types"
    rule: >
      Each pair MUST be proven intentionally distinct or consolidated before
      the affected directory is frozen.

# ============================================================================
# INVENTORY CONTRACT
# ============================================================================

inventory:
  source:
    canonical: "Git tree of grammar/"
    current_count: 877

  each_entry_must_record:
    - "path"
    - "kind"
    - "sha"
    - "size"
    - "owner_domain"
    - "status"

  each_stable_entry_must_add:
