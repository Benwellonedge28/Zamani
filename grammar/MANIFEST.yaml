    gate:
      - "all dependencies frozen"
      - "all parser dispatchers complete"
      - "all conformance suites pass"

# ============================================================================
# ROOT FREEZE CRITERIA
# ============================================================================

root_freeze:
  required:
    - "one language authority"
    - "one specification authority"
    - "one machine-contract authority"
    - "one lexer boundary"
    - "one parser boundary"
    - "one composition root"
    - "unique token ownership"
    - "unique grammar-rule ownership"
    - "acyclic dependency graph"
    - "complete AST mapping"
    - "complete semantic mapping"
    - "complete IR mapping"
    - "complete diagnostics mapping"
    - "complete compatibility mapping"
    - "zero unresolved malformed paths"
    - "zero unresolved duplicate owners"
    - "zero unresolved hard-coded universal capacities"
    - "zero unresolved grammar ambiguity"
    - "zero unresolved unreachable production"
    - "zero unresolved accidental left recursion"
    - "all mandatory tests passing"

  final_state:
    manifest_status: "FROZEN"
    grammar_status: "FROZEN"
    next_stage_allowed: true

# ============================================================================
# PRODUCTION READINESS
# ============================================================================

production_readiness:

  definition: >
    grammar/ is production-ready only when the complete source language
    architecture is closed under its declared contracts while remaining open
    to new targets, resources, capabilities, devices, algorithms, operations,
    dialects, and execution environments.

  production_ready_requires:
    - "complete inventory"
    - "complete ownership"
    - "complete dependency graph"
    - "complete lexical authority"
    - "complete parser composition"
    - "complete AST integration"
    - "complete semantic integration"
    - "complete canonical IR integration"
    - "complete diagnostics"
    - "complete compatibility"
    - "complete tests"
    - "hard-coding audit passed"
    - "portability audit passed"
    - "scalability audit passed"
    - "safe-Rust audit passed"

  non_goals:
    - "guaranteeing infinite physical resources"
    - "guaranteeing infinite compiler memory"
    - "guaranteeing one native binary for every architecture"
    - "enumerating every future device in the grammar"
    - "encoding vendor hardware into universal syntax"

# ============================================================================
# MACHINE VALIDATION RULE
# ============================================================================

machine_validation:
  manifest_must_fail_if:
    - "inventory count differs from repository tree without explicit update"
    - "a file has multiple owners"
    - "an exported grammar symbol has multiple owners"
    - "an import cannot be resolved"
    - "dependency graph contains a forbidden cycle"
    - "a stable file lacks required contract fields"
    - "a stable semantic production lacks AST mapping"
    - "a stable semantic production lacks required IR mapping"
    - "a token has multiple owners"
    - "a universal hardware capacity is hard-coded"
    - "a malformed path exists"
    - "a trailing-whitespace filename exists"
    - "a stable file lacks tests"
    - "a stable file lacks compatibility status"
    - "a root grammar is frozen before its dependencies"

  machine_validation_may_warn:
    - "experimental feature"
    - "planned feature"
    - "historical feature"
    - "deprecated feature"

# ============================================================================
# CURRENT INVENTORY SNAPSHOT
# ============================================================================

inventory_snapshot:
  current_grammar_file_count: 877

  required_next_generated_artifacts:
    - "grammar/OWNERSHIP.yaml"
    - "grammar/DEPENDENCIES.yaml"
    - "grammar/STATUS.yaml"
    - "grammar/contracts/"
    - "grammar/conformance/"
    - "grammar/golden/"
    - "grammar/examples/"

  important:
    >
    MANIFEST.yaml is the authoritative schema for what every inventory entry
    must prove before freezing. The exact per-file Git SHA and byte size are
    repository inventory data and MUST be regenerated from the Git tree whenever
    grammar files are added, removed, renamed, or modified.

# ============================================================================
# FINAL RULE
# ============================================================================

final_rule: >
  Do not grow grammar/ by adding isolated grammar files without first giving
  the file a unique owner, explicit dependency contract, stable exports,
  downstream consumers, AST mapping, semantic mapping, IR mapping where
  applicable, diagnostics, compatibility behavior, tests, scalability
  guarantees, POCO-REAF behavior, and hard-coding audit.

freeze_statement: >
  When every inventory entry satisfies this manifest, all dependency layers
  are frozen in order, all validation gates pass, and the root composition
  grammars pass final conformance, grammar/ becomes the frozen, target-
  independent source-language boundary for Zamani.