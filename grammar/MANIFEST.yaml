# ============================================================================
# FREEZE PROTOCOL
# ============================================================================

freeze_protocol:

  stage_0_inventory:
    status: "AUDIT"
    actions:
      - "enumerate every grammar file"
      - "normalize malformed paths"
      - "identify duplicate filenames/concepts"
      - "assign provisional ownership"
      - "build dependency graph"
      - "record repository SHA"
    output:
      - "MANIFEST.yaml"
      - "ownership report"
      - "dependency report"
      - "path report"

  stage_1_authority:
    freeze:
      - "DESIGN.md"
      - "specification/"
      - "spec/"
    gate:
      - "no contradictory normative definitions"

  stage_2_lexer:
    freeze:
      - "lexer/"
      - "antlr/ZamaniLexer.g4"
    gate:
      - "unique token ownership"
      - "lexical conformance"
      - "Rust lexer agreement"

  stage_3_core:
    freeze:
      - "core/"
      - "modules/"
      - "declarations/"
    gate:
      - "stable names and source-unit structure"

  stage_4_types:
    freeze:
      - "types/"
      - "memory/"
    gate:
      - "complete type ownership and semantic mapping"

  stage_5_expressions:
    freeze:
      - "expressions/"
    gate:
      - "precedence"
      - "ambiguity"
      - "AST coverage"

  stage_6_functions_statements:
    freeze:
      - "functions/"
      - "statements/"
    gate:
      - "semantic and effect integration"

  stage_7_control_plane:
    freeze:
      - "effects/"
      - "resources/"
      - "validation/"
      - "policies/"
      - "security/"
    gate:
      - "requirements"
      - "capabilities"
      - "effects"
      - "contracts"
      - "policies"

  stage_8_classical_data:
    freeze:
      - "classical/"
      - "mathematics/"
      - "data/"

  stage_9_concurrency:
    freeze:
      - "concurrency/"
      - "distributed/"
      - "networking/"

  stage_10_realization:
    freeze:
      - "hardware/"
      - "execution/"
      - "compile/"

  stage_11_quantum:
    freeze:
      - "quantum/"
    gate:
      - "quantum::ir integration"
      - "no physical gate-set ceiling"
      - "resource/capability integration"

  stage_12_hdl:
    freeze:
      - "hdl/"
    gate:
      - "hardware intent separated from realization"

  stage_13_hybrid:
    freeze:
      - "hybrid/"

  stage_14_ai:
    freeze:
