    - "authority"
    - "does_not_own"
    - "imports"
    - "exports"
    - "consumed_by"
    - "ast_owner"
    - "semantic_owner"
    - "ir_owner"
    - "runtime_owner"
    - "diagnostics_owner"
    - "test_owner"
    - "compatibility_owner"
    - "scalability_contract"
    - "poco_reaf_contract"
    - "hard_coding_audit"
    - "ambiguity_contract"
    - "error_handling"
    - "conformance_requirements"
    - "freeze_criteria"

  inventory_status_rule: >
    Git existence alone NEVER implies implementation status.

