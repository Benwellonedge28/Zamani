# ============================================================================
# Zamani Programming Language
# ============================================================================
#
# File:
#   grammar/MANIFEST.yaml
#
# Purpose:
#   Canonical machine-readable manifest for the complete Zamani grammar
#   subsystem.
#
# This file is the inventory and integration contract for grammar/.
#
# It does NOT itself grant STABLE status to a grammar feature.
#
# A file becomes STABLE only after all required production gates defined here
# have been satisfied and evidenced.
#
# Repository:
#   https://github.com/Benwellonedge28/Zamani
#
# Language:
#   Zamani
#
# Rust:
#   Edition 2021
#   Minimum supported Rust: 1.97
#   Newer compatible stable Rust versions are permitted.
#
# Safety:
#   Production Zamani Rust implementation MUST use safe Rust.
#   No unsafe blocks, unsafe functions, unsafe traits, unsafe implementations,
#   or equivalent unsafe Rust may be introduced.
#
# Architecture:
#   Program_Once_Compile_Once_Run_Everywhere_Anywhere_Forever (POCO-REAF)
#
# Scalability:
#   Open-ended.
#   The language MUST NOT impose universal finite hardware/resource ceilings.
#   Actual execution remains bounded by available resources and implementation
#   capacity; such limits MUST NOT become language-wide semantic limits.
#
# ============================================================================

manifest:
  schema_version: "1.0"
  manifest_version: "1.0.0"
  kind: "zamani-grammar-production-manifest"
  language: "Zamani"
  repository: "Benwellonedge28/Zamani"
  branch: "main"
  root: "grammar/"
  generated_from: "git-tree"
  inventory_revision: "main"
  inventory_file_count: 877
  inventory_is_authoritative: false
  manifest_is_authoritative_for:
    - "grammar ownership"
    - "grammar integration contracts"
    - "freeze requirements"
    - "production readiness gates"
    - "repository inventory metadata"
    - "cross-layer integration requirements"

status:
  overall: "AUDIT_REQUIRED"
  freeze_allowed: false
  reason: >
    The repository contains a large existing grammar surface that must first
    pass ownership, dependency, lexical, parser, AST, semantic, IR,
    diagnostics, compatibility, scalability, hard-coding, naming, ambiguity,
    and conformance validation.
  stable_requires:
    - "all mandatory production gates pass"
    - "all direct dependencies are frozen"
    - "all exported symbols have exactly one owner"
    - "all externally consumed contracts are documented"
    - "all required downstream mappings exist"
    - "all required tests pass"
    - "no unresolved hard-coded capacity exists"
    - "no unresolved malformed path/name exists"
    - "no unresolved duplicate conceptual owner exists"

# ============================================================================
# AUTHORITY MODEL
# ============================================================================

authority:
  architecture:
    path: "grammar/DESIGN.md"
    role: "normative grammar architecture"
    authority: "primary"

  human_language_specification:
    path: "grammar/specification/"
    role: "normative language meaning"
    authority: "primary"

  machine_contracts:
    path: "grammar/spec/"
    role: "machine-readable/machine-oriented language contracts"
    authority: "primary"

  canonical_grammar_composition:
    path: "grammar/Zamani.g4"
    role: "top-level ANTLR composition"
    authority: "composition-only"

  canonical_lexer_boundary:
    path: "grammar/antlr/ZamaniLexer.g4"
    role: "single public ANTLR lexer boundary"
    authority: "lexical composition boundary"

  canonical_parser_boundary:
    path: "grammar/antlr/ZamaniParser.g4"
    role: "single public ANTLR parser boundary"
    authority: "parser composition boundary"

  lexical_contracts:
    path: "grammar/lexer/"
    role: "lexical family ownership and contracts"

  historical_reference:
    path: "grammar/Zamani-Grammar.md"
    role: "historical/extended reference"
    authority: "non-normative"

  conformance_reference:
    path: "grammar/grammar.md"
    role: "derived conformance/status reference"
    authority: "derived"

  implementation:
    rust_paths:
      - "src/lexer.rs"
      - "src/parser.rs"
      - "src/ast/"
      - "src/semantic/"
      - "src/ir/"
      - "src/quantum/"
      - "src/compile/"
    rule: >
      Grammar syntax is not considered implemented merely because an ANTLR
      production exists. Implementation requires the complete applicable
      frontend-to-semantic-to-IR integration path.

# ============================================================================
# GLOBAL ARCHITECTURE
# ============================================================================

architecture:
  canonical_pipeline:
    - stage: "source"
      owner: "grammar/"
    - stage: "lexing"
      owner: "grammar/lexer/ + grammar/antlr/ZamaniLexer.g4"
    - stage: "parsing"
      owner: "grammar/antlr/ZamaniParser.g4 + modular grammar delegates"
    - stage: "domain-neutral AST"
      owner: "src/ast/"
    - stage: "structural validation"
      owner: "grammar/validation/ + compiler validation"
    - stage: "type validation"
      owner: "types/ + semantic implementation"
    - stage: "effect validation"
      owner: "effects/ + semantic implementation"
    - stage: "capability validation"
      owner: "resources/ + semantic implementation"
    - stage: "resource validation"
      owner: "resources/ + semantic implementation"
    - stage: "contract validation"
      owner: "validation/ + semantic implementation"
    - stage: "policy validation"
      owner: "policies/ + security/ + semantic implementation"
    - stage: "provenance"
      owner: "semantic/provenance implementation"
    - stage: "domain semantics"
      owner: "domain-specific grammar + semantic implementation"
    - stage: "canonical IR"
      owner: "src/ir/"
    - stage: "canonical quantum IR"
      owner: "quantum::ir"
    - stage: "optimization"
      owner: "compiler/backend"
    - stage: "lowering"
      owner: "compiler/backend"
    - stage: "target negotiation"
      owner: "compiler/runtime"
    - stage: "routing"
      owner: "compiler/backend/runtime"
    - stage: "scheduling"
      owner: "compiler/backend/runtime"
    - stage: "resilience"
      owner: "compiler/runtime"
    - stage: "ZQN"
      owner: "compiler/backend/runtime"
    - stage: "HAL"
      owner: "target/runtime integration"

  root_composition:
    grammar/Zamani.g4:
      owns:
        - "program-level composition"
        - "universal item dispatch"
        - "universal expression/type dispatch where required"
        - "EOF"
      does_not_own:
        - "tokens"
        - "domain-specific token definitions"
        - "domain-specific semantic rules"
        - "hardware limits"
        - "resource realization"
        - "IR definitions"
        - "runtime behavior"

  one_language_rule: >
    Classical, quantum, HDL, AI, data, distributed, networking, accelerator,
    embedded, and future computational domains are domains of one Zamani
    language. They MUST NOT become unrelated languages sharing a repository.

# ============================================================================
# RUST / IMPLEMENTATION CONTRACT
# ============================================================================

implementation:
  rust:
    edition: "2021"
    minimum_version: "1.97"
    safety: "safe-only"
    unsafe_allowed: false

  antlr:
    runtime: "antlr-rust"
    version: "0.3.0-beta"

  cargo:
    manifest: "Cargo.toml"
    toolchain: "rust-toolchain.toml"

  required_repository_integration:
    - "src/lexer.rs"
    - "src/parser.rs"
    - "src/ast/"
    - "src/semantic/"
    - "src/ir/"
    - "src/quantum/"
    - "tests/lexer_tests.rs"
    - "tests/parser_tests.rs"
    - "tests/semantic_tests.rs"
    - "tests/ir_gen_tests.rs"

  implementation_rule: >
    No grammar feature is considered implemented until its required Rust
    frontend, AST, semantic, diagnostic, and IR integration exists.

# ============================================================================
# UNIVERSAL FILE CONTRACT
# ============================================================================

file_contract:
  required_fields_before_freeze:
    - "path"
    - "kind"
    - "status"
    - "purpose"
    - "authority"
    - "owner"
    - "does_not_own"
    - "inputs"
    - "outputs"
    - "imports"
    - "exports"
    - "consumed_by"
    - "ast_owner"
    - "semantic_owner"
    - "ir_owner"
    - "runtime_owner"
    - "diagnostics_owner"
    - "test_owner"
    - "compatibility_owner"
    - "scalability_contract"
    - "poco_reaf_contract"
    - "hard_coding_audit"
    - "ambiguity_contract"
    - "error_handling"
    - "conformance_requirements"
    - "freeze_criteria"

  ownership_rule: >
    Every grammar symbol MUST have exactly one canonical owner.

  dependency_rule: >
    A file may depend on another file's exported contract, but MUST NOT
    duplicate ownership of an exported symbol.

  downstream_stability_rule: >
    Once frozen, a file MUST NOT require semantic modification merely because
    a downstream backend, target, device, dialect, or runtime implementation
    is added.

  interface_rule: >
    Cross-file integration MUST occur through stable exported grammar,
    semantic, AST, IR, capability, resource, effect, policy, or contract
    interfaces.

# ============================================================================
# STATUS MODEL
# ============================================================================

status_model:
  allowed:
    - "HISTORICAL"
    - "REJECTED"
    - "PROPOSED"
    - "PLANNED"
    - "EXPERIMENTAL"
    - "PARTIALLY_IMPLEMENTED"
    - "IMPLEMENTED"
    - "CONFORMANT"
    - "STABLE"
    - "DEPRECATED"

  stable_definition: >
    STABLE means the feature has a complete specification, unique ownership,
    resolved dependencies, valid ANTLR composition, AST mapping, semantic
    mapping, required IR mapping, diagnostics, compatibility contract,
    conformance tests, scalability audit, hard-coding audit, and downstream
    integration evidence.

  implemented_definition: >
    IMPLEMENTED means implementation exists, but does not necessarily imply
    complete production conformance.

  conformant_definition: >
    CONFORMANT means applicable conformance tests and integration gates pass.

# ============================================================================
# SCALABILITY / POCO-REAF CONTRACT
# ============================================================================

scalability:
  model: "open-ended"

  fundamental_rule: >
    Zamani source syntax describes portable program meaning and execution
    intent. It MUST NOT encode an arbitrary finite universe of physical
    machines.

  forbidden_universal_limits:
    - "MAX_QUBITS"
    - "MAX_CPUS"
    - "MAX_CORES"
    - "MAX_THREADS"
    - "MAX_GPUS"
    - "MAX_FPGAS"
    - "MAX_ASICS"
    - "MAX_QPUS"
    - "MAX_NODES"
    - "MAX_MEMORY"
    - "MAX_STORAGE"
    - "MAX_REGISTER_WIDTH"
    - "MAX_VECTOR_WIDTH"
    - "MAX_TENSOR_RANK"
    - "MAX_TENSOR_DIMENSION"
    - "MAX_NETWORK_SIZE"
    - "MAX_DEVICE_COUNT"
    - "MAX_ACCELERATOR_COUNT"
    - "MAX_AGENT_COUNT"
    - "MAX_GATE_COUNT"

  forbidden_equivalents:
    rule: >
      Renaming a forbidden capacity constant does not make it valid.
      Equivalent finite capacity restrictions are also prohibited from the
      target-independent language architecture.

  permitted_resource_semantics:
    - "requires"
    - "prefer"
    - "constrain"
    - "allow"
    - "forbid"
    - "capability"
    - "topology"
    - "resource"
    - "budget"
    - "availability"
    - "reliability"
    - "latency"
    - "energy"
    - "throughput"
    - "memory"
    - "storage"

  canonical_examples:
    - 'requires qubits >= required_qubits'
    - 'requires memory >= required_memory'
    - 'requires capability("quantum.measurement")'
    - 'requires capability("gpu.compute")'
    - 'requires capability("tensor.compute")'
    - 'requires topology(required_topology)'

  realization_boundary:
    grammar: "express intent"
    ast: "preserve intent"
    semantic_model: "validate intent"
    compiler: "negotiate and specialize"
    runtime: "discover and realize"
    hardware: "execute"

  physical_limit_rule: >
    Actual hardware and implementation limits remain valid. They MUST be
    represented as target/environment feasibility information rather than
    universal language ceilings.

  infinity_semantics: >
    "Infinity" means no artificial language-level upper bound. It does not
    claim that physical memory, storage, compiler memory, execution time,
    hardware resources, or implementation representations are mathematically
    infinite.

# ============================================================================
# POCO-REAF
# ============================================================================

poco_reaf:
  enabled: true

  meaning:
    source: "Program Once"
    compilation: "Compile Once"
    execution: "Run Everywhere"
    target_scope: "Anywhere"
    compatibility: "Forever"

  semantic_contract: >
    POCO-REAF preserves program meaning across target realizations. It does
    not require one target-specific machine binary to execute natively on
    every physically different architecture.

  required_layers:
    - "source portability"
    - "semantic portability"
    - "canonical IR portability"
    - "target negotiation"
    - "target realization"
    - "compatibility/versioning"
    - "migration where necessary"

  prohibited_behavior:
    - "silent semantic change"
    - "silent unsupported-feature substitution"
    - "implicit approximation without authorization"
    - "target-specific grammar leakage"
    - "vendor-specific hardware assumptions in universal syntax"

# ============================================================================
# RESOURCE / CAPABILITY CONTRACT
# ============================================================================

resources:
  semantic_distinctions:
    requirement:
      meaning: "mandatory condition"
    capability:
      meaning: "target/environment ability"
    constraint:
      meaning: "restriction on acceptable realization"
    preference:
      meaning: "non-mandatory selection preference"
    hint:
      meaning: "optimization information that cannot alter meaning"
    budget:
      meaning: "execution/compilation allowance"
    negotiation:
      meaning: "matching program requirements to environment capabilities"
    realization:
      meaning: "mapping logical intent to physical resources"

  ownership:
    grammar: "grammar/resources/"
    semantic_validation: "semantic implementation"
    discovery: "runtime/target discovery"
    realization: "compiler/runtime/backend"

# ============================================================================
# EFFECT CONTRACT
# ============================================================================

effects:
  owner: "grammar/effects/"
  canonical_categories:
    - "io"
    - "network"
    - "mutation"
    - "randomness"
    - "native"
    - "foreign"
    - "distributed"
    - "measurement"
    - "quantum"
    - "learning"
    - "adaptation"
    - "reflection"
    - "code_generation"
    - "simulation"

  extensibility: "open-ended"

  rule: >
    New effects MUST be registered through the effect contract and MUST NOT
    require redesigning the universal language merely because a new effect
    category appears.

# ============================================================================
# CONTRACT / POLICY / PROVENANCE
# ============================================================================

contracts:
  owner: "grammar/validation/"
  supported_categories:
    - "requires"
    - "ensures"
    - "invariant"
    - "assume"
    - "guarantee"
    - "property"
    - "assertion"
    - "refinement"

  lowering_rule: >
    Contract semantics MUST remain preserved through lowering whenever their
    declared meaning requires preservation.

policies:
  owner: "grammar/policies/"
  governance_categories:
    - "allow"
    - "forbid"
    - "prefer"
    - "require"
    - "authorize"
    - "restrict"
    - "fallback"
    - "adaptation"
    - "execution"
    - "deployment"
    - "resource"
    - "security"

  rule: >
    Policies govern behavior; they MUST NOT silently redefine type, operation,
    or resource semantics.

provenance:
  cross_domain: true
  required_for:
    - "inference where provenance is requested"
    - "reasoning where evidence is requested"
    - "adaptation"
    - "code generation"
    - "target selection"
    - "resource negotiation"
    - "compiler transformations where required"
    - "security decisions where required"
    - "quantum routing where required"
    - "simulation decisions where required"

