# ============================================================================
# Zamani Programming Language
# ============================================================================
#
# File:
#   grammar/STATUS.yaml
#
# Purpose:
#   Canonical machine-readable lifecycle, implementation, conformance,
#   compatibility, freeze, and production-readiness status registry for
#   grammar/.
#
# This file is authoritative for STATUS.
#
# It MUST NOT be used to infer implementation merely from file existence.
#
# A grammar feature is STABLE only when every applicable production gate,
# implementation mapping, compatibility requirement, and conformance
# requirement has passed.
#
# Repository:
#   Benwellonedge28/Zamani
#
# Language:
#   Zamani
#
# Toolchain:
#   Rust 2021
#   Minimum Rust version: 1.97
#   Newer compatible stable Rust versions are permitted.
#
# Safety:
#   unsafe Rust is forbidden.
#
# Scalability:
#   Open-ended and resource-bounded by the actual execution environment.
#   The language MUST NOT impose artificial universal finite capacity limits.
#
# POCO-REAF:
#   Program Once
#   Compile Once
#   Run Everywhere
#   Anywhere
#   Forever
#
# ============================================================================

schema:
  name: "zamani-grammar-status"
  version: "1.0.0"
  format: "YAML"
  yaml_compatibility: "YAML 1.2"
  authority: "grammar/STATUS.yaml"

repository:
  name: "Benwellonedge28/Zamani"
  grammar_root: "grammar/"
  default_branch: "main"

  inventory_authority:
    file: "grammar/MANIFEST.yaml"
    rule: >
      MANIFEST.yaml owns repository inventory. STATUS.yaml owns lifecycle and
      implementation status. STATUS.yaml MUST NOT duplicate the inventory as
      an independently authoritative file list.

  ownership_authority:
    file: "grammar/OWNERSHIP.yaml"
    rule: >
      OWNERSHIP.yaml owns symbol ownership. STATUS.yaml records whether the
      ownership contract is complete and valid but does not replace it.

  dependency_authority:
    file: "grammar/DEPENDENCIES.yaml"
    rule: >
      DEPENDENCIES.yaml owns the dependency graph. STATUS.yaml records whether
      dependencies are resolved and freeze-eligible.

  conformance_authority:
    file: "grammar/CONFORMANCE.md"
    rule: >
      CONFORMANCE.md defines production conformance requirements. STATUS.yaml
      records their result.

  freeze_authority:
    file: "grammar/FREEZE.md"
    rule: >
      FREEZE.md defines freeze procedure. STATUS.yaml records whether a file,
      directory, stage, or complete grammar satisfies the freeze conditions.

# ============================================================================
# GLOBAL REPOSITORY STATUS
# ============================================================================

repository_status:
  lifecycle: "AUDIT_REQUIRED"
  production_ready: false
  freeze_allowed: false

  reason: >
    The grammar subsystem is architecturally extensive but must not be
    declared production-ready until inventory, ownership, dependency closure,
    lexical uniqueness, parser composition, AST mapping, semantic mapping,
    canonical IR mapping, diagnostics, compatibility, scalability,
    hard-coding, ambiguity, path hygiene, and conformance gates all pass.

  important_rule: >
    A repository may contain IMPLEMENTED or STABLE individual components while
    the complete grammar remains AUDIT_REQUIRED. Component stability MUST NOT
    automatically promote the whole grammar to production readiness.

  production_ready_when:
    - "inventory is complete and machine-verifiable"
    - "every production file has a valid lifecycle status"
    - "every exported symbol has exactly one owner"
    - "all mandatory dependencies resolve"
    - "ANTLR composition is acyclic"
    - "one canonical lexer boundary exists"
    - "one canonical parser boundary exists"
    - "root grammar remains composition-only"
    - "AST mappings are complete"
    - "semantic mappings are complete"
    - "IR mappings are complete where applicable"
    - "diagnostic mappings are complete"
    - "compatibility contracts are complete"
    - "all required conformance tests pass"
    - "hard-coded universal capacity audit passes"
    - "ambiguity and reachability audits pass"
    - "path hygiene audit passes"
    - "Rust integration passes"
    - "safe-Rust policy passes"
    - "POCO-REAF portability gates pass"
    - "scalability gates pass"
    - "all required freeze stages pass"

# ============================================================================
# STATUS DIMENSIONS
# ============================================================================
#
# Lifecycle, implementation, conformance, and freeze are deliberately
# separate dimensions.
#
# Example:
#
#   lifecycle: STABLE
#   syntax: IMPLEMENTED
#   ast: IMPLEMENTED
#   semantic: PARTIALLY_IMPLEMENTED
#   ir: PLANNED
#
# means the syntax contract itself may be stable while downstream support
# remains incomplete.
#
# ============================================================================

status_dimensions:

  lifecycle:
    authority: "grammar/STATUS.yaml"

    allowed:
      - "HISTORICAL"
      - "REJECTED"
      - "PROPOSED"
      - "PLANNED"
      - "SPECIFIED"
      - "EXPERIMENTAL"
      - "PARTIALLY_IMPLEMENTED"
      - "IMPLEMENTED"
      - "STABLE"
      - "DEPRECATED"

    meanings:
      HISTORICAL: >
        Retained only as historical reference. It is not part of the current
        language contract.

      REJECTED: >
        Explicitly rejected from the language contract. It MUST NOT become
        active merely because an implementation exists.

      PROPOSED: >
        Suggested design with no complete normative contract.

      PLANNED: >
        Intended future capability without sufficient implementation or
        conformance evidence.

      SPECIFIED: >
        Normative language contract exists, but complete implementation or
        production conformance has not yet been demonstrated.

      EXPERIMENTAL: >
        Implemented or testable provisional capability whose syntax or
        semantics are not yet stable.

      PARTIALLY_IMPLEMENTED: >
        Some required implementation layers exist while one or more required
        layers remain incomplete.

      IMPLEMENTED: >
        Required implementation layers exist, but complete production
        conformance and compatibility evidence may still be incomplete.

      STABLE: >
        Complete stable contract with resolved ownership, dependencies,
        implementation mappings, diagnostics, compatibility, conformance,
        scalability, and freeze evidence.

      DEPRECATED: >
        Previously supported capability retained for compatibility and
        explicitly scheduled for removal or replacement.

  syntax:
    allowed:
      - "NOT_APPLICABLE"
      - "PLANNED"
      - "SPECIFIED"
      - "PARTIALLY_IMPLEMENTED"
      - "IMPLEMENTED"
      - "TESTED"
      - "STABLE"

  ast:
    allowed:
      - "NOT_APPLICABLE"
      - "PLANNED"
      - "SPECIFIED"
      - "PARTIALLY_IMPLEMENTED"
      - "IMPLEMENTED"
      - "TESTED"
      - "STABLE"

  semantic:
    allowed:
      - "NOT_APPLICABLE"
      - "PLANNED"
      - "SPECIFIED"
      - "PARTIALLY_IMPLEMENTED"
      - "IMPLEMENTED"
      - "TESTED"
      - "STABLE"

  ir:
    allowed:
      - "NOT_APPLICABLE"
      - "PLANNED"
      - "SPECIFIED"
      - "PARTIALLY_IMPLEMENTED"
      - "IMPLEMENTED"
      - "TESTED"
      - "STABLE"

  diagnostics:
    allowed:
      - "NOT_APPLICABLE"
      - "PLANNED"
      - "SPECIFIED"
      - "PARTIALLY_IMPLEMENTED"
      - "IMPLEMENTED"
      - "TESTED"
      - "STABLE"

  compatibility:
    allowed:
      - "NOT_APPLICABLE"
      - "PLANNED"
      - "SPECIFIED"
      - "PARTIALLY_IMPLEMENTED"
      - "IMPLEMENTED"
      - "TESTED"
      - "STABLE"
      - "DEPRECATED"

  conformance:
    allowed:
      - "NOT_APPLICABLE"
      - "NOT_TESTED"
      - "PARTIAL"
      - "PASS"
      - "FAIL"
      - "BLOCKED"

  freeze:
    allowed:
      - "NOT_ELIGIBLE"
      - "BLOCKED"
      - "READY"
      - "FROZEN"
      - "FROZEN_MECHANICAL_ONLY"

# ============================================================================
# REQUIRED STATUS RECORD
# ============================================================================

status_record_schema:
  required:
    - "path"
    - "lifecycle"
    - "syntax"
    - "ast"
    - "semantic"
    - "ir"
    - "diagnostics"
    - "compatibility"
    - "conformance"
    - "freeze"
    - "owner_verified"
    - "dependencies_verified"
    - "scalability_verified"
    - "hard_coding_verified"
    - "ambiguity_verified"

  optional:
    - "reason"
    - "blocked_by"
    - "specification"
    - "tests"
    - "notes"
    - "migration"
    - "deprecation"

  inheritance_rule: >
    Individual files inherit the status policy of their directory contract
    unless an explicit file-level status record exists.

  no_inference_rule: >
    Status MUST NOT be inferred from filename, directory location, presence of
    a .g4 file, comments, README claims, or source-code existence alone.

# ============================================================================
# UNIVERSAL FILE STATUS CONTRACT
# ============================================================================

file_status_contract:

  ownership:
    required: true
    rule: >
      Every exported grammar symbol MUST have exactly one canonical owner.

  dependency_closure:
    required: true
    rule: >
      Every dependency MUST resolve to an existing stable contract or an
      explicitly permitted upstream status.

  imports:
    required: true
    rule: >
      Every ANTLR import MUST resolve and MUST participate in an acyclic
      composition graph.

  exports:
    required: true
    rule: >
      Every exported rule MUST have an explicit owner and consumer contract.

  ast:
    required_for_syntax_features: true
    rule: >
      Every syntax feature that reaches the frontend MUST map to the
      domain-neutral AST or be explicitly documented as syntax-only metadata.

  semantic:
    required_for_semantic_features: true
    rule: >
      Every semantic feature MUST identify its semantic owner.

  ir:
    required_when_lowerable: true
    rule: >
      Every feature that reaches canonical IR MUST identify its canonical IR
      representation. A grammar feature MUST NOT create a competing hidden IR.

  diagnostics:
    required: true
    rule: >
      Invalid forms MUST have deterministic diagnostic ownership.

  compatibility:
    required_for_stable_features: true
    rule: >
      Stable syntax and semantics MUST have version and migration behavior.

  tests:
    required: true
    rule: >
      Every production feature MUST have positive, negative, boundary, and
      applicable downstream integration tests.

# ============================================================================
# AUTHORITY STATUS
# ============================================================================

authority_status:

  design:
    path: "grammar/DESIGN.md"
    role: "normative architecture"
    required_status: "STABLE"
    current_lifecycle: "SPECIFIED"
    freeze_gate: >
      The architecture is freeze-eligible only when ownership, dependency,
      semantic-boundary, scalability, and integration rules are machine
      verifiable.

  specification:
    path: "grammar/specification/"
    role: "human normative language specification"
    required_status: "STABLE"
    current_lifecycle: "SPECIFIED"
    freeze_gate: >
      Normative specification files must be mutually consistent and must not
      contradict the machine contracts.

  machine_specification:
    path: "grammar/spec/"
    role: "machine-oriented contracts"
    required_status: "STABLE"
    current_lifecycle: "SPECIFIED"
    freeze_gate: >
      Machine contracts must agree with specification/, grammar/, ownership,
      dependencies, AST, semantic, and IR mappings.

  root_grammar:
    path: "grammar/Zamani.g4"
    role: "top-level composition"
    required_status: "STABLE"
    current_lifecycle: "SPECIFIED"
    freeze_gate: >
      The root grammar must contain only composition and dispatch and must not
      become a second owner of domain syntax.

  lexer_boundary:
    path: "grammar/antlr/ZamaniLexer.g4"
    role: "single public lexer boundary"
    required_status: "STABLE"
    current_lifecycle: "SPECIFIED"

  parser_boundary:
    path: "grammar/antlr/ZamaniParser.g4"
    role: "single public parser boundary"
    required_status: "STABLE"
    current_lifecycle: "SPECIFIED"

  historical_reference:
    path: "grammar/Zamani-Grammar.md"
    role: "historical and extended reference"
    allowed_status:
      - "HISTORICAL"
      - "DEPRECATED"
      - "SPECIFIED"
    rule: >
      This document MUST NOT silently override specification/, spec/, or the
      canonical grammar.

  derived_reference:
    path: "grammar/grammar.md"
    role: "derived conformance/status reference"
    rule: >
      grammar.md MUST be generated or validated from authoritative status and
      contract information rather than becoming a competing authority.

# ============================================================================
# RUST IMPLEMENTATION STATUS CONTRACT
# ============================================================================

rust:

  edition: "2021"

  minimum_version: "1.97"

  allowed_versions:
    rule: >
      Any newer compatible stable Rust release may be used unless the
      repository explicitly establishes a newer minimum.

  unsafe:
    allowed: false
    policy: "FORBIDDEN"

    prohibited:
      - "unsafe blocks"
      - "unsafe functions"
      - "unsafe traits"
      - "unsafe implementations"
      - "unsafe extern assumptions"
      - "unsafe generated code"
      - "unsafe transmutation"
      - "unsafe pointer-based implementation"

    validation:
      required:
        - "compiler safety validation"
        - "lint validation"
        - "dependency review"
        - "generated-code safety review"

  grammar_integration:
    lexer:
      grammar_boundary: "grammar/antlr/ZamaniLexer.g4"
      rust_consumer: "src/lexer.rs"
      status_gate: "lexer integration must pass"

    parser:
      grammar_boundary: "grammar/antlr/ZamaniParser.g4"
      rust_consumer: "src/parser.rs"
      status_gate: "parser integration must pass"

    ast:
      grammar_boundary: "grammar/"
      rust_owner: "src/ast/"
      canonical_module: "src/ast/mod.rs"
      status_gate: >
        Every applicable syntax feature must have a deterministic mapping into
        the domain-neutral frontend AST.

    source_spans:
      rust_owner: "src/source_map.rs"
      status_gate: >
        Source locations required by diagnostics and AST consumers must remain
        recoverable through the canonical source mapping model.

# ============================================================================
# ANTLR STATUS CONTRACT
# ============================================================================

antlr:

  lexer:
    public_boundary: "grammar/antlr/ZamaniLexer.g4"
    composition_owner: "grammar/lexer/"
    rule: >
      No domain grammar may become an independent public lexer.

  parser:
    public_boundary: "grammar/antlr/ZamaniParser.g4"
    composition_owner: "grammar/"
    rule: >
      Domain grammars provide owned syntax to the canonical parser composition
      and do not create competing parser roots.

  imports:
    acyclic: true
    unresolved_imports_block_freeze: true

  generated_parser:
    required_before_stable: true

  ambiguity:
    unresolved_ambiguity_blocks_stable: true

  unreachable_rules:
    unresolved_unreachable_rules_block_stable: true

# ============================================================================
# SCALABILITY STATUS CONTRACT
# ============================================================================

scalability:

  model: "OPEN_ENDED"

  target:
    rule: >
      Zamani language semantics must remain independent of any finite hardware
      inventory.

  resource_bound:
    rule: >
      Programs may be constrained by resources available at compilation or
      execution time, but such constraints must be expressed as requirements,
      capabilities, constraints, preferences, budgets, or policies rather than
      universal grammar ceilings.

  forbidden_universal_limits:
    - "MAX_QUBITS"
    - "MAX_CPUS"
    - "MAX_CORES"
    - "MAX_THREADS"
    - "MAX_GPUS"
    - "MAX_FPGAS"
    - "MAX_ASICS"
    - "MAX_QPUS"
    - "MAX_NODES"
    - "MAX_MEMORY"
    - "MAX_STORAGE"
    - "MAX_REGISTER_WIDTH"
    - "MAX_VECTOR_WIDTH"
    - "MAX_TENSOR_RANK"
    - "MAX_TENSOR_DIMENSION"
    - "MAX_NETWORK_SIZE"
    - "MAX_DEVICE_COUNT"
    - "MAX_ACCELERATOR_COUNT"
    - "MAX_AGENT_COUNT"
    - "MAX_GATE_COUNT"

  equivalent_limits:
    forbidden: true
    rule: >
      Renaming or disguising a finite universal capacity does not make it
      valid.

  accepted_model:
    - "symbolic resource requirements"
    - "capability requirements"
    - "abstract topology requirements"
    - "constraints"
    - "preferences"
    - "budgets"
    - "policies"
    - "fallback rules"
    - "availability conditions"

  canonical_resource_forms:
    - 'requires qubits >= required_qubits'
    - 'requires memory >= required_memory'
    - 'requires capability("quantum.measurement")'
    - 'requires capability("gpu.compute")'
    - 'requires capability("tensor.compute")'
    - 'requires topology(required_topology)'

  status_gate: >
    Any unresolved artificial universal capacity restriction forces the
    affected feature to remain below STABLE.

# ============================================================================
# POCO-REAF STATUS CONTRACT
# ============================================================================

poco_reaf:

  status: "ARCHITECTURAL_REQUIREMENT"

  source_meaning:
    program_once:
      requirement: >
        Source semantics must not require separate programs solely because
        target scale or hardware class changes.

    compile_once:
      requirement: >
        The portable compilation artifact must preserve language meaning,
        version information, requirements, capabilities, constraints,
        preferences, policies, effects, provenance, and target-independent
        semantic representation.

    run_everywhere:
      requirement: >
        Target realization must be selected from capabilities and available
        resources rather than forcing target-specific source syntax.

    anywhere:
      requirement: >
        Execution on a different target must either preserve the required
        semantics or explicitly fail or use an explicitly authorized fallback.

    forever:
      requirement: >
        Long-term compatibility requires versioned language, AST, semantic,
        IR, dialect, and migration contracts.

  stable_requires:
    - "target-independent semantics"
    - "capability negotiation"
    - "resource negotiation"
    - "explicit fallback semantics"
    - "versioned compatibility"
    - "provenance where required"
    - "deterministic compatibility behavior"

  prohibited:
    - "silent semantic substitution"
    - "silent approximation"
    - "vendor-specific syntax in universal core"
    - "physical device assumptions in universal grammar"
    - "target-dependent AST meaning"
    - "target-dependent source semantics"

# ============================================================================
# DOMAIN STATUS MATRIX
# ============================================================================

