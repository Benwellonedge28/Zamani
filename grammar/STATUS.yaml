      - "distributed"
    rule: >
      AI capabilities must use the common type, effect, resource, capability,
      policy, contract, and provenance systems.

  interoperability:
    path: "grammar/interoperability/"
    lifecycle: "SPECIFIED"
    required_before_freeze: true
    dependencies:
      - "core"
      - "types"
      - "effects"
      - "security"
      - "compatibility"
    rule: >
      External languages and formats remain interoperability boundaries and
      must not become hidden universal grammar authorities.

  dialects:
    path: "grammar/dialects/"
    lifecycle: "SPECIFIED"
    required_before_freeze: true
    dependencies:
      - "core"
      - "types"
      - "compatibility"
    rule: >
      Dialects may extend the language through registered contracts but may not
      silently redefine stable core semantics.

  macros:
    path: "grammar/macros/"
    lifecycle: "SPECIFIED"
    required_before_freeze: true
    dependencies:
      - "core"
      - "types"
      - "expressions"
      - "statements"
      - "validation"

  metaprogramming:
    path: "grammar/metaprogramming/"
    lifecycle: "SPECIFIED"
    required_before_freeze: true
    dependencies:
      - "core"
      - "types"
      - "expressions"
      - "effects"
      - "policies"
      - "security"
      - "validation"

  compatibility:
    path: "grammar/compatibility/"
    lifecycle: "SPECIFIED"
    required_before_freeze: true
    dependencies:
      - "specification"
      - "core"
      - "types"
      - "antlr"
    role: "consumer_of_stable_contracts"

  nano:
    path: "grammar/nano/"
    lifecycle: "SPECIFIED"
    required_before_freeze: true
    dependencies:
      - "core"
      - "types"
      - "resources"
      - "hardware"
      - "execution"
    rule: >
      Nano-scale semantics are an extension of the common language and must
      not introduce a separate language or fixed physical capacity model.

# ============================================================================
# NON-PRODUCTION / CONSUMER STATUS
# ============================================================================

supporting_directories:

  specification:
    path: "grammar/specification/"
    role: "normative authority"
    status: "SPECIFIED"

  spec:
    path: "grammar/spec/"
    role: "machine-oriented contracts"
    status: "SPECIFIED"

  reference:
    path: "grammar/reference/"
    role: "reference/tooling material"
    status: "PLANNED"
    production_dependency: false

  tests:
    path: "grammar/tests/"
    role: "test consumer"
    status: "PARTIALLY_IMPLEMENTED"
    production_dependency: false

  conformance:
    path: "grammar/conformance/"
    role: "planned/generated conformance corpus"
    status: "PLANNED"
    production_dependency: false

  golden:
    path: "grammar/golden/"
    role: "canonical expected-output corpus"
    status: "PLANNED"
    production_dependency: false

  generators:
    path: "grammar/generators/"
    role: "contract/documentation generation tooling"
    status: "PLANNED"
    production_dependency: false

# ============================================================================
# STATUS INHERITANCE
# ============================================================================

inheritance:

  rule: >
    Directory-level status applies to files beneath that directory only when
    the file has no explicit status override and all mandatory inherited gates
    are applicable.

  explicit_override:
    allowed: true
    reason_required: true

  stable_override:
    allowed: false
    rule: >
      A child file cannot declare STABLE when its required upstream directory
      contract is not stable unless a formal compatibility boundary explicitly
      makes the child independent.

  deprecated_override:
    allowed: true
    migration_required: true

  historical_override:
    allowed: true
    production_use: false

# ============================================================================
# FILE-LEVEL STATUS GATES
# ============================================================================

file_gates:

  G01_inventory:
    name: "Inventory"
    requirement: >
      The file exists in the canonical repository inventory and has a canonical
      path.
    blocks:
      - "STABLE"
      - "FROZEN"

  G02_authority:
    name: "Authority"
    requirement: >
      The file has exactly one normative authority and does not create a
      competing specification.
    blocks:
      - "STABLE"
      - "FROZEN"

  G03_owner:
    name: "Ownership"
    requirement: >
      Every exported symbol has exactly one owner.
    blocks:
      - "STABLE"
      - "FROZEN"

  G04_dependencies:
    name: "Dependencies"
    requirement: >
      All required dependencies resolve and obey the canonical dependency DAG.
    blocks:
      - "STABLE"
      - "FROZEN"

  G05_imports:
    name: "Imports"
    requirement: >
      All ANTLR imports resolve and the import graph remains acyclic.
    blocks:
      - "STABLE"
      - "FROZEN"

  G06_exports:
    name: "Exports"
    requirement: >
      Every public grammar rule has a documented export and consumer contract.
    blocks:
      - "STABLE"
      - "FROZEN"

  G07_ast:
    name: "AST"
    requirement: >
      Applicable syntax has a deterministic domain-neutral AST mapping.
    blocks:
      - "STABLE"
      - "FROZEN"

  G08_semantic:
    name: "Semantic"
    requirement: >
      Applicable syntax has a semantic owner and defined semantic behavior.
    blocks:
      - "STABLE"
      - "FROZEN"

  G09_ir:
    name: "IR"
    requirement: >
      Applicable lowerable constructs map to canonical IR without creating a
      competing hidden IR.
    blocks:
      - "STABLE"
      - "FROZEN"

  G10_diagnostics:
    name: "Diagnostics"
    requirement: >
      Invalid syntax and applicable semantic failures have deterministic
      diagnostic ownership.
    blocks:
      - "STABLE"
      - "FROZEN"

  G11_tests:
    name: "Tests"
    requirement: >
      Required positive, negative, boundary, compatibility, and integration
      tests exist and pass.
    blocks:
      - "STABLE"
      - "FROZEN"

  G12_scalability:
    name: "Scalability"
    requirement: >
      The feature does not introduce an artificial finite universal resource
      ceiling or target-specific semantic assumption.
    blocks:
      - "STABLE"
      - "FROZEN"

  G13_hardcoding:
    name: "Hard-coding"
    requirement: >
      Universal grammar contains no forbidden hardware or capacity constants.
    blocks:
      - "STABLE"
      - "FROZEN"

  G14_ambiguity:
    name: "Ambiguity"
    requirement: >
      Grammar ambiguity, precedence conflicts, unreachable rules, and accidental
      duplicate concepts are resolved or explicitly justified.
    blocks:
      - "STABLE"
      - "FROZEN"

  G15_compatibility:
    name: "Compatibility"
    requirement: >
      Stable syntax and semantics have versioned compatibility behavior.
    blocks:
      - "STABLE"
      - "FROZEN"

  G16_downstream_stability:
    name: "Downstream stability"
    requirement: >
      Adding a downstream target, backend, device, or consumer does not require
      semantic modification of the frozen file.
    blocks:
      - "FROZEN"

# ============================================================================
# DIRECTORY FREEZE RULE
# ============================================================================

directory_freeze:

  rule: >
    A directory may be frozen only when every production file in the directory
    and every required upstream dependency satisfies its applicable freeze
    gates.

  frozen_directory_requirements:
    - "all files inventoried"
    - "all owners resolved"
    - "all dependencies resolved"
    - "all imports resolved"
    - "all exports resolved"
    - "all AST mappings complete"
    - "all semantic mappings complete"
    - "all applicable IR mappings complete"
    - "diagnostics complete"
    - "compatibility complete"
    - "tests pass"
    - "hard-coding audit passes"
    - "scalability audit passes"
    - "ambiguity audit passes"
    - "path hygiene audit passes"

  downstream_addition_rule: >
    Adding a new downstream consumer must not require semantic modification of
    a frozen directory. If it does, the original interface was insufficient
    and the directory cannot remain frozen.

  upstream_change_rule: >
    A change to an upstream frozen contract requires an explicit versioned
    compatibility change and revalidation of all affected dependents.

# ============================================================================
# FREEZE STAGES
# ============================================================================

freeze_stages:

  FREEZE_0:
    name: "Inventory and audit"
    status: "NOT_ELIGIBLE"
    requires:
      - "MANIFEST.yaml"
      - "OWNERSHIP.yaml"
      - "DEPENDENCIES.yaml"
      - "STATUS.yaml"
    blocks_all_freezes: true

  FREEZE_1:
    name: "Authority and specification"
    status: "NOT_ELIGIBLE"
    depends_on:
      - "FREEZE_0"

  FREEZE_2:
    name: "Lexical system"
    status: "NOT_ELIGIBLE"
    depends_on:
      - "FREEZE_1"

  FREEZE_3:
    name: "Core names, modules, declarations"
    status: "NOT_ELIGIBLE"
    depends_on:
      - "FREEZE_2"

  FREEZE_4:
    name: "Type system"
    status: "NOT_ELIGIBLE"
    depends_on:
      - "FREEZE_3"

  FREEZE_5:
    name: "Expressions"
    status: "NOT_ELIGIBLE"
    depends_on:
      - "FREEZE_4"

  FREEZE_6:
    name: "Statements and functions"
    status: "NOT_ELIGIBLE"
    depends_on:
      - "FREEZE_5"

  FREEZE_7:
    name: "Effects, resources, capabilities"
    status: "NOT_ELIGIBLE"
    depends_on:
      - "FREEZE_6"

  FREEZE_8:
    name: "Contracts, policies, security"
    status: "NOT_ELIGIBLE"
    depends_on:
      - "FREEZE_7"

  FREEZE_9:
    name: "Classical and data"
    status: "NOT_ELIGIBLE"
    depends_on:
      - "FREEZE_8"

  FREEZE_10:
    name: "Concurrency, distributed, networking"
    status: "NOT_ELIGIBLE"
    depends_on:
      - "FREEZE_9"

  FREEZE_11:
    name: "Hardware, execution, compilation"
    status: "NOT_ELIGIBLE"
    depends_on:
      - "FREEZE_10"

  FREEZE_12:
    name: "Quantum"
    status: "NOT_ELIGIBLE"
    depends_on:
      - "FREEZE_11"

  FREEZE_13:
    name: "HDL"
    status: "NOT_ELIGIBLE"
    depends_on:
      - "FREEZE_12"

  FREEZE_14:
    name: "Hybrid"
    status: "NOT_ELIGIBLE"
    depends_on:
      - "FREEZE_13"

  FREEZE_15:
    name: "AI"
    status: "NOT_ELIGIBLE"
    depends_on:
      - "FREEZE_14"

  FREEZE_16:
    name: "Interoperability and dialects"
    status: "NOT_ELIGIBLE"
    depends_on:
      - "FREEZE_15"

  FREEZE_17:
    name: "Macros and metaprogramming"
    status: "NOT_ELIGIBLE"
    depends_on:
      - "FREEZE_16"

  FREEZE_18:
    name: "Compatibility"
    status: "NOT_ELIGIBLE"
    depends_on:
      - "FREEZE_17"

  FREEZE_19:
    name: "Root grammar composition"
    status: "NOT_ELIGIBLE"
    depends_on:
      - "FREEZE_18"

  COMPLETE:
    name: "Grammar subsystem frozen"
    status: "NOT_ELIGIBLE"
    depends_on:
      - "FREEZE_19"
    requires:
      - "all production gates pass"
      - "all required generated artifacts exist"
      - "all compatibility gates pass"

# ============================================================================
# DOMAIN STABILITY RULES
# ============================================================================

domain_stability:

  core:
    stable_requires:
      - "lexical contract stable"
      - "AST contract stable"
      - "source-span contract stable"
      - "no domain leakage"

  types:
    stable_requires:
      - "generic types"
      - "bounds"
      - "constraints"
      - "function types"
      - "resource-aware types where applicable"
      - "linear/affine semantics where applicable"
      - "no target-layout assumptions"

  expressions:
    stable_requires:
      - "canonical expression algebra"
      - "precedence contract"
      - "operator ownership"
      - "lambda/closure ownership resolved"
      - "AST mapping complete"

  effects:
    stable_requires:
      - "effect identity"
      - "effect composition"
      - "capability relationship"
      - "policy relationship"
      - "diagnostic contract"

  resources:
    stable_requires:
      - "symbolic requirements"
      - "capability references"
      - "abstract topology"
      - "constraint semantics"
      - "preference semantics"
      - "negotiation boundary"
      - "no finite universal capacity"

  quantum:
    stable_requires:
      - "generic quantum operation contract"
      - "operation specifier model"
      - "parameter model"
      - "target model"
      - "logical/physical distinction"
      - "measurement semantics"
      - "resource semantics"
      - "canonical quantum::ir mapping"
      - "no fixed gate enumeration architecture"

  hdl:
    stable_requires:
      - "hardware intent model"
      - "parameterized dimensions"
      - "abstract timing"
      - "resource semantics"
      - "hardware capability semantics"
      - "no fixed universal hardware width"

  hybrid:
    stable_requires:
      - "classical contract stable"
      - "quantum contract stable"
      - "HDL contract stable"
      - "cross-domain data mapping"
      - "cross-domain effect mapping"

  ai:
    stable_requires:
      - "common type system"
      - "common effect system"
      - "common resource system"
      - "common policy system"
      - "provenance"
      - "uncertainty semantics"
      - "no application-specific core dependency"

# ============================================================================
# DUPLICATE / CONFLICT STATUS
# ============================================================================

duplicate_concepts:

  policy: "BLOCKED_UNTIL_OWNERSHIP_RESOLVED"
  capability: "BLOCKED_UNTIL_OWNERSHIP_RESOLVED"
  resource_requirement: "BLOCKED_UNTIL_OWNERSHIP_RESOLVED"
  closure_vs_closures: "BLOCKED_UNTIL_OWNERSHIP_RESOLVED"
  lambda_vs_lambdas: "BLOCKED_UNTIL_OWNERSHIP_RESOLVED"
  array_vs_array_types: "BLOCKED_UNTIL_OWNERSHIP_RESOLVED"
  map_vs_map_types: "BLOCKED_UNTIL_OWNERSHIP_RESOLVED"
  option_vs_option_types: "BLOCKED_UNTIL_OWNERSHIP_RESOLVED"

  rule: >
    Similar names are not automatically duplicates. They become a production
    problem when they export overlapping semantics without an explicit,
    machine-verifiable distinction.

  resolution:
    - "identify canonical owner"
    - "document semantic distinction if both remain"
    - "convert compatibility aliases where appropriate"
    - "remove obsolete competing ownership"
    - "update dependency and ownership contracts"
    - "add regression tests"

# ============================================================================
# PATH HYGIENE
# ============================================================================

path_hygiene:

  required: true

  canonical_path_rules:
    separator: "/"
    absolute_paths: false
    parent_traversal: false
    control_characters: false
    leading_or_trailing_whitespace: false

  suspicious_paths:
    action: "BLOCK_FREEZE"

  duplicate_case_variants:
    action: "BLOCK_FREEZE"

  duplicate_pluralization_variants:
    action: "REVIEW_AND_RESOLVE"

  rule: >
    A malformed, whitespace-dependent, ambiguous, or duplicate path MUST NOT
    silently participate in a stable dependency graph.

# ============================================================================
# HARD-CODING STATUS
# ============================================================================

hard_coding:

  status: "REQUIRED_AUDIT"

  scan_required: true

  forbidden_categories:
    - "fixed qubit ceilings"
    - "fixed CPU ceilings"
    - "fixed GPU ceilings"
    - "fixed FPGA ceilings"
    - "fixed ASIC ceilings"
    - "fixed QPU ceilings"
    - "fixed node ceilings"
    - "fixed memory ceilings"
    - "fixed thread ceilings"
    - "fixed register widths as universal limits"
    - "fixed tensor ranks as universal limits"
    - "fixed network sizes"
    - "fixed device counts"

  semantic_exception:
    allowed: >
      Target-specific implementation constraints may exist downstream of the
      language semantic boundary. They must not become universal source-language
      limits.

  failure_effect:
    feature_status: "BLOCKED"
    directory_status: "NOT_FREEZABLE"
    repository_status: "AUDIT_REQUIRED"

# ============================================================================
# TARGET INDEPENDENCE
# ============================================================================

target_independence:

  grammar_must_not_own:
    - "physical device selection"
    - "physical qubit assignment"
    - "GPU selection"
    - "CPU selection"
    - "FPGA selection"
    - "ASIC selection"
    - "routing algorithm"
    - "runtime scheduling algorithm"
    - "hardware calibration"
    - "physical placement"
    - "device discovery"
    - "runtime telemetry"

  grammar_may_express:
    - "requirements"
    - "capabilities"
    - "constraints"
    - "preferences"
    - "abstract topology"
    - "placement intent"
    - "execution intent"
    - "fallback policy"
    - "resource budget"
    - "reliability requirement"
    - "latency requirement"
    - "energy requirement"

  status_rule: >
    Any grammar feature that crosses this boundary without an explicit
    semantic abstraction remains below STABLE.

# ============================================================================
# DOMAIN-NEUTRAL AST STATUS
# ============================================================================

ast_contract:

  owner:
    primary: "src/ast/mod.rs"

  grammar_requirement:
    rule: >
      Grammar syntax describes source structure. Domain semantics must be
      represented through the canonical domain-neutral AST boundary before
      semantic domain interpretation.

  required:
    - "source spans"
    - "stable node identity"
    - "domain-neutral structure"
    - "attributes"
    - "modifiers"
    - "effects where applicable"
    - "capabilities where applicable"
    - "resources where applicable"
    - "contracts where applicable"
    - "policies where applicable"
    - "provenance where applicable"

  forbidden:
    - "direct vendor IR embedding"
    - "physical device identity in universal AST"
    - "hidden domain-specific parser-only semantics"

# ============================================================================
# SEMANTIC STATUS
# ============================================================================

semantic_contract:

  required_stages:
    - "structural validation"
    - "type validation"
    - "effect validation"
    - "capability validation"
    - "resource validation"
    - "contract validation"
    - "policy validation"
    - "provenance validation"
    - "domain semantic validation"

  rule: >
    Grammar status cannot become STABLE for a semantic feature when the
    corresponding semantic contract is undefined.

# ============================================================================
# IR STATUS
# ============================================================================

ir_contract:

  canonical_rule: >
    Syntax must not lower directly to vendor-specific machine representation.

  required_flow:
    - "Zamani source"
    - "domain-neutral AST"
    - "semantic model"
    - "canonical domain IR"
    - "optimization"
    - "lowering"
    - "target realization"

  quantum:
    canonical_ir: "quantum::ir"

  classical:
    canonical_ir: "Classical IR"

  hdl:
    canonical_ir: "HDL/Hardware IR"

  competing_ir:
    forbidden: true

# ============================================================================
# DIAGNOSTIC STATUS
# ============================================================================

diagnostics:

  deterministic: true

  requirements:
    - "stable diagnostic identity"
    - "source span"
    - "category"
    - "message contract"
    - "severity"
    - "machine-readable representation where applicable"
    - "compatibility behavior"

  parser_errors:
    owner: "lexer/parser diagnostic implementation"

  semantic_errors:
    owner: "semantic validation implementation"

  resource_errors:
    owner: "resource/capability semantic validation"

  policy_errors:
    owner: "policy/security semantic validation"

  target_errors:
    owner: "compiler/runtime realization boundary"

  rule: >
    The grammar must not pretend that an unavailable target is a syntax error.
    Target feasibility belongs to semantic/compiler/runtime realization.

# ============================================================================
# TEST STATUS
# ============================================================================

tests:

  required_layers:
    - "lexical"
    - "parser"
    - "AST"
    - "structural validation"
    - "types"
    - "effects"
    - "resources"
    - "capabilities"
    - "contracts"
    - "policies"
    - "classical"
    - "quantum"
    - "HDL"
    - "hybrid"
    - "AI"
    - "data"
    - "concurrency"
    - "distributed"
    - "networking"
    - "hardware"
    - "execution"
    - "interoperability"
    - "dialects"
    - "macros"
    - "metaprogramming"
    - "compatibility"
    - "portability"
    - "scalability"
    - "diagnostics"
    - "negative cases"
    - "fuzzing"

  required_case_types:
    - "minimal valid"
    - "normal valid"
    - "boundary valid"
    - "invalid"
    - "ambiguous"
    - "unsupported"
    - "resource failure"
    - "capability failure"
    - "policy failure"
    - "compatibility failure"
    - "fallback"
    - "large symbolic scale"

  production_rule: >
    A feature cannot become STABLE solely because positive parser tests pass.

# ============================================================================
# SCALABILITY TEST STATUS
# ============================================================================

scalability_tests:

  required:
    - "same source semantics at multiple scales"
    - "symbolic resource quantities"
    - "tiny realization"
    - "larger realization"
    - "accelerated realization"
    - "distributed realization"
    - "quantum realization where applicable"
    - "hardware realization where applicable"

  rule: >
    Scaling tests must vary realization resources without requiring separate
    source programs solely because the target scale changed.

  equivalence:
    required: >
      Where semantic equivalence is promised, scaling must preserve the
      declared program semantics.

# ============================================================================
# COMPATIBILITY STATUS
# ============================================================================

compatibility:

  required_versions:
    - "language version"
    - "grammar version"
    - "lexer version"
    - "parser version"
    - "AST version"
    - "semantic model version"
    - "IR version"
    - "dialect version"

  stable_feature_requirement:
    - "compatibility identifier"
    - "change classification"
    - "migration behavior where required"
    - "deprecation behavior where required"

  breaking_change:
    requires:
      - "version increment"
      - "migration documentation"
      - "conformance updates"
      - "affected dependency review"

# ============================================================================
# STATUS PROPAGATION
# ============================================================================

status_propagation:

  rule: >
    Status must propagate from the weakest mandatory production contract, not
    from the strongest component.

  example:
    syntax: "STABLE"
    ast: "STABLE"
    semantic: "PARTIALLY_IMPLEMENTED"
    ir: "PLANNED"
    resulting_lifecycle: "PARTIALLY_IMPLEMENTED"

  stable_rule: >
    STABLE requires all applicable implementation and conformance dimensions
    to be STABLE or PASS.

  dependency_rule: >
    A feature cannot be STABLE when a mandatory upstream dependency is below
    the minimum required lifecycle unless a stable compatibility facade
    explicitly isolates the dependency.

# ============================================================================
# BLOCKED STATUS
# ============================================================================

blocking:

  reasons:
    - "missing owner"
    - "duplicate owner"
    - "unresolved import"
    - "dependency cycle"
    - "missing AST mapping"
    - "missing semantic mapping"
    - "missing IR mapping"
    - "missing diagnostics"
    - "missing tests"
    - "failed tests"
    - "hard-coded capacity"
    - "target-specific semantic leakage"
    - "unresolved ambiguity"
    - "unreachable grammar"
    - "path hygiene failure"
    - "compatibility undefined"
    - "downstream instability"
    - "unsafe Rust integration"
    - "missing source-span behavior"

  effect:
    lifecycle: "below STABLE"
    freeze: "BLOCKED"

# ============================================================================
# ROOT STATUS
# ============================================================================

root_files:

  "grammar/Zamani.g4":
    lifecycle: "SPECIFIED"
    freeze: "NOT_ELIGIBLE"
    role: "composition-only"
    must_not_own:
      - "tokens"
      - "domain implementations"
      - "hardware limits"
      - "IR"
      - "runtime realization"

  "grammar/antlr/ZamaniLexer.g4":
    lifecycle: "SPECIFIED"
    freeze: "NOT_ELIGIBLE"
    role: "public lexer boundary"

  "grammar/antlr/ZamaniParser.g4":
    lifecycle: "SPECIFIED"
    freeze: "NOT_ELIGIBLE"
    role: "public parser boundary"

  "grammar/MANIFEST.yaml":
    lifecycle: "SPECIFIED"
    freeze: "NOT_ELIGIBLE"
    role: "inventory and production integration contract"

  "grammar/OWNERSHIP.yaml":
    lifecycle: "PLANNED"
    freeze: "BLOCKED"
    reason: "required ownership artifact must exist and pass validation"

  "grammar/DEPENDENCIES.yaml":
    lifecycle: "PLANNED"
    freeze: "BLOCKED"
    reason: "required dependency artifact must exist and pass validation"

  "grammar/STATUS.yaml":
    lifecycle: "SPECIFIED"
    freeze: "READY"
    role: "canonical lifecycle/status contract"

  "grammar/CONFORMANCE.md":
    lifecycle: "SPECIFIED"
    freeze: "NOT_ELIGIBLE"

  "grammar/FREEZE.md":
    lifecycle: "PLANNED"
    freeze: "BLOCKED"
    reason: "freeze procedure must be established before final grammar freeze"

# ============================================================================
# REQUIRED GENERATED / MACHINE-CHECKED ARTIFACTS
# ============================================================================

required_artifacts:

  mandatory:
    - "grammar/MANIFEST.yaml"
    - "grammar/OWNERSHIP.yaml"
    - "grammar/DEPENDENCIES.yaml"
    - "grammar/STATUS.yaml"
    - "grammar/CONFORMANCE.md"
    - "grammar/FREEZE.md"

  recommended_contracts:
    - "grammar/contracts/ownership.yaml"
    - "grammar/contracts/dependencies.yaml"
    - "grammar/contracts/exports.yaml"
