# ============================================================================
# VALIDATION GATES
# ============================================================================

validation:

  inventory:
    required: true
    verifies:
      - "every grammar file is inventoried"
      - "every path is canonical"
      - "no unexplained duplicate paths"
      - "no malformed paths"

  ownership:
    required: true
    verifies:
      - "one owner per exported symbol"
      - "no competing public owner"
      - "no orphan public symbol"

  dependencies:
    required: true
    verifies:
      - "all dependencies resolve"
      - "no dependency cycle"
      - "no forbidden reverse dependency"
      - "no production dependency on tests"
      - "no production dependency on validation implementation"

  lexer:
    required: true
    verifies:
      - "one public lexer"
      - "one token authority"
      - "no duplicate token ownership"
      - "token compatibility identifiers"

  parser:
    required: true
    verifies:
      - "one public parser"
      - "one program root"
      - "one expression dispatch"
      - "one type dispatch"
      - "one declaration dispatch"
      - "one statement dispatch"

  grammar_quality:
    required: true
    verifies:
      - "ambiguity"
      - "precedence"
      - "reachability"
      - "left recursion policy"
      - "duplicate concepts"
      - "unreachable exports"

  ast:
    required: true
    verifies:
      - "complete AST mappings"
      - "source spans"
      - "stable node identity"

  semantics:
    required: true
    verifies:
      - "types"
      - "effects"
      - "capabilities"
      - "resources"
      - "contracts"
      - "policies"
      - "provenance"

  ir:
    required: true
    verifies:
      - "canonical IR mapping"
      - "no competing IR"
      - "domain-neutral frontend boundary"

  scalability:
    required: true
    verifies:
      - "no artificial universal limits"
      - "symbolic resource requirements"
      - "capability negotiation"
      - "target independence"
      - "explicit fallback"

  safety:
    required: true
    verifies:
      - "Rust >= 1.97"
      - "Rust 2021"
      - "unsafe forbidden"

# ============================================================================
# CI / RELEASE STATUS REQUIREMENTS
# ============================================================================

ci:

  minimum_checks:

    grammar:
      - "validate YAML"
      - "validate inventory"
      - "validate ownership"
      - "validate dependency DAG"
      - "validate ANTLR imports"
      - "validate grammar reachability"
      - "validate ambiguity"
      - "validate token uniqueness"
      - "validate hard-coding policy"
      - "validate path hygiene"

    rust:
      - "cargo check"
      - "cargo test"
      - "cargo clippy"
      - "unsafe-policy validation"

    conformance:
      - "lexer conformance"
      - "parser conformance"
      - "AST conformance"
      - "semantic conformance"
      - "IR conformance"
      - "compatibility conformance"
      - "portability conformance"
      - "scalability conformance"

  stable_release_rule: >
    A STABLE release cannot be produced when any mandatory production gate
    fails or is unverified.

# ============================================================================
# PRODUCTION READINESS SCORE
# ============================================================================

production_readiness:

  scoring_model:
    principle: >
      Production readiness is gate-based, not merely percentage-based. A
      mandatory failed gate prevents production status regardless of the number
      of passing optional checks.

  mandatory_domains:
    - "authority"
    - "inventory"
    - "ownership"
    - "dependencies"
    - "lexer"
    - "parser"
    - "AST"
    - "semantic"
    - "IR"
    - "diagnostics"
    - "compatibility"
    - "scalability"
    - "hard-coding"
    - "safety"
    - "tests"
    - "conformance"
    - "freeze"

  production_ready_condition:
    repository_lifecycle: "STABLE"
    all_mandatory_gates: "PASS"
    all_required_directories: "FROZEN"
    root_composition: "FROZEN"
    compatibility: "STABLE"
    safety: "PASS"

# ============================================================================
# FINAL REPOSITORY STATES
# ============================================================================

repository_states:

  AUDIT_REQUIRED:
    meaning: >
      Repository structure or contracts require inspection before freezing.

  SPECIFICATION_COMPLETE:
    meaning: >
      Normative language specification is complete but implementation and
      conformance may remain incomplete.

  IMPLEMENTATION_COMPLETE:
    meaning: >
      Required implementation layers exist but complete production gates may
      remain.

  CONFORMANCE_COMPLETE:
    meaning: >
      Required conformance suite passes but final freeze bookkeeping may remain.

  FREEZE_READY:
    meaning: >
      All dependencies and production gates are satisfied and the corresponding
      freeze operation may proceed.

  FROZEN:
    meaning: >
      The grammar subsystem or specified directory is frozen according to
      FREEZE.md. Only explicitly permitted mechanical/generated changes are
      allowed.

  PRODUCTION:
    meaning: >
      The complete grammar satisfies all mandatory production gates and is
      released as the stable target-independent Zamani language grammar.

# ============================================================================
# CURRENT DECLARED STATE
# ============================================================================

current_state:

  repository:
    lifecycle: "AUDIT_REQUIRED"
    production_ready: false
    freeze_allowed: false

  reason: >
    STATUS.yaml establishes the required lifecycle system, but repository-wide
    evidence from ownership, dependency, AST, semantic, IR, diagnostics,
    compatibility, hard-coding, path, ambiguity, and conformance validation
    must be completed before the grammar can truthfully become STABLE.

  next_required_stage:
    name: "FREEZE_0"
    objective: >
      Complete machine-verifiable inventory, ownership, dependency, path
      hygiene, duplicate-concept, hard-coding, and status audits before
      freezing any dependent grammar stage.

  next_required_artifacts:
    - "grammar/OWNERSHIP.yaml"
    - "grammar/DEPENDENCIES.yaml"
    - "grammar/contracts/"
    - "grammar/conformance/"
    - "grammar/golden/"

# ============================================================================
# NON-NEGOTIABLE INVARIANTS
# ============================================================================

invariants:

  one_language:
    rule: >
      All computational domains remain domains of one Zamani language.

  one_lexer:
    rule: >
      There is one public lexer boundary and one canonical lexical authority.

  one_parser:
    rule: >
      There is one public parser boundary and one canonical program composition
      root.

  one_ast:
    rule: >
      All source constructs pass through the domain-neutral frontend AST.

  one_semantic_model:
    rule: >
      Domain semantics must integrate through the common semantic architecture.

  canonical_domain_ir:
    rule: >
      Domains may have canonical IR representations, but source syntax must
      not bypass semantic modeling to reach vendor-specific IR.

  one_owner:
    rule: >
      Every public grammar symbol has exactly one canonical owner.

  no_hidden_capacity:
    rule: >
      No universal source-language feature may impose an undisclosed finite
      physical capacity.

  no_target_leakage:
    rule: >
      Universal syntax cannot depend on a particular physical device or vendor.

  no_unsafe:
    rule: >
      Rust implementation and generated Rust integration must remain safe-only.

  downstream_stability:
    rule: >
      Adding a downstream target, device, backend, or application must not
      require semantic modification of a correctly frozen upstream grammar
      contract.

  explicit_fallback:
    rule: >
      Fallback must be explicitly authorized and must not silently change
      program semantics.

  versioned_forever:
    rule: >
      Long-term compatibility is achieved through stable versioned contracts,
      migration rules, and canonical representations rather than assuming an
      unchanged parser binary can run indefinitely.

