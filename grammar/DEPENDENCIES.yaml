============================================================================

FREEZE GATE

============================================================================

freeze_gate:

required_checks:

dependency_graph:
  - "all imports resolve"
  - "no production cycle"
  - "no duplicate canonical owner"
  - "no forbidden reverse dependency"
  - "no dependency on quarantined artifact"

lexical:
  - "one token vocabulary"
  - "one public lexer boundary"
  - "no parser-defined token"
  - "no undocumented token"

syntax:
  - "one parser composition root"
  - "one top-level grammar composition root"
  - "no duplicate parser rule ownership"
  - "no unresolved ambiguity"
  - "no unreachable production"
  - "no accidental left recursion"

semantic:
  - "AST mapping exists"
  - "semantic mapping exists"
  - "effects mapping exists where applicable"
  - "resource mapping exists where applicable"
  - "capability mapping exists where applicable"
  - "policy mapping exists where applicable"
  - "provenance mapping exists where applicable"

ir:
  - "canonical IR mapping exists"
  - "quantum constructs converge on quantum::ir"
  - "no competing domain IR is introduced"

portability:
  - "no physical target dependency in universal syntax"
  - "no fixed hardware capacity"
  - "symbolic resource requirements supported"
  - "capability negotiation supported"
  - "abstract topology supported"
  - "fallback semantics explicit"

compatibility:
  - "language version defined"
  - "grammar version defined"
  - "AST version defined"
  - "semantic version defined"
  - "IR version defined"
  - "dialect version defined"
  - "migration policy defined"

implementation:
  - "Rust 1.97 or later supported"
  - "Rust edition 2021"
  - "unsafe Rust forbidden"
  - "frontend mappings validated"
  - "generated parser integration validated"

tests:
  - "lexical tests pass"
  - "parser tests pass"
  - "AST tests pass"
  - "semantic tests pass"
  - "negative tests pass"
  - "diagnostic tests pass"
  - "portability tests pass"
  - "scalability tests pass"
  - "compatibility tests pass"

============================================================================

HARD-CODING AUDIT

============================================================================

hard_coding_audit:

dependency_graph_must_reject:

capacity_constants:
  - "MAX_QUBITS"
  - "MAX_CPUS"
  - "MAX_CORES"
  - "MAX_THREADS"
  - "MAX_GPUS"
  - "MAX_FPGAS"
  - "MAX_ASICS"
  - "MAX_QPUS"
  - "MAX_NODES"
  - "MAX_MEMORY"
  - "MAX_STORAGE"
  - "MAX_REGISTER_WIDTH"
  - "MAX_VECTOR_WIDTH"
  - "MAX_TENSOR_RANK"
  - "MAX_TENSOR_DIMENSION"
  - "MAX_NETWORK_SIZE"
  - "MAX_DEVICE_COUNT"
  - "MAX_ACCELERATOR_COUNT"

disguised_limits:
  rule: >
    Any equivalent fixed finite implementation ceiling is prohibited even
    if it uses a different name.

dependency_graph_must_allow:

symbolic:
  - "N"
  - "required_memory"
  - "required_qubits"
  - "required_capacity"
  - "required_topology"

capability:
  - 'capability("quantum.measurement")'
  - 'capability("gpu.compute")'
  - 'capability("tensor.compute")'

constraints:
  - "requires"
  - "prefer"
  - "constrain"
  - "allow"
  - "forbid"

============================================================================

OPEN-WORLD EXTENSIBILITY

============================================================================

open_world:

principle: >
Concepts whose universe is inherently extensible MUST use names,
namespaces, registries, metadata, dialects, capabilities, or semantic
contracts rather than finite grammar enumeration.

applies_to:
- "quantum operations"
- "effects"
- "capabilities"
- "resources"
- "dialects"
- "vendors"
- "devices"
- "accelerators"
- "protocols"
- "AI model families"
- "hardware technologies"
- "future computational domains"

exception:
condition: >
A finite grammar enumeration is allowed only when the language semantics
themselves define a genuinely closed set.

requirement:
  - "document why the set is closed"
  - "assign one owner"
  - "define compatibility behavior"
  - "provide negative tests"

============================================================================

TARGET-INDEPENDENCE

============================================================================

target_independence:

grammar_may_express:
- "execution intent"
- "resource requirements"
- "capability requirements"
- "abstract topology"
- "constraints"
- "preferences"
- "policies"
- "effects"
- "contracts"
- "provenance"
- "fallback intent"

grammar_must_not_decide:
- "physical CPU selection"
- "physical GPU selection"
- "physical FPGA selection"
- "physical ASIC selection"
- "physical QPU selection"
- "physical qubit assignment"
- "physical memory placement"
- "routing algorithm"
- "schedule"
- "calibration"
- "target discovery"

dependency_rule: >
Any grammar dependency that requires one of the forbidden decisions above
is an architecture violation and MUST be moved downstream.

============================================================================

ERROR HANDLING

============================================================================

errors:

unresolved_dependency:
severity: "error"
action: "block freeze"

dependency_cycle:
severity: "error"
action: "block parser generation"

duplicate_owner:
severity: "error"
action: "block freeze"

duplicate_rule:
severity: "error"
action: "block parser generation"

duplicate_token:
severity: "error"
action: "block lexer generation"

forbidden_target_dependency:
severity: "error"
action: "block conformance"

hardcoded_capacity:
severity: "error"
action: "block production"

missing_ast_mapping:
severity: "error"
action: "block STABLE"

missing_semantic_mapping:
severity: "error"
action: "block STABLE"

missing_ir_mapping:
severity: "error"
action: "block STABLE when IR is applicable"

missing_compatibility_contract:
severity: "error"
action: "block STABLE"

quarantined_import:
severity: "error"
action: "block production parser generation"

============================================================================

COMPLETION CRITERIA

============================================================================

completion:

dependency_file_is_complete_when:

- "every production subsystem has an explicit dependency layer"
- "all composition roots are identified"
- "all canonical root dependencies are declared"
- "all forbidden dependency directions are declared"
- "all known duplicate concepts have canonical resolution"
- "quarantined artifacts cannot enter production imports"
- "AST boundary is defined"
- "semantic boundary is defined"
- "IR boundary is defined"
- "quantum::ir boundary is defined"
- "Rust frontend boundary is defined"
- "safe-Rust requirement is defined"
- "POCO-REAF dependencies are defined"
- "scalability dependencies are defined"
- "compatibility dependencies are defined"
- "test dependency direction is defined"
- "generated-artifact direction is defined"
- "freeze order is defined"
- "CI validation rules are defined"

file_can_be_frozen_when:

- "the repository tree has been reconciled against this contract"
- "every production import resolves"
- "every production edge belongs to an allowed layer"
- "no production cycle exists"
- "duplicate authorities are eliminated or quarantined"
- "all required downstream mappings exist"
- "all applicable tests pass"
- "the dependency DAG remains unchanged under backend-only additions"

downstream_stability_guarantee: >
Once this dependency contract and the corresponding ownership contracts
are frozen, adding a new compiler backend, CPU family, GPU family, FPGA,
ASIC, accelerator, QPU, simulator, cluster, network topology, deployment
environment, or future computational target MUST NOT require reopening a
frozen grammar dependency merely because the new target exists.

