============================================================================

GENERATED ARTIFACT RULES

============================================================================

generated:

principle: >
Generated parser or documentation artifacts are outputs of authoritative
sources and cannot become dependency roots.

generated_may_depend_on:
- "grammar/"

grammar_may_depend_on_generated: false

generated_must_record:
- "source revision"
- "grammar version"
- "tool version"
- "generation mode"

reproducibility:
required: true

============================================================================

FILE-LEVEL CONTRACT

============================================================================

Every production grammar file participates in this dependency model through

the following fields, whether recorded directly in the file or in the

machine-readable contract registry.

============================================================================

file_dependency_contract:

required:

- "path"
- "owner"
- "kind"
- "status"
- "imports"
- "exports"
- "depends_on"
- "consumed_by"
- "ast_owner"
- "semantic_owner"
- "ir_owner"
- "diagnostics_owner"
- "compatibility_owner"
- "test_owner"
- "scalability_contract"
- "poco_reaf_contract"
- "hard_coding_audit"
- "freeze_criteria"

import_rule: >
Every import MUST identify an existing canonical grammar or an explicitly
registered external contract.

export_rule: >
Every exported parser rule MUST have exactly one owner.

transitive_dependency_rule: >
A file inherits the stability requirements of all transitive dependencies.

downstream_rule: >
Downstream additions MUST use declared exports. They MUST NOT require
upstream semantic modification merely to add a new target, device,
algorithm family, or dialect.

freeze_rule: >
A file is not freeze-ready until all direct dependencies are frozen or
explicitly designated stable interfaces.

============================================================================

FREEZE ORDER

============================================================================

This is dependency order, not alphabetical order.

============================================================================

freeze_order:

stage_00:
name: "inventory-and-authority"
paths:
