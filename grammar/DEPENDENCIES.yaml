============================================================================

Zamani Programming Language

============================================================================

File:

grammar/DEPENDENCIES.yaml

Purpose:

Canonical machine-readable dependency contract for grammar/.

This file defines:

- the dependency DAG;

- dependency direction;

- composition-root boundaries;

- subsystem ordering;

- permitted cross-domain dependencies;

- forbidden dependency edges;

- Rust/frontend integration boundaries;

- AST/semantic/IR dependency boundaries;

- target-independence rules;

- POCO-REAF rules;

- scalability rules;

- quarantine rules for unresolved duplicate/malformed artifacts;

- freeze prerequisites.

This file MUST remain independent of individual backend implementations.

It does NOT define:

- lexical token spelling;

- semantic meaning;

- AST structure;

- IR structure;

- runtime implementation;

- target selection;

- hardware inventory;

- physical routing;

- scheduling algorithms.

Those responsibilities belong to their declared owners.

Repository:

Benwellonedge28/Zamani

Root:

grammar/

Language:

Zamani

Architecture:

Program_Once_Compile_Once_Run_Everywhere_Anywhere_Forever (POCO-REAF)

Rust:

Edition 2021

Minimum supported version: 1.97

Later compatible stable Rust versions are permitted.

Safety:

unsafe Rust is forbidden.

============================================================================

schema:
version: "2.0"
kind: "zamani-grammar-dependency-contract"
format: "yaml"
repository: "Benwellonedge28/Zamani"
root: "grammar/"
language: "Zamani"

source_of_inventory:
authority: "repository-git-tree"
rule: >
The actual repository tree is authoritative for file existence.
This file MUST NOT hard-code a stale total file count.

dependency_contract_authority:
path: "grammar/DEPENDENCIES.yaml"
scope:
- "dependency direction"
- "dependency layers"
- "composition boundaries"
- "freeze ordering"
- "forbidden dependency edges"
- "dependency validation"

ownership_authority:
path: "grammar/OWNERSHIP.yaml"

manifest_authority:
path: "grammar/MANIFEST.yaml"

architecture_authority:
path: "grammar/DESIGN.md"

normative_language_authority:
path: "grammar/specification/"

machine_contract_authority:
path: "grammar/spec/"

============================================================================

GLOBAL STATUS

============================================================================

status:
state: "AUDIT_REQUIRED"
freeze_allowed: false

reason:
- "The dependency DAG must be validated against the complete repository tree."
- "Every imported grammar must resolve to an existing grammar."
- "Every exported rule must have exactly one owner."
- "Every composition root must be acyclic."
- "Known duplicate conceptual files require canonical ownership."
- "Known malformed or non-canonical repository artifacts must not participate in production composition."
- "AST, semantic, IR, diagnostics, compatibility, and test dependencies must be closed before STABLE status."

stable_requires:
- "dependency graph is acyclic"
- "all production imports resolve"
- "all production dependency edges are explicitly classified"
- "all cross-layer edges obey the layer rules"
- "all composition roots have one canonical owner"
- "all quarantined artifacts are excluded from production imports"
- "all AST mappings resolve"
- "all semantic mappings resolve"
- "all applicable IR mappings resolve"
- "all diagnostics mappings resolve"
- "all compatibility mappings resolve"
- "all required conformance tests pass"
- "hard-coding audit passes"
- "scalability audit passes"
- "POCO-REAF audit passes"
- "safe-Rust audit passes"

