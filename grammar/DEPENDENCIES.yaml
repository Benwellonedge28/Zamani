stage_08:
name: "concurrency-distribution-networking"
paths:
- "grammar/concurrency/"
- "grammar/distributed/"
- "grammar/networking/"

stage_09:
name: "hardware-execution-compilation"
paths:
- "grammar/hardware/"
- "grammar/execution/"
- "grammar/compile/"

stage_10:
name: "quantum"
paths:
- "grammar/quantum/"

stage_11:
name: "hdl"
paths:
- "grammar/hdl/"

stage_12:
name: "hybrid"
paths:
- "grammar/hybrid/"

stage_13:
name: "ai-and-specialized-domains"
paths:
