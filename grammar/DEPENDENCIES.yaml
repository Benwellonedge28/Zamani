============================================================================

CANONICAL COMPOSITION ROOTS

============================================================================

A composition root may compose children but MUST NOT duplicate their rules.

============================================================================

composition_roots:

lexer:
path: "grammar/antlr/ZamaniLexer.g4"
owns:
- "public lexer boundary"
imports:
- "grammar/lexer/lexer.g4"
does_not_own:
- "individual token definitions"

parser:
path: "grammar/antlr/ZamaniParser.g4"
owns:
- "public parser composition boundary"
imports:
- "foundation dispatch"
- "type dispatch"
- "expression dispatch"
- "declaration dispatch"
- "function dispatch"
- "statement dispatch"
- "control-plane dispatch"
- "domain dispatch"
- "extension dispatch"
does_not_own:
- "leaf grammar semantics"

root:
path: "grammar/Zamani.g4"
owns:
- "top-level composition"
- "program dispatch"
- "EOF"
imports:
- "grammar/antlr/ZamaniParser.g4"
does_not_own:
- "tokens"
- "individual parser productions"
- "domain semantics"
- "hardware limits"
- "IR"

============================================================================

LEXICAL DEPENDENCIES

============================================================================

lexical:

canonical_token_registry:
owner: "grammar/lexer/tokens.g4"
consumers:
- "all parser grammars"
- "grammar/antlr/ZamaniLexer.g4"
rule: >
Parser grammars MUST consume the canonical vocabulary and MUST NOT
redeclare lexer tokens.

lexer_composition:
owner: "grammar/lexer/lexer.g4"
depends_on:
- "grammar/lexer/tokens.g4"
- "grammar/lexer/keywords.g4"
- "grammar/lexer/operators.g4"
- "grammar/lexer/punctuation.g4"
- "grammar/lexer/literals.g4"
- "grammar/lexer/identifiers.g4"
- "grammar/lexer/comments.g4"
- "grammar/lexer/annotations.g4"
- "grammar/lexer/unicode.g4"
- "grammar/lexer/lexer-errors.g4"

lexical_components:
token_registry:
path: "grammar/lexer/tokens.g4"
depends_on: []

identifiers:
  path: "grammar/lexer/identifiers.g4"
  depends_on:
    - "grammar/lexer/tokens.g4"

keywords:
  path: "grammar/lexer/keywords.g4"
  depends_on:
    - "grammar/lexer/tokens.g4"

operators:
  path: "grammar/lexer/operators.g4"
  depends_on:
    - "grammar/lexer/tokens.g4"

punctuation:
  path: "grammar/lexer/punctuation.g4"
  depends_on:
    - "grammar/lexer/tokens.g4"

literals:
  path: "grammar/lexer/literals.g4"
  depends_on:
    - "grammar/lexer/tokens.g4"
    - "grammar/lexer/numeric-literals.g4"
    - "grammar/lexer/string-literals.g4"
    - "grammar/lexer/character-literals.g4"
    - "grammar/lexer/boolean-literals.g4"
    - "grammar/lexer/duration-literals.g4"
    - "grammar/lexer/size-literals.g4"
    - "grammar/lexer/quantum-literals.g4"
    - "grammar/lexer/hardware-literals.g4"

lexical_rule:
forbidden:
- "parser grammar defining token rules"
- "domain grammar defining token rules"
- "Rust lexer silently accepting tokens absent from the lexical contract"
- "ANTLR lexer silently accepting tokens absent from the lexical contract"

============================================================================

FOUNDATION DEPENDENCIES

============================================================================

foundation:

core:
path: "grammar/core/"
depends_on:
- "grammar/lexer/"
may_define:
- "program"
- "sourceUnit"
- "compilationUnit"
- "names"
- "qualified names"
- "paths"
- "visibility"
- "attributes"
- "annotations"
- "modifiers"
- "requirements"
- "constraints"
- "capabilities"
- "policies"
- "hints"
- "versioning"
- "blocks"
must_not_depend_on:
- "quantum implementation"
- "specific GPU"
- "specific QPU"
- "specific FPGA"
- "backend IR"

modules:
path: "grammar/modules/"
depends_on:
- "grammar/core/"
may_be_depended_on_by:
- "declarations"
- "functions"
- "all domains"

declarations:
path: "grammar/declarations/"
