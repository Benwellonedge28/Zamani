============================================================================

final_invariant:

dependency_equation: >
Source syntax
-> lexical contract
-> parser contract
-> domain-neutral AST
-> structural validation
-> types/effects/resources/capabilities/contracts/policies/provenance
-> semantic model
-> canonical IR
-> target-independent optimization/lowering
-> capability/resource negotiation
-> realization
-> routing/scheduling/resilience
-> ZQN
-> HAL
-> target

mandatory_rule: >
No dependency in grammar/ may collapse the distinction between portable
program meaning and physical realization.

scalability_rule: >
The dependency graph is open-ended. Program size, resource size, machine
size, quantum-system size, network size, cluster size, tensor dimensions,
and hardware capacity are environmental or symbolic properties, not
universal grammar ceilings.

POCO_REAF_rule: >
A frozen grammar dependency must remain valid when the same source
semantics are realized on a tiny target, a larger target, an accelerator,
a quantum target, an HDL target, an HPC system, a distributed system, or a
future target, provided the target satisfies the declared semantic
requirements and policies.

freeze_rule: >
Dependency structure is considered production-ready only when it is closed
under downstream implementation growth without requiring semantic
back-editing of frozen grammar files.

