============================================================================

TYPE DEPENDENCIES

============================================================================

types:

root:
path: "grammar/types/types.g4"
role: "canonical type composition"
depends_on:
- "grammar/core/"
- "grammar/lexer/"
consumes:
- "type-level expressions"
- "names"
- "constraints"
- "capabilities"
exports:
- "canonical type expression entry point"

type_categories:
primitive:
path: "grammar/types/primitive.g4"
depends_on:
- "grammar/core/"
- "grammar/lexer/"

named:
  path: "grammar/types/named.g4"
  depends_on:
    - "grammar/core/"
    - "grammar/modules/"

generic:
  path: "grammar/types/generic.g4"
  depends_on:
    - "grammar/types/named.g4"
    - "grammar/types/bounds.g4"
    - "grammar/types/constraints.g4"

arrays:
  canonical:
    path: "grammar/types/array-types.g4"
    status: "canonical"
    depends_on:
      - "grammar/types/types.g4"
      - "grammar/expressions/"
    rule: >
      Array cardinality remains symbolic/type-level. It MUST NOT create
      physical capacity semantics.

  aliases_or_duplicates:
    - "grammar/types/array.g4"

maps:
  canonical:
    path: "grammar/types/map-types.g4"
    status: "canonical"
  aliases_or_duplicates:
    - "grammar/types/map.g4"

options:
  canonical:
    path: "grammar/types/option-types.g4"
    status: "canonical"
  aliases_or_duplicates:
    - "grammar/types/option.g4"

references:
  path: "grammar/types/reference.g4"
  depends_on:
    - "grammar/types/types.g4"
    - "grammar/memory/"

pointers:
  path: "grammar/types/pointer.g4"
  depends_on:
    - "grammar/types/types.g4"
    - "grammar/memory/"

linear:
  path: "grammar/types/linear.g4"
  depends_on:
    - "grammar/types/types.g4"
    - "grammar/memory/"

affine:
  path: "grammar/types/affine.g4"
  depends_on:
    - "grammar/types/types.g4"
    - "grammar/memory/"

resource:
  path: "grammar/types/resource.g4"
  depends_on:
    - "grammar/types/types.g4"
    - "grammar/resources/"

quantum:
  path: "grammar/types/quantum.g4"
  depends_on:
    - "grammar/types/types.g4"
    - "grammar/quantum/"
  rule: >
    Source-level quantum types may depend on quantum semantic contracts,
    but physical resource assignment remains downstream.

hardware:
  path: "grammar/types/hardware.g4"
  depends_on:
    - "grammar/types/types.g4"
    - "grammar/hardware/"
  rule: >
    Hardware types describe portable intent and capability contracts, not
    a fixed physical machine.

type_dependency_rule:
forbidden:
- "types -> vendor backend"
- "types -> physical device inventory"
- "types -> fixed machine capacity"
- "types -> runtime scheduling"

============================================================================

MEMORY DEPENDENCIES

============================================================================

