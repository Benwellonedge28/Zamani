============================================================================

RUST FRONTEND DEPENDENCIES

============================================================================

rust_frontend:

baseline:
edition: "2021"
minimum_version: "1.97"
later_stable_versions: true
unsafe_allowed: false

frontend:

lexer:
  path: "src/lexer.rs"
  consumes:
    - "grammar/lexer/"
    - "grammar/antlr/ZamaniLexer.g4"
  must_not_define:
    - "competing language token vocabulary"

parser:
  path: "src/parser.rs"
  consumes:
    - "grammar/antlr/ZamaniParser.g4"
    - "grammar/Zamani.g4"
  must_not_define:
    - "competing parser grammar"

ast:
  path: "src/ast/"
  consumes:
    - "parser output"
    - "grammar AST mappings"
  owns:
    - "domain-neutral AST implementation"

semantic:
  path: "src/semantic/"
  consumes:
    - "src/ast/"
    - "grammar/specification/"
    - "grammar/spec/"
    - "grammar semantic mappings"
  owns:
    - "semantic validation implementation"

ir:
  path: "src/ir/"
  consumes:
    - "semantic model"
  owns:
    - "canonical target-independent IR implementation"

quantum:
  path: "src/quantum/"
  consumes:
    - "quantum semantic model"
    - "quantum::ir contract"
  owns:
    - "quantum frontend/backend integration"

compile:
  path: "src/compile/"
  consumes:
    - "canonical IR"
    - "compatibility contracts"
    - "resource/capability contracts"
  owns:
    - "compiler integration"

============================================================================

AST / SEMANTIC / IR BOUNDARY

============================================================================

downstream_contracts:

ast:
owner: "src/ast/"
grammar_rule: >
Grammar produces source structure. It MUST NOT require a target-specific
AST representation.

semantic:
owner: "src/semantic/"
grammar_rule: >
Grammar constructs may declare semantic obligations, but semantic
validity is established downstream.

canonical_ir:
owner: "src/ir/"
grammar_rule: >
Grammar MUST NOT define a competing IR.

quantum_ir:
owner: "quantum::ir"
grammar_rule: >
Quantum syntax and semantics MUST converge through quantum::ir.

hardware_ir:
owner: "hardware/compiler backend"
grammar_rule: >
Hardware syntax MUST remain target-independent until lowering.

diagnostics:
owner: "diagnostic implementation"
grammar_rule: >
Every production construct requiring semantic validation must map to a
stable diagnostic category.

provenance:
owner: "semantic/provenance implementation"
grammar_rule: >
Provenance must survive syntax-to-AST-to-semantic-to-IR transformations
where required by the specification.

============================================================================

FORBIDDEN DEPENDENCY EDGES

============================================================================

forbidden_edges:

- from: "grammar/"
  to: "vendor-specific backend"
  reason: "breaks target independence"

- from: "grammar/"
  to: "physical hardware inventory"
  reason: "hardware discovery is downstream"

- from: "grammar/"
  to: "runtime scheduling implementation"
  reason: "scheduling is realization"

- from: "grammar/"
  to: "physical routing implementation"
  reason: "routing is realization"

- from: "grammar/"
  to: "calibration database"
  reason: "calibration is target/runtime state"

- from: "grammar/"
  to: "physical qubit identifiers"
  reason: "physical allocation is downstream"

- from: "lexer/"
  to: "parser/"
  reason: "lexical layer must remain below parser"

- from: "types/"
  to: "runtime scheduler"
  reason: "types describe meaning"

- from: "expressions/"
  to: "vendor backend"
  reason: "expressions are target-independent"

- from: "quantum/"
  to: "specific QPU implementation"
  reason: "quantum grammar is target-independent"

- from: "hdl/"
  to: "specific FPGA/ASIC implementation"
  reason: "HDL expresses portable hardware intent"

- from: "ai/"
  to: "specific accelerator implementation"
  reason: "AI semantics must remain target-independent"

- from: "tests/"
  to: "production grammar"
  reason: "tests consume production contracts"

- from: "generated/"
  to: "authoritative source grammar"
  reason: "generated artifacts cannot become source authority"

- from: "backend/"
  to: "grammar ownership"
  reason: "backend does not own source syntax"

============================================================================

CYCLE PREVENTION

============================================================================

cycle_rules:

general:
severity: "error"
rule: >
The production grammar dependency graph MUST be a directed acyclic graph.

forbidden_cycles:

parser_root:
  forbidden:
    - "ZamaniParser -> ZamaniParser"
    - "ZamaniParser -> Zamani.g4 -> ZamaniParser"

statements:
  forbidden:
    - "Statements -> Expressions -> Statements"

expressions:
  forbidden:
    - "Expressions -> Statements -> Expressions"

effects:
  forbidden:
    - "Effects -> specialized effect -> Effects"

resources:
  forbidden:
    - "Resources -> resource leaf -> Resources"

policies:
  forbidden:
    - "Policies -> policy leaf -> Policies"

quantum:
  forbidden:
    - "Quantum -> quantum leaf -> Quantum"

hdl:
  forbidden:
    - "HDL -> HDL leaf -> HDL"

hardware:
  forbidden:
    - "Hardware -> hardware leaf -> Hardware"

domains:
  forbidden:
    - "domain A -> domain B -> domain A"
  exception:
    condition: >
      A shared lower-level contract may be extracted into a lower layer.
    requirement: >
      The domain roots themselves MUST NOT form a semantic ownership cycle.

============================================================================

DOMAIN CROSS-DEPENDENCY RULES

============================================================================

cross_domain:

allowed_shared_foundations:
- "core"
- "modules"
- "types"
- "memory"
- "expressions"
- "functions"
- "effects"
- "resources"
- "policies"
- "security"
- "validation"
- "compatibility"

domain_to_domain_rule: >
A domain may consume another domain's exported semantic contract when
necessary, but MUST NOT duplicate the consumed domain's source syntax.

classical_quantum:
allowed: true
direction: "hybrid boundary"
owner: "grammar/hybrid/"

quantum_hdl:
allowed: true
direction: "hybrid boundary"
owner: "grammar/hybrid/"

classical_hdl:
allowed: true
direction: "hybrid boundary"
owner: "grammar/hybrid/"

ai_data:
allowed: true
direction: "AI consumes common data semantics"
owner: "grammar/ai/"

ai_quantum:
allowed: true
direction: "domain integration"
owner: "grammar/hybrid/ + grammar/ai/"

distributed_networking:
allowed: true
direction: "distributed consumes networking contracts"

hardware_execution:
allowed: true
direction: "execution consumes hardware capability contracts"

quantum_hardware:
allowed: true
direction: "quantum consumes hardware/resource capability contracts"

forbidden:
- "domain root redefining another domain's canonical syntax"
- "domain root importing parser root"
- "domain root importing runtime implementation"

============================================================================

QUANTUM DEPENDENCY CONTRACT

============================================================================

quantum:

canonical_direction:
- "lexer"
- "core/types/expressions"
- "quantum syntax"
- "domain-neutral AST"
- "quantum semantic model"
- "quantum::ir"
- "optimization/lowering"
- "routing/scheduling"
- "ZQN"
- "HAL"

operation_dependencies:

operations:
  path: "grammar/quantum/operations.g4"
  depends_on:
    - "grammar/quantum/parameters.g4"
    - "grammar/quantum/controls.g4"
    - "grammar/quantum/states.g4"
    - "grammar/quantum/measurement.g4"
    - "grammar/quantum/quantum-resources.g4"
    - "grammar/core/attributes.g4"
    - "grammar/effects/quantum.g4"

operation_specifier:
  semantic_variants:
    - "builtin"
    - "custom"
    - "vendor"
    - "parameterized"
    - "dialect"
    - "future"
  rule: >
    Adding a new operation MUST NOT require modification of the universal
    operation grammar when the operation can be represented by the
    existing open-world operation contract.

resource_dependencies:
- "grammar/resources/"
- "grammar/hardware/"
- "grammar/policies/"
- "grammar/effects/"

forbidden:
- "physical qubit numbering in universal grammar"
- "fixed QPU capacity"
- "fixed gate count"
- "fixed circuit depth ceiling"
- "vendor-specific mandatory syntax"

============================================================================

HDL DEPENDENCY CONTRACT

============================================================================

hdl:

direction:
- "core"
- "types"
- "memory"
- "resources"
- "hardware"
- "effects"
- "execution"
- "HDL syntax"
- "AST"
- "semantic hardware model"
- "hardware/HDL IR"
- "synthesis/lowering"

specialized_dependencies:
modules:
path: "grammar/hdl/hardware-modules.g4"
depends_on:
- "grammar/types/"
- "grammar/hardware/"

ports:
  path: "grammar/hdl/ports.g4"
  depends_on:
    - "grammar/types/"
    - "grammar/hdl/interfaces.g4"

signals:
  path: "grammar/hdl/signals.g4"
  depends_on:
    - "grammar/types/"
    - "grammar/hdl/nets.g4"

clocks:
  path: "grammar/hdl/clocks.g4"
  depends_on:
    - "grammar/hdl/clocking.g4"
    - "grammar/resources/"

timing:
  path: "grammar/hdl/timing.g4"
  depends_on:
    - "grammar/resources/"
    - "grammar/hdl/clocking.g4"

forbidden:
- "fixed universal register count"
- "fixed universal bus width"
- "fixed universal lane count"
- "specific fabrication technology as core syntax"

============================================================================

POCO-REAF DEPENDENCY CONTRACT

============================================================================

poco_reaf:

semantic_identity:
required_fields:
- "language_version"
- "grammar_version"
- "feature_set"
- "dialect_versions"
- "AST_version"
- "semantic_version"
- "IR_version"
- "resource_requirements"
- "capability_requirements"
- "constraints"
- "preferences"
- "policies"
- "effects"
- "provenance"
- "reproducibility_metadata"

compile_once:
dependency:
- "grammar/compile/"
- "grammar/compatibility/"
- "grammar/specification/compilation-model.md"
meaning: >
Compilation produces a target-independent semantic artifact or equivalent
stable representation. It MUST NOT imply that one physical machine-code
binary is universally executable on every future architecture.

run_everywhere:
dependency:
- "grammar/resources/"
- "grammar/hardware/"
- "grammar/execution/"
- "grammar/compile/"
realization:
- "discover"
- "match requirements"
- "apply constraints"
- "rank preferences"
- "select realization"
- "lower"
- "route"
- "schedule"
- "execute"

run_anywhere:
dependency:
- "grammar/policies/"
- "grammar/resources/"
- "grammar/compile/"
rule: >
Fallback is allowed only when explicitly permitted and semantically
valid. Silent semantic substitution is forbidden.

run_forever:
dependency:
- "grammar/compatibility/"
- "grammar/specification/language-version.md"
- "grammar/specification/compatibility.md"
- "grammar/specification/poco-reaf.md"
required:
- "versioned syntax"
- "versioned AST"
- "versioned semantic model"
- "versioned IR"
- "dialect compatibility"
- "migration rules"
- "reproducibility"

============================================================================

SCALABILITY CONTRACT

============================================================================

scalability:

principle: >
Dependency structure MUST remain valid regardless of the size of the
program, data, machine, cluster, network, quantum system, or hardware
realization.

permitted:
- "symbolic quantities"
- "generic parameters"
- "dependent values"
- "resource requirements"
- "capability requirements"
- "abstract topology"
- "constraints"
- "preferences"
- "budgets"
- "availability requirements"

forbidden_capacity_dependencies:
- "MAX_QUBITS"
- "MAX_CPUS"
- "MAX_CORES"
- "MAX_THREADS"
- "MAX_GPUS"
- "MAX_FPGAS"
- "MAX_ASICS"
- "MAX_QPUS"
- "MAX_NODES"
- "MAX_MEMORY"
- "MAX_STORAGE"
- "MAX_REGISTER_WIDTH"
- "MAX_VECTOR_WIDTH"
- "MAX_TENSOR_RANK"
- "MAX_TENSOR_DIMENSION"
- "MAX_NETWORK_SIZE"
- "MAX_DEVICE_COUNT"
- "MAX_ACCELERATOR_COUNT"

equivalent_limit_rule: >
Renaming a forbidden finite capacity does not make it valid. Dependency
contracts MUST reject equivalent hard-coded capacity semantics.

============================================================================

KNOWN DUPLICATE / LEGACY CONCEPTS

============================================================================

These entries MUST NOT be simultaneously imported as independent canonical

grammar authorities.

The dependency graph remains production-valid only when exactly one canonical

path is active.

============================================================================

duplicate_resolution:

expressions:

closure:
  canonical: "grammar/expressions/closures.g4"
  legacy: "grammar/expressions/closure.g4"
  production_rule:
    - "canonical may be imported"
    - "legacy may not be independently imported"
    - "legacy may become compatibility adapter"
    - "legacy may be retired after migration"

lambda:
  canonical: "grammar/expressions/lambdas.g4"
  legacy: "grammar/expressions/lambda.g4"
  production_rule:
    - "canonical may be imported"
    - "legacy may not be independently imported"

range:
  canonical: "grammar/expressions/ranges.g4"
  legacy: "grammar/expressions/range.g4"
  production_rule:
    - "canonical may be imported"
    - "legacy may not be independently imported"

types:

array:
  canonical: "grammar/types/array-types.g4"
  legacy:
    - "grammar/types/array.g4"
  production_rule:
    - "canonical owner only"
    - "legacy path must be adapter, deprecated, or quarantined"

map:
  canonical: "grammar/types/map-types.g4"
  legacy:
    - "grammar/types/map.g4"
  production_rule:
    - "canonical owner only"

option:
  canonical: "grammar/types/option-types.g4"
  legacy:
    - "grammar/types/option.g4"
  production_rule:
    - "canonical owner only"

associated_types:
  canonical: "grammar/types/associated.g4"
  legacy:
    - "grammar/types/associated types.g4"
  production_rule:
    - "whitespace-containing path MUST NOT be imported by production grammar"
    - "canonical normalized filename is required"

functional_dependencies:
  canonical: "grammar/types/functional-dependencies.g4"
  production_rule:
    - "whitespace-containing or malformed variants MUST NOT be imported"

rule:
severity: "error"
message: >
A duplicate conceptual file may exist during migration, but it MUST NOT
create a second production dependency path or second semantic owner.

============================================================================

QUARANTINE POLICY

============================================================================

quarantine:

purpose: >
Repository artifacts that cannot safely participate in the canonical
dependency DAG remain visible for migration/audit but are excluded from
production composition.

categories:

malformed_path:
  examples:
    - "paths containing unintended whitespace"
    - "paths containing control characters"
    - "paths containing duplicated content markers"
    - "paths whose filename does not match the canonical registry"
  production_import_allowed: false

duplicate_concept:
  examples:
    - "closure.g4 when closures.g4 is canonical"
    - "lambda.g4 when lambdas.g4 is canonical"
    - "array.g4 when array-types.g4 is canonical"
    - "map.g4 when map-types.g4 is canonical"
    - "option.g4 when option-types.g4 is canonical"
  production_import_allowed: false

historical:
  production_import_allowed: false

generated:
  production_import_allowed: false
  exception: >
    Generated parser artifacts may be consumed by build tooling, but
    generated output MUST NOT become grammar source authority.

quarantine_rule: >
Quarantined files MUST have no incoming production dependency edge except
from migration tooling, compatibility tooling, validation tooling, or
historical documentation.

============================================================================

TEST DEPENDENCIES

============================================================================

tests:

principle: >
Tests consume production contracts. Production grammars MUST NOT depend
upon test grammars or test implementations.

layers:

