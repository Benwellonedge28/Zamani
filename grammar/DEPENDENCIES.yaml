============================================================================

DEPENDENCY MODEL

============================================================================

dependency_model:

principle: >
Dependencies represent consumption of stable contracts. A dependency
MUST NOT imply ownership transfer.

dependency_types:

grammar_import:
  meaning: "ANTLR grammar composition/import"
  allowed: true
  must_resolve: true

lexical_contract:
  meaning: "consumption of canonical lexical vocabulary"
  allowed: true
  owner: "grammar/lexer/"

syntax_contract:
  meaning: "consumption of parser syntax"
  allowed: true

ast_contract:
  meaning: "mapping into domain-neutral AST"
  allowed: true
  owner: "src/ast/"

semantic_contract:
  meaning: "consumption of validated semantic meaning"
  allowed: true
  owner: "semantic implementation"

ir_contract:
  meaning: "mapping into canonical IR"
  allowed: true
  owner: "src/ir/"

diagnostic_contract:
  meaning: "diagnostic identity and source mapping"
  allowed: true

compatibility_contract:
  meaning: "language/version compatibility"
  allowed: true

test_contract:
  meaning: "conformance verification"
  allowed: true

documentation_reference:
  meaning: "non-executable documentation reference"
  allowed: true

ownership_rule: >
A dependency NEVER makes the dependent file an owner of the dependency's
symbols.

interface_rule: >
Frozen files may only be depended upon through their declared stable
exports and contracts.

implementation_rule: >
Grammar files MUST NOT depend directly on backend implementation details.

============================================================================

CANONICAL PIPELINE

============================================================================

canonical_pipeline:

- id: "P00"
  stage: "source"
  owner: "grammar/"
  consumes: "Zamani source text"
  produces: "source characters"

- id: "P01"
  stage: "lexical contracts"
  owner: "grammar/lexer/"
  depends_on:
  
  - "P00"
    produces:
  - "canonical token vocabulary"
  - "lexical classifications"

- id: "P02"
  stage: "ANTLR lexer boundary"
  owner: "grammar/antlr/ZamaniLexer.g4"
  depends_on:
  
  - "P01"
    produces:
  - "tokens"

- id: "P03"
  stage: "ANTLR parser composition"
  owner: "grammar/antlr/ZamaniParser.g4"
  depends_on:
  
  - "P02"
  - "grammar/core/"
  - "grammar/types/"
  - "grammar/expressions/"
  - "grammar/declarations/"
  - "grammar/statements/"
  - "grammar/functions/"
  - "domain composition roots"
    produces:
  - "parse tree"

- id: "P04"
  stage: "domain-neutral AST"
  owner: "src/ast/"
  depends_on:
  
  - "P03"
    produces:
  - "AST"

- id: "P05"
  stage: "structural validation"
  owner: "grammar/validation/ + semantic implementation"
  depends_on:
  
  - "P04"
    produces:
  - "validated AST"

- id: "P06"
  stage: "type validation"
  owner: "grammar/types/ + semantic implementation"
  depends_on:
  
  - "P05"

- id: "P07"
  stage: "effect validation"
  owner: "grammar/effects/ + semantic implementation"
  depends_on:
  
  - "P05"
  - "P06"

- id: "P08"
  stage: "resource/capability validation"
  owner: "grammar/resources/ + semantic implementation"
  depends_on:
  
  - "P05"
  - "P06"
  - "P07"

- id: "P09"
  stage: "contract/policy validation"
  owner: "grammar/validation/ + grammar/policies/ + grammar/security/"
  depends_on:
  
  - "P06"
  - "P07"
  - "P08"

- id: "P10"
  stage: "provenance/evidence"
  owner: "semantic implementation"
  depends_on:
  
  - "P04"
  - "P09"

- id: "P11"
  stage: "domain semantics"
  owner: "domain semantic implementations"
  depends_on:
  
  - "P06"
  - "P07"
  - "P08"
  - "P09"
  - "P10"

- id: "P12"
  stage: "canonical IR"
  owner: "src/ir/"
  depends_on:
  
  - "P11"

- id: "P13"
  stage: "quantum canonical IR"
  owner: "quantum::ir"
  depends_on:
  
  - "P11"
    rule: >
    Quantum syntax MUST converge through the canonical quantum IR boundary
    and MUST NOT create a competing source-specific quantum IR.

- id: "P14"
  stage: "optimization"
  owner: "compiler/backend"
  depends_on:
  
  - "P12"
  - "P13"

- id: "P15"
  stage: "lowering"
  owner: "compiler/backend"
  depends_on:
  
  - "P14"

- id: "P16"
  stage: "target negotiation"
  owner: "compiler/runtime"
  depends_on:
  
  - "P15"
  - "resource requirements"
  - "capability requirements"
  - "policies"

- id: "P17"
  stage: "routing and scheduling"
  owner: "compiler/backend/runtime"
  depends_on:
  
  - "P16"

- id: "P18"
  stage: "resilience and recovery"
  owner: "compiler/runtime"
  depends_on:
  
  - "P17"

- id: "P19"
  stage: "ZQN"
  owner: "compiler/backend/runtime"
  depends_on:
  
  - "P18"

- id: "P20"
  stage: "HAL"
  owner: "target/runtime integration"
  depends_on:
  
  - "P19"

