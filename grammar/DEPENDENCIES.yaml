architectural_equation:

  source_side:
    expression: >
      Source Syntax
      -> Types
      -> Effects
      -> Resources
      -> Capabilities
      -> Contracts
      -> Policies
      -> Provenance
      -> Domain Semantics
      -> Canonical IR

  realization_side:
    expression: >
      Canonical IR
      -> Optimization
      -> Target Capability Discovery
      -> Resource Negotiation
      -> Specialization
      -> Lowering
      -> Routing
      -> Scheduling
      -> Resilience
      -> ZQN
