# =============================================================================
# Zamani Programming Language
# =============================================================================
#
# File:
#   grammar/DEPENDENCIES.yaml
#
# Purpose:
#   Canonical machine-readable dependency contract for grammar/.
#
# Authority:
#   This file defines dependency direction, dependency layers, composition
#   boundaries, dependency validation, freeze ordering, and integration
#   contracts.
#
# It does NOT define:
#   - lexical spelling;
#   - complete syntax;
#   - semantic meaning;
#   - AST structure;
#   - IR structure;
#   - backend algorithms;
#   - hardware inventory;
#   - runtime implementation.
#
# Those responsibilities belong to their respective authorities.
#
# Repository:
#   Benwellonedge28/Zamani
#
# Language:
#   Zamani
#
# Rust:
#   Edition: 2021
#   Minimum supported version: 1.97
#   Safety requirement: production Rust MUST remain safe Rust.
#
# Architecture:
#   Program_Once_Compile_Once_Run_Everywhere_Anywhere_Forever (POCO-REAF)
#
# =============================================================================

schema:
  version: "3.0"
  kind: "zamani-grammar-dependency-contract"
  format: "yaml"
  schema_status: "NORMATIVE"
  repository: "Benwellonedge28/Zamani"
  root: "grammar/"
  language: "Zamani"

authority:
  architecture:
    path: "grammar/DESIGN.md"
    role: "normative grammar architecture"

  language_specification:
    path: "grammar/specification/"
    role: "normative language meaning"

  machine_contracts:
    path: "grammar/spec/"
    role: "machine-oriented language contracts"

  manifest:
    path: "grammar/MANIFEST.yaml"
    role: "repository grammar inventory"

  ownership:
    path: "grammar/OWNERSHIP.yaml"
    role: "symbol ownership"

  dependencies:
    path: "grammar/DEPENDENCIES.yaml"
    role: "dependency architecture"

  status:
    path: "grammar/STATUS.yaml"
    role: "implementation and conformance status"

  historical_reference:
    path: "grammar/Zamani-Grammar.md"
    role: "historical and extended reference"
    normative: false

  derived_reference:
    path: "grammar/grammar.md"
    role: "derived implementation/conformance reference"
    normative: false

# =============================================================================
# 1. GLOBAL INVARIANTS
# =============================================================================

invariants:

  single_architecture_authority:
    rule: >
      grammar/DESIGN.md is the sole architectural authority for grammar/.
      Other documents may refine or implement that architecture but MUST NOT
      establish a competing architecture.

  normative_language_authority:
    rule: >
      Normative language meaning is defined under grammar/specification/.
      A grammar file MUST NOT silently redefine semantic meaning that belongs
      to the specification.

  machine_contract_authority:
    rule: >
      Machine-readable contracts belong under grammar/spec/. They MUST agree
      with grammar/specification/ and MUST NOT silently contradict it.

  single_lexer_boundary:
    rule: >
      grammar/antlr/ZamaniLexer.g4 is the public ANTLR lexer boundary.
      grammar/lexer/ owns lexical contracts and registries. Individual parser
      grammars MUST NOT create competing lexer vocabularies.

  single_parser_boundary:
    rule: >
      grammar/antlr/ZamaniParser.g4 is the public parser composition boundary.
      Domain grammars provide owned productions through explicit composition
      contracts.

  single_root:
    rule: >
      grammar/Zamani.g4 is the final combined ANTLR composition root. It MUST
      compose the public lexer/parser boundaries and MUST NOT independently
      compose every domain.

  one_symbol_one_owner:
    rule: >
      Every exported grammar symbol MUST have exactly one canonical owner.
      Dependencies consume symbols but never transfer ownership.

  no_duplicate_public_exports:
    rule: >
      Two production grammar files MUST NOT export the same public rule unless
      one is explicitly designated as an alias or composition adapter by
      grammar/OWNERSHIP.yaml.

  no_backend_dependency_from_grammar:
    rule: >
      Production grammar MUST NOT depend on backend implementation details,
      physical device implementations, scheduling algorithms, routing
      algorithms, calibration data, or runtime state.

  no_target_capacity_in_language_contract:
    rule: >
      Language architecture MUST NOT define universal physical capacity
      ceilings. Available capacity belongs to the target realization.

  symbolic_scalability:
    rule: >
      Resource requirements MUST be expressible symbolically and parametrically.
      Source syntax MUST NOT require knowledge of a target's finite capacity.

  semantic_preservation:
    rule: >
      Changing target realization MUST NOT require changing the semantic
      definition of the portable program merely because target resources differ.

  acyclic_dependency_graph:
    rule: >
      The production dependency graph MUST be acyclic after composition
      aliases and test-only dependencies are removed.

  deterministic_composition:
    rule: >
      Grammar composition MUST be deterministic. Import order MUST NOT produce
      different language meaning.

  safe_rust:
    rule: >
      The Zamani Rust implementation MUST use safe Rust. Production compiler
      code MUST NOT require unsafe blocks, unsafe traits, or unsafe
      implementations.

  tests_do_not_become_dependencies:
    rule: >
      Tests, examples, golden files, conformance fixtures, and generated
      artifacts MAY depend on production grammar, but production grammar MUST
      NOT depend on tests or generated output.

# =============================================================================
# 2. DEPENDENCY KINDS
# =============================================================================

dependency_kinds:

  grammar_import:
    description: "ANTLR grammar composition/import."
    production_allowed: true
    must_resolve: true

  lexical_contract:
    description: "Consumption of the canonical lexical vocabulary."
    production_allowed: true
    owner: "grammar/lexer/"

  syntax_contract:
    description: "Consumption of stable parser syntax."
    production_allowed: true

  ast_contract:
    description: "Mapping from parsed structure into the domain-neutral AST."
    production_allowed: true
    implementation_owner: "src/ast/"

  semantic_contract:
    description: "Consumption of validated semantic meaning."
    production_allowed: true
    implementation_owner: "semantic implementation"

  effect_contract:
    description: "Consumption of the universal effect model."
    production_allowed: true

  capability_contract:
    description: "Consumption of target capability declarations."
    production_allowed: true

  resource_contract:
    description: "Consumption of symbolic resource requirements."
    production_allowed: true

  policy_contract:
    description: "Consumption of policy constraints and decisions."
    production_allowed: true

  provenance_contract:
    description: "Consumption or production of provenance metadata."
    production_allowed: true

  ir_contract:
    description: "Mapping into canonical or explicitly owned domain IR."
    production_allowed: true
    implementation_owner: "src/ir/"

  diagnostic_contract:
    description: "Stable diagnostic categories and source mapping."
    production_allowed: true

  compatibility_contract:
    description: "Language, grammar, AST, semantic, IR, artifact, or dialect compatibility."
    production_allowed: true

  test_contract:
    description: "Conformance verification."
    production_allowed: true

  documentation_reference:
    description: "Non-executable documentation relationship."
    production_allowed: true

# =============================================================================
# 3. DEPENDENCY DIRECTION
# =============================================================================

dependency_direction:

  principle: >
    A dependency consumes a stable contract. It does not transfer ownership.
    Dependencies MUST move from foundational contracts toward consumers.

  forbidden_reverse_dependency:
    - "consumer -> provider implementation internals"
    - "grammar -> runtime"
    - "grammar -> hardware implementation"
    - "grammar -> target inventory"
    - "grammar -> scheduler implementation"
    - "grammar -> router implementation"
    - "grammar -> calibration implementation"
    - "grammar -> QEC implementation"
    - "grammar -> device driver"
    - "grammar -> generated parser output"
    - "production grammar -> tests"

  permitted_downstream_flow:
    - "source"
    - "lexical contracts"
    - "lexer boundary"
    - "foundation syntax"
    - "types and memory"
    - "expressions"
    - "functions"
    - "statements"
    - "effects/resources/policies/security"
    - "computational domains"
    - "extensions and interoperability"
    - "compatibility"
    - "parser composition"
    - "root composition"
    - "frontend AST"
    - "semantic validation"
    - "canonical IR"
    - "optimization"
    - "lowering"
    - "target negotiation"
    - "routing and scheduling"
    - "resilience"
    - "ZQN"
    - "HAL"
    - "runtime"

# =============================================================================
# 4. ARCHITECTURAL LAYERS
# =============================================================================

layers:

  L00_authority:
    purpose: "Normative architecture and language meaning."
    paths:
      - "grammar/DESIGN.md"
      - "grammar/specification/"
      - "grammar/spec/"
    may_depend_on: []
    may_be_depended_on_by:
      - "all production contracts"
      - "validation tooling"
      - "freeze tooling"

  L01_registry:
    purpose: "Machine-readable repository inventories and ownership contracts."
    paths:
      - "grammar/MANIFEST.yaml"
      - "grammar/OWNERSHIP.yaml"
      - "grammar/DEPENDENCIES.yaml"
      - "grammar/STATUS.yaml"
      - "grammar/contracts/"
    may_depend_on:
      - "L00_authority"
    may_be_depended_on_by:
      - "validation tooling"
      - "CI"
      - "freeze tooling"
      - "conformance tooling"

  L02_lexical:
    purpose: "Canonical lexical vocabulary and lexical composition."
    paths:
      - "grammar/lexer/"
    may_depend_on:
      - "L00_authority"
    may_be_depended_on_by:
      - "L03_lexer_boundary"
      - "L04_foundation"
      - "L05_types"
      - "L06_expressions"
      - "L07_functions"
      - "L08_statements"
      - "L09_control_plane"
      - "L10_domains"
      - "L11_extensions"

  L03_lexer_boundary:
    purpose: "Public ANTLR lexer composition boundary."
    paths:
      - "grammar/antlr/ZamaniLexer.g4"
    may_depend_on:
      - "L02_lexical"
    may_be_depended_on_by:
      - "L13_parser_boundary"
      - "L14_root"

  L04_foundation:
    purpose: "Universal names, paths, program structure, modules and declarations."
    paths:
      - "grammar/core/"
      - "grammar/modules/"
      - "grammar/declarations/"
    may_depend_on:
      - "L02_lexical"
    may_be_depended_on_by:
      - "L05_types"
      - "L06_expressions"
      - "L07_functions"
      - "L08_statements"
      - "L09_control_plane"
      - "L10_domains"
      - "L11_extensions"

  L05_types:
    purpose: "Universal type and memory semantics."
    paths:
      - "grammar/types/"
      - "grammar/memory/"
    may_depend_on:
      - "L02_lexical"
      - "L04_foundation"
    may_be_depended_on_by:
      - "L06_expressions"
      - "L07_functions"
      - "L08_statements"
      - "L09_control_plane"
      - "L10_domains"
      - "L11_extensions"

  L06_expressions:
    purpose: "Universal expression algebra."
    paths:
      - "grammar/expressions/"
    may_depend_on:
      - "L02_lexical"
      - "L04_foundation"
      - "L05_types"
    may_be_depended_on_by:
      - "L07_functions"
      - "L08_statements"
      - "L09_control_plane"
      - "L10_domains"
      - "L11_extensions"

  L07_functions:
    purpose: "Functions, parameters, generics, calls, closures and callable constructs."
    paths:
      - "grammar/functions/"
    may_depend_on:
      - "L04_foundation"
      - "L05_types"
      - "L06_expressions"
    may_be_depended_on_by:
      - "L08_statements"
      - "L09_control_plane"
      - "L10_domains"
      - "L11_extensions"

  L08_statements:
    purpose: "Universal statement and control-flow syntax."
    paths:
      - "grammar/statements/"
    may_depend_on:
      - "L04_foundation"
      - "L05_types"
      - "L06_expressions"
      - "L07_functions"
    may_be_depended_on_by:
      - "L09_control_plane"
      - "L10_domains"
      - "L11_extensions"

  L09_control_plane:
    purpose: >
      Shared semantic-control syntax for effects, resources, policies,
      security and validation.
    paths:
      - "grammar/effects/"
      - "grammar/resources/"
      - "grammar/policies/"
      - "grammar/security/"
      - "grammar/validation/"
    may_depend_on:
      - "L04_foundation"
      - "L05_types"
      - "L06_expressions"
      - "L07_functions"
      - "L08_statements"
    may_be_depended_on_by:
      - "L10_domains"
      - "L11_extensions"
      - "L12_compatibility"
      - "L13_parser_boundary"

  L10_domains:
    purpose: "Computational domain syntax."
    paths:
      - "grammar/classical/"
      - "grammar/data/"
      - "grammar/concurrency/"
      - "grammar/distributed/"
      - "grammar/networking/"
      - "grammar/hardware/"
      - "grammar/execution/"
      - "grammar/compile/"
      - "grammar/quantum/"
      - "grammar/hdl/"
      - "grammar/hybrid/"
      - "grammar/ai/"
      - "grammar/nano/"
    may_depend_on:
      - "L04_foundation"
      - "L05_types"
      - "L06_expressions"
      - "L07_functions"
      - "L08_statements"
      - "L09_control_plane"
    may_be_depended_on_by:
      - "L11_extensions"
      - "L12_compatibility"
      - "L13_parser_boundary"

  L11_extensions:
    purpose: "Dialect, interoperability, macro and metaprogramming extensions."
    paths:
      - "grammar/interoperability/"
      - "grammar/dialects/"
      - "grammar/macros/"
      - "grammar/metaprogramming/"
    may_depend_on:
      - "L04_foundation"
      - "L05_types"
      - "L06_expressions"
      - "L07_functions"
      - "L08_statements"
      - "L09_control_plane"
      - "L10_domains"
    may_be_depended_on_by:
      - "L12_compatibility"
      - "L13_parser_boundary"

  L12_compatibility:
    purpose: "Versioning and compatibility contracts."
    paths:
      - "grammar/compatibility/"
    may_depend_on:
      - "L00_authority"
      - "L01_registry"
      - "L02_lexical"
      - "L04_foundation"
      - "L05_types"
      - "L06_expressions"
      - "L07_functions"
      - "L08_statements"
      - "L09_control_plane"
      - "L10_domains"
      - "L11_extensions"
    may_be_depended_on_by:
      - "L13_parser_boundary"
      - "L14_root"
      - "conformance tooling"

  L13_parser_boundary:
    purpose: "Public ANTLR parser composition boundary."
    paths:
      - "grammar/antlr/ZamaniParser.g4"
    may_depend_on:
      - "L03_lexer_boundary"
      - "L04_foundation"
      - "L05_types"
      - "L06_expressions"
      - "L07_functions"
      - "L08_statements"
      - "L09_control_plane"
      - "L10_domains"
      - "L11_extensions"
      - "L12_compatibility"
    may_be_depended_on_by:
      - "L14_root"

  L14_root:
    purpose: "Final combined grammar."
    paths:
      - "grammar/Zamani.g4"
    may_depend_on:
      - "L03_lexer_boundary"
      - "L13_parser_boundary"
    may_be_depended_on_by:
      - "ANTLR generation"
      - "frontend conformance"

  L15_conformance:
    purpose: "Tests, examples and golden expectations."
    paths:
      - "grammar/tests/"
      - "grammar/conformance/"
      - "grammar/golden/"
      - "grammar/examples/"
    may_depend_on:
      - "L00_authority"
      - "L01_registry"
      - "L02_lexical"
      - "L03_lexer_boundary"
      - "L04_foundation"
      - "L05_types"
      - "L06_expressions"
      - "L07_functions"
      - "L08_statements"
      - "L09_control_plane"
      - "L10_domains"
      - "L11_extensions"
      - "L12_compatibility"
      - "L13_parser_boundary"
      - "L14_root"
    production_dependency_allowed: false

  L16_frontend_implementation:
    purpose: "Rust frontend implementation."
    paths:
      - "src/lexer.rs"
      - "src/parser.rs"
      - "src/ast/"
    may_depend_on:
      - "L00_authority"
      - "L02_lexical"
      - "L13_parser_boundary"
      - "L14_root"
      - "L15_conformance"
    grammar_may_depend_on: false

  L17_semantic_implementation:
    purpose: "Validated semantic implementation."
    paths:
      - "src/semantic/"
    may_depend_on:
      - "L16_frontend_implementation"
      - "L09_control_plane"
      - "L10_domains"
      - "L12_compatibility"
    grammar_may_depend_on: false

  L18_ir_implementation:
    purpose: "Canonical and domain IR implementation."
    paths:
      - "src/ir/"
      - "src/quantum/ir/"
    may_depend_on:
      - "L17_semantic_implementation"
      - "L12_compatibility"
    grammar_may_depend_on: false

  L19_realization:
    purpose: "Optimization, lowering, routing, scheduling, resilience and target realization."
    paths:
      - "src/compiler/"
      - "src/compile/"
      - "src/quantum/optimization/"
      - "src/quantum/scheduling/"
      - "src/quantum/qec/"
      - "src/quantum/zqn/"
      - "runtime/"
      - "hal/"
    may_depend_on:
      - "L18_ir_implementation"
      - "L09_control_plane"
      - "L12_compatibility"
    grammar_may_depend_on: false

# =============================================================================
# 5. CANONICAL PIPELINE
# =============================================================================

pipeline:

  - id: "P00"
    stage: "source"
    input: "Zamani source text"
    output: "source characters"

  - id: "P01"
    stage: "lexical_contracts"
    owner: "grammar/lexer/"
    depends_on:
      - "P00"
    output:
      - "canonical token vocabulary"
      - "lexical classifications"

  - id: "P02"
    stage: "antlr_lexer"
    owner: "grammar/antlr/ZamaniLexer.g4"
    depends_on:
      - "P01"
    output:
      - "tokens"

  - id: "P03"
    stage: "antlr_parser"
    owner: "grammar/antlr/ZamaniParser.g4"
    depends_on:
      - "P02"
      - "foundation"
      - "types"
      - "expressions"
      - "functions"
      - "statements"
      - "control_plane"
      - "domains"
      - "extensions"
      - "compatibility"
    output:
      - "parse tree"

  - id: "P04"
    stage: "combined_root"
    owner: "grammar/Zamani.g4"
    depends_on:
      - "P02"
      - "P03"
    output:
      - "complete source parse"

  - id: "P05"
    stage: "domain_neutral_ast"
    owner: "src/ast/"
    depends_on:
      - "P04"
    output:
      - "AST"

  - id: "P06"
    stage: "structural_validation"
    owner: "grammar/validation/ + semantic implementation"
    depends_on:
      - "P05"

  - id: "P07"
    stage: "type_validation"
    owner: "type semantic implementation"
    depends_on:
      - "P06"

  - id: "P08"
    stage: "effect_validation"
    owner: "effect semantic implementation"
    depends_on:
      - "P06"
      - "P07"

  - id: "P09"
    stage: "resource_capability_validation"
    owner: "resource/capability semantic implementation"
    depends_on:
      - "P06"
      - "P07"
      - "P08"

  - id: "P10"
    stage: "contract_policy_validation"
    owner: "contract/policy/security validation"
    depends_on:
      - "P07"
      - "P08"
      - "P09"

  - id: "P11"
    stage: "provenance_evidence"
    owner: "semantic implementation"
    depends_on:
      - "P05"
      - "P10"

  - id: "P12"
    stage: "domain_semantics"
    owner: "domain semantic implementations"
    depends_on:
      - "P07"
      - "P08"
      - "P09"
      - "P10"
      - "P11"

  - id: "P13"
    stage: "canonical_ir"
    owner: "src/ir/"
    depends_on:
      - "P12"

  - id: "P14"
    stage: "quantum_ir"
    owner: "src/quantum/ir/"
    depends_on:
      - "P12"
    invariant: >
      Quantum source semantics MUST converge through quantum::ir. Grammar
      MUST NOT define a competing source-specific quantum IR.

  - id: "P15"
    stage: "optimization"
    owner: "compiler/backend"
    depends_on:
      - "P13"
      - "P14"

  - id: "P16"
    stage: "lowering"
    owner: "compiler/backend"
    depends_on:
      - "P15"

  - id: "P17"
    stage: "target_negotiation"
    owner: "compiler/runtime"
    depends_on:
      - "P16"
      - "resource requirements"
      - "capability requirements"
      - "policies"

  - id: "P18"
    stage: "routing_and_scheduling"
    owner: "compiler/backend/runtime"
    depends_on:
      - "P17"

  - id: "P19"
    stage: "resilience"
    owner: "compiler/runtime"
    depends_on:
      - "P18"

  - id: "P20"
    stage: "zqn"
    owner: "quantum/compiler/runtime"
    depends_on:
      - "P19"

  - id: "P21"
    stage: "hal"
    owner: "target/runtime integration"
    depends_on:
      - "P20"

# =============================================================================
# 6. CANONICAL COMPOSITION ROOTS
# =============================================================================

composition_roots:

  lexer:
    path: "grammar/antlr/ZamaniLexer.g4"
    grammar_type: "lexer grammar"
    owns:
      - "public lexer boundary"
    imports:
      - "grammar/lexer/lexer.g4"
    does_not_own:
      - "individual token registry entries"
      - "parser rules"
      - "semantic rules"
      - "hardware discovery"

  parser:
    path: "grammar/antlr/ZamaniParser.g4"
    grammar_type: "parser grammar"
    owns:
      - "public parser composition boundary"
      - "universal parser dispatch"
    imports:
      - "foundation dispatch"
      - "type dispatch"
      - "expression dispatch"
      - "declaration dispatch"
      - "function dispatch"
      - "statement dispatch"
      - "control-plane dispatch"
      - "domain dispatch"
      - "extension dispatch"
    does_not_own:
      - "leaf domain semantics"
      - "token definitions"
      - "AST implementation"
      - "IR implementation"

  root:
    path: "grammar/Zamani.g4"
    grammar_type: "combined grammar"
    owns:
      - "top-level program entry"
      - "complete-input EOF enforcement"
    imports:
      - "grammar/antlr/ZamaniParser.g4"
      - "grammar/antlr/ZamaniLexer.g4"
    does_not_own:
      - "tokens"
      - "domain parser productions"
      - "semantic validation"
      - "hardware realization"
      - "IR"
      - "runtime"

# =============================================================================
# 7. LEXICAL DEPENDENCIES
# =============================================================================

lexical:

  token_registry:
    owner: "grammar/lexer/tokens.g4"
    depends_on: []
    exports:
      - "canonical token vocabulary"
    consumers:
      - "grammar/lexer/"
      - "grammar/antlr/ZamaniLexer.g4"
      - "parser grammars"
    invariants:
      - "one token spelling has one canonical owner"
      - "duplicate token aliases require explicit compatibility justification"
      - "contextual keywords remain distinguishable from reserved keywords"

  lexer_composition:
    owner: "grammar/lexer/lexer.g4"
    depends_on:
      - "grammar/lexer/tokens.g4"
      - "grammar/lexer/keywords.g4"
      - "grammar/lexer/operators.g4"
      - "grammar/lexer/punctuation.g4"
      - "grammar/lexer/literals.g4"
      - "grammar/lexer/identifiers.g4"
      - "grammar/lexer/comments.g4"
      - "grammar/lexer/annotations.g4"
      - "grammar/lexer/unicode.g4"
      - "grammar/lexer/lexer-errors.g4"

  literal_composition:
    owner: "grammar/lexer/literals.g4"
    depends_on:
      - "grammar/lexer/numeric-literals.g4"
      - "grammar/lexer/string-literals.g4"
      - "grammar/lexer/character-literals.g4"
      - "grammar/lexer/boolean-literals.g4"
      - "grammar/lexer/duration-literals.g4"
      - "grammar/lexer/size-literals.g4"
      - "grammar/lexer/quantum-literals.g4"
      - "grammar/lexer/hardware-literals.g4"

  lexical_forbidden:
    - "parser grammar defining lexer rules"
    - "domain grammar defining token rules"
    - "Rust lexer silently accepting undeclared language tokens"
    - "ANTLR lexer silently accepting undeclared language tokens"
    - "backend-specific token vocabulary in the core lexer"

# =============================================================================
# 8. FOUNDATION DEPENDENCIES
# =============================================================================

foundation:

  core:
    path: "grammar/core/"
    depends_on:
      - "grammar/lexer/"
    owns:
      - "program structure"
      - "source units"
      - "compilation units"
      - "names"
      - "qualified names"
      - "paths"
      - "visibility"
      - "attributes"
      - "annotations"
      - "modifiers"
      - "requirements"
      - "constraints"
      - "capability references"
      - "policy references"
      - "hints"
      - "version references"
      - "universal blocks"
    must_not_depend_on:
      - "specific hardware"
      - "specific QPU"
      - "specific GPU"
      - "backend IR"
      - "runtime state"

  modules:
    path: "grammar/modules/"
    depends_on:
      - "grammar/core/"
      - "grammar/types/"
      - "grammar/lexer/"
    exports:
      - "module declarations"
      - "module paths"
      - "imports"
      - "exports"
      - "source dependencies"
    special_rule: >
      Module dependency syntax describes source-level dependencies. It MUST
      NOT become a direct dependency on a physical target or backend.

  declarations:
    path: "grammar/declarations/"
    depends_on:
      - "grammar/core/"
      - "grammar/types/"
      - "grammar/expressions/"
    may_consume:
      - "grammar/effects/"
      - "grammar/resources/"
      - "grammar/policies/"
      - "grammar/specification/"
    special_rule: >
      Declaration syntax MUST remain domain-neutral unless a declaration is
      explicitly owned by a domain grammar.

# =============================================================================
# 9. TYPE AND MEMORY DEPENDENCIES
# =============================================================================

types:

  type_system:
    path: "grammar/types/"
    depends_on:
      - "grammar/core/"
      - "grammar/lexer/"
    exports:
      - "type syntax"
      - "generic types"
      - "bounds"
      - "constraints"
      - "associated types"
      - "linear types"
      - "affine types"
      - "resource types"
      - "quantum types"
      - "hardware intent types"
    must_not_depend_on:
      - "physical register width"
      - "physical memory capacity"
      - "vendor type identifiers"
      - "backend instruction types"

  memory:
    path: "grammar/memory/"
    depends_on:
      - "grammar/core/"
      - "grammar/types/"
      - "grammar/expressions/"
    exports:
      - "ownership"
      - "borrowing"
      - "references"
      - "lifetimes"
      - "regions"
      - "address-space intent"
      - "memory placement intent"
    invariant: >
      Source memory semantics MUST remain distinct from physical memory
      capacity and address layout.

# =============================================================================
# 10. EXPRESSION DEPENDENCIES
# =============================================================================

expressions:

  root:
    path: "grammar/expressions/"
    depends_on:
      - "grammar/core/"
      - "grammar/types/"
      - "grammar/lexer/"
    exports:
      - "literal expressions"
      - "name expressions"
      - "path expressions"
      - "unary expressions"
      - "binary expressions"
      - "assignment expressions"
      - "call expressions"
      - "member expressions"
      - "index expressions"
      - "range expressions"
      - "tuple expressions"
      - "array expressions"
      - "map expressions"
      - "lambda expressions"
      - "closure expressions"
      - "block expressions"
      - "conditional expressions"
      - "match expressions"
      - "query expressions"
      - "domain extension expressions"

  duplicate_rule:
    rule: >
      Conceptually duplicate files such as singular/plural variants MUST be
      resolved through grammar/OWNERSHIP.yaml. Only one file may own the
      canonical public rule. Non-canonical files MUST be aliases, migration
      artifacts, or quarantined.

# =============================================================================
# 11. FUNCTION DEPENDENCIES
# =============================================================================

functions:

  root:
    path: "grammar/functions/"
    depends_on:
      - "grammar/core/"
      - "grammar/types/"
      - "grammar/expressions/"
    may_consume:
      - "grammar/effects/"
      - "grammar/resources/"
      - "grammar/policies/"
    exports:
      - "functions"
      - "parameters"
      - "returns"
      - "generic parameters"
      - "bounds"
      - "contracts"
      - "closures"
      - "lambdas"
      - "foreign callable declarations"
      - "compile-time callable declarations"
    invariant: >
      Functions MUST use the common type/effect/resource/policy model rather
      than domain-specific parallel function systems.

# =============================================================================
# 12. STATEMENT DEPENDENCIES
# =============================================================================

statements:

  root:
    path: "grammar/statements/"
    depends_on:
      - "grammar/core/"
      - "grammar/types/"
      - "grammar/expressions/"
      - "grammar/functions/"
    may_consume:
      - "grammar/effects/"
      - "grammar/resources/"
      - "grammar/policies/"
      - "grammar/security/"
    exports:
      - "control flow"
      - "declarations used as statements"
      - "contracts"
      - "resource statements"
      - "policy statements"
      - "query statements"
      - "reasoning statements"
      - "learning statements"
      - "controlled adaptation statements"
      - "simulation statements"
    adaptation_rule: >
      Adaptation syntax MUST NOT imply unrestricted self-modifying execution.
      Its semantic validation MUST involve applicable effects, capabilities,
      resources, policies, authorization, contracts, and provenance.

# =============================================================================
# 13. EFFECT DEPENDENCIES
# =============================================================================

effects:

  root:
    path: "grammar/effects/"
    depends_on:
      - "grammar/core/"
      - "grammar/types/"
      - "grammar/expressions/"
      - "grammar/statements/"
    exports:
      - "effect declarations"
      - "effect references"
      - "effect composition"
      - "effect constraints"
    extensibility:
      rule: >
        New effect categories MUST be extensible without rewriting the
        universal dependency architecture.

    known_effect_categories:
      - "io"
      - "network"
      - "mutation"
      - "randomness"
      - "native"
      - "foreign"
      - "distributed"
      - "measurement"
      - "quantum"
      - "learning"
      - "adaptation"
      - "reflection"
      - "code_generation"
      - "simulation"

    invariant: >
      Effects describe semantic consequences. They MUST NOT directly select
      hardware or implement runtime behavior.

# =============================================================================
# 14. RESOURCE DEPENDENCIES
# =============================================================================

resources:

  root:
    path: "grammar/resources/"
    depends_on:
      - "grammar/core/"
      - "grammar/types/"
      - "grammar/expressions/"
      - "grammar/statements/"
    exports:
      - "resource declarations"
      - "requirements"
      - "constraints"
      - "preferences"
      - "hints"
      - "budgets"
      - "capabilities"
      - "negotiation"
      - "scalability expressions"
      - "resource provenance"

  resource_expression:
    owner: "grammar/resources/resource-expressions.g4"
    depends_on:
      - "grammar/core/"
      - "grammar/types/"
      - "grammar/expressions/"
    invariant: >
      Resource expressions MUST be symbolic and dynamically extensible.

  requirements:
    owner: "grammar/resources/requirements.g4"
    depends_on:
      - "grammar/resources/resource-expressions.g4"
      - "grammar/core/capabilities.g4"
    examples:
      - "requires qubits >= required_qubits"
      - "requires memory >= required_memory"
      - "requires capability(\"quantum.measurement\")"
      - "requires capability(\"gpu.compute\")"
      - "requires capability(\"tensor.compute\")"
      - "requires topology(required_topology)"

  constraints:
    owner: "grammar/resources/constraints.g4"
    depends_on:
      - "grammar/resources/resource-expressions.g4"

  preferences:
    owner: "grammar/resources/preferences.g4"
    depends_on:
      - "grammar/resources/resource-expressions.g4"
      - "grammar/resources/capabilities.g4"

  hints:
    owner: "grammar/resources/hints.g4"
    depends_on:
      - "grammar/resources/resource-expressions.g4"
    invariant: >
      Hints MUST NOT alter semantic correctness.

  negotiation:
    owner: "grammar/resources/negotiation.g4"
    depends_on:
      - "grammar/resources/requirements.g4"
      - "grammar/resources/constraints.g4"
      - "grammar/resources/preferences.g4"
      - "grammar/resources/capabilities.g4"
      - "grammar/policies/"

  scalability:
    owner: "grammar/resources/scalability.g4"
    depends_on:
      - "grammar/resources/resource-expressions.g4"
      - "grammar/types/"
      - "grammar/expressions/"
    invariant: >
      Scalability syntax MUST describe symbolic growth and realization intent,
      never a universal implementation ceiling.

  forbidden_capacity_dependencies:
    patterns:
      - "MAX_QUBITS"
      - "MAX_CPUS"
      - "MAX_CORES"
      - "MAX_THREADS"
      - "MAX_GPUS"
      - "MAX_FPGAS"
      - "MAX_ASICS"
      - "MAX_QPUS"
      - "MAX_NODES"
      - "MAX_MEMORY"
      - "MAX_STORAGE"
      - "MAX_REGISTER_WIDTH"
      - "MAX_VECTOR_WIDTH"
      - "MAX_TENSOR_RANK"
      - "MAX_TENSOR_DIMENSION"
      - "MAX_NETWORK_SIZE"
      - "MAX_DEVICE_COUNT"
      - "MAX_ACCELERATOR_COUNT"
      - "MAX_AGENT_COUNT"
    enforcement: "validation tooling MUST detect these and equivalent patterns"

# =============================================================================
# 15. POLICY AND SECURITY DEPENDENCIES
# =============================================================================

policies:

  root:
    path: "grammar/policies/"
    depends_on:
      - "grammar/core/"
      - "grammar/types/"
      - "grammar/expressions/"
      - "grammar/statements/"
      - "grammar/effects/"
      - "grammar/resources/"
    exports:
      - "policy declarations"
      - "allow rules"
      - "forbid rules"
      - "authorization intent"
      - "fallback policies"
      - "adaptation policies"
      - "deployment policies"
    invariant: >
      Policies constrain realization and execution but MUST NOT redefine
      universal syntax or physical target state.

security:

  root:
    path: "grammar/security/"
    depends_on:
      - "grammar/core/"
      - "grammar/types/"
      - "grammar/expressions/"
      - "grammar/effects/"
      - "grammar/resources/"
      - "grammar/policies/"
    exports:
      - "security declarations"
      - "authorization intent"
      - "sandbox intent"
      - "trust requirements"
      - "audit intent"
      - "cryptographic intent"
    invariant: >
      Security grammar declares intent and constraints. It MUST NOT implement
      privileged operations in the parser.

# =============================================================================
# 16. COMPUTATIONAL DOMAIN DEPENDENCIES
# =============================================================================

domains:

  common_dependency_contract:
    every_domain_must_depend_on:
      - "grammar/core/"
      - "grammar/types/"
      - "grammar/expressions/"
      - "grammar/functions/"
      - "grammar/statements/"
      - "grammar/effects/"
      - "grammar/resources/"
      - "grammar/policies/"
    every_domain_must_provide:
      - "syntax owner"
      - "AST mapping"
      - "semantic mapping"
      - "applicable IR mapping"
      - "diagnostic mapping"
      - "compatibility status"
      - "conformance tests"
      - "hard-coding audit"
      - "scalability audit"

  classical:
    path: "grammar/classical/"
    depends_on:
      - "common_dependency_contract"
    must_not_own:
      - "universal quantum syntax"
      - "hardware-specific register widths"
      - "target-specific CPU counts"

  data:
    path: "grammar/data/"
    depends_on:
      - "common_dependency_contract"
    may_integrate_with:
      - "grammar/interoperability/"
      - "grammar/dialects/"
    invariant: >
      External data formats remain dialect/interoperability concerns unless
      their construct is part of the universal language semantics.

  concurrency:
    path: "grammar/concurrency/"
    depends_on:
      - "common_dependency_contract"
    exports:
      - "tasks"
      - "futures"
      - "actors"
      - "parallel intent"
      - "synchronization"
      - "coordination"
    invariant: >
      Source concurrency semantics MUST NOT require a fixed number of
      execution units.

  distributed:
    path: "grammar/distributed/"
    depends_on:
      - "grammar/concurrency/"
      - "common_dependency_contract"
    invariant: >
      Distributed syntax MUST NOT define a universal node or network count.

  networking:
    path: "grammar/networking/"
    depends_on:
      - "grammar/distributed/"
      - "common_dependency_contract"
    invariant: >
      Networking syntax MUST remain independent of a finite topology.

  hardware:
    path: "grammar/hardware/"
    depends_on:
      - "common_dependency_contract"
    exports:
      - "hardware intent"
      - "capabilities"
      - "abstract resources"
      - "abstract topology"
      - "timing intent"
      - "memory intent"
      - "placement intent"
    must_not_own:
      - "device discovery"
      - "calibration"
      - "driver implementation"
      - "physical device inventory"

  execution:
    path: "grammar/execution/"
    depends_on:
      - "grammar/concurrency/"
      - "grammar/distributed/"
      - "grammar/resources/"
      - "grammar/policies/"
      - "common_dependency_contract"
    exports:
      - "execution context"
      - "simulation intent"
      - "adaptive execution intent"
      - "checkpoint intent"
      - "recovery intent"
      - "dispatch intent"
    invariant: >
      Execution syntax describes intent. Runtime state and algorithms remain
      outside grammar.

  compile:
    path: "grammar/compile/"
    depends_on:
      - "grammar/resources/"
      - "grammar/policies/"
      - "grammar/compatibility/"
      - "common_dependency_contract"
    exports:
      - "compilation intent"
      - "specialization intent"
      - "optimization intent"
      - "reproducibility intent"
      - "artifact intent"
      - "target-selection intent"
    invariant: >
      Compilation syntax MUST NOT require a particular target unless the
      source explicitly requests target-specific behavior.

# =============================================================================
# 17. QUANTUM DEPENDENCIES
# =============================================================================

quantum:

  root:
    path: "grammar/quantum/"
    depends_on:
      - "grammar/core/"
      - "grammar/types/"
      - "grammar/expressions/"
      - "grammar/functions/"
      - "grammar/statements/"
      - "grammar/effects/"
      - "grammar/resources/"
      - "grammar/policies/"
      - "grammar/hardware/"
      - "grammar/execution/"
    exports:
      - "quantum source syntax"
      - "operation specifications"
      - "targets"
      - "controls"
      - "parameters"
      - "states"
      - "measurements"
      - "observables"
      - "channels"
      - "dynamic circuits"
      - "logical resources"
      - "physical realization intent"
      - "error-correction intent"
      - "noise intent"
      - "pulse intent"

  operations:
    owner: "grammar/quantum/operations.g4"
    depends_on:
      - "grammar/quantum/"
      - "grammar/expressions/"
      - "grammar/core/attributes.g4"
    invariant: >
      Quantum operations MUST use a data-driven operation specification.
      The grammar MUST NOT require a permanently enumerated list of every
      possible operation.

  operation_specifier:
    owner: "grammar/quantum/operation-specifier.g4"
    allowed_kinds:
      - "builtin"
      - "custom"
      - "vendor"
      - "parameterized"
      - "dialect"
      - "future"
    invariant: >
      Adding a new quantum operation MUST be possible through a registered
      semantic/dialect extension without redesigning the universal parser.

  quantum_ir_boundary:
    syntax_owner: "grammar/quantum/"
    semantic_owner: "src/quantum/"
    ir_owner: "src/quantum/ir/"
    canonical_name: "quantum::ir"
    rule: >
      Quantum grammar MUST NOT depend on individual quantum backend IR
      structures.

  error_correction:
    path: "grammar/quantum/"
    depends_on:
      - "grammar/resources/"
      - "grammar/effects/"
      - "grammar/policies/"
    downstream:
      - "src/quantum/qec/"
      - "src/quantum/scheduling/"
      - "src/quantum/zqn/"
    invariant: >
      Source QEC intent MUST NOT hard-code a universal physical code,
      hardware size, decoder implementation, or fixed realization.

  physical_realization:
    forbidden_dependencies:
      - "specific physical qubit identifier"
      - "specific QPU inventory"
      - "specific calibration database"
      - "specific vendor instruction set"
      - "fixed hardware topology"

# =============================================================================
# 18. HDL DEPENDENCIES
# =============================================================================

hdl:

  root:
    path: "grammar/hdl/"
    depends_on:
      - "grammar/core/"
      - "grammar/types/"
      - "grammar/expressions/"
      - "grammar/functions/"
      - "grammar/statements/"
      - "grammar/resources/"
      - "grammar/hardware/"
      - "grammar/effects/"
    exports:
      - "HDL modules"
      - "ports"
      - "signals"
      - "nets"
      - "registers"
      - "memories"
      - "clocking"
      - "reset"
      - "timing"
      - "pipelines"
      - "state machines"
      - "verification intent"
      - "synthesis intent"
      - "physical intent"

  invariant:
    rule: >
      HDL syntax expresses hardware intent but MUST NOT impose universal bus
      widths, register counts, clock counts, pipeline depths, memory sizes,
      device counts, or topology limits.

  downstream:
    semantic_model: "hardware semantic implementation"
    ir: "canonical hardware/HDL IR"
    synthesis: "backend/synthesis implementation"
    target: "HAL/hardware integration"

# =============================================================================
# 19. HYBRID DEPENDENCIES
# =============================================================================

hybrid:

  root:
    path: "grammar/hybrid/"
    depends_on:
      - "grammar/classical/"
      - "grammar/quantum/"
      - "grammar/hdl/"
      - "grammar/hardware/"
      - "grammar/execution/"
      - "grammar/effects/"
      - "grammar/resources/"
      - "grammar/policies/"
    exports:
      - "classical-quantum boundaries"
      - "host-device boundaries"
      - "feed-forward"
      - "synchronization"
      - "shared data intent"
      - "hybrid resource requirements"
    invariant: >
      Hybrid grammar MUST compose already-owned domain constructs rather than
      redefining classical, quantum, HDL, or hardware semantics.

# =============================================================================
# 20. AI AND REASONING DEPENDENCIES
# =============================================================================

ai:

  root:
    path: "grammar/ai/"
    depends_on:
      - "grammar/core/"
      - "grammar/types/"
      - "grammar/expressions/"
      - "grammar/functions/"
      - "grammar/statements/"
      - "grammar/data/"
      - "grammar/effects/"
      - "grammar/resources/"
      - "grammar/policies/"
      - "grammar/concurrency/"
      - "grammar/distributed/"
    exports:
      - "inference"
      - "deduction"
      - "reasoning"
      - "learning"
      - "adaptation intent"
      - "evidence"
      - "provenance"
      - "uncertainty"
      - "probability"
      - "confidence"
      - "model intent"
      - "training intent"
      - "planning"
      - "decision intent"
      - "neural-symbolic composition"
      - "agent intent"

  invariant:
    rule: >
      AI constructs MUST use the universal type/effect/resource/capability/
      policy/provenance architecture.

  forbidden_core_domain_leakage:
    rule: >
      Application-specific concepts MUST NOT become universal core grammar
      merely because an application uses AI. Such functionality belongs in
      libraries, registered dialects, capabilities, policies, or applications.

# =============================================================================
# 21. INTEROPERABILITY AND DIALECT DEPENDENCIES
# =============================================================================

interoperability:

  root:
    path: "grammar/interoperability/"
    depends_on:
      - "grammar/core/"
      - "grammar/types/"
      - "grammar/expressions/"
      - "grammar/functions/"
      - "grammar/effects/"
      - "grammar/security/"
      - "grammar/compatibility/"
    exports:
      - "FFI declarations"
      - "ABI declarations"
      - "foreign types"
      - "calling conventions"
      - "linkage intent"
      - "serialization"
      - "external system interfaces"
    invariant: >
      Supporting an external language or format MUST NOT make that language
      a second Zamani language authority.

  dialects:
    path: "grammar/dialects/"
    depends_on:
      - "grammar/interoperability/"
      - "grammar/core/"
      - "grammar/types/"
      - "grammar/effects/"
      - "grammar/resources/"
      - "grammar/policies/"
      - "grammar/compatibility/"
    exports:
      - "dialect identity"
      - "namespace"
      - "version"
      - "dependencies"
      - "capabilities"
      - "syntax extension"
      - "semantic mapping"
      - "registration"
      - "compatibility"
    invariant: >
      A dialect MUST declare how its constructs map into the common semantic
      model. A dialect MUST NOT silently redefine core semantics.

# =============================================================================
# 22. MACRO AND METAPROGRAMMING DEPENDENCIES
# =============================================================================

macros:

  root:
    path: "grammar/macros/"
    depends_on:
      - "grammar/core/"
      - "grammar/types/"
      - "grammar/expressions/"
      - "grammar/statements/"
      - "grammar/compatibility/"
    exports:
      - "macro declarations"
      - "macro parameters"
      - "macro invocation"
      - "expansion intent"
      - "hygiene metadata"
    invariant: >
      Macro expansion MUST remain subject to normal semantic validation.

metaprogramming:

  root:
    path: "grammar/metaprogramming/"
    depends_on:
      - "grammar/core/"
      - "grammar/types/"
      - "grammar/expressions/"
      - "grammar/macros/"
      - "grammar/effects/"
      - "grammar/policies/"
      - "grammar/security/"
    exports:
      - "quotation"
      - "unquotation"
      - "reflection intent"
      - "introspection"
      - "generation"
      - "compile-time computation"
      - "specialization"
    invariant: >
      Reflection and generation MUST remain governed by applicable effects,
      capabilities, policies, security rules, and provenance.

# =============================================================================
# 23. COMPATIBILITY DEPENDENCIES
# =============================================================================

compatibility:

  root:
    path: "grammar/compatibility/"
    depends_on:
      - "grammar/DESIGN.md"
      - "grammar/specification/"
      - "grammar/MANIFEST.yaml"
      - "grammar/OWNERSHIP.yaml"
      - "grammar/DEPENDENCIES.yaml"
    exports:
      - "language version compatibility"
      - "grammar compatibility"
      - "lexer compatibility"
      - "AST compatibility"
      - "semantic compatibility"
      - "IR compatibility"
      - "artifact compatibility"
      - "dialect compatibility"
      - "deprecation policy"
      - "migration policy"

  invariant:
    rule: >
      Compatibility metadata MUST NOT become a backdoor for changing the
      meaning of existing stable constructs.

# =============================================================================
# 24. FRONTEND INTEGRATION
# =============================================================================

frontend:

  lexer:
    grammar_contract:
      - "grammar/lexer/"
      - "grammar/antlr/ZamaniLexer.g4"
    implementation:
      - "src/lexer.rs"
    invariant: >
      The Rust lexer and ANTLR lexer MUST agree on the canonical lexical
      contract. Neither implementation may silently introduce independent
      language tokens.

  parser:
    grammar_contract:
      - "grammar/antlr/ZamaniParser.g4"
      - "grammar/Zamani.g4"
    implementation:
      - "src/parser.rs"
    invariant: >
      Parser implementation behavior MUST be covered by shared conformance
      tests.

  ast:
    implementation:
      - "src/ast/"
    consumes:
      - "parse tree"
    produces:
      - "domain-neutral AST"
    invariant: >
      Grammar files MUST NOT depend on AST implementation internals.
      Grammar-to-AST mappings are recorded separately in ownership/mapping
      contracts.

# =============================================================================
# 25. SEMANTIC INTEGRATION
# =============================================================================

semantic:

  validation:
    consumes:
      - "AST"
      - "types"
      - "effects"
      - "resources"
      - "capabilities"
      - "contracts"
      - "policies"
      - "provenance"
    produces:
      - "validated semantic program"

  domain_models:
    classical:
      grammar: "grammar/classical/"
      semantic_owner: "classical semantic implementation"
      ir_owner: "canonical classical IR"

    quantum:
      grammar: "grammar/quantum/"
      semantic_owner: "quantum semantic implementation"
      ir_owner: "src/quantum/ir/"

    hdl:
      grammar: "grammar/hdl/"
      semantic_owner: "hardware/HDL semantic implementation"
      ir_owner: "canonical hardware/HDL IR"

    hybrid:
      grammar: "grammar/hybrid/"
      semantic_owner: "hybrid semantic implementation"
      ir_owner: "canonical hybrid/domain IR"

    ai:
      grammar: "grammar/ai/"
      semantic_owner: "AI semantic implementation"
      ir_owner: "canonical semantic/domain IR"

# =============================================================================
# 26. IR INTEGRATION
# =============================================================================

ir:

  canonical_boundary:
    owner: "src/ir/"
    consumes:
      - "validated semantic program"
    produces:
      - "canonical target-independent IR"

  quantum:
    owner: "src/quantum/ir/"
    canonical_name: "quantum::ir"
    consumes:
      - "validated quantum semantics"
    must_not_consume:
      - "raw parser tree"
      - "vendor-specific grammar"
    must_not_be_owned_by:
      - "grammar/quantum/"
      - "grammar/Zamani.g4"

  domain_specific_ir:
    rule: >
      Domain-specific IRs MAY exist after semantic validation for optimization
      or lowering. They MUST NOT replace the canonical semantic boundary.

# =============================================================================
# 27. REALIZATION DEPENDENCIES
# =============================================================================

realization:

  optimization:
    consumes:
      - "canonical IR"
      - "quantum::ir"
      - "optimization policies"
    grammar_dependency_allowed: false

  lowering:
    consumes:
      - "optimized IR"
      - "target capabilities"
      - "target resources"
      - "policies"
    grammar_dependency_allowed: false

  negotiation:
    consumes:
      - "requirements"
      - "constraints"
      - "preferences"
      - "capabilities"
      - "available resources"
      - "policies"
    grammar_dependency_allowed: false

  routing:
    consumes:
      - "canonical operations"
      - "topology"
      - "resources"
      - "dependencies"
      - "target capabilities"
    grammar_dependency_allowed: false

  scheduling:
    consumes:
      - "operations"
      - "dependencies"
      - "timing"
      - "resources"
      - "target capabilities"
    grammar_dependency_allowed: false

  resilience:
    consumes:
      - "semantic identity"
      - "provenance"
      - "checkpoint intent"
      - "recovery policy"
      - "resource requirements"
    grammar_dependency_allowed: false

  hal:
    consumes:
      - "realized target description"
      - "lowered artifact"
      - "runtime requirements"
    grammar_dependency_allowed: false

# =============================================================================
# 28. POCO-REAF DEPENDENCY CONTRACT
# =============================================================================

poco_reaf:

  source_semantics:
    must_be_independent_of:
      - "specific CPU"
      - "specific GPU"
      - "specific FPGA"
      - "specific ASIC"
      - "specific QPU"
      - "specific machine"
      - "specific cluster size"
      - "specific network size"

  portable_artifact:
    should_contain:
      - "language version"
      - "feature set"
      - "AST/semantic identity"
      - "IR version"
      - "dialect versions"
      - "resource requirements"
      - "capability requirements"
      - "constraints"
      - "preferences"
      - "policies"
      - "effects"
      - "provenance"
      - "reproducibility metadata"

  realization:
    sequence:
      - "discover"
      - "validate requirements"
      - "evaluate capabilities"
      - "evaluate constraints"
      - "apply policies"
      - "rank preferences"
      - "select realization"
      - "specialize"
      - "lower"
      - "route"
      - "schedule"
      - "execute"

  failure_rule:
    rule: >
      If a target cannot satisfy required semantics, the implementation MUST
      reject the realization or select an explicitly permitted alternative.
      It MUST NOT silently change program meaning.

  fallback_rule:
    rule: >
      Fallbacks MUST be explicitly authorized and semantically defined.

# =============================================================================
# 29. SCALABILITY CONTRACT
# =============================================================================

scalability:

  principle: >
    The grammar expresses open-ended computation. Physical feasibility is
    determined by resources available to a particular realization.

  prohibited:
    - "language-wide maximum qubit count"
    - "language-wide maximum CPU count"
    - "language-wide maximum GPU count"
    - "language-wide maximum FPGA count"
    - "language-wide maximum node count"
    - "language-wide maximum memory capacity"
    - "language-wide maximum thread count"
    - "language-wide maximum register width"
    - "language-wide maximum tensor rank"
    - "language-wide maximum network size"
    - "language-wide maximum device count"

  permitted:
    - "symbolic dimensions"
    - "runtime dimensions"
    - "generic parameters"
    - "resource expressions"
    - "capability expressions"
    - "topology requirements"
    - "resource negotiation"
    - "target specialization"
    - "implementation diagnostics"

  implementation_limit_rule:
    rule: >
      A real implementation may have practical limits. Such a limit MUST be
      an implementation constraint, MUST NOT become language semantics, MUST
      be diagnosable, and MUST be removable or extendable without changing
      the language's semantic model.

# =============================================================================
# 30. DIAGNOSTIC DEPENDENCIES
# =============================================================================

diagnostics:

  layers:
    - "lexical"
    - "syntax"
    - "structure"
    - "name"
    - "type"
    - "effect"
    - "contract"
    - "policy"
    - "capability"
    - "resource"
    - "semantic"
    - "IR"
    - "lowering"
    - "target"
    - "runtime"

  invariant:
    rule: >
      A dependency failure MUST identify the appropriate architectural layer.
      Resource infeasibility MUST NOT be reported as a syntax error, and
      unavailable target capabilities MUST NOT be disguised as invalid source.

  source_mapping:
    required:
      - "file"
      - "span"
      - "diagnostic identity"
      - "severity"
      - "layer"
      - "message"

# =============================================================================
# 31. PROVENANCE DEPENDENCIES
# =============================================================================

provenance:

  owner:
    semantic: "semantic implementation"
    artifact: "compiler/artifact implementation"

  consumers:
    - "AI reasoning"
    - "resource negotiation"
    - "target selection"
    - "quantum routing"
    - "optimization"
    - "HDL synthesis"
    - "security"
    - "adaptation"
    - "simulation"
    - "diagnostics"

  invariant: >
    Grammar may declare provenance-bearing constructs but MUST NOT require an
    unlimited in-memory history.

# =============================================================================
# 32. TEST AND CONFORMANCE DEPENDENCIES
# =============================================================================

testing:

  production_grammar_may_depend_on_tests: false

  test_layers:
    - "lexical"
    - "parser"
    - "AST"
    - "structural validation"
    - "types"
    - "effects"
    - "resources"
    - "capabilities"
    - "contracts"
    - "policies"
    - "security"
    - "classical"
    - "quantum"
    - "HDL"
    - "hybrid"
    - "AI"
    - "data"
    - "concurrency"
    - "distributed"
    - "networking"
    - "hardware"
    - "execution"
    - "compilation"
    - "interoperability"
    - "dialects"
    - "macros"
    - "metaprogramming"
    - "compatibility"
    - "diagnostics"
    - "portability"
    - "scalability"
    - "determinism"
    - "fuzzing"
    - "negative cases"

  required_mapping:
    every_production_file:
      must_have:
        - "positive conformance coverage"
        - "negative conformance coverage where applicable"
        - "boundary coverage where applicable"
        - "ownership record"
        - "dependency record"

  scalability_tests:
    rule: >
      Tests MAY use finite practical bounds for CI execution. Those bounds
      MUST belong to the test harness and MUST NOT be encoded as language
      capacity limits.

# =============================================================================
# 33. GENERATED ARTIFACT DEPENDENCIES
# =============================================================================

generated_artifacts:

  rule: >
    Generated files are outputs, never authorities.

  allowed_consumers:
    - "tooling"
    - "tests"
    - "build system"

  forbidden:
    - "generated parser becoming grammar authority"
    - "generated lexer becoming token authority"
    - "generated documentation becoming specification authority"

  regeneration_rule:
    rule: >
      Generated output MUST be reproducible from authoritative repository
      inputs.

# =============================================================================
# 34. DUPLICATE AND MALFORMED ARTIFACT POLICY
# =============================================================================

artifact_hygiene:

  duplicate_concept_rule:
    rule: >
      Similar filenames do not automatically imply duplicate semantics.
      Every apparent duplicate MUST be classified as canonical, alias,
      compatibility artifact, historical artifact, experimental artifact,
      or quarantine candidate.

  known_patterns_requiring_audit:
    - "closure.g4 vs closures.g4"
    - "lambda.g4 vs lambdas.g4"
    - "map.g4 vs map-types.g4"
    - "option.g4 vs option-types.g4"
    - "array.g4 vs array-types.g4"

  malformed_filename_rule:
    rule: >
      Files whose names contain unintended whitespace, inconsistent casing,
      generated suffixes, or ambiguous naming MUST be explicitly classified
      before production freeze.

  quarantine:
    path: "grammar/quarantine/"
    allowed_contents:
      - "historical grammar artifacts"
      - "malformed artifacts"
      - "superseded grammar fragments"
      - "unresolved duplicate candidates"
    production_import_allowed: false
    parser_composition_allowed: false

  important_existing_candidate:
    path: "grammar/types/functional dependencies.g4"
    status: "MUST_BE_EXPLICITLY_CLASSIFIED"
    rule: >
      The path contains whitespace and MUST be explicitly classified as
      canonical, renamed, migrated, or quarantined before final freeze.
      It MUST NOT be silently assumed to be production-stable.

# =============================================================================
# 35. MODULE DEPENDENCY SPECIAL CASE
# =============================================================================

module_dependencies:

  source_dependency_syntax:
    path: "grammar/modules/dependencies.g4"
    layer: "L04_foundation"
    meaning: >
      Declares source-level module dependencies and dependency requirements.
    must_not_be_confused_with:
      - "grammar/DEPENDENCIES.yaml"
      - "ANTLR import dependency graph"
      - "compiler backend dependency graph"

  distinction:
    grammar_dependency_contract:
      path: "grammar/DEPENDENCIES.yaml"
      meaning: "architecture of grammar files"

    source_module_dependency:
      path: "grammar/modules/dependencies.g4"
      meaning: "dependencies declared by Zamani programs"

# =============================================================================
# 36. OWNERSHIP INTEGRATION
# =============================================================================

ownership_integration:

  authority:
    path: "grammar/OWNERSHIP.yaml"

  dependency_rule: >
    Every production dependency MUST be resolvable to an ownership record.

  required_fields:
    - "path"
    - "owner"
    - "kind"
    - "exports"
    - "imports"
    - "status"

  validation:
    duplicate_owner:
      severity: "error"

    missing_owner:
      severity: "error"

    missing_export_owner:
      severity: "error"

    dependency_on_unowned_symbol:
      severity: "error"

# =============================================================================
# 37. MANIFEST INTEGRATION
# =============================================================================

manifest_integration:

  authority:
    path: "grammar/MANIFEST.yaml"

  rule: >
    DEPENDENCIES.yaml MUST NOT become a stale file inventory. The actual
    repository tree plus MANIFEST.yaml determines file existence and metadata.

  validation:
    dependency_path_not_in_manifest:
      severity: "error"
      except:
        - "directory patterns"
        - "external implementation paths explicitly declared"
        - "generated paths"
        - "quarantine paths"

    missing_dependency_contract:
      severity: "error"

# =============================================================================
# 38. STATUS INTEGRATION
# =============================================================================

status_integration:

  authority:
    path: "grammar/STATUS.yaml"

  stable_dependency_rule:
    rule: >
      A production file MUST NOT be marked STABLE if any required production
      dependency is not itself stable or explicitly frozen under the
      compatibility policy.

  allowed_statuses:
    - "STABLE"
    - "IMPLEMENTED"
    - "PARTIALLY_IMPLEMENTED"
    - "EXPERIMENTAL"
    - "PROPOSED"
    - "PLANNED"
    - "DEPRECATED"
    - "HISTORICAL"
    - "REJECTED"
    - "QUARANTINED"

# =============================================================================
# 39. FREEZE ORDER
# =============================================================================

freeze_order:

  principle: >
    A file can be frozen only after all semantic dependencies required by its
    contract are frozen or explicitly versioned.

  stages:

    - id: "FREEZE_00"
      name: "inventory_and_contracts"
      paths:
        - "grammar/MANIFEST.yaml"
        - "grammar/OWNERSHIP.yaml"
        - "grammar/DEPENDENCIES.yaml"
        - "grammar/STATUS.yaml"
        - "grammar/contracts/"
      prerequisites:
        - "repository tree audit"
        - "duplicate audit"
        - "malformed artifact audit"

    - id: "FREEZE_01"
      name: "architecture_and_specification"
      paths:
        - "grammar/DESIGN.md"
        - "grammar/specification/"
        - "grammar/spec/"

    - id: "FREEZE_02"
      name: "lexical"
      paths:
        - "grammar/lexer/"
        - "grammar/antlr/ZamaniLexer.g4"

    - id: "FREEZE_03"
      name: "foundation"
      paths:
        - "grammar/core/"
        - "grammar/modules/"
        - "grammar/declarations/"

    - id: "FREEZE_04"
      name: "types_and_memory"
      paths:
        - "grammar/types/"
        - "grammar/memory/"

    - id: "FREEZE_05"
      name: "expressions"
      paths:
        - "grammar/expressions/"

    - id: "FREEZE_06"
      name: "functions_and_statements"
      paths:
        - "grammar/functions/"
        - "grammar/statements/"

    - id: "FREEZE_07"
      name: "semantic_control_plane"
      paths:
        - "grammar/effects/"
        - "grammar/resources/"
        - "grammar/policies/"
        - "grammar/security/"
        - "grammar/validation/"

    - id: "FREEZE_08"
      name: "classical_and_data"
      paths:
        - "grammar/classical/"
        - "grammar/data/"

    - id: "FREEZE_09"
      name: "concurrency_distribution_networking"
      paths:
        - "grammar/concurrency/"
        - "grammar/distributed/"
        - "grammar/networking/"

    - id: "FREEZE_10"
      name: "hardware_execution_compilation"
      paths:
        - "grammar/hardware/"
        - "grammar/execution/"
        - "grammar/compile/"

    - id: "FREEZE_11"
      name: "quantum"
      paths:
        - "grammar/quantum/"

    - id: "FREEZE_12"
      name: "hdl"
      paths:
        - "grammar/hdl/"

    - id: "FREEZE_13"
      name: "hybrid"
      paths:
        - "grammar/hybrid/"

    - id: "FREEZE_14"
      name: "AI_and_reasoning"
      paths:
        - "grammar/ai/"

    - id: "FREEZE_15"
      name: "interoperability_and_dialects"
      paths:
        - "grammar/interoperability/"
        - "grammar/dialects/"

    - id: "FREEZE_16"
      name: "macros_and_metaprogramming"
      paths:
        - "grammar/macros/"
        - "grammar/metaprogramming/"

    - id: "FREEZE_17"
      name: "compatibility"
      paths:
        - "grammar/compatibility/"

    - id: "FREEZE_18"
      name: "parser_composition"
      paths:
        - "grammar/antlr/ZamaniParser.g4"

    - id: "FREEZE_19"
      name: "root_composition"
      paths:
        - "grammar/Zamani.g4"

    - id: "FREEZE_20"
      name: "full_conformance"
      paths:
        - "grammar/tests/"
        - "grammar/conformance/"
        - "grammar/golden/"
        - "grammar/examples/"

# =============================================================================
# 40. FILE FREEZE CONTRACT
# =============================================================================

file_freeze_contract:

  required_before_freeze:
    - "file exists"
    - "file has one canonical owner"
    - "all imports resolve"
    - "all exported symbols are classified"
    - "all dependencies are declared"
    - "dependency direction is valid"
    - "no production cycle exists"
    - "AST mapping exists where applicable"
    - "semantic mapping exists where applicable"
    - "IR mapping exists where applicable"
    - "diagnostic mapping exists where applicable"
    - "compatibility status exists"
    - "conformance tests exist"
    - "hard-coding audit passes"
    - "scalability audit passes"
    - "POCO-REAF audit passes"
    - "safe-Rust boundary is respected"
    - "no unresolved duplicate ownership exists"
    - "no downstream implementation requires semantic re-edit merely because another backend is added"

  freeze_result:
    meaning: >
      A frozen file exposes a stable contract. Downstream files may consume
      that contract without requiring the frozen file to be modified merely
      because a new target, backend, domain implementation, or realization
      strategy is introduced.

# =============================================================================
# 41. VALIDATION RULES
# =============================================================================

validation:

  path_resolution:
    error_if:
      - "production dependency path does not exist"
      - "ANTLR import does not resolve"
      - "declared owner path does not exist"

  cycle_detection:
    algorithm_requirement: >
      CI MUST construct the production dependency graph and reject every cycle.

  duplicate_export_detection:
    rule: >
      Every exported public grammar rule MUST map to exactly one canonical
      owner.

  orphan_detection:
    rule: >
      A production grammar file not reachable from a canonical composition root
      MUST be classified as intentionally unused, experimental, historical,
      quarantined, or an integration defect.

  reverse_dependency_detection:
    rule: >
      CI MUST reject dependencies from a lower architectural layer into a
      higher layer.

  backend_leak_detection:
    rule: >
      CI SHOULD detect references from grammar/ to backend implementation
      identifiers, physical device identifiers, calibration structures,
      scheduler internals, router internals, or runtime state.

  capacity_detection:
    rule: >
      CI MUST detect known capacity constants and SHOULD detect semantically
      equivalent hard-coded capacity patterns.

  duplicate_file_detection:
    rule: >
      CI SHOULD detect filename and public-rule similarity and require explicit
      classification.

  generated_file_detection:
    rule: >
      Generated output MUST NOT be accepted as an authoritative grammar source.

# =============================================================================
# 42. RUST INTEGRATION CONTRACT
# =============================================================================

rust:

  edition: "2021"

  minimum_version: "1.97"

  safety:
    unsafe_allowed: false
    unsafe_blocks_allowed: false
    unsafe_traits_allowed: false
    unsafe_impls_allowed: false

  frontend_paths:
    lexer:
      - "src/lexer.rs"
    parser:
      - "src/parser.rs"
    ast:
      - "src/ast/"

  semantic_paths:
    - "src/semantic/"

  ir_paths:
    - "src/ir/"
    - "src/quantum/ir/"

  compiler_paths:
    - "src/compiler/"
    - "src/compile/"

  integration_rule:
    rule: >
      Rust implementation details are downstream consumers of grammar
      contracts. grammar/ MUST NOT acquire dependencies on Rust implementation
      internals.

  implementation_limit_rule:
    rule: >
      Rust implementation guards MAY exist for genuine implementation safety,
      memory protection, parser protection, or resource exhaustion prevention.
      Such guards MUST NOT be represented as language-wide semantic limits.

  deterministic_data_rule:
    rule: >
      Where dependency or semantic ordering is observable, implementations
      SHOULD use deterministic collections or explicitly defined ordering.

# =============================================================================
# 43. SECURITY INTEGRATION
# =============================================================================

security:

  grammar_boundary:
    rule: >
      Parsing MUST NOT execute privileged operations, inspect hardware, access
      secrets, contact networks, or execute arbitrary external programs.

  compile_time_execution:
    rule: >
      Compile-time execution, when supported, MUST remain subject to explicit
      effects, capabilities, policies, sandboxing, provenance, and resource
      validation.

  external_systems:
    rule: >
      External systems MUST be accessed through explicitly owned safe
      interfaces. Grammar dependency contracts MUST NOT require unsafe Rust.

# =============================================================================
# 44. TARGET-INDEPENDENCE CONTRACT
# =============================================================================

target_independence:

  grammar_must_not_depend_on:
    - "CPU model"
    - "GPU model"
    - "FPGA family"
    - "ASIC model"
    - "QPU model"
    - "physical qubit identifier"
    - "physical memory address"
    - "device inventory"
    - "vendor calibration database"
    - "runtime scheduling state"
    - "current cluster size"
    - "current network topology"

  grammar_may_describe:
    - "required capability"
    - "required resource"
    - "resource constraint"
    - "resource preference"
    - "abstract topology"
    - "execution intent"
    - "placement intent"
    - "policy"
    - "fallback intent"
    - "resilience intent"

# =============================================================================
# 45. DOMAIN EXTENSION CONTRACT
# =============================================================================

future_domain:

  rule: >
    A future computational domain MUST be integrable without modifying the
    universal dependency architecture merely because the domain is new.

  required_extension_contract:
    - "domain identity"
    - "grammar owner"
    - "imports"
    - "exports"
    - "AST mapping"
    - "semantic mapping"
    - "effects"
    - "resources"
    - "capabilities"
    - "policies"
    - "IR mapping"
    - "diagnostics"
    - "compatibility"
    - "conformance tests"

  forbidden_strategy:
    - "copy the core language into a second grammar"
    - "create a competing lexer"
    - "create a competing parser root"
    - "create a competing universal AST"
    - "create an unregistered IR"
    - "add physical capacity constants to core grammar"

# =============================================================================
# 46. CONFORMANCE REQUIREMENTS
# =============================================================================

conformance:

  architecture:
    - "one architectural authority"
    - "one normative language specification"
    - "one machine-contract layer"
    - "one lexer boundary"
    - "one parser boundary"
    - "one combined root"
    - "one ownership record per public symbol"
    - "acyclic production dependency graph"

  portability:
    - "target-independent semantics"
    - "symbolic resource requirements"
    - "capability negotiation"
    - "explicit constraints"
    - "explicit preferences"
    - "explicit fallback semantics"
    - "no accidental target dependence"

  scalability:
    - "no universal hardware capacity ceiling"
    - "parameterized resource expressions"
    - "dynamic collection semantics"
    - "target-driven realization"
    - "implementation limits remain implementation limits"

  semantic:
    - "types"
    - "effects"
    - "resources"
    - "capabilities"
    - "contracts"
    - "policies"
    - "provenance"
    - "diagnostics"

  domains:
    - "classical"
    - "quantum"
    - "HDL"
    - "hybrid"
    - "AI"
    - "data"
    - "concurrency"
    - "distributed"
    - "networking"
    - "hardware"
    - "execution"
    - "compilation"
    - "interoperability"
    - "dialects"
    - "metaprogramming"

  implementation:
    - "Rust 2021"
    - "Rust 1.97 or later"
    - "safe Rust"
    - "deterministic parser behavior"
    - "diagnostic source mapping"

# =============================================================================
# 47. PRODUCTION READINESS GATE
# =============================================================================

production_ready_requires:

  authority:
    - "DESIGN.md is authoritative"
    - "specification/ is normative"
    - "spec/ is machine-contract authoritative"
    - "historical references are non-normative"

  ownership:
    - "every public symbol has one owner"
    - "every production file has one owner"
    - "no unresolved duplicate ownership"

  dependencies:
    - "all production imports resolve"
    - "dependency graph is acyclic"
    - "no forbidden reverse dependency"
    - "no backend dependency from grammar"

  lexical:
    - "canonical token registry"
    - "canonical lexer composition"
    - "Rust lexer conformance"

  parser:
    - "canonical parser composition"
    - "root parser integration"
    - "complete-input EOF enforcement"

  semantic:
    - "AST mapping"
    - "type mapping"
    - "effect mapping"
    - "resource mapping"
    - "capability mapping"
    - "contract mapping"
    - "policy mapping"
    - "provenance mapping"

  IR:
    - "canonical IR mapping"
    - "quantum::ir mapping"
    - "no competing universal IR"

  portability:
    - "no physical capacity in universal grammar"
    - "symbolic requirements"
    - "capability negotiation"
    - "explicit fallback"

  scalability:
    - "no fixed language capacity"
    - "parameterized dimensions"
    - "target resource driven realization"
    - "scalability tests"

  safety:
    - "safe Rust"
    - "no unsafe implementation requirement"
    - "no hidden execution during parsing"

  compatibility:
    - "language version"
    - "grammar version"
    - "AST version"
    - "semantic version"
    - "IR version"
    - "dialect version"
    - "migration policy"

  testing:
    - "positive tests"
    - "negative tests"
    - "boundary tests"
    - "cross-domain tests"
    - "determinism tests"
    - "scalability tests"
    - "fuzzing"
    - "compatibility tests"
    - "golden tests"

# =============================================================================
# 48. FREEZE PRINCIPLE
# =============================================================================

freeze_principle:

  rule: >
    A grammar file is frozen only when every dependency required by its public
    contract is stable, every consumer-facing export is explicitly defined,
    and no downstream implementation detail is required to complete the file.

  permanent_invariant: >
    Adding a new CPU, GPU, FPGA, ASIC, accelerator, QPU, simulator, cluster,
    topology, network, execution environment, AI model, data representation,
    quantum operation, HDL realization, or future computational target MUST
    NOT require modifying a frozen universal grammar file merely to represent
    the new target.

  permitted_future_changes:
    - "new dialect registration"
    - "new domain extension"
    - "new capability registration"
    - "new resource kind"
    - "new backend"
    - "new lowering"
    - "new target adapter"
    - "new library"
    - "new implementation"
    - "versioned language evolution"

  prohibited_future_changes:
    - "adding a machine-size ceiling"
    - "enumerating all future hardware in core grammar"
    - "creating a second lexer"
    - "creating a second parser root"
    - "creating a competing universal AST"
    - "creating a competing universal IR"
    - "making backend internals grammar dependencies"

