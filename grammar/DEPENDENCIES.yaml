    - "src/ast/"
    - "grammar/"

semantic:
  path: "grammar/conformance/semantic/"
  depends_on:
    - "src/semantic/"
    - "grammar/spec/"

types:
  path: "grammar/conformance/types/"
  depends_on:
    - "grammar/types/"

effects:
  path: "grammar/conformance/effects/"
  depends_on:
    - "grammar/effects/"

resources:
  path: "grammar/conformance/resources/"
  depends_on:
    - "grammar/resources/"

policies:
  path: "grammar/conformance/policies/"
  depends_on:
    - "grammar/policies/"

classical:
  path: "grammar/conformance/classical/"
  depends_on:
    - "grammar/classical/"

quantum:
  path: "grammar/conformance/quantum/"
  depends_on:
    - "grammar/quantum/"

hdl:
  path: "grammar/conformance/hdl/"
  depends_on:
    - "grammar/hdl/"

hybrid:
  path: "grammar/conformance/hybrid/"
  depends_on:
    - "grammar/hybrid/"

portability:
  path: "grammar/conformance/portability/"
  depends_on:
    - "grammar/resources/"
    - "grammar/hardware/"
    - "grammar/compile/"
    - "grammar/execution/"

scalability:
  path: "grammar/conformance/scalability/"
  depends_on:
    - "grammar/resources/"
    - "grammar/compile/"
    - "grammar/execution/"
    - "grammar/compatibility/"

compatibility:
  path: "grammar/conformance/compatibility/"
  depends_on:
    - "grammar/compatibility/"

diagnostics:
  path: "grammar/conformance/diagnostics/"
