[package]
name = "zamani"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["Samuel Mukandara <samuelmukandara@gmail.com>"]
description = "Zamani: The Omniversal AGI Language & Operating Intelligence"
repository = "https://github.com/Benwellonedge28/Zamani"
categories = ["compilers", "development-tools", "command-line-utilities"]
keywords = ["compiler", "programming-language", "agi", "zamani", "zutc"]
homepage = "https://github.com/Benwellonedge28/Zamani"
license = "Apache-2.0 OR MIT"
readme = "README.md"

[[bin]]
name = "zamani"
path = "src/main.rs"

[[bin]]
name = "zamani-lsp"
path = "src/bin/zamani_lsp_main.rs"
required-features = ["lsp"]

[[bin]]
name = "zamani-pkg"
path = "src/bin/zamani_pkg_main.rs"
required-features = ["buildsystem"]

[lib]
name = "zamani_compiler"
path = "src/lib.rs"


[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
# Lightweight, independently-buildable component features (see docker/ for
# per-component container images). These compile standalone without pulling
# in the rest of the aspirational `full` surface.
lsp = []
buildsystem = []
full = []
omniversal = []

[dependencies]
antlr-rust = "0.3.0-beta"
lazy_static = "1.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
toml = "0.8"

[dev-dependencies]
pretty_assertions = "1.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true

[[bench]]
name = "compiler_bench"
harness = false
