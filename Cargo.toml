[package]
name = "zenith"
version = "0.1.0"
edition = "2021"
authors = ["Samuel Mukandara <samuelmukandara@gmail.com>"]
description = "Zenith: The Omniversal AGI Language & Operating Intelligence"
repository = "https://github.com/Benwellonedge28/Zenith"
license = "Apache-2.0 OR MIT"
readme = "README.md"

[[bin]]
name = "zenith"
path = "src/main.rs"

[lib]
name = "zenith_lib"
path = "src/lib.rs"

[dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
pretty_assertions = "1.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
